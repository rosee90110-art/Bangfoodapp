<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Hub | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <style>
        /* 📍 Global UI Base */
        :root {
            --cyber-cyan: #00f2ff;
            --cyber-gold: #c5a059;
            --cyber-green: #43e97b;
            --cyber-red: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            margin: 0; padding: 0; min-height: 100vh; 
            background: radial-gradient(circle at 50% 50%, #1a1a1d 0%, #0a0a0b 100%);
            color: #fff; font-family: 'Kanit', sans-serif; 
            display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        /* 🌌 Techno Grid Background */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .dashboard-container { width: 100%; max-width: 1000px; padding: 40px; display: flex; flex-direction: column; gap: 40px; }

        /* 👑 Cyber Header */
        header { text-align: left; border-left: 4px solid var(--cyber-gold); padding-left: 20px; margin-bottom: 20px; animation: slideInLeft 0.8s ease; }
        header h1 { font-size: 2.8rem; font-weight: 900; margin: 0; letter-spacing: -1.5px; text-transform: uppercase; color: #fff; }
        header p { color: var(--cyber-gold); font-size: 0.7rem; margin: 5px 0 0; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; opacity: 0.8; }

        /* 📊 Cyber Glass Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .stat-card { 
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); 
            padding: 35px; border-radius: 35px;
            display: flex; align-items: center; gap: 25px; 
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative; overflow: hidden;
            animation: cardFadeIn 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
        }

        .stat-card::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .stat-card:hover::before { left: 150%; }

        .stat-card:hover { 
            transform: scale(1.02) translateY(-5px); 
            background: rgba(255,255,255,0.06);
            border-color: var(--card-glow, var(--cyber-gold)); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px var(--card-glow, transparent); 
        }

        .stat-icon { 
            width: 70px; height: 70px; border-radius: 20px; 
            background: rgba(255, 255, 255, 0.05); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.85rem; color: var(--card-glow, #fff);
            box-shadow: inset 0 0 15px var(--card-glow, transparent);
        }

        .stat-info span { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; display: block; margin-bottom: 8px; }
        .stat-info b { font-size: 2.2rem; font-weight: 950; color: #fff; line-height: 1; letter-spacing: -1px; }

        /* ✨ Light Theme (Pristine Tech) */
        body.light-theme { 
            background: radial-gradient(circle at 50% 50%, #f1f2f6 0%, #dfe4ea 100%);
            color: #2f3542;
        }
        body.light-theme::before { background-image: linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px); }
        body.light-theme header h1 { color: #2f3542; }
        body.light-theme .stat-card { background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); }
        body.light-theme .stat-info b { color: #2f3542; }
        body.light-theme .stat-card:hover { background: #fff; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }

        @keyframes cardFadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }

        /* 📱 Mobile Responsiveness (Cyber Adaptivity) */
        @media (max-width: 768px) {
            .dashboard-container { padding: 25px 20px; gap: 30px; }
            header h1 { font-size: 1.8rem; letter-spacing: -1px; }
            header p { font-size: 0.6rem; letter-spacing: 2px; }
            .stats-grid { grid-template-columns: 1fr; gap: 20px; }
            .stat-card { padding: 25px; border-radius: 28px; gap: 20px; }
            .stat-icon { width: 55px; height: 55px; font-size: 1.4rem; }
            .stat-info b { font-size: 1.6rem; }
            .stat-info span { font-size: 0.6rem; }
        }
    </style>
    </style>
</head>
<body onload="initializeDashboard()">

    <div class="dashboard-container">
        <header>
            <h1 data-lang-th="ศูนย์ควบคุมบริหาร" data-lang-en="Executive Hub">ศูนย์ควบคุมบริหาร</h1>
            <p data-lang-th="ภาพรวมประสิทธิภาพร้านวันนี้" data-lang-en="Snapshot Performance Today">ภาพรวมประสิทธิภาพร้านวันนี้</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card" style="animation-delay: 0.1s; --card-glow: var(--cyber-gold);">
                <div class="stat-icon"><i class="fas fa-coins"></i></div>
                <div class="stat-info">
                    <span data-lang-th="รายได้รวมวันนี้" data-lang-en="Revenue Today">รายได้รวมวันนี้</span>
                    <b id="dash-revenue">฿0</b>
                </div>
            </div>
            <div class="stat-card" style="animation-delay: 0.2s; --card-glow: var(--cyber-cyan);">
                <div class="stat-icon"><i class="fas fa-microchip"></i></div>
                <div class="stat-info">
                    <span data-lang-th="ออเดอร์รอเริ่มทำ" data-lang-en="Pending Orders">ออเดอร์รอเริ่มทำ</span>
                    <b id="dash-orders-count">0</b>
                </div>
            </div>
            <div class="stat-card" style="animation-delay: 0.3s; --card-glow: var(--cyber-green);">
                <div class="stat-icon"><i class="fas fa-signal"></i></div>
                <div class="stat-info">
                    <span data-lang-th="พนักงานที่ออนไลน์" data-lang-en="Active Staff">พนักงานที่ออนไลน์</span>
                    <b id="dash-online-count">0</b>
                </div>
            </div>
            <div class="stat-card" style="animation-delay: 0.4s; --card-glow: #f1c40f; display:none;">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-info">
                    <span data-lang-th="ความพึงพอใจลูกค้า" data-lang-en="Satisfaction">ความพึงพอใจลูกค้า</span>
                    <b id="dash-rating-avg">0.0</b>
                </div>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 20px;">
            <div id="live-time" style="font-size: 1rem; font-weight: 800; color: var(--premium-gold); opacity: 0.8;">00:00:00</div>
            <p style="font-size: 0.6rem; opacity: 0.3; letter-spacing: 2px; margin-top: 10px;" data-lang-th="ระบบวิเคราะห์ข้อมูลปลอดภัย" data-lang-en="SECURE ANALYTICS CONNECTION">ระบบวิเคราะห์ข้อมูลปลอดภัย</p>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initializeDashboard() {
            // ดึงธีมและภาษามาใช้ทันที
            const user = sessionStorage.getItem('currentAdminName');
            if (user) {
                const theme = localStorage.getItem(`bf_theme_${user}`) || 'dark';
                document.body.classList.toggle('light-theme', theme === 'light');
            }
            
            // เรียกใช้ฟังก์ชันเปลี่ยนภาษาจาก admin_script.js
            if (window.applyGlobalLanguage) applyGlobalLanguage();

            // นาฬิกาแบบไทย/สากล
            setInterval(() => {
                document.getElementById('live-time').innerText = new Date().toLocaleTimeString('th-TH');
            }, 1000);

            loadData();
        }

        // 📈 Smooth CountUp Animation Object
        const CountUp = {
            animate: function(elementId, start, end, duration, isCurrency = false) {
                const obj = document.getElementById(elementId);
                if (!obj) return;
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const currentVal = (easeOut * (end - start) + start);
                    
                    if (isCurrency) {
                        obj.innerText = "฿" + currentVal.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
                    } else {
                        obj.innerText = Math.floor(currentVal).toLocaleString();
                    }
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        // Final exact value
                        if (isCurrency) {
                            obj.innerText = "฿" + end.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                        } else {
                            obj.innerText = end.toLocaleString();
                        }
                    }
                };
                window.requestAnimationFrame(step);
            }
        };

        let prevRev = 0, prevOrd = 0, prevOnl = 0;

        function loadData() {
            const today = new Date().toDateString();
            
            db.ref().on('value', snap => {
                const data = snap.val() || {};
                let totalRevenue = 0;
                let pendingCount = 0;

                if (totalRevenue !== prevRev) {
                    CountUp.animate('dash-revenue', prevRev, totalRevenue, 1200, true);
                    prevRev = totalRevenue;
                }
                if (pendingCount !== prevOrd) {
                    CountUp.animate('dash-orders-count', prevOrd, pendingCount, 1000, false);
                    prevOrd = pendingCount;
                }
            });

            // ดึงคนออนไลน์
            db.ref('presence').on('value', s => {
                let online = 0;
                if(s.exists()) Object.values(s.val()).forEach(ss => online += Object.keys(ss).length);
                if (online !== prevOnl) {
                    CountUp.animate('dash-online-count', prevOnl, online, 800, false);
                    prevOnl = online;
                }
            });
        }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
