<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revenue Insights | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 📍 Global UI Base */
        :root {
            --premium-gold: #c5a059;
            --bg: #080809;
            --card-bg: #141416;
            --text: #ffffff;
            --sub-text: #888;
            --border: rgba(255, 255, 255, 0.08);
        }

        body.light-theme {
            --bg: #f1f3f6;
            --card-bg: #ffffff;
            --text: #1a1d23;
            --sub-text: #666;
            --border: rgba(0, 0, 0, 0.06);
        }

        body { margin: 0; padding: 25px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; }
        .page-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: fadeIn 0.8s ease; }

        /* 📅 Smart Filter Hub */
        .filter-hub {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px;
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: sticky; top: 10px; z-index: 100; backdrop-filter: blur(10px);
        }
        .mode-toggle { 
            background: rgba(128,128,128,0.1); padding: 4px; border-radius: 15px; 
            display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .mode-toggle::-webkit-scrollbar { display: none; }
        .mode-btn { border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 0.75rem; cursor: pointer; transition: 0.3s; background: transparent; color: var(--sub-text); white-space: nowrap; }
        .mode-btn.active { background: var(--premium-gold); color: #000; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3); }
        .select-input { background: rgba(128,128,128,0.08); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 12px; font-size: 0.85rem; outline: none; font-weight: 600; cursor: pointer; }

        /* 💰 Main Revenue Display */
        .revenue-hero { 
            background: linear-gradient(145deg, var(--card-bg), rgba(197, 160, 89, 0.03));
            border: 1px solid var(--border); border-left: 5px solid var(--premium-gold); border-radius: 35px; padding: 40px; 
            text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .revenue-hero span { font-size: 0.8rem; color: var(--premium-gold); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }
        .revenue-hero b { font-size: 4rem; display: block; letter-spacing: -2px; margin: 15px 0; color: var(--text); transition: 0.3s; }
        
        .sub-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 600px; margin: 30px auto 0; padding-top: 25px; border-top: 1px solid var(--border); }
        .sub-stat-item div { font-size: 0.7rem; color: var(--sub-text); font-weight: 700; text-transform: uppercase; margin-bottom: 5px; }
        .sub-stat-item b { font-size: 1.4rem; color: var(--text); }
        .sub-stat-item i { color: var(--premium-gold); margin-right: 5px; }

        /* 📈 Charts & Tables */
        .revenue-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .revenue-grid { grid-template-columns: 1.6fr 1fr; } }

        .content-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card-head { font-size: 0.9rem; font-weight: 800; color: var(--premium-gold); margin-bottom: 25px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: 1px; }

        /* 🏆 Income Table */
        .income-list-container { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .income-list-container::-webkit-scrollbar { width: 4px; }
        .income-list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        .income-row { display: flex; justify-content: space-between; padding: 18px 10px; border-bottom: 1px solid var(--border); align-items: center; transition: 0.3s; }
        .income-row:hover { background: rgba(197, 160, 89, 0.03); border-radius: 15px; }
        .income-row:last-child { border-bottom: none; }
        .income-name { font-size: 0.95rem; font-weight: 600; color: var(--text); }
        .income-val { font-weight: 800; color: var(--premium-gold); font-size: 1.1rem; }

        /* 📱 Mobile Adjustments */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .filter-hub { padding: 15px; border-radius: 20px; justify-content: center; }
            .mode-toggle { width: 100%; justify-content: flex-start; }
            .revenue-hero { padding: 30px 20px; border-radius: 25px; }
            .revenue-hero b { font-size: 2.2rem; }
            .sub-stats { grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
            .content-card { padding: 20px; border-radius: 25px; }
            .chart-container { height: 250px !important; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body onload="setupAndInit()">

    <div class="page-container">
        <header class="filter-hub">
            <div class="mode-toggle">
                <button id="m-daily" class="mode-btn active" onclick="switchView('daily')">DAILY</button>
                <button id="m-range" class="mode-btn" onclick="switchView('range')">RANGE</button>
                <button id="m-monthly" class="mode-btn" onclick="switchView('monthly')">MONTHLY</button>
                <button id="m-yearly" class="mode-btn" onclick="switchView('yearly')">YEARLY</button>
            </div>
            <div style="display:flex; gap:8px; align-items: center; flex-wrap: wrap; justify-content: center;">
                <input type="date" id="in-date" class="select-input" onchange="refresh()">
                
                <input type="date" id="start-date" class="select-input" onchange="refresh()" style="display:none;">
                <span id="range-to" style="display:none; color:var(--sub-text); font-size:0.7rem; font-weight:800;">TO</span>
                <input type="date" id="end-date" class="select-input" onchange="refresh()" style="display:none;">

                <select id="in-month" class="select-input" onchange="refresh()" style="display:none;">
                    <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                    <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
                    <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                    <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
                </select>
                <select id="in-year" class="select-input" onchange="refresh()" style="display:none;">
                    <option value="2024">2567</option><option value="2025">2568</option><option value="2026">2569</option>
                    <option value="2027">2570</option>
                </select>
            </div>
        </header>

        <section class="revenue-hero">
            <span>Net Revenue Overview</span>
            <b id="main-rev">฿0.00</b>
            <div class="sub-stats">
                <div class="sub-stat-item">
                    <div><i class="fas fa-receipt"></i> Total Orders</div>
                    <b id="sub-orders">0 บิล</b>
                </div>
                <div class="sub-stat-item">
                    <div><i class="fas fa-chart-pie"></i> Average Ticket</div>
                    <b id="sub-avg">฿0.00</b>
                </div>
            </div>
        </section>

        <div class="revenue-grid">
            <div class="content-card">
                <div class="card-head"><i class="fas fa-chart-line"></i> Revenue Trend Analysis</div>
                <div class="chart-container" style="height: 320px; position: relative;"><canvas id="revChart"></canvas></div>
            </div>

            <div class="content-card">
                <div class="card-head"><i class="fas fa-crown"></i> Best Sellers (By Revenue)</div>
                <div class="income-list-container" id="income-list">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let history = [];
        let chart;
        let mode = 'daily';

        function setupAndInit() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            document.getElementById('in-date').value = todayStr;
            document.getElementById('start-date').value = todayStr;
            document.getElementById('end-date').value = todayStr;
            
            document.getElementById('in-month').value = now.getMonth();
            document.getElementById('in-year').value = now.getFullYear();
            
            const theme = localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light-theme', theme === 'light');

            switchView('daily');

            db.ref('history').on('value', snap => {
                if (snap.exists()) {
                    history = Object.values(snap.val());
                    refresh();
                }
            });
        }

        function switchView(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`m-${m}`);
            activeBtn.classList.add('active');
            
            // เลื่อนปุ่มให้มาอยู่ตรงกลางถ้าล้นหน้าจอ (Mobile)
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            
            document.getElementById('in-date').style.display = (m === 'daily') ? 'block' : 'none';
            document.getElementById('start-date').style.display = (m === 'range') ? 'block' : 'none';
            document.getElementById('range-to').style.display = (m === 'range') ? 'block' : 'none';
            document.getElementById('end-date').style.display = (m === 'range') ? 'block' : 'none';
            
            document.getElementById('in-month').style.display = (m === 'monthly') ? 'block' : 'none';
            document.getElementById('in-year').style.display = (m === 'monthly' || m === 'yearly') ? 'block' : 'none';
            
            refresh();
        }

        function refresh() {
            const selD = document.getElementById('in-date').value;
            const startD = document.getElementById('start-date').value;
            const endD = document.getElementById('end-date').value;
            const selM = parseInt(document.getElementById('in-month').value);
            const selY = parseInt(document.getElementById('in-year').value);
            
            let total = 0, count = 0, products = {}; let trendData = {};

            history.forEach(order => {
                if (!order || !order.archivedAt) return;
                const d = new Date(order.archivedAt);
                const dateStr = d.toISOString().split('T')[0];
                let match = false; let key = "";

                if (mode === 'daily' && dateStr === selD) { 
                    match = true; key = d.getHours() + ":00"; 
                }
                else if (mode === 'range' && dateStr >= startD && dateStr <= endD) {
                    match = true; key = dateStr;
                }
                else if (mode === 'monthly' && d.getMonth() === selM && d.getFullYear() === selY) { 
                    match = true; key = d.getDate(); 
                }
                else if (mode === 'yearly' && d.getFullYear() === selY) { 
                    match = true; key = (d.getMonth() + 1); 
                }

                if (match) {
                    const amt = parseFloat(order.total || 0);
                    total += amt; count++;
                    trendData[key] = (trendData[key] || 0) + amt;
                    if(order.items) {
                        order.items.forEach(i => {
                            if(!products[i.name]) products[i.name] = 0;
                            products[i.name] += parseFloat(i.finalPrice || 0);
                        });
                    }
                }
            });

            // Update UI
            const up = (id, v) => { 
                const el = document.getElementById(id); 
                el.innerText = v; 
                el.classList.remove('pop'); 
                void el.offsetWidth; 
                el.classList.add('pop'); 
            };
            
            up('main-rev', total === 0 ? "฿0.00" : "฿" + total.toLocaleString(undefined, {minimumFractionDigits: 2}));
            up('sub-orders', count.toLocaleString() + " บิล");
            up('sub-avg', count === 0 ? "฿0.00" : "฿" + (total / count).toLocaleString(undefined, {minimumFractionDigits: 2}));

            const sorted = Object.entries(products).sort((a,b) => b[1] - a[1]).slice(0, 15);
            document.getElementById('income-list').innerHTML = sorted.length > 0 ? sorted.map(([n, v]) => `
                <div class="income-row">
                    <span class="income-name">${n}</span>
                    <span class="income-val">฿${v.toLocaleString()}</span>
                </div>`).join('') : '<div style="text-align:center; padding:40px; color:var(--sub-text); font-weight:bold;">ไม่มีข้อมูลรายได้ในช่วงนี้</div>';

            renderChart(trendData);
        }

        function renderChart(data) {
            const ctx = document.getElementById('revChart').getContext('2d');
            if (chart) chart.destroy();
            const isL = document.body.classList.contains('light-theme');
            
            const keys = Object.keys(data).sort((a, b) => {
                if (mode === 'range') return a.localeCompare(b);
                return parseInt(a) - parseInt(b);
            });

            const labels = keys.map(k => {
                if (mode === 'daily') return k;
                if (mode === 'range') {
                    const parts = k.split('-');
                    return `${parts[2]}/${parts[1]}`;
                }
                if (mode === 'monthly') return k;
                const months = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
                return months[k-1];
            });

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ 
                        data: keys.map(k => data[k]), 
                        borderColor: '#c5a059', 
                        backgroundColor: 'rgba(197, 160, 89, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 3, 
                        pointRadius: 4, pointBackgroundColor: '#c5a059'
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { 
                            beginAtZero: true,
                            grid: { color: isL ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)' }, 
                            ticks: { color: varColor('--sub-text'), font: { size: 10, weight: 'bold' } } 
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: varColor('--sub-text'), font: { size: 10, weight: 'bold' } } 
                        }
                    }
                }
            });
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
</html>
