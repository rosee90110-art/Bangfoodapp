<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #c5a059;
            --bg-deep: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
            --text-muted: #666;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 50% -20%, #222 0%, #0a0a0a 80%);
            /* ป้องกันการเลื่อนหน้าจอบนมือถือถ้าไม่จำเป็น */
            touch-action: manipulation;
        }

        .login-card {
            background: var(--glass);
            padding: 40px 25px;
            border-radius: 35px;
            border: 1px solid var(--border-dim);
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: cardEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .logo-icon {
            font-size: 2.8rem;
            color: var(--primary-gold);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(var(--premium-gold-rgb), 0.2));
        }

        h2 { 
            margin-bottom: 30px; 
            font-size: 1.2rem;
            letter-spacing: 4px; 
            font-weight: 500; 
            color: #fff;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            font-size: 16px; /* ป้องกัน iOS Auto-zoom เมื่อคลิกช่องกรอก */
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(var(--premium-gold-rgb), 0.15);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--primary-gold);
            color: #000;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 15px;
            /* เพิ่มเงาปุ่มให้กดง่ายบนมือถือ */
            box-shadow: 0 8px 15px rgba(var(--premium-gold-rgb), 0.2);
        }

        button:active { transform: scale(0.96); }

        .cancel-btn {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .cancel-btn:hover { color: #fff; }

        /* ปรับปรุงให้หน้าจอมือถือขนาดเล็กแสดงผลได้สวย */
        @media (max-height: 600px) {
            .login-card { padding: 30px 20px; }
            .logo-icon { font-size: 2rem; }
            h2 { margin-bottom: 20px; }
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-user-shield logo-icon"></i>
        <h2>Admin Login</h2>

        <div class="input-group">
            <input type="text" id="user" placeholder="ชื่อผู้ใช้" autocomplete="username" 
                   onkeydown="if(event.key === 'Enter') document.getElementById('pass').focus()">
        </div>
        <div class="input-group">
            <input type="password" id="pass" placeholder="รหัสผ่าน" autocomplete="current-password"
                   onkeydown="if(event.key === 'Enter') handleLogin()">
        </div>

        <button id="login-btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
        
        <a href="admin_center.html" class="cancel-btn">ยกเลิก</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 📍 1. Firebase Config
        const firebaseConfig = { 
            apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
            authDomain: "bangfood-cb30f.firebaseapp.com", 
            databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "bangfood-cb30f", 
            storageBucket: "bangfood-cb30f.appspot.com", 
            messagingSenderId: "390955623784", 
            appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 📍 2. ฟังก์ชัน Login
        function handleLogin() {
            const userInput = document.getElementById('user').value.trim();
            const passInput = document.getElementById('pass').value;
            const btn = document.getElementById('login-btn');

            if (!userInput || !passInput) {
                return alert("กรุณากรอกข้อมูลให้ครบครับ!");
            }

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> กำลังตรวจสอบ...';
            btn.disabled = true;

            db.ref('admins').once('value', snap => {
                let userFound = null;
                
                if (snap.exists()) {
                    const admins = snap.val();
                    for (let id in admins) {
                        if (admins[id].username === userInput && admins[id].password === passInput) {
                            userFound = admins[id]; // เก็บข้อมูลพนักงานทั้งก้อนไว้ตรงนี้
                            break;
                        }
                    }
                }

                // 🚩 เงื่อนไขตรวจสอบความสำเร็จ
                if (userFound || (userInput === "admin" && passInput === "bang")) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('currentAdminName', userInput);
                    
                    // ✨ บรรทัดสำคัญ: บันทึกสิทธิ์ลงเครื่อง เพื่อให้ปุ่ม "เพิ่มแอดมิน" โผล่ครับ!
                    const roleToSave = userFound ? userFound.role : "Super Admin";
                    sessionStorage.setItem('currentAdminRole', roleToSave); 
                    
                    alert("ยินดีต้อนรับครับ!");
                    window.location.href = "admin_center.html";
                } else {
                    alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้องครับ!");
                    btn.innerHTML = 'เข้าสู่ระบบ';
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
