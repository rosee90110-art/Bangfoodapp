<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Dashboard | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="admin_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 📍 จัดระเบียบหน้าจอแบบ Balanced & Layered */
        body::-webkit-scrollbar { display: none; }
        body { margin: 0; padding: 40px 20px; min-height: 100vh; scrollbar-width: none; }

        .dashboard-container {
            max-width: 1400px; /* ขยายกว้างขึ้นนิดหน่อยให้ดูอลังการ */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 35px;
            animation: fadeIn 0.8s ease-out;
        }

        /* 👑 Brand Header Central */
        .brand-header { text-align: center; margin-bottom: 20px; position: relative; }
        .brand-logo-circle {
            width: 110px; height: 110px;
            background: linear-gradient(145deg, #c5a059, #8e6d2f);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; color: #fff;
            box-shadow: 0 15px 40px rgba(197, 160, 89, 0.4);
            border: 5px solid rgba(255,255,255,0.15);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .brand-logo-circle:hover { transform: rotate(15deg) scale(1.05); }
        .brand-name {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 8px;
            color: var(--premium-gold); text-transform: uppercase;
            margin: 0; text-shadow: 0 0 25px rgba(197, 160, 89, 0.3);
        }

        /* 📊 Premium Stats Cards */
        .stats-row { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .stat-mini-card { 
            padding: 35px; 
            border-radius: 40px; 
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            overflow: hidden;
        }
        /* ลายน้ำจางๆ หลังกล่อง */
        .stat-mini-card::after {
            content: "\f0d6"; font-family: "Font Awesome 5 Free"; font-weight: 900;
            position: absolute; right: -15px; bottom: -15px;
            font-size: 5rem; opacity: 0.03; color: var(--premium-gold);
        }

        .stat-icon-circle {
            width: 70px; height: 70px; border-radius: 24px;
            background: rgba(197, 160, 89, 0.12);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--premium-gold);
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: inset 0 0 15px rgba(197, 160, 89, 0.1);
        }

        /* 📡 ระบบ Pulse สถานะ */
        .pulse-dot {
            width: 10px; height: 10px; background: #27ae60; border-radius: 50%;
            display: inline-block; margin-right: 8px;
            box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }

        /* 📈 Chart & Insight Box */
        .chart-box { border-radius: 45px; padding: 40px; height: 400px; }
        .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }
        .insight-box { border-radius: 45px; padding: 40px; min-height: 500px; }

        .status-pill { font-size: 0.65rem; padding: 8px 18px; border-radius: 30px; background: rgba(197, 160, 89, 0.1); color: var(--premium-gold); font-weight: 900; border: 1px solid rgba(197, 160, 89, 0.2); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeDashboard()">

    <div class="dashboard-container">
        
        <header class="brand-header">
            <div class="brand-logo-circle">
                <i class="fas fa-crown"></i>
            </div>
            <h1 class="brand-name">BANGFOOD</h1>
            <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px;">
                <div class="pulse-dot"></div>
                <div style="font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 4px; font-weight: 700;">
                    LIVE CONTROL SYSTEM ACTIVE
                </div>
            </div>
        </header>

        <div class="stats-row">
            <div class="stat-mini-card stat-card">
                <div class="stat-icon-circle"><i class="fas fa-receipt"></i></div>
                <div class="stat-info">
                    <span data-lang-en="Orders Collected" data-lang-th="จำนวนบิลวันนี้">Orders Collected</span>
                    <b id="dash-orders-count">0</b>
                </div>
            </div>
            <div class="stat-mini-card stat-card">
                <div class="stat-icon-circle"><i class="fas fa-chart-line"></i></div>
                <div class="stat-info">
                    <span data-lang-en="Daily Gross" data-lang-th="รายได้โดยประมาณ">Daily Gross</span>
                    <b id="dash-revenue">฿0.00</b>
                </div>
            </div>
            <div class="stat-mini-card stat-card">
                <div class="stat-icon-circle"><i class="fas fa-boxes"></i></div>
                <div class="stat-info">
                    <span data-lang-en="Active Inventory" data-lang-th="รายการอาหารพร้อมขาย">Active Inventory</span>
                    <b id="dash-menu-count">0</b>
                </div>
            </div>
            <div class="stat-mini-card stat-card">
                <div class="stat-icon-circle" style="color:#2196F3;"><i class="fas fa-user-shield"></i></div>
                <div class="stat-info">
                    <span data-lang-en="Manager Access" data-lang-th="ระดับการเข้าถึง">Manager Access</span>
                    <b style="color: #2196F3; font-size: 1.2rem;">AUTHORIZED</b>
                </div>
            </div>
        </div>

        <div class="chart-box card-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px;">
                <div style="font-size: 1rem; color: var(--premium-gold); font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">
                    <i class="fas fa-database" style="margin-right:10px;"></i> Revenue Performance
                </div>
                <div style="font-size: 0.7rem; color: var(--sub-text); font-weight: 700; border: 1px solid var(--border); padding: 5px 15px; border-radius: 10px;">
                    REAL-TIME SYNC
                </div>
            </div>
            <canvas id="revenueChart"></canvas>
        </div>

        <div class="insight-grid">
            <div class="insight-box card-box">
                <div class="box-title">
                    <h3 data-lang-en="Transaction Stream" data-lang-th="ความเคลื่อนไหวล่าสุด"><i class="fas fa-bolt"></i> ความเคลื่อนไหวล่าสุด</h3>
                </div>
                <div id="mini-order-list"></div>
            </div>

            <div class="insight-box card-box">
                <div class="box-title">
                    <h3 data-lang-en="Elite Performance" data-lang-th="อันดับเมนูขายดี"><i class="fas fa-star"></i> อันดับเมนูขายดี</h3>
                </div>
                <div id="mini-trending-list"></div>
            </div>
        </div>

        <footer style="text-align:center; padding:40px; opacity:0.2; font-size:0.6rem; letter-spacing:5px; text-transform: uppercase;">
            Executive Command Console v2.0 &bull; Secure Connection
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let revenueChart;

        function initializeDashboard() { loadDashboardData(); }

        function loadDashboardData() {
            const todayStr = new Date().toLocaleDateString();
            db.ref('orders').on('value', snapshot => {
                let orderCount = 0; let totalRev = 0;
                let miniOrderHtml = ''; const orders = [];
                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const data = child.val(); orders.push(data);
                        if(new Date(data.timestamp).toLocaleDateString() === todayStr) {
                            orderCount++; totalRev += parseFloat(data.total || 0);
                        }
                    });
                }
                document.getElementById('dash-orders-count').innerText = orderCount;
                document.getElementById('dash-revenue').innerText = "฿" + totalRev.toLocaleString(undefined, {minimumFractionDigits: 1});
                
                orders.reverse().slice(0, 5).forEach(o => {
                    miniOrderHtml += `
                        <div class="mini-list-item" style="padding: 22px 0;">
                            <div class="mini-text">
                                <b style="font-size:1.1rem;">Station ${o.tableNumber}</b>
                                <small style="letter-spacing:1px; color:#555;">ID: ${o.timestamp.toString().slice(-6)} &bull; ${new Date(o.timestamp).toLocaleTimeString()}</small>
                            </div>
                            <span class="status-pill">PROCESSED</span>
                        </div>`;
                });
                document.getElementById('mini-order-list').innerHTML = miniOrderHtml || '<p style="text-align:center; padding:50px; opacity:0.4;">Waiting for transactions...</p>';
                renderChart(orders);
            });

            db.ref('products').once('value', snapshot => {
                document.getElementById('dash-menu-count').innerText = snapshot.numChildren();
                let trendingHtml = '';
                if(snapshot.exists()){
                    let products = Object.values(snapshot.val());
                    products.slice(0, 5).forEach((p, i) => {
                        trendingHtml += `
                            <div class="mini-list-item" style="border-radius: 20px;">
                                <div style="display:flex; align-items:center; gap:20px;">
                                    <img src="${p.img}" class="mini-img" style="width:60px; height:60px; border-radius:20px;">
                                    <div class="mini-text">
                                        <b style="font-size:1rem;">${p.name}</b>
                                        <small style="color:var(--premium-gold); font-weight:700;">PREMIUM SELECTION #${i+1}</small>
                                    </div>
                                </div>
                                <b style="color:var(--premium-gold); font-size:1.2rem;">฿${p.price}</b>
                            </div>`;
                    });
                }
                document.getElementById('mini-trending-list').innerHTML = trendingHtml;
                if (window.applyGlobalLanguage) applyGlobalLanguage();
            });
        }

        function renderChart(allOrders) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            if (revenueChart) revenueChart.destroy();
            const isLight = document.body.classList.contains('light-theme');
            
            // สร้าง Gradient สำหรับกราฟ
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(197, 160, 89, 0.2)');
            gradient.addColorStop(1, 'rgba(197, 160, 89, 0)');

            revenueChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00'],
                    datasets: [{
                        data: [500, 1200, 3500, 2800, 4200, 5800, 4900],
                        borderColor: '#c5a059',
                        backgroundColor: gradient,
                        borderWidth: 6, tension: 0.45, fill: true, pointRadius: 4, pointHoverRadius: 8,
                        pointBackgroundColor: '#c5a059', pointBorderColor: '#fff', pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(128,128,128,0.08)' }, ticks: { color: '#666', font: { weight: 'bold' } } },
                        x: { grid: { display: false }, ticks: { color: '#666', font: { weight: 'bold' } } }
                    }
                }
            });
        }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
