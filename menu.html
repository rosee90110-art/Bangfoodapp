<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวเลือกอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="global_style.css">
    <link rel="stylesheet" href="admin_style.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-deep: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --drawer-bg: #0a0a0b;
        }

        body.light-theme {
            --bg-deep: #f5f5f7;
            --drawer-bg: #ffffff;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: var(--bg-deep);
            color: #f1f1f1;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.25, 1, 0.5, 1), color 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 🌊 Theme Switch Ripple Overlay */
        .theme-transition-overlay {
            position: fixed;
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease-in-out;
        }

        /* 💫 Language Switch Blur & Fade */
        .lang-transitioning {
            filter: blur(10px);
            opacity: 0;
            transform: scale(0.95);
        }

        .lang-transition-container {
            transition: filter 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ✨ Page Wrapper */
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-deep);
            position: relative;
            padding-bottom: 120px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        /* 📍 Header แบบเดิม (เหมือนหน้าแรก) */
        .app-header-sticky {
            position: sticky;
            top: 0;
            z-index: 2000;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
        }

        body.light-theme .app-header-sticky {
            background: rgba(245, 245, 247, 0.9);
        }

        .header-main-row {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            cursor: pointer;
            color: #666;
            font-size: 1.1rem;
        }

        .bangfood-logo {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: var(--premium-gold);
            margin: 0;
            text-transform: uppercase;
        }

        .hamburger-menu {
            position: absolute;
            right: 20px;
            z-index: 2500;
            width: 25px;
            height: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger-menu span {
            display: block;
            width: 100%;
            height: 2.5px;
            background: var(--premium-gold);
            border-radius: 10px;
            transition: 0.3s;
        }

        /* 📍 แถบราคารวมแบบที่ต้องการ */
        .top-summary-bar {
            padding: 12px 25px;
            background: rgba(var(--premium-gold-rgb), 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label {
            font-size: 0.65rem;
            color: #666;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .summary-val {
            color: var(--premium-gold);
            font-weight: 700;
            font-size: 1.25rem;
            text-shadow: 0 0 12px rgba(181, 142, 73, 0.2);
        }

        /* 📸 Hero Image Animation */
        .item-hero {
            text-align: center;
            padding: 20px 0;
        }

        .modal-image {
            width: 150px;
            height: 150px;
            border-radius: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--glass-border);
            object-fit: cover;
            animation: imagePop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 📋 Option List Animation */
        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            background: var(--glass);
            border-radius: 18px;
            margin: 0 20px 10px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            transition: 0.4s;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s forwards;
        }

        .option-item:active {
            transform: scale(0.95);
        }

        body.light-theme .option-item {
            background: #fff;
            color: #333;
        }

        .note-area {
            width: 90%;
            margin: 0 auto;
            display: block;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: #fff;
            padding: 15px;
            box-sizing: border-box;
        }

        @keyframes imagePop {
            from {
                transform: scale(0.5);

                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .side-drawer {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 180px;
            background: var(--drawer-bg);
            z-index: 4000;
            padding: 10px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform-origin: top right;
            transform: scale(0);
            opacity: 0;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .side-drawer.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 18px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        /* ✨ Add-on Smooth Transitions */
        .addon-row {
            display: grid !important;
            grid-template-columns: 1fr auto auto;
            /* แบ่ง 3 ส่วน: ชื่อ | ราคา | ปุ่ม */
            align-items: center;
            gap: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ทำให้ราคาอยู่ตรงกลาง */
        .addon-price-center {
            color: var(--premium-gold);
            font-weight: 500;
            font-size: 0.9rem;
            min-width: 60px;
            text-align: center;
        }

        /* ปุ่มบวกลบแบบมีเงาและ Animation */
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .qty-btn.minus {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
        }

        .qty-btn.plus {
            background: #fff;
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .qty-btn:active {
            transform: scale(0.85);
            /* เวลากดจะยุบตัวลง */
        }

        /* ตัวเลขจำนวนแบบ Bounce */
        .addon-qty {
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 25px;
            text-align: center;
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bump {
            transform: scale(1.3);
            color: var(--premium-gold);
        }

        /* ✈️ Flying Item Animation */
        .flying-item {
            position: fixed;
            z-index: 9999;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 🫨 Shake Animation for Error */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
                border-color: #ff4757;
            }

            75% {
                transform: translateX(5px);
                border-color: #ff4757;
            }
        }

        .error-shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        /* 🍜 Noodle Type Pills */
        .noodle-type-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 50px;
            border: 1.5px solid var(--glass-border);
            background: var(--glass);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.85rem;
            font-weight: 600;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .noodle-type-pill.selected {
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--premium-gold);
            color: var(--premium-gold);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
            transform: scale(1.04);
        }
        .noodle-type-pill:active { transform: scale(0.92); }
        body.light-theme .noodle-type-pill { background: #fff; color: #333; }
        body.light-theme .noodle-type-pill.selected { background: rgba(197,160,89,0.1); }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let rawProductData = null;
        let pendingAnimateItem = null;

        function toggleDrawer() {
            const d = document.getElementById('side-drawer');
            const o = document.getElementById('drawer-overlay');
            const active = d.classList.toggle('active');
            o.style.display = active ? 'block' : 'none';
            if (active) {
                const table = localStorage.getItem('selectedTable') || '1';
                const lang = localStorage.getItem(`lang_table_${table}`) || 'th';
                document.getElementById('drawer-lang-status').innerText = lang.toUpperCase();
            }
        }


        function switchCustomerTheme(event) {
            const table = localStorage.getItem('selectedTable') || '1';
            const key = `theme_table_${table}`;
            const next = (localStorage.getItem(key) === 'light') ? 'dark' : 'light';
            localStorage.setItem(key, next);

            // 🌊 Ripple Expansion Effect
            const overlay = document.createElement('div');
            overlay.className = 'theme-transition-overlay';
            const x = event ? event.clientX : window.innerWidth - 30;
            const y = event ? event.clientY : 30;
            overlay.style.backgroundColor = next === 'light' ? '#f5f5f7' : '#0a0a0b';
            overlay.style.left = `${x}px`;
            overlay.style.top = `${y}px`;
            const maxDim = Math.max(window.innerWidth, window.innerHeight) * 2.5;
            overlay.style.width = `${maxDim}px`;
            overlay.style.height = `${maxDim}px`;
            document.body.appendChild(overlay);

            requestAnimationFrame(() => overlay.style.transform = 'translate(-50%, -50%) scale(1)');

            setTimeout(() => {
                applyTheme(next);
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 600);
            }, 350);
        }

        function applyTheme(t) { document.body.classList.toggle('light-theme', t === 'light'); }

        async function switchCustomerLanguage() {
            const table = localStorage.getItem('selectedTable') || '1';
            const langKey = `lang_table_${table}`;
            const next = (localStorage.getItem(langKey) === 'en') ? 'th' : 'en';
            localStorage.setItem(langKey, next);

            // 💫 Blur & Fade Main Container
            const mainEl = document.querySelector('.app-wrapper');
            if (mainEl) {
                mainEl.classList.add('lang-transition-container', 'lang-transitioning');
            }

            // 💫 Animate Text in Drawer
            const drawerLang = document.getElementById('drawer-lang-status');
            if (drawerLang) {
                drawerLang.style.transition = 'transform 0.2s, opacity 0.2s';
                drawerLang.style.transform = 'translateY(-5px)';
                drawerLang.style.opacity = '0';
                setTimeout(() => {
                    drawerLang.innerText = next.toUpperCase();
                    drawerLang.style.transform = 'translateY(5px)';
                    requestAnimationFrame(() => {
                        drawerLang.style.transform = 'translateY(0)';
                        drawerLang.style.opacity = '1';
                    });
                }, 200);
            }

            setTimeout(async () => {
                document.querySelectorAll('[data-lang-en]').forEach(el => {
                    el.innerText = (next === 'en') ? el.getAttribute('data-lang-en') : el.getAttribute('data-lang-th');
                });
                if (rawProductData) { await renderTranslatedContent(rawProductData, next); }
                if (mainEl) mainEl.classList.remove('lang-transitioning');
            }, 300);
        }

        async function initializeMenuPage() {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            const table = params.get('table') || localStorage.getItem('selectedTable') || '1';
            localStorage.setItem('selectedTable', table);
            document.getElementById('display-table').innerText = table;

            applyTheme(localStorage.getItem(`theme_table_${table}`) || 'dark');
            const currentLang = localStorage.getItem(`lang_table_${table}`) || 'th';

            if (!name) return;
            db.ref('products').orderByChild('name').equalTo(name).once('value', async snap => {
                const data = snap.val();
                if (data) {
                    rawProductData = Object.values(data)[0];
                    await renderTranslatedContent(rawProductData, currentLang);
                    document.querySelectorAll('[data-lang-en]').forEach(el => {
                        el.innerText = (currentLang === 'en') ? el.getAttribute('data-lang-en') : el.getAttribute('data-lang-th');
                    });
                }
            });
        }

        async function renderTranslatedContent(p, lang) {
            const transSnap = await db.ref('menu_translations').once('value');
            const dict = transSnap.val() || {};
            const displayName = (lang === 'en') ? (dict[p.name] || p.name) : p.name;
            document.getElementById('modal-item-name').innerText = displayName;
            document.getElementById('modal-item-name').setAttribute('data-raw', p.name);
            document.getElementById('modal-base-price').innerText = parseFloat(p.price).toFixed(2);
            document.getElementById('modal-item-image').src = p.img;
            renderOptions(p.config || {}, lang, dict);
            updatePrice();
        }

        // ประเภทเส้นเริ่มต้น (ใช้เมื่อสินค้าเป็นหมวดก๋วยเตี๋ยว)
        const DEFAULT_NOODLE_TYPES = [
            { name: 'เส้นใหญ่', name_en: 'Wide Noodle', price: 0 },
            { name: 'เส้นเล็ก', name_en: 'Thin Noodle', price: 0 },
            { name: 'เส้นหมี่', name_en: 'Rice Vermicelli', price: 0 },
            { name: 'เส้นเหลือง', name_en: 'Egg Noodle', price: 0 },
            { name: 'วุ้นเส้น', name_en: 'Glass Noodle', price: 0 },
        ];

        function renderOptions(config, lang, dict) {
            // --- Sizes ---
            const sc = document.getElementById('dynamic-sizes-container');
            sc.innerHTML = '';
            if (config.sizes && config.sizes.length > 0) {
                const title = (lang === 'en') ? "Select Size" : "เลือกขนาด";
                const reqBadge = (config.sizeRequired !== false) ? `<span style="color:#ff4757; font-size:0.6rem; margin-left:5px;">(REQUIRED)</span>` : '';
                sc.innerHTML = `<h3 style="color:#666; font-size:0.65rem; margin:30px 30px 10px; text-transform:uppercase; font-weight:700;">${title}${reqBadge}</h3>`;
                config.sizes.forEach((s, i) => {
                    const sName = (lang === 'en') ? (dict[s.name] || s.name) : s.name;
                    const noodleLimit = i + 1; // ธรรมดา=1, พิเศษ=2, โครตพิเศษ=3
                    sc.innerHTML += `<label class="option-item" style="animation-delay: ${i * 0.1}s"><input type="radio" name="size" value="${s.name}" data-modifier="${s.price}" data-noodle-limit="${noodleLimit}" ${i === 0 && config.sizeRequired !== false ? 'checked' : ''} onchange="updatePrice(); updateNoodleLimit();"><span style="font-size: 0.95rem;">${sName}</span><span style="margin-left:auto; color:var(--premium-gold); font-weight:500;">+${s.price}</span></label>`;
                });
            }

            // --- Noodle Types (เฉพาะหมวดก๋วยเตี๋ยว) ---
            const ntc = document.getElementById('dynamic-noodle-types-container');
            ntc.innerHTML = '';
            const isNoodle = rawProductData && rawProductData.category === 'ก๋วยเตี๋ยว';
            const noodleTypes = (config.noodleTypes || (isNoodle ? DEFAULT_NOODLE_TYPES : [])).filter(nt => nt.enabled !== false);
            if (noodleTypes.length > 0) {
                const title = (lang === 'en') ? "Noodle Type" : "ประเภทเส้น";
                ntc.innerHTML = `
                    <h3 style="color:#666; font-size:0.65rem; margin:30px 30px 6px; text-transform:uppercase; font-weight:700;">
                        ${title}<span style="color:#ff4757; font-size:0.6rem; margin-left:5px;">(REQUIRED)</span>
                    </h3>
                    <p id="noodle-limit-hint" style="color:#888; font-size:0.7rem; margin:0 30px 15px; transition:color 0.3s;">🍜 เลือกได้สูงสุด 1 ประเภท</p>
                    <div id="noodle-pills-wrap" style="display:flex; flex-wrap:wrap; gap:10px; padding:0 20px 10px;"></div>`;
                const wrap = document.getElementById('noodle-pills-wrap');
                noodleTypes.forEach(nt => {
                    const ntName = (lang === 'en') ? (nt.name_en || dict[nt.name] || nt.name) : nt.name;
                    const pill = document.createElement('div');
                    pill.className = 'noodle-type-pill';
                    pill.setAttribute('data-name', nt.name);
                    pill.setAttribute('data-price', nt.price || 0);
                    pill.setAttribute('data-selected', 'false');
                    pill.innerHTML = `<i class="fas fa-bowl-rice" style="font-size:0.75rem;"></i> ${ntName}${nt.price > 0 ? ` <span style="color:var(--premium-gold); font-size:0.75rem;">+${nt.price}</span>` : ''}`;
                    pill.onclick = () => toggleNoodlePill(pill);
                    wrap.appendChild(pill);
                });
                // อัปเดต hint ทันทีหลัง render
                setTimeout(updateNoodleLimit, 0);
            }

            // --- Addons ---
            const ac = document.getElementById('dynamic-addons-container');
            ac.innerHTML = '';
            if (config.addons && config.addons.length > 0) {
                const title = (lang === 'en') ? "Extra Add-ons" : "ท็อปปิ้งเสริม";
                const maxText = (config.addonMax > 0) ? `<span style="color:var(--premium-gold); font-size:0.6rem; margin-left:5px; opacity:0.6;">(MAX ${config.addonMax})</span>` : '';
                ac.innerHTML = `<h3 style="color:#666; font-size:0.65rem; margin:30px 30px 10px; text-transform:uppercase; font-weight:700;">${title}${maxText}</h3>`;
                config.addons.forEach((a, i) => {
                    const aName = (lang === 'en') ? (dict[a.name] || a.name) : a.name;
                    ac.innerHTML += `
                <div class="option-item addon-row" style="animation-delay: ${(i + 3) * 0.1}s">
                    <span style="font-size: 0.95rem;">${aName}</span>
                    <span class="addon-price-center">+${a.price}</span>
                    <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 5px 8px; border-radius: 30px; border: 1px solid var(--glass-border);">
                        <button type="button" class="qty-btn minus" onclick="changeAddonQty('${a.name}', -1, ${a.price})">-</button>
                        <span id="qty-${a.name}" class="addon-qty" data-name="${a.name}" data-price="${a.price}">0</span>
                        <button type="button" class="qty-btn plus" onclick="changeAddonQty('${a.name}', 1, ${a.price})">+</button>
                    </div>
                </div>`;
                });
                ac.setAttribute('data-max', config.addonMax || 0);
            }
        }

        function getNoodleLimit() {
            const selectedSize = document.querySelector('input[name="size"]:checked');
            return selectedSize ? parseInt(selectedSize.getAttribute('data-noodle-limit') || 1) : 1;
        }

        function updateNoodleLimit() {
            const limit = getNoodleLimit();
            const lang = localStorage.getItem(`lang_table_${localStorage.getItem('selectedTable')}`) || 'th';
            const hintEl = document.getElementById('noodle-limit-hint');
            if (hintEl) {
                hintEl.textContent = lang === 'en'
                    ? `🍜 Select up to ${limit} type${limit > 1 ? 's' : ''}`
                    : `🍜 เลือกได้สูงสุด ${limit} ประเภท`;
            }
            // ถ้าเลือกไว้เกิน limit ใหม่ ให้ยกเลิกส่วนเกิน
            const selectedPills = [...document.querySelectorAll('.noodle-type-pill[data-selected="true"]')];
            if (selectedPills.length > limit) {
                selectedPills.slice(limit).forEach(p => {
                    p.setAttribute('data-selected', 'false');
                    p.classList.remove('selected');
                });
                updatePrice();
            }
        }

        function toggleNoodlePill(pill) {
            const isSelected = pill.getAttribute('data-selected') === 'true';
            if (!isSelected) {
                const limit = getNoodleLimit();
                const currentCount = document.querySelectorAll('.noodle-type-pill[data-selected="true"]').length;
                if (currentCount >= limit) {
                    // แจ้งเตือนว่าเกิน limit
                    navigator.vibrate && navigator.vibrate([30, 50, 30]);
                    const hintEl = document.getElementById('noodle-limit-hint');
                    if (hintEl) {
                        hintEl.style.color = '#ff4757';
                        hintEl.style.fontWeight = '700';
                        setTimeout(() => { hintEl.style.color = ''; hintEl.style.fontWeight = ''; }, 1000);
                    }
                    // Shake ทุก pill ที่ selected เพื่อบอกว่า full แล้ว
                    document.querySelectorAll('.noodle-type-pill.selected').forEach(p => {
                        p.classList.add('error-shake');
                        setTimeout(() => p.classList.remove('error-shake'), 400);
                    });
                    return;
                }
            }
            pill.setAttribute('data-selected', String(!isSelected));
            pill.classList.toggle('selected', !isSelected);
            updatePrice();
            if (!isSelected && navigator.vibrate) navigator.vibrate(15);
        }

        function changeAddonQty(name, delta, price) {
            const qtyEl = document.getElementById(`qty-${name}`);
            const container = document.getElementById('dynamic-addons-container');
            const max = parseInt(container.getAttribute('data-max') || 0);

            let currentQty = parseInt(qtyEl.innerText);

            // Check Max if adding
            if (delta > 0 && max > 0) {
                let total = 0;
                document.querySelectorAll('.addon-qty').forEach(el => total += parseInt(el.innerText));
                if (total >= max) {
                    navigator.vibrate ? navigator.vibrate(50) : null;
                    return; // Max reached
                }
            }

            const nextQty = Math.max(0, currentQty + delta);
            if (nextQty !== currentQty) {
                qtyEl.innerText = nextQty;
                qtyEl.classList.remove('bump');
                void qtyEl.offsetWidth;
                qtyEl.classList.add('bump');
                setTimeout(() => qtyEl.classList.remove('bump'), 200);
                const minusBtn = qtyEl.previousElementSibling;
                minusBtn.style.opacity = (nextQty === 0) ? "0.3" : "1";
                updatePrice();
            }
        }

        function changeMainQty(delta) {
            const qtyEl = document.getElementById('main-item-qty');
            let currentQty = parseInt(qtyEl.innerText);
            const nextQty = Math.max(1, currentQty + delta);
            if (nextQty !== currentQty) {
                qtyEl.innerText = nextQty;
                qtyEl.classList.remove('bump');
                void qtyEl.offsetWidth;
                qtyEl.classList.add('bump');
                updatePrice();
            }
        }

        function updatePrice() {
            const base = parseFloat(document.getElementById('modal-base-price').innerText);
            let extraPerItem = 0;
            const s = document.querySelector('input[name="size"]:checked');
            if (s) extraPerItem += parseFloat(s.dataset.modifier);
            document.querySelectorAll('.addon-qty').forEach(el => {
                const qty = parseInt(el.innerText);
                const price = parseFloat(el.dataset.price);
                extraPerItem += (qty * price);
            });
            // รวมราคาประเภทเส้นที่เลือก
            document.querySelectorAll('.noodle-type-pill[data-selected="true"]').forEach(pill => {
                extraPerItem += parseFloat(pill.getAttribute('data-price') || 0);
            });
            const mainQty = parseInt(document.getElementById('main-item-qty').innerText);
            const finalTotal = (base + extraPerItem) * mainQty;
            document.getElementById('modal-final-price').innerText = finalTotal.toFixed(2);
        }

        function initSliderLogic() {
            const slider = document.getElementById('hero-best-seller-slider');
            const indicators = document.querySelectorAll('.indicator-item');

            if (!slider) return;

            slider.addEventListener('scroll', () => {
                const cards = document.querySelectorAll('.slide-card');
                let closestIndex = 0;
                let minDistance = Infinity;

                const centerX = slider.scrollLeft + (slider.offsetWidth / 2);

                cards.forEach((card, i) => {
                    const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                    const distance = Math.abs(centerX - cardCenter);

                    if (distance < minDistance) {
                        minDistance = distance;
                        closestIndex = i;
                    }
                });

                cards.forEach((c, i) => {
                    c.classList.toggle('is-active', i === closestIndex);
                    if (indicators[i]) indicators[i].classList.toggle('active', i === closestIndex);
                });
            });
        }

        function confirmOrder() {
            const table = localStorage.getItem('selectedTable');
            const lang = localStorage.getItem(`lang_table_${table}`) || 'th';
            const cartKey = `bangfood_cart_table_${table}`;

            // 🛑 Validation: Size Required
            const titleEl = document.querySelector('#dynamic-sizes-container h3');
            if (titleEl && titleEl.innerHTML.includes('REQUIRED')) {
                const s = document.querySelector('input[name="size"]:checked');
                if (!s) {
                    const sc = document.getElementById('dynamic-sizes-container');
                    sc.classList.add('error-shake');
                    setTimeout(() => sc.classList.remove('error-shake'), 500);
                    alert(lang === 'en' ? "Please select a size!" : "กรุณาเลือกขนาดอาหาร!");
                    return;
                }
            }

            // 🛑 Validation: Noodle Type Required
            const ntc = document.getElementById('dynamic-noodle-types-container');
            if (ntc && ntc.children.length > 0) {
                const selectedNoodles = ntc.querySelectorAll('.noodle-type-pill[data-selected="true"]');
                if (selectedNoodles.length === 0) {
                    ntc.classList.add('error-shake');
                    setTimeout(() => ntc.classList.remove('error-shake'), 500);
                    alert(lang === 'en' ? 'Please select at least one noodle type!' : 'กรุณาเลือกประเภทเส้นอย่างน้อย 1 ชนิด!');
                    return;
                }
            }

            let cart = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };
            let opts = [];
            const basePrice = document.getElementById('modal-base-price').innerText;

            // Size
            const s = document.querySelector('input[name="size"]:checked');
            if (s) opts.push({ name: s.value, price: s.dataset.modifier, qty: 1 });

            // Noodle Types (multi-select)
            document.querySelectorAll('.noodle-type-pill[data-selected="true"]').forEach(pill => {
                opts.push({
                    name: pill.getAttribute('data-name'),
                    price: pill.getAttribute('data-price') || 0,
                    qty: 1
                });
            });

            // Add-ons
            document.querySelectorAll('.addon-qty').forEach(el => {
                const qty = parseInt(el.innerText);
                if (qty > 0) {
                    opts.push({ name: el.dataset.name, price: el.dataset.price, qty: qty });
                }
            });

            const mainQty = parseInt(document.getElementById('main-item-qty').innerText);

            cart.items.push({
                name: document.getElementById('modal-item-name').getAttribute('data-raw'),
                price: basePrice,
                finalPrice: document.getElementById('modal-final-price').innerText,
                optionsArray: opts,
                notes: document.getElementById('modal-notes').value,
                img: document.getElementById('modal-item-image').src,
                quantity: mainQty
            });

            sessionStorage.setItem(cartKey, JSON.stringify(cart));

            const pendingAnimateItem = document.getElementById('modal-item-name').getAttribute('data-raw');
            const url = `index.html?table=${table}&animate=${encodeURIComponent(pendingAnimateItem)}`;
            if (window.navigateTo) {
                window.navigateTo(url);
            } else {
                window.location.href = url;
            }
        }
    </script>
    <script src="global_script.js"></script>
    <script src="guard.js"></script>
