<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="global_style.css">
    <style>
        body { 
            background-color: var(--bg-deep); color: #f1f1f1; 
            font-family: 'Kanit', sans-serif; margin: 0; padding: 0;
            display: flex; justify-content: center; overflow-x: hidden;
            transition: 0.3s;
        }

        .app-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background: var(--bg-deep); position: relative; padding-bottom: 120px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 📍 Header Structure ให้เหมือนหน้าแรก */
        .app-header-sticky { position: sticky; top: 0; z-index: 2000; background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border); }
        body.light-theme .app-header-sticky { background: rgba(245, 245, 247, 0.9); }

        .header-main-row { padding: 15px 20px; display: flex; align-items: center; justify-content: center; position: relative; }
        .back-btn { position: absolute; left: 20px; cursor: pointer; color: #666; font-size: 1.1rem; }
        .bangfood-logo { font-size: 0.9rem; font-weight: 600; letter-spacing: 3px; color: var(--premium-gold); margin: 0; text-transform: uppercase; }

        .top-summary-bar { padding: 12px 25px; background: rgba(197, 160, 89, 0.04); display: flex; justify-content: space-between; align-items: center; }
        .summary-label { font-size: 0.65rem; color: #666; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .summary-val { color: var(--premium-gold); font-weight: 700; font-size: 1.4rem; text-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }

        /* 🛒 รายการในตะกร้า */
        .cart-item {
            background: var(--glass); border: 1px solid var(--glass-border);
            margin: 15px 20px; border-radius: 24px; padding: 18px;
            animation: slideUpFade 0.6s ease-out both;
        }
        body.light-theme .cart-item { background: #fff; color: #333; }
        .item-main-row { display: flex; gap: 15px; align-items: flex-start; }
        .item-img { width: 65px; height: 65px; border-radius: 16px; object-fit: cover; border: 1px solid var(--glass-border); }
        .food-name { font-size: 0.95rem; color: #fff; font-weight: 500; margin: 0; }
        body.light-theme .food-name { color: #000; }
        .addon-line { display: flex; justify-content: space-between; color: #666; font-size: 0.75rem; margin-top: 3px; }

        .item-footer { 
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.03);
        }
        .remove-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.2); padding: 6px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }

        /* 📍 Bottom Nav */
        .bottom-nav-fixed {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 100px;
            background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
            z-index: 2500; display: flex; justify-content: center; align-items: flex-end;
            pointer-events: none;
        }
        .nav-buttons-bar {
            width: 92%; height: 60px; background: #121214; border-radius: 30px;
            border: 1px solid var(--glass-border); display: flex;
            justify-content: space-around; align-items: center; pointer-events: auto;
            margin-bottom: 15px; -webkit-mask-image: radial-gradient(circle 55px at center -5px, transparent 48px, black 49px);
        }
        body.light-theme .nav-buttons-bar { background: #fff; }
        .round-btn-center {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 72px; height: 72px; background: #fff; border-radius: 50%;
            border: 6px solid var(--bg-deep); color: #000; font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); cursor: pointer; z-index: 2600; 
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <div id="side-drawer" class="side-drawer">
        <div class="drawer-content">
            <div class="drawer-item" onclick="switchCustomerTheme(); toggleDrawer();">
                <span data-lang-en="THEME" data-lang-th="เปลี่ยนธีม">เปลี่ยนธีม</span>
                <i class="fas fa-adjust" style="color:var(--premium-gold);"></i>
            </div>
            <div class="drawer-item" onclick="switchCustomerLanguage(); toggleDrawer();">
                <span data-lang-en="LANGUAGE" data-lang-th="เปลี่ยนภาษา">เปลี่ยนภาษา</span>
                <b id="drawer-lang-status">TH</b>
            </div>
        </div>
    </div>
    <div id="drawer-overlay" onclick="toggleDrawer()" style="position:fixed; top:0; left:0; width:100%; height:100%; background:transparent; z-index:3500; display:none;"></div>

    <div class="app-wrapper">
        <div class="app-header-sticky">
            <div class="header-main-row">
                <div class="back-btn" onclick="goBackToIndex()"><i class="fas fa-arrow-left"></i></div>
                <h1 class="bangfood-logo" data-lang-en="MY BASKET" data-lang-th="ตะกร้าของฉัน">MY BASKET</h1>
                <div class="hamburger-menu" onclick="toggleDrawer()">
                    <span></span><span></span><span></span>
                </div>
            </div>
            <div class="top-summary-bar">
                <div class="summary-label">STATION <span id="display-table">1</span> | <span data-lang-en="TOTAL" data-lang-th="ราคารวม">TOTAL</span></div>
                <div class="summary-val">฿<span id="final-total-amount">0.00</span></div>
            </div>
        </div>

        <div style="padding: 10px 0;">
            <div id="cart-items-list"></div>
        </div>

        <div class="bottom-nav-fixed">
            <div class="round-btn-center" onclick="placeOrder()">
                <i class="fas fa-check"></i>
            </div>
            <div class="nav-buttons-bar">
                <div class="nav-icon" onclick="goBackToIndex()" style="cursor:pointer; display:flex; flex-direction:column; align-items:center;">
                    <i class="fas fa-plus"></i>
                    <span style="font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="ADD MORE" data-lang-th="สั่งเพิ่ม">ADD MORE</span>
                </div>
                <div style="width: 80px;"></div> 
                <div class="nav-icon" onclick="goToTracking()" style="cursor:pointer; display:flex; flex-direction:column; align-items:center;">
                    <i class="fas fa-receipt"></i>
                    <span style="font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="ORDERS" data-lang-th="รายการที่สั่ง">ORDERS</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="global_script.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
            authDomain: "bangfood-cb30f.firebaseapp.com", 
            databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "bangfood-cb30f", 
            storageBucket: "bangfood-cb30f.appspot.com", 
            messagingSenderId: "390955623784", 
            appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        // 📍 ตั้งค่า window.db เพื่อให้ไฟล์ global_script.js มองเห็นและแปลภาษาได้
        window.db = firebase.database(); 

        async function initializeCartPage() {
            const table = getTableNo();
            applyTheme(localStorage.getItem(`theme_table_${table}`) || 'dark');
            const lang = localStorage.getItem(`lang_table_${table}`) || 'th';
            
            await renderCartItems();
            translatePage(lang);
        }

        async function renderCartItems() {
    const tableNo = getTableNo();
    const lang = localStorage.getItem(`lang_table_${tableNo}`) || 'th';
    const cartKey = `bangfood_cart_table_${tableNo}`;
    const cartData = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };
    
    const transSnap = await window.db.ref('menu_translations').once('value');
    const dict = transSnap.val() || {};

    const listContainer = document.getElementById('cart-items-list');
    listContainer.innerHTML = '';
    let grandTotal = 0;

    if (cartData.items.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:100px 0; opacity:0.3;"><i class="fas fa-shopping-basket" style="font-size:3.5rem;"></i><p data-lang-en="Your basket is empty" data-lang-th="ตะกร้าว่างเปล่าครับน้า">ตะกร้าว่างเปล่าครับน้า</p></div>`;
        document.getElementById('final-total-amount').textContent = '0.00';
        return;
    }

    cartData.items.forEach((item, index) => {
        const finalP = parseFloat(item.finalPrice || 0);
        grandTotal += finalP;
        
        const displayName = (lang === 'en') ? (dict[item.name] || item.name) : item.name;
        
        let optionsHtml = '';
        let optionsPriceTotal = 0;
        if (item.optionsArray) {
            optionsHtml = item.optionsArray.map(opt => {
                const op = parseFloat(opt.price || 0);
                optionsPriceTotal += op;
                const optName = (lang === 'en') ? (dict[opt.name] || opt.name) : opt.name;
                return `<div class="addon-line" style="display:flex; justify-content:space-between; width:100%;">
                            <span>+ ${optName}</span>
                            <span style="color:#666;">฿${op.toFixed(2)}</span>
                        </div>`;
            }).join('');
        }

        // 📍 คำนวณราคาเริ่มต้นของอาหาร (ราคาเต็ม - ราคาท็อปปิ้ง)
        const baseP = finalP - optionsPriceTotal;

        listContainer.innerHTML += `
            <div class="cart-item" style="animation-delay: ${index * 0.1}s">
                <div class="item-main-row" style="display: flex; gap: 15px; align-items: flex-start;">
                    <img src="${item.img}" class="item-img" style="width: 65px; height: 65px; border-radius: 16px; object-fit: cover;">
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items: center; width:100%;">
                            <p class="food-name" style="margin:0; font-weight:500;">${displayName}</p>
                            <span style="color:#888; font-size:0.85rem;">฿${baseP.toFixed(2)}</span>
                        </div>
                        <div class="addon-area" style="margin-top: 5px;">${optionsHtml}</div>
                        ${item.notes ? `<div style="font-size:0.7rem; color:var(--premium-gold); margin-top:8px; opacity:0.8;">📝 ${item.notes}</div>` : ''}
                    </div>
                </div>
                
                <div class="item-footer" style="display:flex; justify-content:space-between; align-items:center; margin-top:15px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.03);">
                    <button class="remove-btn" onclick="removeItem(${index})" data-lang-en="REMOVE" data-lang-th="ลบออก">ลบออก</button>
                    <div style="text-align: right;">
                        <span style="font-weight:700; color:var(--premium-gold); font-size:1.3rem;">฿${finalP.toFixed(2)}</span>
                    </div>
                </div>
            </div>`;
    });
    document.getElementById('final-total-amount').textContent = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 });
    document.getElementById('display-table').innerText = tableNo;
}

        window.removeItem = function(index) {
            const tableNo = getTableNo();
            const cartKey = `bangfood_cart_table_${tableNo}`;
            let cartData = JSON.parse(sessionStorage.getItem(cartKey));
            cartData.items.splice(index, 1);
            sessionStorage.setItem(cartKey, JSON.stringify(cartData));
            renderCartItems(); 
        }

        window.placeOrder = function() {
            const tableNo = getTableNo();
            const cartKey = `bangfood_cart_table_${tableNo}`;
            const cartData = JSON.parse(sessionStorage.getItem(cartKey));
            if (!cartData || cartData.items.length === 0) return;
            if (!confirm("ยืนยันการส่งออเดอร์เข้าครัวใช่ไหมครับน้า?")) return;

            const orderData = {
                tableNumber: tableNo,
                items: cartData.items,
                total: cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice), 0),
                status: 'รอดำเนินการ',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            window.db.ref('orders').push(orderData).then(() => {
                sessionStorage.setItem(cartKey, JSON.stringify({ items: [] }));
                window.location.href = `track.html?table=${tableNo}`;
            });
        };

        function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
        function goToTracking() { window.location.href = `track.html?table=${getTableNo()}`; }

        window.addEventListener('DOMContentLoaded', initializeCartPage);
    </script>
</body>
</html>
