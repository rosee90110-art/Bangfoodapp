<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ติดตามสถานะ - BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="global_style.css">
    <style>
        body {
            background-color: var(--bg-deep);
            color: #e0e0e0;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: 0.3s;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-deep);
            position: relative;
            padding-bottom: 120px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .app-header-sticky {
            position: sticky;
            top: 0;
            z-index: 2000;
            background: rgba(10, 10, 11, 0.9);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
        }

        body.light-theme .app-header-sticky {
            background: rgba(245, 245, 247, 0.9);
        }

        .header-main-row {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            cursor: pointer;
            color: #666;
            font-size: 1.1rem;
        }

        .bangfood-logo {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--premium-gold);
            margin: 0;
            text-transform: uppercase;
        }

        .top-summary-bar {
            padding: 12px 25px;
            background: rgba(197, 160, 89, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label {
            font-size: 0.65rem;
            color: #666;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .summary-val {
            color: var(--premium-gold);
            font-weight: 700;
            font-size: 1.4rem;
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }

        /* 🧾 Unified Receipt Style */
        .receipt-paper {
            background: #fdfdfd;
            color: #111;
            margin: 0 20px 40px;
            padding: 30px 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            min-height: 400px;
            animation: flowDown 1.2s cubic-bezier(0.19, 1, 0.22, 1) both;
            transform-origin: top center;
        }

        @media (max-width: 400px) {
            .receipt-paper {
                margin: 0 12px 30px;
                padding: 25px 15px;
            }

            .bangfood-logo {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }

            .summary-val {
                font-size: 1.2rem;
            }

            .nav-bar {
                width: 85%;
                padding: 0 20px;
            }

            .round-refresh {
                width: 62px;
                height: 62px;
            }
        }

        .receipt-paper::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 16px;
            background: linear-gradient(-45deg, transparent 33.33%, #fdfdfd 33.33%, #fdfdfd 66.66%, transparent 66.66%),
                linear-gradient(45deg, transparent 33.33%, #fdfdfd 33.33%, #fdfdfd 66.66%, transparent 66.66%);
            background-size: 12px 12px;
            transform: rotate(180deg);
        }

        .receipt-paper::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(-45deg, transparent 33.33%, #fdfdfd 33.33%, #fdfdfd 66.66%, transparent 66.66%),
                linear-gradient(45deg, transparent 33.33%, #fdfdfd 33.33%, #fdfdfd 66.66%, transparent 66.66%);
            background-size: 10px 10px;
        }

        .order-card-receipt {
            border-bottom: 2px dashed #ddd;
            padding: 20px 0;
            position: relative;
        }

        .order-card-receipt:last-child {
            border-bottom: none;
        }

        .order-id-label {
            font-size: 0.7rem;
            color: #888;
            font-weight: 700;
            font-family: monospace;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .receipt-item b {
            font-weight: 800;
        }

        .receipt-addon {
            font-size: 0.75rem;
            color: #666;
            padding-left: 15px;
            margin-top: -4px;
            margin-bottom: 6px;
        }

        /* 🗃️ Status Stamps */
        .status-stamp {
            position: absolute;
            top: 15px;
            right: 0;
            border: 3px solid;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 950;
            text-transform: uppercase;
            transform: rotate(-12deg);
            opacity: 0.8;
            pointer-events: none;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .stamp-pending {
            color: #e67e22;
            border-color: #e67e22;
        }

        .stamp-paid {
            color: #2980b9;
            border-color: #2980b9;
        }

        .stamp-ready {
            color: #27ae60;
            border-color: #27ae60;
        }

        @keyframes flowDown {
            from {
                transform: translateY(-30px) scaleY(0);
                opacity: 0;
            }

            to {
                transform: translateY(0) scaleY(1);
                opacity: 1;
            }
        }

        /* --- Nav Style --- */

        .round-refresh {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-deep);
            border: 4px solid var(--premium-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5100;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            color: var(--premium-gold);
            pointer-events: auto;
        }

        body.light-theme .round-refresh {
            background: #fff;
        }

        /* --- Dropdown Menu Style --- */
        .side-drawer {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 180px;
            background: #121214;
            z-index: 4000;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            transform-origin: top right;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .side-drawer.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 18px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .drawer-item:active {
            transform: scale(0.95);
        }

        .drawer-item span {
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--premium-gold);
        }


        /* --- Bottom Nav Style --- */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 5000;
        }

        .nav-bar {
            width: 75%;
            height: 65px;
            background: #121214;
            border-radius: 35px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 35px;
            pointer-events: auto;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        body.light-theme .nav-bar {
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .nav-item {
            text-align: center;
            color: #666;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        .nav-item.active {
            color: var(--premium-gold);
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item span {
            display: block;
            font-size: 0.55rem;
            font-weight: 700;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .round-refresh {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-deep);
            border: 4px solid var(--premium-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5100;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--premium-gold);
            pointer-events: auto;
        }

        body.light-theme .round-refresh {
            background: #fff;
        }

        /* --- Receipt UI --- */
        .receipt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .receipt-paper {
            background: #fff;
            color: #333;
            width: 100%;
            max-width: 83%;
            padding: 30px 20px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            font-family: 'Courier New', Courier, monospace;
        }

        .receipt-paper::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(-45deg, #fff 5px, transparent 0), linear-gradient(45deg, #fff 5px, transparent 0);
            background-size: 10px 10px;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 2px dashed #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .receipt-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #000;
            letter-spacing: 2px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .receipt-total {
            border-top: 2px dashed #eee;
            margin-top: 15px;
            padding-top: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .close-receipt {
            position: absolute;
            top: -50px;
            right: 0;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .print-btn {
            margin-top: 25px;
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Kanit';
            cursor: pointer;
        }

        .receipt-status-stamp {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            border: 2px solid #333;
            padding: 5px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
        }
    </style>
</head>

<body onload="initializeTrackPage()">

    <div id="receipt-overlay" class="receipt-overlay">

                    <span data-lang-en="HOME" data-lang-th="หน้าแรก">หน้าแรก</span>

                    <i class="fas fa-list-ul"></i>
                    <span data-lang-en="ORDERS" data-lang-th="รายการสั่ง">รายการสั่ง</span>
                </div>

            </div>

            <div class="round-btn-center" id="center-action-btn" onclick="handleCenterAction()">
                <i id="center-icon" class="fas fa-sync-alt" style="font-size: 1.8rem;"></i>
            </div>
        </div>
        </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="global_script.js"></script>
    <audio id="notification-sound" src="sound/warn.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        window.db = firebase.database();

        let currentSelectedOrderId = null;
        let currentSelectedStatus = null;
        let lastOrderStatuses = {};

        async function initializeTrackPage() {
            const table = getTableNo();
            applyTheme(localStorage.getItem(`theme_table_${table}`) || 'dark');
            const lang = localStorage.getItem(`lang_table_${table}`) || 'th';

            document.getElementById('display-table').innerText = table;
            document.getElementById('drawer-lang-status').innerText = lang.toUpperCase();

            // เพิ่ม Event Listener เพื่อปลดล็อกเสียงเมื่อผู้ใช้สัมผัสหน้าจอครั้งแรก
            document.body.addEventListener('click', function () {
                const sound = document.getElementById('notification-sound');
                sound.play().then(() => {
                    sound.pause(); // เล่นแล้วหยุดทันทีเพื่อ "เบิกทาง" ให้ระบบอนุญาตส่งเสียง
                    sound.currentTime = 0;
                }).catch(e => { });
            }, { once: true });

            startLiveTracking();
            updatePageText(lang);
        }

        function requestNotificationPermission() {
            if ("Notification" in window) Notification.requestPermission();
        }

        function playAlert(orderId, newStatus) {
            const sound = document.getElementById('notification-sound');
            if (sound) sound.play().catch(e => console.log("Audio play blocked"));

            if (Notification.permission === "granted") {
                new Notification("อัปเดตสถานะอาหาร - BANGFOOD", {
                    body: `ออเดอร์ ID: ${orderId.slice(-6).toUpperCase()} เปลี่ยนเป็น: ${newStatus}`,
                    icon: "logo.png"
                });
            }
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        // เพิ่มตัวแปรเพื่อเช็คว่าเป็นการโหลดครั้งแรกหรือไม่ (ป้องกันเสียงดังรัวๆ ตอนเปิดหน้าเว็บ)
        let isFirstLoad = true;

        function startLiveTracking() {
            requestNotificationPermission();
            const tableNo = getTableNo();

            window.db.ref('orders').orderByChild('tableNumber').equalTo(tableNo).on('value', async (snapshot) => {
                const listContainer = document.getElementById('items-list-container');
                listContainer.className = 'receipt-paper';
                const currentLang = localStorage.getItem(`lang_table_${tableNo}`) || 'th';
                const transSnap = await window.db.ref('menu_translations').once('value');
                const dict = transSnap.val() || {};

                let mainHtml = '';
                let grandTotal = 0;

                if (snapshot.exists()) {
                    snapshot.forEach(orderChild => {
                        const order = orderChild.val();
                        const orderId = orderChild.key;

                        if (!isFirstLoad) {
                            if (lastOrderStatuses[orderId] && lastOrderStatuses[orderId] !== order.status) {
                                playAlert(orderId, order.status);
                            }
                        }
                        lastOrderStatuses[orderId] = order.status;

                        let orderItemsHtml = '';
                        if (order.items) {
                            order.items.forEach((item) => {
                                const mainQty = parseInt(item.quantity || 1);
                                const basePrice = parseFloat(item.price || item.unitPrice || 0);
                                const displayName = (currentLang === 'en') ? (dict[item.name] || item.name) : item.name;
                                const finalP = parseFloat(item.finalPrice || 0);
                                grandTotal += finalP;

                                let optionsHtml = '';
                                if (item.optionsArray) {
                                    optionsHtml = item.optionsArray.map(opt => {
                                        const optPrice = parseFloat(opt.price || 0) * parseInt(opt.qty || 1);
                                        const optName = (currentLang === 'en') ? (dict[opt.name] || opt.name) : opt.name;
                                        return `<div class="receipt-addon">
                                                <span>+ ${optName} (x${opt.qty})</span>
                                                <span style="float:right;">${optPrice > 0 ? '฿' + optPrice.toFixed(2) : '-'}</span>
                                            </div>`;
                                    }).join('');
                                }

                                orderItemsHtml += `
                                <div class="receipt-item">
                                    <span>${displayName} <b>x${mainQty}</b></span>
                                    <span>฿${finalP.toFixed(2)}</span>
                                </div>
                                ${optionsHtml}`;
                            });
                        }

                        let stampClass = 'stamp-pending';
                        let stampText = (currentLang === 'en') ? 'WAITING' : 'รอรับออเดอร์';
                        if (order.status === 'เสร็จสมบูรณ์') { stampClass = 'stamp-ready'; stampText = (currentLang === 'en') ? 'READY' : 'ครัวทำเสร็จแล้ว'; }
                        if (order.status === 'ชำระเงินแล้ว') { stampClass = 'stamp-paid'; stampText = (currentLang === 'en') ? 'PAID' : 'ชำระเงินแล้ว'; }

                        mainHtml += `
                        <div class="order-card-receipt" id="order-card-${orderId}" onclick="selectOrder('${orderId}', '${order.status}')">
                            <div class="status-stamp ${stampClass}">${stampText}</div>
                            <div class="order-id-label">#${orderId.slice(-6).toUpperCase()}</div>
                            <div style="margin-top:10px;">${orderItemsHtml}</div>
                            <div style="display:flex; justify-content:space-between; margin-top:15px; border-top:1px dashed #eee; padding-top:10px;">
                                <span style="font-size:0.7rem; font-weight:700; color:#888;">ORDER TOTAL</span>
                                <span style="font-weight:900; font-size:1.1rem; color:#111;">฿${parseFloat(order.total || grandTotal).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                            </div>
                        </div>`;
                    });
                    listContainer.innerHTML = mainHtml;
                    document.getElementById('final-total-amount').textContent = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 });
                    isFirstLoad = false;
                } else {
                    listContainer.innerHTML = `<div style="text-align:center; padding:100px 0; opacity:0.3;"><i class="fas fa-receipt" style="font-size:3.5rem;"></i><p>ยังไม่มีรายการสั่งครับ</p></div>`;
                }
            });
        }

        function selectOrder(orderId, status) {
            if (currentSelectedOrderId === orderId) {
                currentSelectedOrderId = null;
                currentSelectedStatus = null;
            } else {
                currentSelectedOrderId = orderId;
                currentSelectedStatus = status;
            }
            document.querySelectorAll('.order-card-receipt').forEach(card => card.classList.remove('selected-order'));
            if (currentSelectedOrderId) {
                const card = document.getElementById('order-card-' + currentSelectedOrderId);
                if (card) card.classList.add('selected-order');
            }
            updateCenterButtonUI();
        }

        function updateCenterButtonUI() {
            const btn = document.getElementById('center-action-btn');
            const icon = document.getElementById('center-icon');
            if (!btn || !icon) return;

            if (currentSelectedOrderId) {
                if (currentSelectedStatus === 'เสร็จสมบูรณ์') {
                    btn.style.background = "#e74c3c"; // Red for action
                    btn.style.borderColor = "#c0392b";
                    btn.style.color = "#fff";
                    icon.className = "fas fa-cash-register";
                } else if (currentSelectedStatus === 'ชำระเงินแล้ว') {
                    btn.style.background = "#27ae60"; // Green for paid
                    btn.style.borderColor = "#219150";
                    btn.style.color = "#fff";
                    icon.className = "fas fa-file-invoice-dollar";
                } else {
                    resetCenterButton();
                }
            } else {
                resetCenterButton();
            }
        }

        function resetCenterButton() {
            const btn = document.getElementById('center-action-btn');
            const icon = document.getElementById('center-icon');
            btn.style.background = "var(--bg-deep)";
            btn.style.borderColor = "var(--premium-gold)";
            btn.style.color = "var(--premium-gold)";
            icon.className = "fas fa-sync-alt";
        }

        function handleCenterAction() {
            if (currentSelectedOrderId && (currentSelectedStatus === 'ชำระเงินแล้ว' || currentSelectedStatus === 'เสร็จสมบูรณ์')) {
                generateReceiptPopup(currentSelectedOrderId);
            } else {
                window.location.reload();
            }
        }

        async function generateReceiptPopup(orderId) {
            const snapshot = await window.db.ref('orders/' + orderId).once('value');
            if (!snapshot.exists()) return;

            const order = snapshot.val();
            const content = document.getElementById('receipt-content');
            const dateEl = document.getElementById('receipt-date');
            const totalEl = document.getElementById('receipt-total-amount');

            const now = new Date();
            dateEl.innerText = `ID: ${orderId.toUpperCase()}\nDate: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;

            let statusText = (order.status === 'ชำระเงินแล้ว') ? "ชำระเงินแล้ว / PAID" : "ยังไม่ชำระ / UNPAID";
            let statusColor = (order.status === 'ชำระเงินแล้ว') ? "#2980b9" : "#e74c3c";

            let html = `
        <div style="margin: 10px 0; border-top: 1px solid #eee; padding-top: 10px; font-weight:bold;">STATION: ${order.tableNumber}</div>
        <div class="receipt-status-stamp" style="border-color: ${statusColor}; color: ${statusColor};">${statusText}</div>
        <div style="border-bottom: 1px dashed #eee; margin-bottom: 10px; padding-bottom: 5px; font-size: 0.7rem; color: #666;">รายการอาหาร (DETAILS)</div>
    `;

            let grandTotal = 0;
            order.items.forEach(item => {
                // ดึงราคาฐานที่เก็บไว้
                const bPrice = parseFloat(item.price || 0);
                const fPrice = parseFloat(item.finalPrice || 0);
                grandTotal += fPrice;

                html += `
            <div class="receipt-row" style="font-weight: bold; margin-top: 8px;">
                <span>${item.name} x${item.quantity}</span>
                <span>฿${fPrice.toFixed(2)}</span>
            </div>
            <div class="receipt-row" style="font-size: 0.65rem; color: #888; padding-left: 5px; margin-top: -2px;">
                <span>(ราคาจานละ: ฿${bPrice.toFixed(2)})</span>
                <span>-</span> 
            </div>
        `;

                if (item.optionsArray) {
                    item.optionsArray.forEach(opt => {
                        const optPrice = parseFloat(opt.price || 0) * parseInt(opt.qty || 1);
                        // หากราคาเป็น 0 ให้แสดงเป็น - ตามคำสั่งของคุณ
                        const displayOptPrice = optPrice > 0 ? `+ ฿${optPrice.toFixed(2)}` : "-";

                        html += `
                    <div class="receipt-row" style="font-size: 0.7rem; color: #555; padding-left: 15px;">
                        <span>- ${opt.name} (x${opt.qty})</span>
                        <span>${displayOptPrice}</span>
                    </div>`;
                    });
                }
            });

            content.innerHTML = html;
            totalEl.innerText = `฿${grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
            document.getElementById('receipt-overlay').style.display = 'flex';
        }

        function closeReceipt() { document.getElementById('receipt-overlay').style.display = 'none'; }
        function goToPage(page) {
            const table = localStorage.getItem('selectedTable') || '1';
            const url = `${page}?table=${table}`;
            if (window.navigateTo) {
                window.navigateTo(url);
            } else {
                window.location.href = url;
            }
        }
        function switchLanguageRealtime() {
            const table = getTableNo();
            const langKey = `lang_table_${table}`;
            const next = (localStorage.getItem(langKey) === 'en') ? 'th' : 'en';
            localStorage.setItem(langKey, next);

            const mainEl = document.querySelector('.app-wrapper');
            if (mainEl) mainEl.classList.add('lang-transition-container', 'lang-transitioning');

            const drawerLang = document.getElementById('drawer-lang-status');
            if (drawerLang) {
                drawerLang.style.transition = 'transform 0.2s, opacity 0.2s';
                drawerLang.style.transform = 'translateY(-5px)';
                drawerLang.style.opacity = '0';
                setTimeout(() => {
                    drawerLang.innerText = next.toUpperCase();
                    drawerLang.style.transform = 'translateY(5px)';
                    requestAnimationFrame(() => {
                        drawerLang.style.transform = 'translateY(0)';
                        drawerLang.style.opacity = '1';
                    });
                }, 200);
            }

            setTimeout(() => {
                location.reload(); // Simple reload for tracking page to refresh listeners
            }, 300);
        }
        function updatePageText(lang) {
            document.querySelectorAll('[data-lang-en]').forEach(el => {
                el.innerText = (lang === 'en') ? el.getAttribute('data-lang-en') : el.getAttribute('data-lang-th');
            });
        }
        function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
        function goToCart() { window.location.href = `cart.html?table=${getTableNo()}`; }
        function toggleDrawer() {
            const drawer = document.getElementById('side-drawer');
            drawer.classList.toggle('active');
            const overlay = document.getElementById('drawer-overlay');
            if (overlay) overlay.style.display = drawer.classList.contains('active') ? 'block' : 'none';
        }
        function applyTheme(t) { document.body.classList.toggle('light-theme', t === 'light'); }

    </script>
</body>

</html>
