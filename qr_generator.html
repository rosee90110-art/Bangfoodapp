<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สร้าง QR Code โต๊ะ | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* 📍 Premium Global Config (BANGFOOD Style) */
        :root {
            --premium-gold: #c5a059;
            --gold-glow: rgba(197, 160, 89, 0.4);
            --bg-dark: #080809;
            --bg-card: #141416;
            --text-main: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-pos: 0 25px 50px rgba(0,0,0,0.7);
            --input-bg: rgba(128,128,128,0.08);
        }

        body.light-theme {
            --bg-dark: #f1f3f6;
            --bg-card: #ffffff;
            --text-main: #1a1d23;
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow-pos: 0 15px 40px rgba(0,0,0,0.06);
            --input-bg: #f9f9f9;
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; outline: none; }
        body { margin: 0; padding: 40px 20px; min-height: 100vh; background-color: var(--bg-dark); color: var(--text-main); transition: 0.5s ease; display: flex; justify-content: center; align-items: flex-start; }

        .generator-container { width: 100%; max-width: 950px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; animation: slideUp 0.8s ease; }

        /* 🎛️ Control Panel */
        .control-panel { background: var(--bg-card); border: 1px solid var(--glass-border); padding: 40px; border-radius: 45px; box-shadow: var(--shadow-pos); }
        .header-title h1 { font-size: 2rem; font-weight: 900; margin: 0; color: var(--premium-gold); letter-spacing: -1px; }
        .header-title p { color: #888; font-size: 0.85rem; margin-top: 5px; font-weight: 600; }

        .input-group { margin: 30px 0; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--text-main); font-weight: 800; margin-bottom: 12px; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 20px 25px; border-radius: 20px; border: 1px solid var(--glass-border); background: var(--input-bg); color: var(--text-main); font-size: 1.2rem; font-weight: 700; transition: 0.3s; }
        .input-group input:focus { border-color: var(--premium-gold); box-shadow: 0 0 20px var(--gold-glow); }

        .url-preview { font-size: 0.7rem; color: #555; margin-top: 8px; word-break: break-all; font-family: monospace; }

        .btn-action { width: 100%; padding: 20px; border-radius: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; font-size: 1.1rem; border: none; margin-top: 15px; }
        .btn-generate { background: var(--premium-gold); color: #000; box-shadow: 0 10px 30px var(--gold-glow); }
        .btn-download { background: rgba(128,128,128,0.1); color: var(--text-main); border: 1px solid var(--glass-border); display: none; }

        /* 📱 QR Preview Panel */
        .preview-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .qr-card-preview { 
            background: #ffffff; width: 320px; padding: 40px 30px; border-radius: 35px; 
            text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border: 8px solid var(--premium-gold);
            transform: scale(0.9); opacity: 0.4; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .qr-card-preview.active { transform: scale(1); opacity: 1; }
        .qr-brand { color: #000; font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; }
        .qr-sub { color: #888; font-size: 0.75rem; font-weight: 700; margin-bottom: 25px; text-transform: uppercase; }
        .qr-code-box { background: #fff; padding: 15px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .qr-table-label { background: var(--premium-gold); color: #000; padding: 12px 25px; border-radius: 50px; font-size: 1.5rem; font-weight: 900; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 850px) {
            .generator-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="generator-container">
        <div class="control-panel">
            <div class="header-title">
                <h1>QR GENERATOR</h1>
                <p>สร้างโค้ดสำหรับติดที่โต๊ะอาหาร</p>
            </div>

            <div class="input-group">
                <label>หมายเลขโต๊ะ (TABLE NUMBER)</label>
                <input type="text" id="table-input" placeholder="ใส่เลขโต๊ะ เช่น 99" oninput="updateUrlPreview()">
                <div class="url-preview" id="url-display">ลิงก์จะปรากฏที่นี่...</div>
            </div>

            <button class="btn-action btn-generate" onclick="generateNow()">
                <i class="fas fa-magic"></i> สร้าง QR Code ทันที
            </button>

            <button class="btn-action btn-download" id="btn-dl" onclick="downloadQR()">
                <i class="fas fa-download"></i> ดาวน์โหลดรูปภาพ
            </button>
        </div>

        <div class="preview-panel">
            <div class="qr-card-preview" id="preview-card">
                <div class="qr-brand">BANGFOOD</div>
                <div class="qr-sub">Scan to Order</div>
                
                <div class="qr-code-box" id="qrcode">
                    </div>

                <div class="qr-table-label" id="label-table">TABLE -</div>
            </div>
        </div>
    </div>

    <script>
        // 1. ดึง Path ของหน้า start.html อัตโนมัติ
        function getTargetUrl(table) {
            const currentPath = window.location.pathname;
            const directory = currentPath.substring(0, currentPath.lastIndexOf('/'));
            // สร้าง URL เต็ม: โปรโตคอล + โฮสต์ + โฟลเดอร์เดิม + start.html?table=XX
            const fullUrl = window.location.origin + directory + "/start.html?table=" + table;
            return fullUrl;
        }

        // 2. แสดงตัวอย่าง Link ขณะพิมพ์
        function updateUrlPreview() {
            const val = document.getElementById('table-input').value.trim();
            const display = document.getElementById('url-display');
            if(val) {
                display.innerText = "Target: " + getTargetUrl(val);
            } else {
                display.innerText = "กรุณาใส่เลขโต๊ะ...";
            }
        }

        // 3. ฟังก์ชันหลัก: สร้าง QR Code
        function generateNow() {
            const tableNo = document.getElementById('table-input').value.trim();
            if(!tableNo) { alert("กรุณาใส่เลขโต๊ะก่อนครับ!"); return; }

            const finalUrl = getTargetUrl(tableNo);
            const qrContainer = document.getElementById('qrcode');
            
            // ล้างอันเก่า
            qrContainer.innerHTML = '';

            // สร้างใหม่
            new QRCode(qrContainer, {
                text: finalUrl,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // อัปเดตหน้าตา Preview
            document.getElementById('label-table').innerText = "TABLE " + tableNo;
            document.getElementById('preview-card').classList.add('active');
            document.getElementById('btn-dl').style.display = 'flex';
        }

        // 4. ฟังก์ชันดาวน์โหลด
        function downloadQR() {
            const tableNo = document.getElementById('table-input').value;
            const img = document.querySelector('#qrcode img');
            const canvas = document.querySelector('#qrcode canvas');
            
            // ใช้ค่าจาก <img> ถ้ามี (qrcode.js จะสร้างทั้งสองอย่าง)
            const imgUri = img ? img.src : canvas.toDataURL("image/png");

            const link = document.createElement('a');
            link.href = imgUri;
            link.download = `BANGFOOD_Table_${tableNo}.png`;
            link.click();
        }
    </script>
</body>
</html>
