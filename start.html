<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยินดีต้อนรับสู่ BANGFOOD</title>
    
    <style>
        /* 🎥 Background Video Setup */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            z-index: 0;
        }

        /* 📍 Minimal Menu Style */
        .top-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }

        .menu-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .menu-toggle span {
            width: 18px;
            height: 2px;
            background-color: white;
        }

        /* 📋 Admin Dropdown */
        .admin-dropdown {
            position: fixed;
            top: 75px;
            right: 20px;
            width: 180px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1002;
            display: none;
            overflow: hidden;
            animation: fadeInDown 0.3s ease-out;
        }

        .admin-dropdown.active { display: block; }

        .dropdown-item {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .dropdown-item:hover { background: rgba(255, 255, 255, 0.1); color: #c5a059; }

        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.1); }

        /* 🏠 Main Container */
        .landing-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .app-header-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .table-badge {
            background: #c5a059;
            color: black;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none; /* โชว์เมื่อมีเลขโต๊ะ */
        }

        /* 🔘 Minimal Button */
        .landing-btn-group { margin-top: 25px; width: 280px; }

        .landing-button {
            display: block;
            width: 100%;
            padding: 18px;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: 0.4s;
            cursor: pointer;
            font-weight: 700;
        }

        .landing-button:hover {
            background: white;
            color: black;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            position: fixed;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-background">
        <source src="intro.mp4" type="video/mp4">
    </video>
    
    <div class="video-overlay"></div>
    
    <div class="top-header">
        <div class="menu-toggle" onclick="toggleAdminMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div id="admin-dropdown" class="admin-dropdown">
        <a href="login.html" class="dropdown-item">⚙️ <span id="admin-text">โหมดผู้ดูแลระบบ</span></a>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="switchLanguage()">
            <span id="lang-label">🌐 TH | EN</span>
        </div>
    </div>

    <div class="landing-container">
        <div id="table-display" class="table-badge">TABLE -</div>
        <h1 class="app-header-title">BANGFOOD</h1>
        <p id="welcome-msg">ร้านบังอะซิล ยินดีให้บริการครับ</p>

        <div class="landing-btn-group">
            <button id="customer-btn" class="landing-button" onclick="goToOrder()">สั่งอาหารกดที่นี่</button>
        </div>
    </div>

    <script>
        // 🌐 คลังคำแปล
        const translations = {
            th: {
                welcome: "ร้านบังอะซิล ยินดีให้บริการครับ",
                orderBtn: "สั่งอาหารกดที่นี่",
                adminMode: "โหมดผู้ดูแลระบบ",
                table: "โต๊ะที่",
                checking: "กำลังตรวจสอบพิกัด..."
            },
            en: {
                welcome: "Welcome to Bang Azil Food",
                orderBtn: "ORDER NOW",
                adminMode: "Admin Mode",
                table: "TABLE",
                checking: "Checking location..."
            }
        };

        // --- 1. จัดการเลขโต๊ะจาก QR Code ---
        function initTableCheck() {
            const urlParams = new URLSearchParams(window.location.search);
            const table = urlParams.get('table');
            
            if (table) {
                localStorage.setItem('selectedTable', table);
                const display = document.getElementById('table-display');
                const lang = localStorage.getItem('appLang') || 'th';
                display.innerText = `${translations[lang].table} ${table}`;
                display.style.display = 'inline-block';
                console.log("Scan Success: Table " + table);
            }
        }

        // --- 2. ฟังก์ชันไปหน้าสั่งอาหาร ---
        function goToOrder() {
            const tableNo = localStorage.getItem('selectedTable');
            const lang = localStorage.getItem('appLang') || 'th';

            if (!tableNo) {
                alert(lang === 'th' ? "กรุณาสแกน QR Code ที่โต๊ะครับ" : "Please scan QR Code at your table");
                return;
            }

            // ✅ ไปหน้าเมนูพร้อมส่งเลขโต๊ะทันที (ไม่ต้องเช็ค GPS)
            window.location.href = `index.html?table=${tableNo}`;
        }

        // --- 3. ระบบสลับภาษา ---
        function updatePageLanguage(lang) {
            document.getElementById('welcome-msg').innerText = translations[lang].welcome;
            document.getElementById('customer-btn').innerText = translations[lang].orderBtn;
            document.getElementById('admin-text').innerText = translations[lang].adminMode;
            
            const tableNo = localStorage.getItem('selectedTable');
            if(tableNo) {
                document.getElementById('table-display').innerText = `${translations[lang].table} ${tableNo}`;
            }

            localStorage.setItem('appLang', lang);
            document.getElementById('lang-label').innerText = (lang === 'th') ? "🌐 TH | EN" : "🌐 EN | TH";
        }

        function switchLanguage() {
            let currentLang = localStorage.getItem('appLang') || 'th';
            updatePageLanguage(currentLang === 'th' ? 'en' : 'th');
        }

        function toggleAdminMenu() {
            document.getElementById('admin-dropdown').classList.toggle('active');
        }

        // ปิดเมนูเมื่อคลิกข้างนอก
        window.onclick = function(e) {
            if (!e.target.closest('.top-header') && !e.target.closest('.admin-dropdown')) {
                document.getElementById('admin-dropdown').classList.remove('active');
            }
        }

        // รันเมื่อโหลดหน้าเว็บ
        window.addEventListener('DOMContentLoaded', () => {
            initTableCheck();
            updatePageLanguage(localStorage.getItem('appLang') || 'th');
        });
    </script>
</body>
</html>
