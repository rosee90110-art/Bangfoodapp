<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | สั่งง่าย QR Code</title>
    <link rel="stylesheet" href="style.css">
    
    </head>
<body>
   <header class="app-header">
    <a href="start.html" class="back-link">
        <i class="fas fa-chevron-left"></i> 
        <span>กลับ</span>
    </a>
    <h1 class="bangfoodindex">BANGFOOD</h1>
    <p class="menu-label">หน้า MENU</p>
    <div id="table-status-bar" style="text-align: center; color: #ff6347; font-weight: bold; margin-bottom: 10px;">
    กำลังตรวจสอบเลขโต๊ะ...
</div>
   </header>
   
    <main class="menu-container">
    <div class="menu-tabs"> 
        <a href="#" class="menu-tab active" data-category="อาหาร" onclick="switchCategory('อาหาร', event)">อาหาร</a>
        <a href="#" class="menu-tab" data-category="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว', event)">ก๋วยเตี๋ยว</a>
        <a href="#" class="menu-tab" data-category="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม', event)">เครื่องดื่ม</a>
    </div>

    <div id="food-container" class="menu-category-content">
        </div>

    <div id="noodle-container" class="menu-category-content" style="display: none;">
        </div>

    <div id="drink-container" class="menu-category-content" style="display: none;">
        </div>
</main>

    <div class="floating-cart-summary-container">
        <div class="floating-cart-summary">
            <span id="cart-item-count">0</span> รายการ
            <span class="separator">|</span>
            <span id="cart-total">0.00</span> บาท 
        
        
            <a href="cart.html" id="cart-label" class="checkout-button">
                🍽️
            </a>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
    // 1. ดึงค่าโต๊ะจาก URL และแสดงผล
    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table');
    const tableDisplay = document.getElementById('table-status-bar');

    if (tableNo) {
        localStorage.setItem('selectedTable', tableNo);
        if (tableDisplay) {
            tableDisplay.innerText = "📍 โต๊ะที่: " + tableNo;
            tableDisplay.style.color = "#4CAF50"; // เปลี่ยนเป็นสีเขียวเมื่อเจอโต๊ะ
        }
    } else {
        // กรณีเข้าผ่านลิงก์ตรงไม่มีเลขโต๊ะ ให้ดึงจากที่เคยจำไว้
        const savedTable = localStorage.getItem('selectedTable');
        if (savedTable && tableDisplay) {
            tableDisplay.innerText = "📍 โต๊ะที่: " + savedTable + " (เดิม)";
        } else if (tableDisplay) {
            tableDisplay.innerText = "❌ กรุณาสแกน QR Code ที่โต๊ะ";
            tableDisplay.style.color = "#ff4444";
        }
    }

    // 2. ตั้งค่า Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ",
        authDomain: "bangfood-cb30f.firebaseapp.com",
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bangfood-cb30f",
        storageBucket: "bangfood-cb30f.appspot.com",
        messagingSenderId: "390955623784",
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    // ใช้ var หรือ window.db เพื่อให้ไฟล์ script.js มองเห็นแน่นอน
    window.db = firebase.database(); 
</script>

    <script src="script.js"></script>
</body>
</html>
