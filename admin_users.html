<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Access Control | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* 📍 Theme System */
        :root {
            --bg: #0a0a0a;
            --card-bg: rgba(128,128,128,0.03);
            --text: #ffffff;
            --sub-text: #888888;
            --border: rgba(255,255,255,0.1);
            --premium-gold: #c5a059;
            --modal-bg: #111111;
        }

        /* ☀️ Light Theme Overrides */
        body.light-theme {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --sub-text: #666666;
            --border: rgba(0,0,0,0.08);
            --modal-bg: #ffffff;
        }

        body { margin: 0; padding: 40px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.4s ease; }
        main { max-width: 1200px; margin: 0 auto; animation: fadeInPage 0.8s ease-out; }

        /* 👑 Header */
        .elite-header-bar { display: flex; justify-content: space-between; align-items: center; gap: 25px; margin-bottom: 50px; }
        .header-title h1 { font-size: 2.2rem; font-weight: 900; margin: 0; letter-spacing: -1px; }
        .header-title p { color: var(--premium-gold); font-size: 0.75rem; letter-spacing: 3px; font-weight: 700; margin-top: 5px; }

        /* 📊 Stat Cluster */
        .stats-cluster { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-capsule {
            background: var(--card-bg);
            border: 1px solid var(--border); padding: 25px 40px; border-radius: 30px;
            flex: 1; backdrop-filter: blur(10px); transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .stat-capsule b { display: block; font-size: 2.5rem; color: var(--premium-gold); line-height: 1; margin-bottom: 8px; }
        .stat-capsule span { font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }

        /* ➕ Button */
        .btn-elite-create {
            background: linear-gradient(135deg, #d4af37, #8a6d3b); color: #000; border: none; 
            height: 60px; padding: 0 40px; border-radius: 20px; font-weight: 900; font-size: 0.85rem; 
            cursor: pointer; display: flex; align-items: center; gap: 15px; letter-spacing: 1px;
            transition: 0.4s; box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
        }

        /* 👥 User Grid */
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .user-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 40px; 
            padding: 30px; display: flex; align-items: center; justify-content: space-between; 
            transition: 0.4s; box-shadow: 0 15px 35px rgba(0,0,0,0.03);
        }
        .user-card.is-active-me { border: 2px solid var(--premium-gold); }

        .avatar-frame { position: relative; width: 75px; height: 75px; }
        .user-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); padding: 3px; background: var(--bg); }
        .status-dot { position: absolute; bottom: 5px; right: 5px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--bg); z-index: 2; }
        .status-dot.online { background: #43e97b; box-shadow: 0 0 10px #43e97b; }
        .status-dot.offline { background: #777; }

        .role-tag { font-size: 0.65rem; font-weight: 900; color: var(--premium-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; display: block; }
        
        .action-btn { 
            width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer; transition: 0.3s; background: rgba(128,128,128,0.1); border: 1px solid var(--border); color: var(--text);
        }

        /* 📱 Mobile */
        @media (max-width: 600px) {
            body { padding: 20px; }
            .elite-header-bar { flex-direction: column; align-items: flex-start; margin-bottom: 30px; }
            .btn-elite-create { width: 100%; justify-content: center; }
            .stats-cluster { gap: 10px; }
            .stat-capsule { padding: 20px 10px; }
            .user-grid { grid-template-columns: 1fr; }
        }

        @keyframes fadeInPage { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeAccessControl()">

    <main>
        <header class="elite-header-bar">
            <div class="header-title">
                <h1 id="txt-page-title">การจัดการสิทธิ์พนักงาน</h1>
                <p>SYSTEM SECURITY & PERMISSIONS</p>
            </div>

            <div id="add-btn-container" style="display: none;">
                <button class="btn-elite-create" onclick="openAddModal()">
                    <i class="fas fa-plus-circle"></i> <span id="txt-btn-add">เพิ่มสมาชิกใหม่</span>
                </button>
            </div>
        </header>

        <section class="stats-cluster">
            <div class="stat-capsule">
                <b id="total-admins">0</b>
                <span id="txt-stat-total">พนักงานทั้งหมด</span>
            </div>
            <div class="stat-capsule">
                <b id="online-admins" style="color: #43e97b;">0</b>
                <span id="txt-stat-online">กำลังออนไลน์</span>
            </div>
        </section>

        <div id="admin-list-container" class="user-grid"></div>
    </main>

    <div id="edit-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; backdrop-filter: blur(15px); justify-content: center; align-items: center; padding: 20px;">
        <div class="modal-box" style="background: var(--modal-bg); border: 1px solid var(--premium-gold); padding: 35px; border-radius: 35px; text-align: center; width: 100%; max-width: 380px; color: var(--text);">
            <div style="position: relative; display: inline-block; margin-bottom: 25px;" onclick="document.getElementById('edit-avatar-input').click()">
                <img id="edit-avatar-preview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:110px; height:110px; border-radius:50%; border:4px solid var(--premium-gold); object-fit:cover; cursor:pointer;">
                <div style="position:absolute; bottom:5px; right:5px; background:var(--premium-gold); color:#000; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fas fa-camera"></i></div>
            </div>
            <input type="file" id="edit-avatar-input" hidden accept="image/*" onchange="previewImage(this)">
            
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-username" placeholder="Username" style="width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
            <input type="text" id="edit-password" placeholder="Password" style="width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
            <select id="edit-role" style="width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
                <option value="Staff">Staff (พนักงาน)</option>
                <option value="Super Admin">Super Admin (เจ้าของร้าน)</option>
            </select>
            
            <button class="btn-elite-create" style="width:100%; justify-content:center;" onclick="saveAdminChanges()">SAVE CHANGES</button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--sub-text); margin-top:15px; cursor:pointer; font-weight:bold;">CANCEL</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentAdmin = sessionStorage.getItem('currentAdminName');
        const currentRole = sessionStorage.getItem('currentAdminRole') || "Staff";

        // 🌗 Theme & Language Logic
        function applySettings() {
            // Theme
            const isLight = localStorage.getItem('theme') === 'light';
            document.body.classList.toggle('light-theme', isLight);

            // Language
            const lang = localStorage.getItem('bf_lang') || 'th';
            const dict = {
                th: { title: "การจัดการสิทธิ์พนักงาน", add: "เพิ่มสมาชิกใหม่", total: "พนักงานทั้งหมด", online: "กำลังออนไลน์", staff: "พนักงาน", owner: "เจ้าของร้าน" },
                en: { title: "Access Control", add: "ADD NEW MEMBER", total: "TOTAL MEMBERS", online: "ACTIVE NOW", staff: "STAFF", owner: "OWNER" }
            };
            
            document.getElementById('txt-page-title').innerText = dict[lang].title;
            document.getElementById('txt-btn-add').innerText = dict[lang].add;
            document.getElementById('txt-stat-total').innerText = dict[lang].total;
            document.getElementById('txt-stat-online').innerText = dict[lang].online;
            
            return dict[lang]; // ส่งคำแปลไปใช้ในตอน render card
        }

        // คอยดักฟังการเปลี่ยนจากหน้า Dashboard (ไม่ต้อง Refresh)
        window.addEventListener('storage', () => {
            applySettings();
            loadAdminsRealtime(); // Render ใหม่เพื่อให้ภาษาใน Card เปลี่ยนด้วย
        });

        function initializeAccessControl() {
            applySettings();
            if (currentRole === 'Super Admin') document.getElementById('add-btn-container').style.display = 'block';
            loadAdminsRealtime();
        }

        function loadAdminsRealtime() {
            db.ref('admins').on('value', adminSnap => {
                db.ref('online_admins').on('value', onlineSnap => {
                    renderAdmins(adminSnap.val() || {}, onlineSnap.val() || {});
                });
            });
        }

        function renderAdmins(admins, onlineData) {
            const container = document.getElementById('admin-list-container');
            container.innerHTML = '';
            const t = applySettings(); // ดึงชุดคำแปลปัจจุบัน
            
            let onlineCount = Object.keys(onlineData || {}).length;

            Object.keys(admins).forEach(id => {
                const admin = admins[id];
                const isOnline = onlineData && onlineData[admin.username];
                const isMe = (admin.username === currentAdmin);
                
                let roleLabel = (admin.role === 'Super Admin') ? t.owner : t.staff;

                container.innerHTML += `
                    <div class="user-card ${isMe ? 'is-active-me' : ''}">
                        <div style="display:flex; align-items:center; gap:15px; flex: 1;">
                            <div class="avatar-frame">
                                <img src="${admin.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="user-img">
                                <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            </div>
                            <div style="overflow: hidden;">
                                <span class="role-tag">${roleLabel}</span>
                                <b style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${admin.username}</b>
                                <div style="color:${isOnline ? '#43e97b' : 'var(--sub-text)'}; font-size:0.6rem; font-weight:800; text-transform:uppercase;">
                                    ${isOnline ? 'Active Now' : 'Disconnected'}
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            ${(currentRole === 'Super Admin' || isMe) ? `<div class="action-btn" onclick='openEditModal("${id}", ${JSON.stringify(admin)})'><i class="fas fa-pen"></i></div>` : ''}
                            ${(currentRole === 'Super Admin' && !isMe) ? `<div class="action-btn" onclick="deleteAdmin('${id}')" style="color:#ff4444;"><i class="fas fa-trash"></i></div>` : ''}
                        </div>
                    </div>`;
            });
            document.getElementById('total-admins').innerText = Object.keys(admins).length;
            document.getElementById('online-admins').innerText = onlineCount;
        }

        // Logic Modal & Firebase (คงเดิม)
        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-username').value = "";
            document.getElementById('edit-avatar-preview').src = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openEditModal(id, admin) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = admin.username;
            document.getElementById('edit-password').value = admin.password;
            document.getElementById('edit-role').value = admin.role;
            document.getElementById('edit-avatar-preview').src = admin.profileImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function saveAdminChanges() {
            const id = document.getElementById('edit-id').value;
            const data = { 
                username: document.getElementById('edit-username').value.trim(), 
                password: document.getElementById('edit-password').value.trim(), 
                role: document.getElementById('edit-role').value,
                profileImg: document.getElementById('edit-avatar-preview').src 
            };
            if (id) db.ref('admins/' + id).update(data).then(closeModal);
            else db.ref('admins').push(data).then(closeModal);
        }

        function deleteAdmin(id) {
            if (confirm("ลบพนักงานคนนี้ใช่ไหมครับ?")) db.ref('admins/' + id).remove();
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('edit-avatar-preview').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
