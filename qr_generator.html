<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR STUDIO ULTIMATE | PRO MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Montserrat:wght@800;900&family=Chakra+Petch:wght@400;700&family=Sarabun:wght@400;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* Page-specific only — shared vars come from admin_style.css */
            --sidebar-bg: rgba(18,20,26,0.96);
            --stand-bg: #ffffff;
            --radius: 14px;
            --transition: all 0.35s cubic-bezier(0.23,1,0.32,1);
        }
        /* Light theme overrides for this page */
        body.light-theme {
            --sidebar-bg: rgba(255,255,255,0.96) !important;
        }
        body.light-theme .sidebar {
            border-right-color: rgba(var(--premium-gold-rgb),0.2) !important;
            box-shadow: 4px 0 30px rgba(0,0,0,.08) !important;
        }
        body.light-theme .section-title { color: var(--premium-gold) !important; }
        body.light-theme .opt-btn { color: var(--text) !important; background: rgba(0,0,0,.03) !important; }
        body.light-theme .input-box { background: rgba(0,0,0,.04) !important; color: var(--text) !important; }
        body.light-theme .viewport { background: radial-gradient(ellipse 80% 70% at 50% 50%, #e8ecf0 0%, #f0f4f8 100%) !important; }
        body.light-theme .toolbar { background: rgba(255,255,255,.92) !important; border-color: rgba(var(--premium-gold-rgb),.2) !important; }
        body.light-theme .tool-btn { color: #555 !important; border-color: rgba(var(--premium-gold-rgb),.15) !important; }
        body.light-theme .mobile-nav { background: rgba(255,255,255,.95) !important; }
        /* === BASE === */
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Kanit',sans-serif; }
        body {
            background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; overflow:hidden;
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
            background:
                radial-gradient(ellipse 70% 50% at 10% 10%, rgba(var(--premium-gold-rgb),.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 85%, rgba(var(--premium-gold-rgb),.03) 0%, transparent 60%);
        }

        /* === MOBILE NAV BAR === */
        .mobile-nav {
            display:none; position:fixed; top:0; width:100%;
            background:rgba(12,14,20,0.9); backdrop-filter:blur(20px);
            padding:14px 18px; z-index:200;
            border-bottom:1px solid rgba(var(--premium-gold-rgb),.15);
            justify-content:space-between; align-items:center;
        }

        /* === SIDEBAR === */
        .sidebar {
            width:360px; background:var(--sidebar-bg);
            backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
            border-right:1px solid rgba(var(--premium-gold-rgb),.12);
            padding:24px 20px; display:flex; flex-direction:column; gap:14px;
            z-index:90; overflow-y:auto;
            transition:var(--transition);
            box-shadow:4px 0 30px rgba(0,0,0,.3);
        }
        .sidebar::-webkit-scrollbar { width:4px; }
        .sidebar::-webkit-scrollbar-track { background:transparent; }
        .sidebar::-webkit-scrollbar-thumb { background:rgba(var(--premium-gold-rgb),.2); border-radius:10px; }

        /* === SECTION TITLES === */
        .section-title {
            font-size:.7rem; font-weight:700; color:var(--premium-gold);
            text-transform:uppercase; letter-spacing:2px; margin-top:10px;
            display:flex; align-items:center; gap:8px;
            border-bottom:1px solid rgba(var(--premium-gold-rgb),.15); padding-bottom:8px;
        }
        .section-title i { opacity:.8; }

        /* === OPTION BUTTONS GRID === */
        .grid-options { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
        @keyframes optIn { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
        .opt-btn {
            aspect-ratio:1; border-radius:12px;
            border:1px solid rgba(var(--premium-gold-rgb),.12);
            background:rgba(255,255,255,.03); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:1.05rem; color:var(--text);
            transition:var(--transition);
            min-height:48px; position:relative; overflow:hidden;
        }
        .opt-btn::after {
            content:''; position:absolute; inset:0;
            background:radial-gradient(circle at 50% 50%,rgba(var(--premium-gold-rgb),.18),transparent 70%);
            opacity:0; transition:opacity .3s;
        }
        .opt-btn:hover:not(:disabled) {
            border-color:rgba(var(--premium-gold-rgb),.45);
            background:rgba(var(--premium-gold-rgb),.07);
            transform:translateY(-3px);
            box-shadow:0 6px 16px rgba(var(--premium-gold-rgb),.12);
        }
        .opt-btn:hover::after { opacity:1; }
        .opt-btn:active { transform:scale(.94); }
        .opt-btn.active {
            border-color:var(--premium-gold);
            background:rgba(var(--premium-gold-rgb),.12);
            color:var(--premium-gold);
            box-shadow:0 4px 14px rgba(var(--premium-gold-rgb),.2),
                       inset 0 0 0 1px rgba(var(--premium-gold-rgb),.15);
        }

        /* === INPUTS === */
        .input-box {
            width:100%; background:rgba(255,255,255,.04);
            border:1px solid rgba(var(--premium-gold-rgb),.12);
            padding:13px 15px; border-radius:12px; color:#fff;
            outline:none; transition:var(--transition); font-size:.95rem;
        }
        .input-box:focus {
            border-color:var(--premium-gold);
            background:rgba(var(--premium-gold-rgb),.06);
            box-shadow:0 0 0 3px rgba(var(--premium-gold-rgb),.12);
        }

        /* === GENERATE BUTTON === */
        .btn-generate {
            background:linear-gradient(135deg,var(--premium-gold),#a07830);
            color:#111; border:none; padding:15px;
            border-radius:12px; font-weight:900; cursor:pointer;
            font-size:.95rem; letter-spacing:1px;
            box-shadow:0 6px 20px rgba(var(--premium-gold-rgb),.3);
            transition:var(--transition); text-transform:uppercase;
            position:relative; overflow:hidden; width:100%;
        }
        .btn-generate::after {
            content:''; position:absolute; inset:0;
            background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.25),transparent 60%);
            opacity:0; transition:opacity .3s;
        }
        .btn-generate:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 12px 30px rgba(var(--premium-gold-rgb),.4); }
        .btn-generate:hover::after { opacity:1; }
        .btn-generate:active { transform:scale(.97); }

        /* === VIEWPORT === */
        .viewport {
            flex:1; display:flex; align-items:center; justify-content:center;
            position:relative; padding:40px; overflow:auto;
            background:radial-gradient(ellipse 80% 70% at 50% 50%, #1a1d24 0%, #070910 100%);
            touch-action:manipulation;
        }

        /* === QR STAND === */
        .qr-stand {
            background:var(--stand-bg); width:340px; min-height:480px;
            padding:45px 35px; border-radius:24px;
            box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
            text-align:center; position:relative; overflow:hidden;
            transition:.5s cubic-bezier(.2,.8,.2,1);
            opacity:.05; filter:blur(10px); pointer-events:none;
            flex-shrink:0; transform:translateY(20px) scale(.95);
        }
        .qr-stand.active { opacity:1; filter:blur(0); pointer-events:auto; transform:translateY(0) scale(1); }
        .shape-oval { border-radius:190px 190px 24px 24px; }
        .shape-sharp { border-radius:8px; }

        .qr-wrapper {
            position:relative; display:inline-flex; padding:18px;
            margin:22px 0; background:white; border-radius:14px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }
        .table-badge {
            background:#111; color:var(--premium-gold);
            padding:8px 32px; border-radius:8px;
            font-size:1.8rem; font-weight:900;
            display:inline-block; letter-spacing:2px;
        }

        /* === STICKERS === */
        .sticker-container { position:absolute; cursor:move; user-select:none; z-index:10; transform-origin:center; }
        .sticker-badge { background:#e74c3c; color:white; padding:5px 15px; border-radius:20px; font-weight:800; font-size:1.2rem; border:2px solid white; }
        .sticker-ctrls {
            position:absolute; top:-45px; left:50%; transform:translateX(-50%);
            display:flex; gap:5px; background:rgba(0,0,0,.85);
            padding:6px 10px; border-radius:30px;
            opacity:0; transition:.2s; pointer-events:none;
        }
        .sticker-container:hover .sticker-ctrls,
        .sticker-container.active-sticker .sticker-ctrls { opacity:1; pointer-events:auto; }
        .s-btn {
            background:rgba(255,255,255,.1); border:none; color:#fff; cursor:pointer;
            width:28px; height:28px; border-radius:50%;
            display:flex; align-items:center; justify-content:center; font-size:10px;
            transition:.2s;
        }
        .s-btn:hover { background:rgba(255,255,255,.25); }

        /* === TOOLBAR === */
        .toolbar {
            position:absolute; bottom:28px;
            background:rgba(12,14,20,.9); backdrop-filter:blur(20px);
            padding:12px 22px; border-radius:20px;
            display:flex; gap:14px;
            border:1px solid rgba(var(--premium-gold-rgb),.15);
            box-shadow:0 8px 30px rgba(0,0,0,.4);
            opacity:0; transform:translateY(20px); transition:.5s;
        }
        .toolbar.show { opacity:1; transform:translateY(0); }
        .tool-btn {
            background:rgba(255,255,255,.06); border:1px solid rgba(var(--premium-gold-rgb),.12);
            color:#ccc; cursor:pointer; width:46px; height:46px;
            border-radius:12px; display:flex; align-items:center; justify-content:center;
            transition:var(--transition); font-size:.95rem;
        }
        .tool-btn:hover {
            background:rgba(var(--premium-gold-rgb),.12);
            border-color:rgba(var(--premium-gold-rgb),.4);
            color:var(--premium-gold);
            transform:translateY(-2px);
            box-shadow:0 6px 16px rgba(var(--premium-gold-rgb),.15);
        }
        .tool-btn:active { transform:scale(.93); }

        /* === COLOR THEMES === */
        .bg-grad-1 { background:#ffffff; color:#111; }
        .bg-grad-blue { background:linear-gradient(135deg,#f0f4f8,#d9e2ec); color:#102a43; }
        .bg-grad-dark-gold { background:#121212 !important; color:#e1e1e6 !important; }
        .bg-grad-dark-gold .qr-wrapper { background:#1a1a1a; border:1px solid #333; }
        .bg-grad-dark-gold .table-badge { background:var(--premium-gold); color:#111; }
        .color-dot { width:18px; height:18px; border-radius:50%; }

        /* === PC: Sidebar always visible, no fixed overlay === */
        @media (min-width:901px) {
            .mobile-nav { display:none !important; }
            .sidebar-overlay { display:none !important; }
            .sidebar { position:relative; left:0 !important; height:100vh; width:360px; flex-shrink:0; }
            body { height:100vh; overflow:hidden; }
        }
        /* === MOBILE RESPONSIVE === */
        @media (max-width:900px) {
            body { flex-direction:column; overflow:hidden; }
            .mobile-nav { display:flex; }
            .sidebar {
                position:fixed; left:-100%; top:62px;
                height:calc(100% - 62px); width:88%; max-width:340px;
                box-shadow:10px 0 40px rgba(0,0,0,.8);
                border-right:1px solid rgba(var(--premium-gold-rgb),.2);
            }
            .sidebar.open { left:0; }
            .sidebar-overlay {
                display:none; position:fixed; inset:0; top:62px;
                background:rgba(0,0,0,.6); z-index:80; backdrop-filter:blur(4px);
            }
            .sidebar-overlay.show { display:block; }
            .viewport { padding-top:82px; padding-left:16px; padding-right:16px; padding-bottom:100px; }
            .qr-stand { width:290px; min-height:420px; padding:36px 28px; }
            .toolbar {
                bottom:16px; padding:10px 16px; gap:10px;
                left:50%; transform:translateX(-50%) translateY(20px);
                white-space:nowrap;
            }
            .toolbar.show { transform:translateX(-50%) translateY(0); }
            .tool-btn { width:44px; height:44px; }
            .opt-btn { min-height:50px; font-size:1rem; }
            .btn-generate { padding:16px; font-size:1rem; }
        }

        /* === PRINT STYLES === */
        @media print {
            body { background:white !important; height:auto; overflow:visible; }
            .sidebar,.toolbar,.mobile-nav,.placeholder-msg,.sticker-ctrls { display:none !important; }
            .viewport { padding:0; background:none; display:block; }
            .qr-stand {
                opacity:1 !important; filter:none !important; transform:none !important;
                margin:0 auto; box-shadow:none !important;
                border:1px solid #eee; page-break-inside:avoid;
            }
            #sticker-layer { pointer-events:none; }
        }
    </style>
</head>
<body>
    <div class="mobile-nav">
        <h2 style="font-family:'Montserrat'; font-size:1.1rem; font-weight:900; letter-spacing:1px;"><span style="color:var(--premium-gold)">QR</span> STUDIO</h2>
        <button class="tool-btn" style="width:40px;height:40px;" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="mainSidebar">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:5px;">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="width:36px; height:36px; background:linear-gradient(135deg, var(--premium-gold), #b38b45); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#111;"><i class="fas fa-crown"></i></div>
                <h2 style="font-family:'Montserrat'; font-size:1.1rem; font-weight:900;">PRO MAX</h2>
            </div>
            <button class="opt-btn" style="width:40px; height:40px;" onclick="toggleLang()" id="langBtn">EN</button>
        </div>

        <div class="section-title"><i class="fas fa-sliders-h"></i> <span data-key="step1">Step 1: Setup Details</span></div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="brand-input" class="input-box" placeholder="Brand / Store Name" value="BANGFOOD" oninput="liveUpdate()">
            <input type="text" id="table-input" class="input-box" placeholder="Table Number" value="01" oninput="liveUpdate()">
            <button class="btn-generate" onclick="initDesign()">
                <i class="fas fa-bolt" style="margin-right: 5px;"></i> <span data-key="genBtn">ACTIVATE DESIGN</span>
            </button>
        </div>

        <div id="edit-controls" style="opacity: 0.3; pointer-events: none; transition: 0.5s;">
            <div class="section-title"><i class="fas fa-font"></i> <span data-key="styling">Typography</span></div>
            <div class="grid-options">
                <button class="opt-btn active" onclick="setFont('Montserrat', this)" style="font-family: Montserrat;">M</button>
                <button class="opt-btn" onclick="setFont('Chakra Petch', this)" style="font-family: Chakra Petch;">C</button>
                <button class="opt-btn" onclick="setFont('Kanit', this)" style="font-family: Kanit;">K</button>
                <button class="opt-btn" onclick="setFont('JetBrains Mono', this)" style="font-family: 'JetBrains Mono';">J</button>
            </div>

            <div class="section-title"><i class="fas fa-vector-square"></i> <span data-key="shape">Shape & Logo</span></div>
            <div class="grid-options">
                <button class="opt-btn" onclick="document.getElementById('logo-upload').click()"><i class="fas fa-cloud-upload-alt"></i></button>
                <button class="opt-btn active" onclick="setStandShape('', this)"><i class="fas fa-square"></i></button>
                <button class="opt-btn" onclick="setStandShape('shape-oval', this)"><i class="fas fa-archway"></i></button>
                <button class="opt-btn" onclick="setStandShape('shape-sharp', this)"><i class="fas fa-stop"></i></button>
            </div>
            <input type="file" id="logo-upload" hidden accept="image/*" onchange="handleLogo(this)">

            <div class="section-title"><i class="fas fa-swatchbook"></i> <span data-key="theme">Theme</span></div>
            <div class="grid-options">
                <button class="opt-btn bg-grad-1 active" onclick="setPattern('bg-grad-1', this)"></button>
                <button class="opt-btn bg-grad-blue" onclick="setPattern('bg-grad-blue', this)"></button>
                <button class="opt-btn" style="background:#121212;" onclick="setPattern('bg-grad-dark-gold', this)"></button>
            </div>
            
            <div class="section-title"><i class="fas fa-qrcode"></i> <span data-key="qrcolor">QR Color</span></div>
            <div class="grid-options">
                <button class="opt-btn active" onclick="changeQRColor('#000000', this)"><div class="color-dot" style="background:#000;"></div></button>
                <button class="opt-btn" onclick="changeQRColor(varColor('--premium-gold'), this)"><div class="color-dot" style="background:var(--premium-gold);"></div></button>
            </div>

            <div class="section-title"><i class="fas fa-icons"></i> <span data-key="decor">Decorations</span></div>
            <div class="grid-options">
                <button class="opt-btn" onclick="addSticker('emoji', '🔥')">🔥</button>
                <button class="opt-btn" onclick="addSticker('emoji', '⭐')">⭐</button>
                <button class="opt-btn" onclick="addSticker('badge', 'BEST')">BEST</button>
                <button class="opt-btn" onclick="addSticker('badge', 'NEW')">NEW</button>
            </div>
        </div>
    </aside>

    <main class="viewport" onclick="handleViewportClick(event)">
        <div id="placeholder-text" class="placeholder-msg" style="text-align:center; opacity:0.3;">
            <i class="fas fa-qrcode" style="font-size: 3rem; color: var(--premium-gold); margin-bottom: 1rem;"></i>
            <h3 data-key="welcome">Fill details & Activate to start</h3>
        </div>

        <div id="printable-area" class="qr-stand bg-grad-1">
            <div id="sticker-layer" style="position:absolute; inset:0; pointer-events:none; z-index:10; overflow:hidden; border-radius:inherit;"></div>
            <div id="ribbon" style="position: absolute; left: -30px; top: 25px; background: var(--premium-gold); color: #111; padding: 6px 40px; transform: rotate(-45deg); font-size: 0.65rem; font-weight: 900; z-index:2; letter-spacing: 2px;">PREMIUM</div>
            
            <h2 id="display-brand" style="font-weight:900; font-size:2.2rem; text-transform: uppercase; margin-top: 10px;">BANGFOOD</h2>
            <p style="font-size:0.7rem; letter-spacing:3px; opacity:0.6; font-weight:700; margin-bottom:15px;">ESTABLISHED 2026</p>
            
            <div class="qr-wrapper">
                <div id="qrcode"></div>
            </div>
            
            <div style="margin-top:10px;">
                <div class="table-badge" id="display-table">01</div>
            </div>
            <p id="footer-text" style="margin-top:30px; font-size:0.75rem; font-weight:800; opacity:0.7;">SCAN TO START ORDERING</p>
        </div>

        <div id="main-toolbar" class="toolbar">
            <button class="tool-btn" onclick="exportPNG()" title="Download PNG"><i class="fas fa-download"></i></button>
            <button class="tool-btn" onclick="window.print()" title="Print Now"><i class="fas fa-print"></i></button>
            <button class="tool-btn" style="color: #e74c3c;" onclick="location.reload()"><i class="fas fa-redo-alt"></i></button>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        /* === Theme Sync (matches other admin pages) === */
        function applySharedTheme() {
            const t = localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light-theme', t === 'light');
        }
        applySharedTheme();
        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'THEME_CHANGE') {
                localStorage.setItem('theme', e.data.theme);
                applySharedTheme();
            }
            if (e.data && e.data.type === 'ACCENT_CHANGE') {
                document.documentElement.style.setProperty('--premium-gold', e.data.color);
                if (e.data.rgb) document.documentElement.style.setProperty('--premium-gold-rgb', e.data.rgb);
            }
        });
        window.addEventListener('storage', e => {
            if (e.key === 'theme') applySharedTheme();
        });

        let currentLang = 'EN';
        let qrColor = "#000000";
        let zIndexCounter = 100;

        const langData = {
            TH: { step1: "ขั้นตอนที่ 1: ตั้งค่า", genBtn: "สร้างดีไซน์", styling: "รูปแบบอักษร", shape: "รูปทรง", theme: "ธีม", qrcolor: "สีคิวอาร์", decor: "ของตกแต่ง", welcome: "กรอกข้อมูลและกดสร้างดีไซน์" },
            EN: { step1: "Step 1: Setup Details", genBtn: "ACTIVATE DESIGN", styling: "Typography", shape: "Shape & Logo", theme: "Theme", qrcolor: "QR Color", decor: "Decorations", welcome: "Fill details & Activate to start" }
        };

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function toggleLang() {
            currentLang = currentLang === 'TH' ? 'EN' : 'TH';
            document.getElementById('langBtn').innerText = currentLang;
            document.querySelectorAll('[data-key]').forEach(el => {
                el.innerText = langData[currentLang][el.getAttribute('data-key')];
            });
        }

        function toggleSidebar() {
            document.getElementById('mainSidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
        
        function liveUpdate() {
            if(document.getElementById('printable-area').classList.contains('active')) {
                document.getElementById('display-brand').innerText = document.getElementById('brand-input').value || "BRAND";
                document.getElementById('display-table').innerText = document.getElementById('table-input').value || "00";
            }
        }

        function initDesign() {
            const brand = document.getElementById('brand-input').value;
            const table = document.getElementById('table-input').value;
            if(!brand || !table) return alert("Please fill all details");

            document.getElementById('printable-area').classList.add('active');
            document.getElementById('placeholder-text').style.display = 'none';
            document.getElementById('edit-controls').style.opacity = '1';
            document.getElementById('edit-controls').style.pointerEvents = 'auto';
            document.getElementById('main-toolbar').classList.add('show');
            
            generateQR(table, qrColor);
            liveUpdate();
            if(window.innerWidth < 900) toggleSidebar();
        }

        function generateQR(table, color) {
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, {
        
        // 👇 เปลี่ยน URL ตรงบรรทัดนี้บรรทัดเดียวครับ 👇
        text: `https://bangfood.vercel.app/start.html?table=${table}`,
        
        width: 170, height: 170, 
        colorDark: color,
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H // แนะนำให้ใส่บรรทัดนี้ไว้เพื่อช่วยให้สแกนง่ายขึ้นแม้โลโก้บัง
    });
}

        function changeQRColor(color, btn) {
            qrColor = color;
            generateQR(document.getElementById('table-input').value, color);
            updateActiveBtn(btn);
        }

        function setFont(font, btn) { 
            document.getElementById('display-brand').style.fontFamily = font; 
            updateActiveBtn(btn);
        }

        function setStandShape(className, btn) {
            const stand = document.getElementById('printable-area');
            stand.classList.remove('shape-oval', 'shape-sharp');
            if(className) stand.classList.add(className);
            updateActiveBtn(btn);
        }

        function setPattern(className, btn) {
            const stand = document.getElementById('printable-area');
            stand.classList.remove('bg-grad-1', 'bg-grad-blue', 'bg-grad-dark-gold');
            stand.classList.add(className);
            updateActiveBtn(btn);
        }

        function addSticker(type, content) {
            const layer = document.getElementById('sticker-layer');
            const div = document.createElement('div');
            div.className = 'sticker-container active-sticker';
            div.style.left = '50%'; div.style.top = '20%';
            div.style.position = 'absolute';
            div.style.pointerEvents = 'auto';
            
            let innerHTML = type === 'emoji' ? `<span style="font-size:3rem;">${content}</span>` : `<div class="sticker-badge">${content}</div>`;
            div.innerHTML = `
                <div class="sticker-ctrls">
                    <button class="s-btn" onclick="updateStickerTransform(this, 0.1, 0)"><i class="fas fa-plus"></i></button>
                    <button class="s-btn" onclick="updateStickerTransform(this, -0.1, 0)"><i class="fas fa-minus"></i></button>
                    <button class="s-btn delete" onclick="this.closest('.sticker-container').remove()"><i class="fas fa-times"></i></button>
                </div>
                <div class="sticker-transform-wrapper" data-scale="1" data-rot="0">
                    <div class="sticker-content">${innerHTML}</div>
                </div>
            `;
            makeDraggable(div);
            layer.appendChild(div);
        }

        function updateStickerTransform(btn, scaleChange, rotChange) {
            event.stopPropagation();
            const wrapper = btn.closest('.sticker-container').querySelector('.sticker-transform-wrapper');
            let scale = parseFloat(wrapper.getAttribute('data-scale')) + scaleChange;
            wrapper.setAttribute('data-scale', scale);
            wrapper.style.transform = `scale(${scale})`;
        }

        function makeDraggable(el) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        // รองรับทั้ง Mouse และ Touch
        el.onmousedown = dragStart;
        el.ontouchstart = dragStart;

        function dragStart(e) {
            // ป้องกันการเลื่อนหน้าจอขณะลากสติกเกอร์
            if (e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
            }
            
            document.onmouseup = dragEnd;
            document.onmousemove = dragMove;
            document.ontouchend = dragEnd;
            document.ontouchmove = dragMove;
            
            // เพิ่ม Class เพื่อบอกว่ากำลังลากอยู่
            el.classList.add('active-sticker');
        }

        function dragMove(e) {
            let cx, cy;
            if (e.type === 'touchmove') {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            
            pos1 = pos3 - cx;
            pos2 = pos4 - cy;
            pos3 = cx;
            pos4 = cy;
            
            el.style.top = (el.offsetTop - pos2) + "px";
            el.style.left = (el.offsetLeft - pos1) + "px";
        }

        function dragEnd() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

        function updateActiveBtn(btn) {
            btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleViewportClick(e) {
            if(!e.target.closest('.sticker-container')) {
                document.querySelectorAll('.sticker-container').forEach(s => s.classList.remove('active-sticker'));
            }
        }

        async function exportPNG() {
            const area = document.getElementById('printable-area');
            const canvas = await html2canvas(area, { scale: 3, backgroundColor: null });
            const link = document.createElement('a');
            link.download = 'QR_STAND.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function handleLogo(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const layer = document.getElementById('sticker-layer');
                    const div = document.createElement('div');
                    div.className = 'sticker-container';
                    div.style.left = '40%'; div.style.top = '10%';
                    div.innerHTML = `
                        <div class="sticker-ctrls"><button class="s-btn delete" onclick="this.closest('.sticker-container').remove()">×</button></div>
                        <div class="sticker-transform-wrapper" data-scale="1"><img src="${e.target.result}" style="width:70px; border-radius:10px;"></div>
                    `;
                    makeDraggable(div);
                    layer.appendChild(div);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
