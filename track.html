<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะ - BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="global_style.css">
    <style>
        body { 
            background-color: var(--bg-deep); color: #e0e0e0; 
            font-family: 'Kanit', sans-serif; margin: 0; padding: 0;
            display: flex; justify-content: center; overflow-x: hidden;
            transition: 0.3s;
        }

        .app-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background: var(--bg-deep); position: relative; padding-bottom: 120px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 📍 Header Fix ให้เหมือนหน้าแรก */
        .app-header-sticky { position: sticky; top: 0; z-index: 2000; background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(25px); border-bottom: 1px solid var(--glass-border); }
        body.light-theme .app-header-sticky { background: rgba(245, 245, 247, 0.9); }

        .header-main-row { padding: 15px 20px; display: flex; align-items: center; justify-content: center; position: relative; }
        .back-btn { position: absolute; left: 20px; cursor: pointer; color: #666; font-size: 1.1rem; }
        .bangfood-logo { font-size: 0.9rem; font-weight: 600; letter-spacing: 3px; color: var(--premium-gold); margin: 0; text-transform: uppercase; }

        .top-summary-bar { padding: 12px 25px; background: rgba(197, 160, 89, 0.04); display: flex; justify-content: space-between; align-items: center; }
        .summary-label { font-size: 0.65rem; color: #666; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .summary-val { color: var(--premium-gold); font-weight: 700; font-size: 1.4rem; text-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }

        /* 📍 Table Status Box */
        .status-box { text-align: center; padding: 20px; background: var(--glass); border-radius: 24px; margin: 20px; border: 1px solid var(--glass-border); }
        body.light-theme .status-box { background: #fff; }

        /* 📍 Order Card */
        .order-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 28px; padding: 22px; margin: 0 20px 20px; animation: slideUpFade 0.6s ease-out both; }
        body.light-theme .order-card { background: #fff; color: #333; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
        body.light-theme .order-header { border-color: #eee; }

        .item-row { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.03); }
        body.light-theme .item-row { border-color: #eee; }
        
        .item-main { display: flex; gap: 15px; align-items: flex-start; }
        .item-img { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; border: 1px solid var(--glass-border); }
        .food-name { font-size: 0.95rem; color: #fff; font-weight: 500; margin: 0; }
        body.light-theme .food-name { color: #000; }
        .addon-line { display: flex; justify-content: space-between; color: #777; font-size: 0.75rem; margin-top: 3px; }

        .item-total-badge { text-align: right; margin-top: 12px; padding: 6px 12px; background: rgba(255,255,255,0.02); border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--premium-gold); }

        /* 📍 Bottom Nav */
        .bottom-nav-fixed { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100px; background: linear-gradient(to top, var(--bg-deep) 70%, transparent); z-index: 2500; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; }
        .nav-buttons-bar { width: 92%; height: 60px; background: #121214; border-radius: 30px; border: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; pointer-events: auto; margin-bottom: 15px; -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 48px, black 49px); }
        body.light-theme .nav-buttons-bar { background: #fff; }
        .round-refresh { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 72px; height: 72px; background: #fff; border-radius: 50%; border: 6px solid var(--bg-deep); color: #000; font-size: 1.8rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); cursor: pointer; z-index: 2600; pointer-events: auto; transition: 0.3s; }
        .nav-icon { color: #666; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
    </style>
</head>
<body onload="initializeTrackPage()"> 

<div id="side-drawer" class="side-drawer">
    <div class="drawer-content">
        <div class="drawer-item" onclick="switchCustomerTheme(); toggleDrawer();">
            <span data-lang-en="THEME" data-lang-th="เปลี่ยนธีม">เปลี่ยนธีม</span>
            <i class="fas fa-adjust" style="color:var(--premium-gold);"></i>
        </div>
        <div class="drawer-item" onclick="switchCustomerLanguage(); toggleDrawer();">
            <span data-lang-en="LANGUAGE" data-lang-th="เปลี่ยนภาษา">เปลี่ยนภาษา</span>
            <b id="drawer-lang-status">TH</b>
        </div>
    </div>
</div>
<div id="drawer-overlay" onclick="toggleDrawer()" style="position:fixed; top:0; left:0; width:100%; height:100%; background:transparent; z-index:3500; display:none;"></div>

<div class="app-wrapper">
    <div class="app-header-sticky">
        <div class="header-main-row">
            <div class="back-btn" onclick="goBackToIndex()"><i class="fas fa-arrow-left"></i></div>
            <h1 class="bangfood-logo" data-lang-en="TRACKING" data-lang-th="ติดตามสถานะ">TRACKING</h1>
            <div class="hamburger-menu" onclick="toggleDrawer()">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="top-summary-bar">
            <div class="summary-label">STATION <span id="display-table">1</span> | <span data-lang-en="TOTAL" data-lang-th="ยอดรวมทั้งหมด">TOTAL</span></div>
            <div class="summary-val">฿<span id="final-total-amount">0.00</span></div>
        </div>
    </div>

    <div class="status-box">
        <p style="color: #666; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 5px; font-weight: 700; letter-spacing: 2px;" data-lang-en="Your Station" data-lang-th="สถานีของคุณ">Your Station</p>
        <h2 id="tracking-table-header">STATION 1</h2>
    </div>

    <div id="items-list-container"></div>
    
    <div class="bottom-nav-fixed">
        <div class="round-refresh" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i></div>
        <div class="nav-buttons-bar">
            <div class="nav-icon" onclick="goToCart()">
                <i class="fas fa-shopping-basket"></i>
                <span style="font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="BASKET" data-lang-th="ตะกร้า">BASKET</span>
            </div>
            <div style="width: 80px;"></div>
            <div class="nav-icon" onclick="goBackToIndex()">
                <i class="fas fa-plus"></i>
                <span style="font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="ADD MENU" data-lang-th="สั่งเพิ่ม">ADD MENU</span>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="global_script.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
        authDomain: "bangfood-cb30f.firebaseapp.com", 
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "bangfood-cb30f", 
        storageBucket: "bangfood-cb30f.appspot.com", 
        messagingSenderId: "390955623784", 
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    window.db = firebase.database(); 

    async function initializeTrackPage() {
        const table = getTableNo();
        applyTheme(localStorage.getItem(`theme_table_${table}`) || 'dark');
        const lang = localStorage.getItem(`lang_table_${table}`) || 'th';
        
        document.getElementById('tracking-table-header').textContent = "STATION " + table;
        
        startLiveTracking();
        translatePage(lang);
    }

    function startLiveTracking() {
        const tableNo = getTableNo();
        
        window.db.ref('orders').orderByChild('tableNumber').equalTo(tableNo).on('value', async (snapshot) => {
            const listContainer = document.getElementById('items-list-container');
            const totalDisplay = document.getElementById('final-total-amount');
            const currentLang = localStorage.getItem(`lang_table_${tableNo}`) || 'th';
            
            // ดึงคำแปลจาก Firebase
            const transSnap = await window.db.ref('menu_translations').once('value');
            const dict = transSnap.val() || {};

            let mainHtml = ''; 
            let grandTotal = 0;

            if (snapshot.exists()) {
                snapshot.forEach(orderChild => {
                    const order = orderChild.val();
                    let orderItemsHtml = '';
                    let statusColor = order.status === 'เสร็จสมบูรณ์' ? '#4CAF50' : '#ff9800';

                    if (order.items) {
                        order.items.forEach((item) => {
                            const finalP = parseFloat(item.finalPrice || 0);
                            grandTotal += finalP;

                            // 🌐 แปลชื่อสินค้าและท็อปปิ้ง
                            const displayName = (currentLang === 'en') ? (dict[item.name] || item.name) : item.name;
                            
                            let optionsHtml = '';
                            let optionsPriceTotal = 0;
                            if (item.optionsArray) {
                                optionsHtml = item.optionsArray.map(opt => {
                                    const op = parseFloat(opt.price || 0);
                                    optionsPriceTotal += op;
                                    const optName = (currentLang === 'en') ? (dict[opt.name] || opt.name) : opt.name;
                                    return `<div class="addon-line"><span>+ ${optName}</span><span>฿${op.toFixed(2)}</span></div>`;
                                }).join('');
                            }

                            const baseP = finalP - optionsPriceTotal;
                            orderItemsHtml += `
                                <div class="item-row">
                                    <div class="item-main">
                                        <img src="${item.img || ''}" class="item-img" onerror="this.src='https://via.placeholder.com/100'">
                                        <div style="flex:1;">
                                            <div style="display:flex; justify-content:space-between;">
                                                <p class="food-name">${displayName}</p>
                                                <span>฿${baseP.toFixed(2)}</span>
                                            </div>
                                            <div class="addon-area">${optionsHtml}</div>
                                            <div class="item-total-badge">
                                                <span data-lang-en="Total" data-lang-th="รวม">รวม</span>: ฿${finalP.toFixed(2)}
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                        });
                    }

                    mainHtml += `
                        <div class="order-card">
                            <div class="order-header">
                                <span style="font-size: 0.75rem; color: #666; font-weight: 600;">ID: ${orderChild.key.slice(-6).toUpperCase()}</span>
                                <span style="color: ${statusColor}; border: 1px solid ${statusColor}44; padding: 3px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 700;">● ${order.status || 'รอดำเนินการ'}</span>
                            </div>
                            ${orderItemsHtml}
                        </div>`;
                });
                listContainer.innerHTML = mainHtml;
                totalDisplay.textContent = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 });
                translatePage(currentLang);
            } else {
                listContainer.innerHTML = `<div style="text-align:center; padding:100px 0; opacity:0.3;"><i class="fas fa-receipt" style="font-size:3.5rem;"></i><p data-lang-en="No orders yet" data-lang-th="ยังไม่มีรายการสั่งครับน้า">ยังไม่มีรายการสั่งครับน้า</p></div>`;
                totalDisplay.textContent = "0.00";
            }
        });
    }

    function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
    function goToCart() { window.location.href = `cart.html?table=${getTableNo()}`; }
</script>
</body>
</html>
