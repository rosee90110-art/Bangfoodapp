<!DOCTYPE html>
<html lang="th">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวเลือกอาหาร - BANGFOOD</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body onload="initializeMenuPage()">
    <header class="app-header">
    <a href="javascript:history.back()" class="back-button"> 
        <i class="fas fa-chevron-left"></i> กลับ
    </a>
    <h1 class="bangfoodmenu">BANGFOOD</h1>
    <p class="menu-label">หน้า MENU</p>
   </header>
    <div id="item-detail-modal" class="modal" style="display: block;">
        <div class="modal-content">
            
            <div class="item-info-section">
                <img id="modal-item-image" src="" alt="รูปภาพอาหาร" class="modal-image">
                <h2 id="modal-item-name" class="modal-item-name"></h2>
                <p class="modal-item-base-price">ราคาเริ่มต้น: <span id="modal-base-price">0.00</span> บาท</p>
            </div>

            <div class="table-info-section">
    📌 โต๊ะที่สั่ง: 
    <span id="display-table" style="font-weight: bold; color: #ff6347; font-size: 1.2em;">
        (กำลังตรวจสอบเลขโต๊ะ...)
    </span>
    <input type="hidden" id="table-select-id"> 
</div>

            <form id="item-customization-form" class="customization-form">
                <div class="customization-group">
                    <h3>🍲 ปริมาณ</h3>
                    <label class="radio-label">
                        <input type="radio" name="size" value="ธรรมดา" data-modifier="0" checked>
                        ธรรมดา (Normal)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="size" value="พิเศษ" data-modifier="10">
                        พิเศษ (+ 10 บาท)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="size" value="โครตพิเศษ" data-modifier="20">
                        โครตพิเศษ (+ 20 บาท)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="size" value="โครตพ่อโครตแม่พิเศษ" data-modifier="30">
                        โครตพ่อโครตแม่พิเศษ (+ 30 บาท)
                    </label>
                </div>
                <div class="customization-group">
            
                    <h3>🥚 ประเภทไข่</h3>
                    <div class="addon-category">
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ไข่ดาว" data-modifier="10">
                            เพิ่มไข่ดาว 🍳 (+ 10 บาท)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ไข่เจียว" data-modifier="10">
                            เพิ่มไข่เจียว 🥘 (+ 10 บาท)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ไข่ข้น" data-modifier="15">
                            เพิ่มไข่ข้น 🫓 (+ 15 บาท)
                        </label>
                    </div>
                </div>
                <div class="customization-group">
            
                    <h3 style="margin-top: 15px;">🌊 ประเภททะเล</h3>
                    <div class="addon-category">
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="หมึก" data-modifier="10">
                            เพิ่มหมึก 🦑 (+ 10 บาท)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="กุ้ง" data-modifier="10">
                            เพิ่มกุ้ง 🦐 (+ 10 บาท)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ปู" data-modifier="10">
                            เพิ่มปู 🦀 (+ 10 บาท)
                        </label>
                    </div>
                    
                </div>
                <div class="customization-group">
            
                    <h3 style="margin-top: 15px;">🍖 ตัวเลือกเสริมอื่น ๆ</h3>
                    <div class="addon-category">
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ไส้กรอก" data-modifier="10">
                            เพิ่มไส้กรอก 🌭 (+ 10 บาท)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addon" value="ไก่กรอบ" data-modifier="10">
                            เพิ่มไก่กรอบ 🍗 (+ 10 บาท)
                        </label>
                    </div>
                    
                </div>
                <div class="customization-group">
                    <h3>✍️ หมายเหตุ (Optional)</h3>
                    <textarea id="modal-notes" rows="3" placeholder="ตัวอย่าง: เผ็ดน้อย, ไม่ใส่ผักชี"></textarea>
                </div>
            </form>
            <div class="modal-footer">
                <p class="final-price-display">ราคาสุทธิ: <span id="modal-final-price">0.00</span> บาท</p>
                <button id="add-to-cart-confirm-btn" class="add-confirm-btn">
                    ยืนยันการสั่งซื้อ
                </button>
                <a href="index.html" id="add-to-cart-confirm-btn" class="add-confirm-btnm">
                    ยกเลิกการสั่งซื่อ                
                </a>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
