<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Access Control | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 Global UI Base */
        body { margin: 0; padding: 40px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; }
        main { max-width: 1200px; margin: 0 auto; animation: fadeInPage 0.8s ease-out; }

        /* 📊 Premium Header Bar */
        .elite-header-bar { display: flex; justify-content: space-between; align-items: center; gap: 25px; margin-bottom: 60px; flex-wrap: wrap; }
        .stats-cluster { display: flex; gap: 20px; flex: 1; }
        .stat-capsule {
            background: linear-gradient(145deg, var(--card-bg), rgba(197, 160, 89, 0.05));
            border: 1px solid var(--border); padding: 20px 35px; border-radius: 28px;
            text-align: left; flex: 1; min-width: 180px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative; overflow: hidden; transition: 0.4s;
        }
        .stat-capsule b { display: block; font-size: 2.4rem; color: var(--premium-gold); line-height: 1; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.3)); }
        .stat-capsule span { font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }

        /* ➕ Button Ultra Design */
        #add-btn-container { display: none; }
        .btn-elite-create {
            background: linear-gradient(135deg, #d4af37, #c5a059); color: #000; border: none; 
            height: 75px; padding: 0 40px; border-radius: 28px; font-weight: 900; font-size: 0.9rem; 
            cursor: pointer; display: flex; align-items: center; gap: 15px; letter-spacing: 1px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(197, 160, 89, 0.2); white-space: nowrap;
        }
        .btn-elite-create:hover { transform: translateY(-7px) scale(1.03); }

        /* 👥 User Grid Decor */
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }
        .user-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; 
            padding: 30px; display: flex; align-items: center; justify-content: space-between; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
        }
        .user-card:hover { border-color: var(--premium-gold); box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(1.02); }
        .user-card.is-active-me { border: 2.5px solid var(--premium-gold); background: linear-gradient(160deg, rgba(197, 160, 89, 0.08), transparent); }

        .user-profile { display: flex; align-items: center; gap: 22px; }
        .avatar-frame { position: relative; width: 70px; height: 70px; }
        .user-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--border); padding: 3px; background: var(--bg); }
        
        .status-dot { position: absolute; bottom: 4px; right: 4px; width: 15px; height: 15px; border-radius: 50%; border: 3.5px solid var(--card-bg); }
        .status-dot.online { background: #43e97b; box-shadow: 0 0 15px #43e97b; animation: pulseOnline 2s infinite; }
        .status-dot.offline { background: #555; }

        .role-tag { font-size: 0.65rem; font-weight: 900; color: var(--premium-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; display: block; }

        .card-actions { display: flex; gap: 20px; }
        .action-btn { font-size: 1.3rem; cursor: pointer; transition: 0.3s; opacity: 0.6; }
        .action-btn:hover { opacity: 1; transform: scale(1.2); }

        @keyframes pulseOnline { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeAccessControl()">

    <main>
        <div style="text-align: left; margin-bottom: 40px;">
            <h1 style="font-size: 1.8rem; font-weight: 900; margin: 0; letter-spacing: -1px;" data-lang-th="การจัดการสิทธิ์เข้าถึง" data-lang-en="Access Control">การจัดการสิทธิ์เข้าถึง</h1>
            <span style="font-size: 0.75rem; color: var(--premium-gold); letter-spacing: 4px; text-transform: uppercase; font-weight: 800;">
                <i class="fas fa-key"></i> <span data-lang-th="ระบบรักษาความปลอดภัยและสิทธิ์" data-lang-en="System Security & Permissions">ระบบรักษาความปลอดภัยและสิทธิ์</span>
            </span>
        </div>

        <header class="elite-header-bar">
            <section class="stats-cluster">
                <div class="stat-capsule">
                    <b id="total-admins">0</b>
                    <span data-lang-th="สมาชิกทั้งหมด" data-lang-en="Members Total">สมาชิกทั้งหมด</span>
                </div>
                <div class="stat-capsule">
                    <b id="online-admins" style="color: #43e97b;">0</b>
                    <span data-lang-th="กำลังออนไลน์" data-lang-en="Live Online">กำลังออนไลน์</span>
                </div>
            </section>

            <div id="add-btn-container">
                <button class="btn-elite-create" onclick="openAddModal()">
                    <i class="fas fa-plus-circle"></i> <span data-lang-th="เพิ่มสิทธิ์ใหม่" data-lang-en="CREATE ACCESS">เพิ่มสิทธิ์ใหม่</span>
                </button>
            </div>
        </header>

        <div id="admin-list-container" class="user-grid"></div>
    </main>

    <div id="edit-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; backdrop-filter: blur(20px); justify-content: center; align-items: center; padding: 20px;">
        <div class="modal-box card-box" style="background: var(--card-bg); border: 1px solid var(--border); padding: 50px; border-radius: 45px; width: 100%; max-width: 420px; text-align: center;">
            <div style="position: relative; display: inline-block; margin-bottom: 30px;" onclick="document.getElementById('edit-avatar-input').click()">
                <img id="edit-avatar-preview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:120px; height:120px; border-radius:50%; border:4px solid var(--premium-gold); object-fit:cover; cursor:pointer;">
                <div style="position:absolute; bottom:5px; right:5px; background:var(--premium-gold); color:#000; width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.9rem;"><i class="fas fa-camera"></i></div>
            </div>
            <input type="file" id="edit-avatar-input" hidden accept="image/*" onchange="previewImage(this)">
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-username" placeholder="Username" style="width:100%; padding:18px; margin-bottom:15px; border-radius:18px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:white; font-family:'Kanit'; outline:none;">
            <input type="text" id="edit-password" placeholder="Password" style="width:100%; padding:18px; margin-bottom:15px; border-radius:18px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:white; font-family:'Kanit'; outline:none;">
            <select id="edit-role" style="width:100%; padding:18px; margin-bottom:30px; border-radius:18px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:white; font-family:'Kanit'; outline:none;">
                <option value="Staff">Staff (พนักงาน)</option>
                <option value="Super Admin">Super Admin (เจ้าของร้าน)</option>
            </select>
            <button class="btn-elite-create" style="width:100%; justify-content:center; height:65px;" onclick="saveAdminChanges()">
                <span data-lang-th="บันทึกการเปลี่ยนแปลง" data-lang-en="SAVE CHANGES">บันทึกการเปลี่ยนแปลง</span>
            </button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--sub-text); margin-top:25px; cursor:pointer; font-weight:800; font-family:'Kanit';">
                <span data-lang-th="ยกเลิก" data-lang-en="Cancel">ยกเลิก</span>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentAdmin = sessionStorage.getItem('currentAdminName');
        const currentRole = sessionStorage.getItem('currentAdminRole') || "Staff";

        function initializeAccessControl() {
            const btnContainer = document.getElementById('add-btn-container');
            if (currentRole === 'Super Admin') btnContainer.style.display = 'block';
            else btnContainer.remove();

            // เรียกใช้ฟังก์ชันเปลี่ยนภาษาจาก admin_script.js
            if(typeof applyGlobalLanguage === 'function') applyGlobalLanguage();
            // ปลุกระบบออนไลน์
            if(typeof syncOnlineStatus === 'function') syncOnlineStatus();

            loadAdminsRealtime();
        }

        function loadAdminsRealtime() {
            db.ref('admins').on('value', adminSnap => {
                db.ref('presence').on('value', presenceSnap => {
                    renderAdmins(adminSnap.val() || {}, presenceSnap.val() || {});
                });
            });
        }

        function renderAdmins(admins, presenceData) {
            const container = document.getElementById('admin-list-container');
            container.innerHTML = '';
            let totalSessions = 0;

            // ดึงภาษาปัจจุบัน
            const savedLang = localStorage.getItem(`bf_lang_${currentAdmin}`) || 'th';

            Object.keys(admins).forEach(id => {
                const admin = admins[id];
                const userSessions = presenceData[admin.username] || {};
                const isOnline = Object.keys(userSessions).length > 0;
                if (isOnline) totalSessions += Object.keys(userSessions).length;

                const isMe = (admin.username === currentAdmin);
                const canEdit = (currentRole === 'Super Admin') || isMe;
                const canDelete = (currentRole === 'Super Admin') && !isMe;

                // แปลชื่อตำแหน่ง
                let displayRole = admin.role;
                if(savedLang === 'th') {
                    displayRole = (admin.role === 'Super Admin') ? 'เจ้าของร้าน' : 'พนักงาน';
                }

                container.innerHTML += `
                    <div class="user-card ${isMe ? 'is-active-me' : ''}">
                        <div class="user-profile">
                            <div class="avatar-frame">
                                <img src="${admin.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="user-img">
                                <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            </div>
                            <div class="user-details">
                                <span class="role-tag">${displayRole}</span>
                                <b>${admin.username} ${isMe ? `<small style="opacity:0.6">(${savedLang === 'th' ? 'คุณ' : 'You'})</small>` : ''}</b>
                                <small style="color:${isOnline ? '#43e97b' : 'var(--sub-text)'}; font-size:0.7rem; font-weight:800;">
                                    ${isOnline ? `${savedLang === 'th' ? 'ออนไลน์' : 'ONLINE'} (${Object.keys(userSessions).length})` : (savedLang === 'th' ? 'ออฟไลน์' : 'OFFLINE')}
                                </small>
                            </div>
                        </div>
                        <div class="card-actions">
                            ${canEdit ? `<i class="fas fa-edit action-btn" style="color:var(--premium-gold)" onclick='openEditModal("${id}", ${JSON.stringify(admin)})'></i>` : ''}
                            ${canDelete ? `<i class="fas fa-trash-alt action-btn" style="color:#ff4757" onclick="deleteAdmin('${id}')"></i>` : ''}
                        </div>
                    </div>`;
            });
            document.getElementById('total-admins').innerText = Object.keys(admins).length;
            document.getElementById('online-admins').innerText = totalSessions;
        }

        // Modal Actions
        function openEditModal(id, admin) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = admin.username;
            document.getElementById('edit-password').value = admin.password;
            document.getElementById('edit-role').value = admin.role;
            document.getElementById('edit-role').disabled = (currentRole !== 'Super Admin');
            document.getElementById('edit-avatar-preview').src = admin.profileImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-username').value = "";
            document.getElementById('edit-password').value = "";
            document.getElementById('edit-avatar-preview').src = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function saveAdminChanges() {
            const id = document.getElementById('edit-id').value;
            const data = { 
                username: document.getElementById('edit-username').value.trim(), 
                password: document.getElementById('edit-password').value.trim(), 
                role: document.getElementById('edit-role').value,
                profileImg: document.getElementById('edit-avatar-preview').src 
            };
            if (id) db.ref('admins/' + id).update(data).then(closeModal);
            else { data.createdAt = firebase.database.ServerValue.TIMESTAMP; db.ref('admins').push(data).then(closeModal); }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('edit-avatar-preview').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }
        function deleteAdmin(id) { 
            const lang = localStorage.getItem(`bf_lang_${currentAdmin}`) || 'th';
            const msg = lang === 'th' ? "น้าจะลบคนนี้จริงเหรอครับ?" : "Are you sure you want to delete this user?";
            if (confirm(msg)) db.ref('admins/' + id).remove(); 
        }
        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
