<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="global_style.css">

    <style>
        /* 📍 เพิ่มฟอนต์ Google Font เพื่อความน่ารักและอ่านง่าย */
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap');

        :root {
            --bg-deep: #0a0a0b;
            --premium-gold: #c5a059;
            --cartoon-orange: #ff7f50;
        }

        body {
            font-family: 'Kanit', sans-serif;
        }

        /* 📍 Header */
        .app-header-sticky {
            position: sticky;
            top: 0;
            z-index: 2000;
            background: rgb(7 7 7 / 95%);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.3s;
        }

        body.light-theme .app-header-sticky {
            background: rgb(255 253 245 / 95%); /* สีครีมนวล */
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        body.light-theme .top-summary-bar {
            background: rgba(0, 0, 0, 0.02);
            border-top: 1px solid rgba(0, 0, 0, 0.03);
        }

        body.light-theme .bangfood-logo {
            background: none;
            -webkit-text-fill-color: var(--premium-gold);
            color: var(--premium-gold);
        }

        .header-main-row {
            padding: 1px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 55px;
        }

        .top-summary-bar {
            padding: 10px 25px;
            background: rgba(197, 160, 89, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        .summary-label {
            font-size: 0.6rem;
            color: #666;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .summary-val {
            color: var(--premium-gold);
            font-weight: 700;
            font-size: 1.3rem;
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }

        .hamburger-menu {
            position: absolute;
            right: 20px;
        }

        .bangfood-logo { 
            font-size: 1.1rem; font-weight: 600; letter-spacing: 4px; 
            background: linear-gradient(90deg, #c5a059, #fff, #c5a059); 
            background-size: 200% auto; -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; animation: shineText 4s linear infinite; margin: 0; 
        }

        /* ✨ Slider */
        .slider-container { width: 100%; margin-top: 10px; overflow: hidden; position: relative; }
        .image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding: 15px 35px 25px; scrollbar-width: none; scroll-behavior: smooth; flex-wrap: nowrap; }
        .image-slider::-webkit-scrollbar { display: none; }
        
        .slide-card {
            position: relative;
            flex: 0 0 82%;
            scroll-snap-align: center;
            border-radius: 35px; /* มนมากขึ้นแบบการ์ตูน */
            height: 185px;
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: scale(0.9);
            opacity: 0.5;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 3px solid transparent;
        }

        .slide-card.is-active { transform: scale(1); opacity: 1; border-color: var(--premium-gold); }

        .slide-info-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: #fff; display: flex; flex-direction: column; pointer-events: none;
            transform: translateY(20px); opacity: 0; transition: 0.5s 0.2s ease-out;
        }

        .slide-card.is-active .slide-info-overlay { transform: translateY(0); opacity: 1; }

        .slide-food-name { font-size: 1rem; font-weight: 600; margin: 0; color: var(--premium-gold); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .slide-food-price { font-size: 0.75rem; opacity: 0.9; letter-spacing: 1px; }
        .slide-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 35px; }

        .middle-indicator-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 5px auto 20px; height: 40px; width: 100%; }
        .indicator-item { width: 10px; height: 4px; background: #333; border-radius: 10px; transition: 0.4s; }
        .indicator-item.active { width: 35px; height: 35px; background: transparent; color: var(--premium-gold); font-size: 1.6rem; font-weight: 900; }

        /* 🍛 Tabs เมนูแบบการ์ตูน */
        .menu-tabs { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; scrollbar-width: none; }
        .menu-tab { 
            padding: 10px 18px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; 
            color: #888; font-size: 0.8rem; border: 1px solid var(--glass-border); 
            white-space: nowrap; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        body.light-theme .menu-tab { background: #eee; color: #666; }
        .menu-tab.active { background: var(--premium-gold); color: #fff; font-weight: 600; transform: scale(1.05); box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3); }

        /* 🍱 รายการเมนูอาหาร */
        .menu-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            margin: 0 20px 15px; padding: 14px; border-radius: 30px; 
            display: flex; align-items: center; gap: 15px; text-decoration: none;
            color: inherit; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        body.light-theme .menu-item { background: #ffffff; color: #333; border: 1px solid rgba(0, 0, 0, 0.04); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }

        .menu-item:active { transform: scale(0.96); background: rgba(197, 160, 89, 0.08); }

        .item-img-thumb { width: 75px; height: 75px; border-radius: 22px; object-fit: cover; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); }
        .menu-item h3 { margin: 0 0 5px; font-size: 1.0rem; font-weight: 500; }

        /* 🔘 ปุ่ม "เลือก" แบบเด้งดึ๋ง */
        .select-btn {
            padding: 8px 20px; background: var(--premium-gold); border-radius: 18px;
            color: #fff; font-size: 0.75rem; font-weight: 700; transition: 0.2s;
            box-shadow: 0 4px 0 #8e7340; border: none;
        }

        .select-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e7340; }

        /* 📍 ปรับ Container ให้รองรับการลอยของปุ่ม */
        .section-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px 10px;
            position: relative; /* สำคัญ: เพื่อให้ตัวค้นหาอิงตำแหน่งกับกรอบนี้ */
            min-height: 60px; /* เพิ่มความสูงเผื่อไว้กันเบียด */
        }

        .search-wrapper {
            position: absolute; /* เปลี่ยนเป็น absolute */
            right: 20px;
            top: 50%;
            transform: translateY(-50%); /* จัดให้อยู่กึ่งกลางแนวตั้ง */
            z-index: 100; /* ให้อยู่เหนือข้อความ */
            display: flex;
            align-items: center;
        }

        .search-input-container {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #1a1a1a; /* เปลี่ยนเป็นสีเข้มทึบ */
            border-radius: 25px;
            display: flex;
            align-items: center;
            height: 42px;
        }

        body.light-theme .search-input-container {
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-wrapper.active .search-input-container {
            width: 220px;
            opacity: 1;
            padding: 0 15px;
            border: 1.5px solid var(--premium-gold);
            margin-right: 8px;
        }

        /* ⌨️ ช่องพิมพ์ด้านบน (เดิม) */
        #menuSearchInput {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }
        body.light-theme #menuSearchInput { color: #333; }

        .search-trigger-btn {
            width: 38px;
            height: 38px;
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--premium-gold);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .search-wrapper.active .search-trigger-btn { background: var(--premium-gold); color: #fff; transform: rotate(90deg); }
        .search-trigger-btn:active { transform: scale(0.9); }


        /* ========================================= */
        /* ✨ ส่วนที่แก้ไขใหม่สำหรับปุ่มค้นหาด้านล่างให้เด้งไปข้างบน */
        /* ========================================= */

        /* 📍 ปรับตำแหน่งให้ปุ่มลอยอมทับกึ่งกลางของแถบนำทางด้านล่าง */
.round-search-parent {
    position: fixed;
    bottom: 35px; /* ลดระยะจาก 85px เป็น 35px เพื่อให้ทับขอบบนของแถบล่างพอดี */
    left: 50%;
    transform: translateX(-50%);
    z-index: 4000;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 75px; /* ขยายขนาดความกว้าง */
    height: 75px; /* ขยายขนาดความสูง */
}

/* ปรับปุ่มวงกลมให้ดูเป็น "ปุ่มค้นหา" เริ่มต้น */
.search-main-btn {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #ffffff;
    color: #000;
    border: 6px solid var(--bg-deep);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    z-index: 4001;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-size: 1.5rem;
}

/* ปรับให้หมุนตอนกด (ของคุณมีอยู่แล้ว) */
.round-search-parent.active .search-main-btn {
    transform: rotate(90deg);
}

/* รองรับ Light Theme (ถ้าเปลี่ยนเป็นธีมสว่าง ให้สลับปุ่มเป็นสีดำ) */
body.light-theme .search-main-btn {
    background: #000000;
    color: #ffffff;
    border-color: var(--bg-deep); /* สลับขอบเป็นสีครีมนวลตามตัวแปร */
}

        .top-search-overlay {
    position: fixed;
    bottom: -100px; /* ซ่อนไว้ใต้จอ */
    top: auto;      /* ยกเลิกของเดิม */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 440px;
    height: 60px; 
    background: rgba(18, 18, 20, 0.98); 
    backdrop-filter: blur(15px);
    z-index: 3500; /* ให้อยู่เหนือ Nav-bar เล็กน้อย */
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-radius: 20px; /* ทำมุมมนให้เข้ากับธีม */
    border: 1.5px solid var(--premium-gold);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-sizing: border-box;
}

        body.light-theme .top-search-overlay {
    background: #ffffff;
    border-color: var(--premium-gold);
}
        /* เมื่อสั่งให้แสดง (Active) */
.top-search-overlay.active {
    bottom: 110px; /* ตำแหน่งที่ลอยอยู่เหนือแถบ Nav-bar */
}

        /* ช่อง Input ในแถบด้านบน */
        #bottomSearchInput {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 1.1rem;
        }
        body.light-theme #bottomSearchInput { color: #333; }

        /* ========================================= */


        /* 📍 Bottom Nav & Refresh */
        .bottom-nav-fixed { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100px; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; z-index: 3000; }
        .nav-bar { width: 92%; height: 60px; background: #121214; border-radius: 30px; border: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; pointer-events: auto; margin-bottom: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        body.light-theme .nav-bar { background: #ffffff; border-color: #eee; }

        :root { --bg-deep: #0a0a0b; --btn-bg: #ffffff; --btn-text: #000000; }
        body.light-theme { --bg-deep: #fffdf5; --btn-bg: #000000; --btn-text: #ffffff; }

        .round-refresh {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--btn-bg); color: var(--btn-text); 
            border: 7px solid var(--bg-deep); font-size: 1.6rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 2600; pointer-events: auto; transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>

            <span style="display:block; font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="BASKET" data-lang-th="ตะกร้า">BASKET</span>

        </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="global_script.js"></script>

<script>
    function toggleSearchField() {
        const wrapper = document.getElementById('searchWrapper');
        const input = document.getElementById('topMenuSearchInput');
        wrapper.classList.toggle('active');
        if (wrapper.classList.contains('active')) {
            input.focus();
        } else {
            input.value = '';
            handleSearch('topMenuSearchInput');
        }
    }

    // 🔍 ฟังก์ชัน ค้นหาชื่ออาหารในรายการ
    function handleSearch(inputId) {
        const keyword = document.getElementById(inputId).value.toLowerCase();
        const items = document.querySelectorAll('.menu-item');
        items.forEach(item => {
            const name = item.querySelector('h3').innerText.toLowerCase();
            item.style.display = name.includes(keyword) ? 'flex' : 'none';
        });
    }

    const firebaseConfig = { 
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
        authDomain: "bangfood-cb30f.firebaseapp.com", 
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "bangfood-cb30f", 
        storageBucket: "bangfood-cb30f.appspot.com", 
        messagingSenderId: "390955623784", 
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    window.db = firebase.database();

    async function loadMenuFromFirebase() {
        const tableNo = getTableNo();
        const transSnap = await window.db.ref('menu_translations').once('value');
        const translations = transSnap.val() || {};

        window.db.ref('products').on('value', (prodSnap) => {
            const currentLang = localStorage.getItem(`lang_table_${tableNo}`) || 'th';
            const products = prodSnap.val() || {};
            if(!products) return;

            const hero = document.getElementById('hero-best-seller-slider');
            const indicators = document.getElementById('indicator-container');
            const menuMain = document.getElementById('menu-main-container');
            
            let heroHTML = '', indHTML = '', mainHTML = '';
            let productList = Object.values(products);

            productList.forEach((p, idx) => {
                const isOut = p.status === 'out_of_stock' || p.status === 'sold_out';
                const displayName = (currentLang === 'en') ? (translations[p.name] || p.name) : p.name;

                if(idx < 5) {
                    heroHTML += `
                        <div class="slide-card ${isOut ? 'sold-out-gray' : ''}" data-index="${idx}" onclick="${isOut ? '' : `location.href='menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}'`}">
                            <img src="${p.img}" loading="lazy" style="width:100%; height:100%; object-fit:cover; ${isOut ? 'filter: grayscale(1);' : ''}">
                            <div class="slide-info-overlay">
                                <h3 class="slide-food-name">${displayName} ${isOut ? '(หมด)' : ''}</h3>
                                <span class="slide-food-price">฿${p.price}</span>
                            </div>
                        </div>`;
                    indHTML += `<div class="indicator-item"></div>`;
                }

                mainHTML += `
                    <a href="${isOut ? '#' : `menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}`}" 
                       class="menu-item" data-category="${p.category}" 
                       style="${isOut ? 'opacity:0.5; pointer-events:none; filter: grayscale(0.8);' : ''}">
                        <img src="${p.img}" class="item-img-thumb" loading="lazy">
                        <div style="flex:1;">
                            <h3>${displayName}</h3>
                            <div style="color:var(--premium-gold); font-weight:700;">฿${p.price}</div>
                        </div>
                        <div class="select-btn">
                             ${(currentLang === 'en') ? (isOut?'OUT':'ADD') : (isOut?'หมด':'เลือก')}
                        </div>
                    </a>`;
            });

            hero.innerHTML = heroHTML;
            indicators.innerHTML = indHTML;
            menuMain.innerHTML = mainHTML;

            initInfiniteSlider(); 
            updateCartUI();
        });
    }

    function goToPage(page) { window.location.href = `${page}?table=${getTableNo()}`; }

    let autoPlayInterval;
    function initInfiniteSlider() {
        const slider = document.getElementById('hero-best-seller-slider');
        const indicators = document.querySelectorAll('.indicator-item');
        const cards = slider.querySelectorAll('.slide-card');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-active');
                    const idx = entry.target.dataset.index;
                    indicators.forEach((ind, i) => {
                        if (i == idx) { 
                            ind.classList.add('active'); 
                            ind.innerText = `${parseInt(i) + 1}`; 
                        } else { 
                            ind.classList.remove('active'); 
                            ind.innerText = ''; 
                        }
                    });
                } else {
                    entry.target.classList.remove('is-active');
                }
            });
        }, { root: slider, threshold: 0.7 });

        cards.forEach(card => observer.observe(card));
        startAutoPlay(slider, cards.length);
        slider.addEventListener('touchstart', () => clearInterval(autoPlayInterval));
    }
    

    function startAutoPlay(slider, count) {
        if (autoPlayInterval) clearInterval(autoPlayInterval);
        let currentIndex = 0;
        autoPlayInterval = setInterval(() => {
            currentIndex++;
            if (currentIndex >= count) currentIndex = 0;
            const cardWidth = slider.querySelector('.slide-card').offsetWidth + 15;
            slider.scrollTo({ left: currentIndex * cardWidth, behavior: 'smooth' });
        }, 4000);
    }

    // ✨ JS ที่ถูกแก้: ควบคุมแถบด้านบน แทนที่จะขยายกล่องล่าง
    function toggleBottomSearch() {
    const searchBar = document.getElementById('topSearchOverlay'); 
    const parentBtn = document.getElementById('searchParent'); 
    const input = document.getElementById('bottomSearchInput');
    const icon = document.getElementById('searchIcon');
    
    searchBar.classList.toggle('active');
    parentBtn.classList.toggle('active'); 
    
    if (searchBar.classList.contains('active')) {
        // เมื่อเปิด: ให้โฟกัสที่ช่องพิมพ์
        setTimeout(() => {
            input.focus();
        }, 300); 
        icon.className = 'fas fa-times'; // เปลี่ยนเป็นกากบาทเพื่อปิด
    } else {
        // เมื่อปิด: ล้างค่าและรีเซ็ตไอคอน
        input.value = '';
        handleSearchBottom(); 
        icon.className = 'fas fa-search'; // กลับเป็นแว่นขยาย
    }
}

    function handleSearchBottom() {
        const keyword = document.getElementById('bottomSearchInput').value.toLowerCase();
        const items = document.querySelectorAll('.menu-item');
        items.forEach(item => {
            const name = item.querySelector('h3').innerText.toLowerCase();
            item.style.display = name.includes(keyword) ? 'flex' : 'none';
        });
    }
    // แก้ไขฟังก์ชันปิดเมื่อคลิกข้างนอก เพื่อให้สัมพันธ์กับตำแหน่งล่าง
document.addEventListener('click', function(event) {
    const searchBar = document.getElementById('topSearchOverlay');
    const searchBtn = document.getElementById('searchParent'); 
    
    if (!searchBar.contains(event.target) && !searchBtn.contains(event.target) && searchBar.classList.contains('active')) {
        toggleBottomSearch();
    }
}, true);

    function switchCategory(cat) {
        document.querySelectorAll('.menu-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
        document.querySelectorAll('.menu-item').forEach(item => item.style.display = (cat === 'ทั้งหมด' || item.dataset.category === cat) ? 'flex' : 'none');
    }

    function updateCartUI() {
        const cartKey = 'bangfood_cart_table_' + getTableNo();
        const cartData = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };
        const total = cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice || 0), 0);
        document.getElementById('floating-total').innerText = total.toLocaleString('th-TH', {minimumFractionDigits:2});
        const badge = document.getElementById('cart-count-badge');
        badge.innerText = cartData.items.length;
        badge.style.display = cartData.items.length > 0 ? 'block' : 'none';
    }

    function initializeApp() { 
        const tableNo = getTableNo();
        applyTheme(localStorage.getItem(`theme_table_${tableNo}`) || 'dark');
        loadMenuFromFirebase(); 
    }
</script>
<script src="guard.js"></script>
</body>
