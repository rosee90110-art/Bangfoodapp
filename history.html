<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 คงเหลือไว้เฉพาะโครงสร้าง Layout เฉพาะหน้า */
        body { margin: 0; padding: 25px; min-height: 100vh; animation: fadeInPage 0.8s ease-out; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { padding: 22px; border-radius: 28px; text-align: center; }
        .stat-card:hover { border-color: var(--premium-gold); transform: translateY(-5px); }
        .stat-label { font-size: 0.65rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; display: block; font-weight: 700; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text); }

        .filter-section { border-radius: 24px; padding: 20px; margin-bottom: 25px; }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .filter-group label { font-size: 0.7rem; color: var(--sub-text); margin-bottom: 5px; display: block; padding-left: 5px; text-transform: uppercase; font-weight: 600; }
        
        input { 
            background: rgba(128,128,128,0.1); border: 1px solid var(--border); padding: 12px; 
            border-radius: 14px; color: var(--text); width: 100%; box-sizing: border-box; 
            outline: none; transition: 0.3s; font-size: 0.9rem; 
        }
        input:focus { border-color: var(--premium-gold); background: rgba(197, 160, 89, 0.05); }

        .btn-search { 
            background: var(--premium-gold); color: #000; border: none; padding: 14px; 
            border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; 
            width: 100%; transition: 0.3s; font-size: 0.85rem; letter-spacing: 1px; 
        }

        .order-card { border-radius: 24px; margin-bottom: 12px; cursor: pointer; overflow: hidden; }
        .order-card:hover { border-color: var(--premium-gold); }

        .card-collapsed-part { padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; }
        .order-brief { display: flex; align-items: center; gap: 15px; }
        .station-tag { background: var(--premium-gold); color: #000; padding: 4px 14px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; }
        .order-date-brief { font-size: 0.8rem; color: var(--sub-text); }
        .total-brief { font-size: 1.15rem; color: var(--premium-gold); font-weight: 700; }

        .card-expanded-part {
            max-height: 0; padding: 0 25px; background: rgba(128,128,128,0.02);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); opacity: 0; border-top: 1px solid transparent;
        }
        .order-card.active .card-expanded-part { max-height: 1000px; padding: 20px 25px 25px; opacity: 1; border-top: 1px solid var(--border); }

        .item-row { padding: 14px 0; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .food-line { display: flex; justify-content: space-between; color: var(--text); font-size: 0.9rem; font-weight: 500; }
        .addon-item { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub-text); margin-top: 4px; padding-left: 15px; }

        .btn-group { display: flex; gap: 8px; margin-top: 20px; }
        .btn-action { flex: 1; border: none; padding: 12px; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.75rem; }
        .btn-print { background: rgba(128,128,128,0.1); color: var(--sub-text); border: 1px solid var(--border); }
        .btn-del { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.2); }
        .btn-del:hover { background: #ff4757; color: #fff; }

        @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media print { .filter-section, .btn-group, .stats-grid { display: none; } body { background: white; color: black; } .order-card { border: 1px solid #ddd; page-break-inside: avoid; } .card-expanded-part { max-height: none !important; opacity: 1 !important; } }
    </style>
</head>
<body onload="initializeHistory()">

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label" data-lang-en="Total Bills" data-lang-th="จำนวนบิลทั้งหมด">Total Bills</span>
                <span id="total-bills" class="stat-value">0</span>
            </div>
            <div class="stat-card" style="border-bottom: 4px solid #27ae60;">
                <span class="stat-label" data-lang-en="Revenue View" data-lang-th="ยอดขายรวม">Revenue View</span>
                <span class="stat-value">฿<span id="total-revenue">0.00</span></span>
            </div>
        </div>

        <section class="filter-section">
            <div class="filter-row">
                <div class="filter-group"><label data-lang-en="Date" data-lang-th="วันที่">วันที่</label><input type="date" id="search-date"></div>
                <div class="filter-group"><label data-lang-en="Start" data-lang-th="เริ่ม">เริ่ม</label><input type="time" id="start-time" value="00:00"></div>
                <div class="filter-group"><label data-lang-en="To" data-lang-th="ถึง">ถึง</label><input type="time" id="end-time" value="23:59"></div>
            </div>
            <button onclick="filterHistoryByDateTime()" class="btn-search" data-lang-en="FILTER RECORDS" data-lang-th="ค้นหาประวัติ">FILTER RECORDS</button>
        </section>

        <div id="history-list">
            <div style="text-align:center; padding:80px 0; opacity:0.3;">
                <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                <p>Loading records...</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.firebasestorage.app", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allHistoryData = [];

    function initializeHistory() {
        loadHistoryRealtime();
    }

    function loadHistoryRealtime() {
        db.ref('history').on('value', (snapshot) => {
            allHistoryData = [];
            if (snapshot.exists()) {
                snapshot.forEach((child) => { allHistoryData.push({ id: child.key, ...child.val() }); });
            }
            renderHistory(allHistoryData);
        });
    }

    function toggleCard(element) {
        element.classList.toggle('active');
    }

    function renderHistory(data) {
        const list = document.getElementById('history-list');
        const billsEl = document.getElementById('total-bills');
        const revEl = document.getElementById('total-revenue');
        let html = ''; let totalSum = 0;
        data.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));

        data.forEach((order) => {
            totalSum += parseFloat(order.total || 0);
            const orderId = order.id ? order.id.substring(order.id.length - 7).toUpperCase() : 'N/A';

            let itemsHtml = order.items ? order.items.map(item => `
                <div class="item-row">
                    <div class="food-line"><span>${item.quantity || 1}x ${item.name}</span><b>฿${parseFloat(item.finalPrice).toFixed(2)}</b></div>
                    ${item.optionsArray ? item.optionsArray.map(opt => `<div class="addon-item"><span>+ ${opt.name}</span><span>฿${parseFloat(opt.price).toFixed(2)}</span></div>`).join('') : ''}
                </div>`).join('') : '';

            html += `
                <div class="order-card" onclick="toggleCard(this)">
                    <div class="card-collapsed-part">
                        <div class="order-brief">
                            <span class="station-tag">ST ${order.tableNumber || '?' }</span>
                            <span style="font-size: 0.7rem; color: var(--premium-gold); font-family: monospace; font-weight:700;">#${orderId}</span>
                            <span class="order-date-brief">🕒 ${new Date(order.archivedAt).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <b class="total-brief">฿${parseFloat(order.total).toLocaleString()}</b>
                    </div>
                    <div class="card-expanded-part">
                        <div style="font-size:0.65rem; color:var(--sub-text); margin-bottom:15px; border-bottom: 1px solid var(--border); padding-bottom:10px;">
                            ORDER REF: ${order.id} | DATE: ${new Date(order.archivedAt).toLocaleString('th-TH')}
                        </div>
                        <div class="items-area">${itemsHtml}</div>
                        <div class="btn-group">
                            <button onclick="event.stopPropagation(); window.print()" class="btn-action btn-print"><i class="fas fa-print"></i> PRINT</button>
                            <button onclick="event.stopPropagation(); deleteEntry('${order.id}')" class="btn-action btn-del"><i class="fas fa-trash-alt"></i> DELETE</button>
                        </div>
                    </div>
                </div>`;
        });

        list.innerHTML = data.length ? html : '<div style="text-align:center; padding:100px; color:var(--sub-text); font-size:0.9rem;">ไม่พบประวัติการขาย</div>';
        billsEl.textContent = data.length;
        revEl.textContent = totalSum.toLocaleString('th-TH', { minimumFractionDigits: 2 });
    }

    function filterHistoryByDateTime() {
        const searchDate = document.getElementById('search-date').value;
        const startTime = document.getElementById('start-time').value;
        const endTime = document.getElementById('end-time').value;
        if (!searchDate) return alert("กรุณาเลือกวันที่ก่อนครับน้า");

        const filtered = allHistoryData.filter(order => {
            const d = new Date(order.archivedAt);
            const dateStr = d.toISOString().split('T')[0];
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return dateStr === searchDate && timeStr >= startTime && timeStr <= endTime;
        });
        renderHistory(filtered);
    }

    window.deleteEntry = (id) => confirm("น้าแน่ใจนะว่าจะลบประวัตินี้ถาวร?") && db.ref(`history/${id}`).remove();
</script>

<script src="admin_script.js"></script>

</body>
</html>
