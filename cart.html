<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-charcoal: #0a0a0b;
            --glass-border: rgba(255, 255, 255, 0.08);
            --bg-dark: #121110;
        }

        body { 
            background-color: var(--bg-charcoal); color: #f1f1f1; 
            font-family: 'Kanit'; margin: 0; 
            overflow-x: hidden; padding-bottom: 220px;
        }

        /* 📍 Header Luxury */
        .app-header {
            background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); padding: 18px 25px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 2000;
        }
        .bangfood { 
            font-weight: 600; color: var(--premium-gold); margin: 0; 
            font-size: 1rem; letter-spacing: 3px;
        }

        /* 📍 รายการในตะกร้าแบบแยกราคาละเอียด */
        .cart-item {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            margin: 0 20px 15px; border-radius: 24px; padding: 18px;
            animation: slideUpFade 0.6s ease-out both;
        }

        .item-main-row { display: flex; gap: 15px; align-items: flex-start; }
        .item-img { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; border: 1px solid var(--glass-border); }
        .item-info { flex: 1; }
        
        .food-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .food-name { font-size: 1rem; color: #fff; font-weight: 500; margin: 0; }
        .food-base-p { color: #fff; font-size: 0.9rem; }

        /* 📍 ส่วนรายการเสริมแยกบรรทัด */
        .addon-line { 
            display: flex; justify-content: space-between; 
            color: #777; font-size: 0.8rem; margin-top: 4px; padding-left: 5px;
        }
        .addon-price { color: var(--premium-gold); }

        .item-total-line { 
            text-align: right; margin-top: 15px; padding: 10px 15px; 
            background: rgba(255,255,255,0.02); border-radius: 12px;
            font-size: 0.9rem; font-weight: 600; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
        }

        .remove-btn {
            background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.2);
            padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; cursor: pointer;
        }

        /* 📍 ส่วนสรุปยอดเงินลอยตัว */
        .cart-footer-fixed {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 340px; background: rgba(20, 20, 22, 0.95);
            backdrop-filter: blur(30px); border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 1px 2px; border-radius: 22px; z-index: 1500;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .total-label { font-size: 0.7rem; color: #666; font-weight: 700; letter-spacing: 1px; }
        .grand-total { color: var(--premium-gold); font-weight: 700; font-size: 1.6rem; text-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }

        /* 📍 Bottom Nav เพรียวบาง */
        .curved-nav-container {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px; height: 75px; z-index: 2000;
            display: flex; justify-content: center; align-items: flex-end;
        }
        .nav-buttons-wrapper {
            background: rgba(18, 18, 20, 0.98); width: 100%; height: 50px; border-radius: 34px;
            border: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center;
            -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 52px, black 53px);
        }
        .round-btn.center {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 78px; height: 78px; background: #fff; border-radius: 50%;
            border: 8px solid var(--bg-charcoal); color: #000; font-size: 2rem;
            display: flex; justify-content: center; align-items: center;
            animation: pulseBreath 3s infinite; box-shadow: 0 15px 35px rgba(0,0,0,0.5); cursor: pointer;
        }
        .nav-icon { color: #444; font-size: 1.25rem; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .nav-text { font-size: 0.6rem; margin-top: 4px; font-weight: 700; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseBreath { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 30px rgba(197, 160, 89, 0.4); } }
    </style>
</head>

<body onload="renderCartItems()">
    <header class="app-header">
        <a href="javascript:void(0)" onclick="goBackToIndex()" style="color: #444;"><i class="fas fa-arrow-left"></i></a>
        <h1 class="bangfood">MY BASKET</h1>
        <div style="width: 25px;"></div>
    </header>

    <div class="cart-container" style="padding: 20px 0;">
        <div id="table-display-info" style="text-align: center; color: #444; font-size: 0.7rem; margin-bottom: 20px; letter-spacing: 2px; font-weight: 700;"></div> 
        <div id="cart-items-list"></div>
    </div>

    <div class="cart-footer-fixed">
        <div class="total-label">TOTAL AMOUNT</div>
        <div class="grand-total">฿<span id="final-total-amount">0.00</span></div>
    </div>

    <div class="curved-nav-container">
        <div class="round-btn center" onclick="placeOrder()">
            <i class="fas fa-check"></i>
        </div>
        <div class="nav-buttons-wrapper">
            <div class="nav-icon" onclick="goBackToIndex()">
                <i class="fas fa-plus"></i>
                <span class="nav-text">ADD MORE</span>
            </div>
            <div style="width: 90px;"></div> 
            <div class="nav-icon" onclick="goToTracking()">
                <i class="fas fa-receipt"></i>
                <span class="nav-text">ORDERS</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.database(); 

        function getTableNo() {
            const urlParams = new URLSearchParams(window.location.search);
            let table = urlParams.get('table');
            if (table && table !== 'null') { localStorage.setItem('selectedTable', table); return table; }
            return localStorage.getItem('selectedTable') || '1';
        }

        function renderCartItems() {
            const listContainer = document.getElementById('cart-items-list');
            const totalAmountDisplay = document.getElementById('final-total-amount');
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = sessionStorage.getItem(cartKey);
            const currentCart = cartData ? JSON.parse(cartData) : { items: [] };

            if (!listContainer) return;
            listContainer.innerHTML = '';
            let grandTotal = 0;

            document.getElementById('table-display-info').innerHTML = `STATION: ${tableNo}`;

            if (!currentCart.items || currentCart.items.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:100px 0; color:#333;"><i class="fas fa-shopping-basket" style="font-size:3rem; margin-bottom:15px; opacity:0.1;"></i><p>ตะกร้าว่างเปล่าครับน้า</p></div>';
                totalAmountDisplay.textContent = '0.00';
                return;
            }

            currentCart.items.forEach((item, index) => {
                const finalP = parseFloat(item.finalPrice) || 0;
                grandTotal += finalP;

                // 📍 คำนวณแยกราคาละเอียดในตะกร้า
                let optionsHtml = '';
                let optionsPriceTotal = 0;

                if (item.optionsArray && item.optionsArray.length > 0) {
                    optionsHtml = item.optionsArray.map(opt => {
                        const op = parseFloat(opt.price || 0);
                        optionsPriceTotal += op;
                        return `
                            <div class="addon-line">
                                <span>+ ${opt.name}</span>
                                <span class="addon-price">฿${op.toFixed(2)}</span>
                            </div>`;
                    }).join('');
                }

                const baseP = finalP - optionsPriceTotal;

                const html = `
                    <div class="cart-item" style="animation-delay: ${index * 0.1}s">
                        <div class="item-main-row">
                            <img src="${item.img || ''}" class="item-img">
                            <div class="item-info">
                                <div class="food-header">
                                    <span class="food-name">${item.name}</span>
                                    <span class="food-base-p">฿${baseP.toFixed(2)}</span>
                                </div>
                                <div class="addon-area">${optionsHtml}</div>
                                ${item.notes ? `<p style="color:#8e6d31; font-size:0.7rem; margin-top:8px;">📝 ${item.notes}</p>` : ''}
                            </div>
                        </div>
                        <div class="item-total-line">
                            <button class="remove-btn" onclick="removeItem(${index})">ลบรายการ</button>
                            <span>รวมจานนี้: ฿${finalP.toFixed(2)}</span>
                        </div>
                    </div>`;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            totalAmountDisplay.textContent = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 });
        }

        window.removeItem = function(index) {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            let cartData = JSON.parse(sessionStorage.getItem(cartKey));
            cartData.items.splice(index, 1);
            sessionStorage.setItem(cartKey, JSON.stringify(cartData));
            renderCartItems();
        }

        window.placeOrder = function() {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = JSON.parse(sessionStorage.getItem(cartKey));
            if (!cartData || cartData.items.length === 0) return alert("กรุณาเลือกเมนูก่อนครับน้า");
            if (!confirm("ยืนยันส่งออเดอร์เข้าครัวใช่ไหมครับ?")) return;

            const orderData = {
                tableNumber: tableNo,
                items: cartData.items,
                total: cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice), 0),
                status: 'รอดำเนินการ',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('orders').push(orderData).then(() => {
                sessionStorage.setItem(cartKey, JSON.stringify({ items: [] }));
                window.location.href = `track.html?table=${tableNo}`;
            });
        };

        function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
        function goToTracking() { window.location.href = `track.html?table=${getTableNo()}`; }
    </script>
</body>
</html>
