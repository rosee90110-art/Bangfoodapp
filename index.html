<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-deep: #0a0a0a;
            --glass-soft: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
            --text-main: #e0e0e0;
        }

        body { 
            background-color: rgb(17, 16, 13); color: var(--text-main); 
            font-family: 'Kanit', sans-serif; margin: 0; padding-bottom: 200px; 
            overflow-x: hidden; letter-spacing: 0.2px;
        }

        /* 📍 Header - พรีเมียมมินิมอล */
        .app-header {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(25px);
            padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid var(--border-dim);
            animation: fadeInDown 0.8s ease-out;
        }
        .bangfoodindex { font-size: 1.3rem; font-weight: 600; color: #fff; letter-spacing: 2px; margin: 0; }

        /* 📍 Slider - ระบบขยายรูปที่นวลที่สุด */
        .image-slider {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            gap: 15px; padding: 30px 10%; scrollbar-width: none;
        }
        .image-slider::-webkit-scrollbar { display: none; }

        .slide-card {
            flex: 0 0 80%; scroll-snap-align: center; position: relative;
            border-radius: 32px; overflow: hidden; height: 340px;
            border: 1px solid var(--border-dim); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform: scale(0.88); opacity: 0.5;
        }

        /* การ์ดที่อยู่ตรงกลางจะเรืองแสงสีทอง */
        .slide-card.is-active { 
            transform: scale(1.02); opacity: 1; z-index: 10; 
            border-color: var(--premium-gold);
            box-shadow: 0 15px 40px rgba(197, 160, 89, 0.2);
        }
        
        .slide-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .slide-info { position: absolute; text-align: center; bottom: 15px; left: 15px; right: 15px; padding: 18px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .recommend-badge { position: absolute; top: 20px; right: 20px; background: linear-gradient(135deg, var(--premium-gold), #b8860b); color: #000; padding: 6px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 800; z-index: 10; }

        /* 📍 Menu Tabs & Items */
        .menu-tabs { display: flex; gap: 8px; padding: 10px 20px 20px; overflow-x: auto; scrollbar-width: none; }
        .menu-tab { padding: 8px 18px; background: var(--glass-soft); border-radius: 12px; color: #666; text-decoration: none; font-size: 0.85rem; border: 1px solid var(--border-dim); transition: 0.3s; }
        .menu-tab.active { background: #fff; color: #000; font-weight: 500; box-shadow: 0 5px 15px rgba(255,255,255,0.1); }

        .menu-item {
            background: var(--glass-soft); border: 1px solid var(--border-dim);
            margin: 0 15px 12px; padding: 14px; border-radius: 22px;
            display: flex; align-items: center; gap: 15px;
            animation: slideUpFade 0.6s forwards; text-decoration: none; color: inherit;
        }

        .item-badge {
            position: absolute; top: -8px; right: -8px; background: #ff4b2b;
            color: white; font-size: 0.7rem; font-weight: bold; min-width: 22px; height: 22px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            border: 2px solid #1a1a1a; z-index: 10; animation: badgePop 0.4s;
        }

        .add-to-cart-btn { background: var(--premium-gold); color: #000; padding: 8px 18px; border-radius: 12px; font-weight: bold; font-size: 0.85rem; margin-left: auto; transition: 0.2s; }
        .add-to-cart-btn:active { transform: scale(0.9); }

        /* 📍 Floating Price Summary */
        .price-summary-float {
            position: fixed; bottom: 105px; left: 50%; transform: translateX(-50%);
            width: 88%; max-width: 320px; background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(25px); border: 1px solid var(--premium-gold);
            padding: 8px 25px; border-radius: 25px; z-index: 1500;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* 📍 Nav Bar */
        .curved-nav-container { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 75px; z-index: 2000; display: flex; justify-content: center; align-items: flex-end; }
        .nav-buttons-wrapper {
            background: #111; width: 100%; height: 100%; border-radius: 35px;
            border: 1px solid var(--border-dim); display: flex; justify-content: space-around; align-items: center;
            mask-image: radial-gradient(circle 60px at center -5px, transparent 48px, black 49px);
            -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 48px, black 49px);
        }
        .round-btn.center {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            width: 78px; height: 78px; background: #fff; border-radius: 50%;
            border: 6px solid rgb(17, 16, 13); color: #000; font-size: 1.8rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: pulseWhite 3s infinite;
        }

        @keyframes badgePop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        /* 📍 แอนิเมชันการเด้ง (Bounce) */
@keyframes bounceClick {
    0% { transform: scale(1); }
    30% { transform: scale(0.92); }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.98); }
    100% { transform: scale(1); }
}

/* 📍 เมื่อกดรายการอาหาร ให้มีการเด้ง */
.menu-item:active {
    animation: bounceClick 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: rgba(255, 255, 255, 0.08);
}

/* 📍 ปรับแต่งปุ่ม "เลือก" ให้เด้งสู้มือ */
.add-to-cart-btn {
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.add-to-cart-btn:active {
    transform: scale(0.8);
}
    </style>
</head>
<body onload="initializeApp()">

<header class="app-header">
    <div style="width: 30px;"></div> <h1 class="bangfoodindex">BANGFOOD</h1>
    <div onclick="window.location.href='admin_center.html'" style="cursor:pointer; color:#666;"><i class="fas fa-bars"></i></div>
</header>

<main>
    <div style="padding: 25px 25px 0;">
        <h2 style="margin:0; font-size:1rem; color: var(--premium-gold); letter-spacing: 1px; font-weight: 400;"><i class="fas fa-fire"></i> เมนูยอดฮิตที่เปิดขายตอนนี้</h2>
    </div>

    <div class="slider-wrapper">
        <div class="image-slider" id="hero-best-seller-slider"></div>
    </div>

    <div class="menu-tabs"> 
        <a href="#" class="menu-tab active" data-cat="ทั้งหมด" onclick="switchCategory('ทั้งหมด', event)">ทั้งหมด</a>
        <a href="#" class="menu-tab" data-cat="อาหาร" onclick="switchCategory('อาหาร', event)">อาหาร</a>
        <a href="#" class="menu-tab" data-cat="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว', event)">ก๋วยเตี๋ยว</a>
        <a href="#" class="menu-tab" data-cat="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม', event)">เครื่องดื่ม</a>
    </div>

    <div id="menu-main-container"></div>
</main>

<div class="price-summary-float">
    <div style="font-size: 0.75rem; color: #666; text-transform: uppercase;">โต๊ะที่ <span id="display-table">1</span> | รวม</div>
    <div style="color:var(--premium-gold); font-weight:600; font-size:1.6rem;">฿<span id="floating-total">0.00</span></div>
</div>

<div class="curved-nav-container">
    <div class="round-btn center" onclick="window.location.reload()"><i class="fas fa-receipt"></i></div>
    <div class="nav-buttons-wrapper">
        <div onclick="goToPage('cart.html')" style="flex:1; text-align:center; cursor:pointer; position:relative;">
            <i class="fas fa-shopping-basket" style="color:#555; font-size:1.3rem;"></i>
            <span id="cart-count-badge" style="position:absolute; top:-5px; right:20%; background:#ff4b2b; color:white; font-size:0.65rem; padding:2px 6px; border-radius:10px; display:none;">0</span>
        </div>
        <div style="flex: 1.2;"></div>
        <div onclick="goToPage('track.html')" style="flex:1; text-align:center; cursor:pointer;"><i class="fas fa-clock" style="color:#555; font-size:1.3rem;"></i></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getTableNo() {
        const urlParams = new URLSearchParams(window.location.search);
        let table = urlParams.get('table');
        if (table) { localStorage.setItem('selectedTable', table); }
        const currentTable = table || localStorage.getItem('selectedTable') || '1';
        document.getElementById('display-table').innerText = currentTable;
        return currentTable;
    }

    function goToPage(page) { window.location.href = `${page}?table=${getTableNo()}`; }

    function updateCartUI() {
        const tableNo = getTableNo();
        const cartKey = 'bangfood_cart_table_' + tableNo;
        const cartData = sessionStorage.getItem(cartKey);
        let total = 0, count = 0;
        if (cartData) {
            const cart = JSON.parse(cartData);
            count = cart.items ? cart.items.length : 0;
            total = cart.items ? cart.items.reduce((s, i) => s + parseFloat(i.finalPrice || 0), 0) : 0;
        }
        document.getElementById('floating-total').innerText = total.toFixed(2);
        const badge = document.getElementById('cart-count-badge');
        badge.innerText = count;
        badge.style.display = count > 0 ? 'block' : 'none';
    }

    function initHeroSlider() {
        const slider = document.getElementById('hero-best-seller-slider');
        let autoSlideInterval;
        
        // 📍 ปรับการตรวจจับให้แม่นยำขึ้นแม้มีป้าย SOLD OUT บัง
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    // เคลียร์คลาสจากใบอื่นก่อน
                    slider.querySelectorAll('.slide-card').forEach(c => c.classList.remove('is-active'));
                    entry.target.classList.add('is-active');
                }
            });
        }, { 
            root: slider, 
            threshold: 0.5, // 📍 ลดระดับเหลือ 50% เพื่อให้ตรวจเจอง่ายขึ้น
            rootMargin: '0px' 
        });

        const startAutoSlide = () => {
            // เคลียร์ของเก่าก่อนเริ่มใหม่กันรวน
            clearInterval(autoSlideInterval);
            
            autoSlideInterval = setInterval(() => {
                const cards = slider.querySelectorAll('.slide-card');
                if (cards.length <= 1) return;
                
                let curIndex = Array.from(cards).findIndex(c => c.classList.contains('is-active'));
                
                // 📍 ถ้าหา Active ไม่เจอ (เช่นตอนเพิ่งโหลด) ให้เริ่มที่ใบแรก
                if (curIndex === -1) curIndex = 0;
                
                let nextIndex = (curIndex + 1) % cards.length;
                
                const card = cards[nextIndex];
                // 📍 คำนวณตำแหน่งให้แม่นยำที่สุดเพื่อให้หยุดตรงกลาง
                const scrollLeft = card.offsetLeft - (slider.clientWidth / 2) + (card.clientWidth / 2);
                
                slider.scrollTo({
                    left: scrollLeft,
                    behavior: 'smooth'
                });
            }, 4500); // 📍 ตั้งเวลาเลื่อนทุก 4.5 วินาที
        };

        // 📍 ตรวจสอบว่าการ์ดโหลดมาหรือยัง
        const checkReady = setInterval(() => {
            const cards = slider.querySelectorAll('.slide-card');
            if (cards.length > 0) {
                cards.forEach(c => observer.observe(c));
                startAutoSlide();
                clearInterval(checkReady);
            }
        }, 500);
        
        // หยุดเลื่อนเมื่อน้าเอานิ้วไปแตะ และเริ่มใหม่เมื่อปล่อย
        slider.addEventListener('touchstart', () => clearInterval(autoSlideInterval));
        slider.addEventListener('touchend', () => startAutoSlide());
    }

    async function loadMenuFromFirebase() {
        const [ordersSnap, historySnap] = await Promise.all([db.ref('orders').once('value'), db.ref('history').once('value')]);
        const sales = {};
        const proc = (snap) => { if (snap.exists()) Object.values(snap.val()).forEach(o => { if (o.items) o.items.forEach(i => sales[i.name] = (sales[i.name] || 0) + (i.quantity || 1)); }); };
        proc(ordersSnap); proc(historySnap);

        db.ref('products').on('value', (snapshot) => {
            const products = snapshot.val();
            const hero = document.getElementById('hero-best-seller-slider');
            const menuMain = document.getElementById('menu-main-container');
            const cartData = JSON.parse(sessionStorage.getItem('bangfood_cart_table_' + getTableNo())) || { items: [] };

            menuMain.innerHTML = ''; hero.innerHTML = '';
            let productList = [];
            for (let id in products) { 
                let p = products[id]; 
                p.sales = sales[p.name] || 0; 
                productList.push(p); 
            }

            // 📍 1. ส่วนของ Slider ยอดฮิต (ถ้าของหมดให้ขึ้นป้าย SOLD OUT)
            const top5 = [...productList]
                .sort((a,b) => b.sales - a.sales)
                .filter(p => p.sales > 0)
                .slice(0, 5);

            top5.forEach((p, index) => {
                const isOut = p.status === 'out_of_stock';
                // 📍 ใส่ฟิลเตอร์สีเทาถ้าของหมด
                const grayscaleStyle = isOut ? 'filter: grayscale(1); opacity: 0.6;' : '';
                const soldOutBadge = isOut ? `<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:#ff4444; padding:10px 20px; border-radius:15px; font-weight:bold; border:2px solid #ff4444; z-index:15;">SOLD OUT</div>` : '';

                hero.innerHTML += `
                    <div class="slide-card" style="${grayscaleStyle}">
                        ${soldOutBadge}
                        <div class="recommend-badge">TRENDING #${index + 1}</div>
                        <img src="${p.img}" ${isOut ? '' : `onclick="location.href='menu.html?name=${encodeURIComponent(p.name)}&table=${getTableNo()}'"`}> 
                        <div class="slide-info">
                            <h3 style="margin:0; font-size:1.1rem; color:#fff;">${p.name}</h3>
                            <p style="margin:5px 0 0; font-size:0.75rem; color:#aaa;">สั่งไปแล้ว ${p.sales} รายการ</p>
                        </div>
                    </div>`;
            });

            // 📍 2. รายการเมนูด้านล่าง (ถ้าของหมดให้เปลี่ยนปุ่มเป็น "ของหมด")
            // 📍 2. รายการเมนูด้านล่าง (ปรับปรุงการวาด HTML ใหม่)
            productList.forEach((p, idx) => {
                const isOut = p.status === 'out_of_stock';
                const count = cartData.items ? cartData.items.filter(item => item.name === p.name).length : 0;
                const badge = count > 0 ? `<div class="item-badge">${count}</div>` : '';
                
                const itemImgStyle = isOut ? 'filter: grayscale(1); opacity: 0.5;' : '';
                const actionBtn = isOut 
                    ? `<div style="background:#333; color:#666; padding:8px 18px; border-radius:12px; font-weight:bold; font-size:0.85rem; margin-left:auto;">ของหมด</div>`
                    : `<div class="add-to-cart-btn">เลือก</div>`;

                menuMain.innerHTML += `
                    <a ${isOut ? '' : `href="menu.html?name=${encodeURIComponent(p.name)}&table=${getTableNo()}"`} 
                       class="menu-item" data-category="${p.category}" 
                       style="animation-delay: ${0.05 * idx}s; ${isOut ? 'pointer-events: none; opacity: 0.7;' : ''}">
                        <div class="image-container">
                            <img src="${p.img}" class="item-image" style="width:80px; height:80px; border-radius:18px; object-fit:cover; ${itemImgStyle}">
                            ${badge}
                        </div>
                        <div style="flex:1;">
                            <h3 style="margin:0; font-size:1rem; font-weight:500; color:${isOut ? '#666' : '#fff'};">${p.name}</h3>
                            <div style="color:${isOut ? '#444' : 'var(--premium-gold)'}; font-size:0.9rem; margin-top:3px;">฿${p.price}</div>
                        </div>
                        ${actionBtn}
                    </a>`;
            });
            // 📍 ต้องมีบรรทัดปิดครอบคลุม db.ref('products').on ...
            switchCategory(document.querySelector('.menu-tab.active').dataset.cat);
        });
    }

    function switchCategory(cat, e) {
        if(e) e.preventDefault();
        document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-cat="${cat}"]`).classList.add('active');
        document.querySelectorAll('.menu-item').forEach(item => {
            if (cat === 'ทั้งหมด' || item.dataset.category === cat) item.style.display = 'flex';
            else item.style.display = 'none';
        });
    }

    function initializeApp() { loadMenuFromFirebase(); updateCartUI(); initHeroSlider(); getTableNo(); }
</script>
</body>
</html>
