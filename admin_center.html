<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        :root {
            --sidebar-wide: 260px;
            --sidebar-narrow: 80px;
            --top-bar-height: 70px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body { font-family: 'Kanit', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .top-bar {
            height: var(--top-bar-height);
            background: var(--card-bg); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; position: relative; z-index: 2500;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .top-left { display: flex; align-items: center; gap: 20px; }
        .mobile-toggle {
            display: none;
            background: rgba(var(--premium-gold-rgb), 0.08);
            color: var(--premium-gold);
            width: 40px; height: 40px; border-radius: 12px;
            justify-content: center; align-items: center; cursor: pointer;
            border: 1px solid rgba(var(--premium-gold-rgb), 0.2);
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative; overflow: hidden;
        }
        .mobile-toggle:hover {
            background: rgba(var(--premium-gold-rgb), 0.18);
            box-shadow: 0 0 14px rgba(var(--premium-gold-rgb), 0.3);
            transform: scale(1.08);
        }
        .mobile-toggle:active { transform: scale(0.94); }
        /* 📍 ชื่อแบรนด์ที่จะเปลี่ยนตามหน้าเมนูครับน้า */
        .system-logo { font-size: 1.1rem; letter-spacing: 3px; color: var(--premium-gold); font-weight: 700; text-transform: uppercase; transition: 0.3s; }

        .top-right { display: flex; align-items: center; gap: 25px; }

        .profile-container { position: relative; }
        .user-profile-header {
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            padding: 6px 12px; border-radius: 16px;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .user-profile-header:hover {
            background: rgba(var(--premium-gold-rgb), 0.07);
            border-color: rgba(var(--premium-gold-rgb), 0.2);
        }
        .user-profile-header:active { transform: scale(0.97); }

        .user-info-text { text-align: right; }
        .user-info-text b { display: block; font-size: 0.8rem; color: var(--text); }
        .user-info-text span { font-size: 0.6rem; color: var(--premium-gold); text-transform: uppercase; }

        /* 🌀 Spinning ring around avatar on hover */
        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .user-avatar-circle {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--premium-gold); overflow: hidden;
            background: #222;
            transition: box-shadow 0.35s, border-color 0.35s;
        }
        .user-profile-header:hover .user-avatar-circle {
            box-shadow: 0 0 0 3px rgba(var(--premium-gold-rgb), 0.25),
                        0 0 20px rgba(var(--premium-gold-rgb), 0.3);
            animation: ringRotate 4s linear infinite;
        }
        .user-avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

        .profile-dropdown {
            position: absolute; top: calc(100% + 15px); right: 0;
            width: 230px;
            background: rgba(15,15,15,0.7);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(var(--premium-gold-rgb), 0.15);
            border-radius: 20px; padding: 10px; opacity: 0; visibility: hidden;
            transform: translateY(-12px) scale(0.97);
            transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1); z-index: 3000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35), 0 0 0 1px rgba(var(--premium-gold-rgb), 0.06),
                        inset 0 1px 0 rgba(255,255,255,0.06);
        }
        body.light-theme .profile-dropdown {
            background: rgba(255,255,255,0.88);
            border-color: rgba(var(--premium-gold-rgb), 0.25);
            box-shadow: 0 16px 40px rgba(0,0,0,0.12);
        }
        .profile-dropdown.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

        .dropdown-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 15px; border-radius: 12px; color: var(--sub-text);
            font-size: 0.85rem; cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.28s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid transparent;
        }
        .dropdown-item i {
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; background: rgba(var(--premium-gold-rgb), 0.07);
            color: var(--premium-gold); font-size: 0.85rem;
            transition: all 0.28s cubic-bezier(0.23, 1, 0.32, 1);
            flex-shrink: 0;
        }
        .dropdown-item:hover {
            background: rgba(var(--premium-gold-rgb), 0.08);
            border-color: rgba(var(--premium-gold-rgb), 0.2);
            color: var(--premium-gold);
            transform: translateX(4px);
        }
        .dropdown-item:hover i {
            background: rgba(var(--premium-gold-rgb), 0.18);
            box-shadow: 0 0 10px rgba(var(--premium-gold-rgb), 0.25);
        }
        /* logout item stays red */
        .dropdown-item[style*='ff4444']:hover {
            background: rgba(231,76,60,0.1) !important;
            border-color: rgba(231,76,60,0.3) !important;
            color: #e74c3c !important;
            transform: translateX(4px);
        }
        .dropdown-item[style*='ff4444'] i {
            color: #e74c3c !important;
            background: rgba(231,76,60,0.08) !important;
        }
        .dropdown-item[style*='ff4444']:hover i {
            background: rgba(231,76,60,0.18) !important;
            box-shadow: 0 0 10px rgba(231,76,60,0.25) !important;
        }

        .layout-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: var(--sidebar-narrow); background: var(--card-bg); border-right: 1px solid var(--border);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; transition: var(--transition); overflow: hidden;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.05);
        }
        @media (min-width: 901px) { .sidebar:hover { width: var(--sidebar-wide); } }

        .nav-list { flex: 1; padding: 20px 10px; display: flex; flex-direction: column; gap: 4px; }

        /* ✨ Nav items entrance stagger */
        @keyframes navSlideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .nav-item {
            display: flex; align-items: center; height: 50px; border-radius: 14px;
            cursor: pointer; color: var(--sub-text);
            position: relative; overflow: hidden;
            border: 1px solid transparent;
            animation: navSlideIn 0.45s cubic-bezier(0.23, 1, 0.32, 1) both;
            transition: background 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                        border-color 0.3s, color 0.3s, box-shadow 0.3s, transform 0.2s;
        }
        /* stagger each nav-item's entrance */
        .nav-item:nth-child(1) { animation-delay: 0.05s; }
        .nav-item:nth-child(2) { animation-delay: 0.10s; }
        .nav-item:nth-child(3) { animation-delay: 0.15s; }
        .nav-item:nth-child(4) { animation-delay: 0.20s; }
        .nav-item:nth-child(5) { animation-delay: 0.25s; }
        .nav-item:nth-child(6) { animation-delay: 0.30s; }
        .nav-item:nth-child(7) { animation-delay: 0.35s; }
        .nav-item:nth-child(8) { animation-delay: 0.40s; }

        /* Ripple pseudo-element */
        .nav-item::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(var(--premium-gold-rgb), 0.18) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.4s;
            pointer-events: none;
        }
        .nav-item:hover::after { opacity: 1; }

        .nav-item:hover {
            background: rgba(var(--premium-gold-rgb), 0.07);
            border-color: rgba(var(--premium-gold-rgb), 0.15);
            color: var(--premium-gold);
            box-shadow: 0 0 18px rgba(var(--premium-gold-rgb), 0.08), inset 0 0 0 1px rgba(var(--premium-gold-rgb), 0.08);
        }
        .nav-item:active { transform: scale(0.97); }

        .nav-item i {
            min-width: 60px; font-size: 1.15rem; display: flex; justify-content: center;
            transition: text-shadow 0.3s, transform 0.3s;
        }
        .nav-item:hover i {
            text-shadow: 0 0 12px rgba(var(--premium-gold-rgb), 0.6);
            transform: scale(1.1);
        }

        .nav-item span { font-size: 0.85rem; white-space: nowrap; opacity: 0; transform: translateX(-10px); transition: 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; transform: translateX(0); margin-left: 10px; }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(var(--premium-gold-rgb), 0.14), rgba(var(--premium-gold-rgb), 0.04));
            border-left: 3px solid var(--premium-gold);
            border-top-left-radius: 0; border-bottom-left-radius: 0;
            border-radius: 0 14px 14px 0;
            color: var(--premium-gold); font-weight: 700;
            box-shadow: inset 0 0 20px rgba(var(--premium-gold-rgb), 0.06),
                        0 4px 20px rgba(var(--premium-gold-rgb), 0.1);
        }
        .nav-item.active i {
            text-shadow: 0 0 14px rgba(var(--premium-gold-rgb), 0.7);
        }

        .sidebar-footer {
            padding: 20px 10px;
            border-top: 1px solid var(--border);
            display: flex; align-items: center;
            min-height: 70px;
        }
        #top-clock-container {
            display: flex; align-items: center;
            color: var(--text); gap: 10px;
            width: 100%; transition: 0.3s;
        }
        #top-clock-container i {
            min-width: 60px; display: flex; justify-content: center;
            font-size: 1.2rem; color: var(--premium-gold);
            text-shadow: 0 0 10px var(--premium-gold);
        }
        #top-clock {
            font-size: 0.95rem; font-weight: 700; font-family: 'Courier New', monospace;
            opacity: 0; transform: translateX(-10px); transition: 0.3s;
        }
        .sidebar:hover #top-clock { opacity: 1; transform: translateX(0); }

        .main-content { flex: 1; position: relative; background: var(--bg); overflow: hidden; }
        .content-frame { width: 100%; height: 100%; border: none; }

        @media (max-width: 900px) {
            .mobile-toggle { display: flex; }
            .sidebar { position: fixed; left: -100%; top: var(--top-bar-height); height: calc(100% - var(--top-bar-height)); width: 280px !important; z-index: 2000; background: var(--bg); }
            .sidebar.open { left: 0; }
            .sidebar .nav-item span { opacity: 1 !important; display: inline-block !important; transform: none !important; margin-left: 12px !important; font-size: 0.9rem; color: var(--text); }
            .sidebar-overlay { display: none; position: fixed; top: var(--top-bar-height); left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
            .sidebar-overlay.show { display: block; }
        }
    </style>
</head>
<body onload="initializeCommandCenter()">

    <header class="top-bar">
        <div class="top-left">
            <div class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
            <div class="system-logo" id="main-brand-text">BANGFOOD CENTER</div>
        </div>
        
        <div class="top-right">
            <div class="profile-container">
                <div class="user-profile-header" onclick="toggleProfileDropdown()">
                    <div class="user-info-text">
                        <b id="admin-name-display">Admin User</b>
                        <span data-lang-en="Manager" data-lang-th="ผู้จัดการ">Manager <i class="fas fa-chevron-down" style="font-size:0.5rem;"></i></span>
                    </div>
                    <div class="user-avatar-circle">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" id="top-avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                    </div>
                </div>
                <div class="profile-dropdown" id="profile-dropdown">
                    <div class="dropdown-item" onclick="loadContent('profile.html', null); toggleProfileDropdown();" data-lang-en="Profile" data-lang-th="ข้อมูลส่วนตัว">
                        <i class="fas fa-user-circle"></i> ข้อมูลส่วนตัว
                    </div>
                    <div class="dropdown-item" onclick="loadContent('settings.html', null); toggleProfileDropdown();" data-lang-en="Settings" data-lang-th="ตั้งค่าระบบ">
                        <i class="fas fa-cog"></i> ตั้งค่าระบบ & การเงิน
                    </div>
                    <div class="dropdown-item" style="color:#ff4444;" onclick="logoutAdmin()" data-lang-en="Logout" data-lang-th="ออกจากระบบ">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="layout-body">
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="main-sidebar">
            <nav class="nav-list">
                <div class="nav-item active" onclick="loadContent('admin_dashboard.html', this)">
                    <i class="fas fa-th-large"></i><span data-lang-en="DASHBOARD" data-lang-th="แผงควบคุม">DASHBOARD</span>
                </div>
                <div class="nav-item" onclick="loadContent('admin.html', this)">
                    <i class="fas fa-receipt"></i><span data-lang-en="ORDERS" data-lang-th="จัดการออเดอร์">จัดการออเดอร์</span>
                </div>
                <div class="nav-item" onclick="loadContent('history.html', this)">
                    <i class="fas fa-history"></i><span data-lang-en="HISTORY" data-lang-th="ประวัติการสั่งซื้อ">ประวัติการสั่งซื้อ</span>
                </div>
                <div class="nav-item" onclick="loadContent('admin_users.html', this)">
                    <i class="fas fa-user-shield"></i><span data-lang-en="STAFF" data-lang-th="จัดการแอดมิน">จัดการแอดมิน</span>
                </div>
                <div class="nav-item" onclick="loadContent('trending.html', this)">
                    <i class="fas fa-fire"></i><span data-lang-en="TRENDING" data-lang-th="อันดับยอดฮิต">อันดับยอดฮิต</span>
                </div>
                <div class="nav-item" onclick="loadContent('edit_products.html', this)">
                    <i class="fas fa-utensils"></i><span data-lang-en="MENU" data-lang-th="จัดการเมนู">จัดการเมนู</span>
                </div>
                <div class="nav-item" onclick="loadContent('revenue_report.html', this)">
                    <i class="fas fa-chart-bar"></i><span data-lang-en="REVENUE" data-lang-th="ข้อมูลรายได้">ข้อมูลรายได้</span>
                </div>
                <div class="nav-item" onclick="loadContent('qr_generator.html', this)">
    <i class="fas fa-qrcode"></i><span data-lang-en="QR GENERATOR" data-lang-th="สร้าง QR Code">สร้าง QR Code</span>
</div>
            </nav>

            <div class="sidebar-footer">
                <div id="top-clock-container">
                    <i class="far fa-clock"></i>
                    <span id="top-clock">00:00:00</span>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <iframe src="" id="content-frame" class="content-frame"></iframe>
        </main>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function applyMainTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.classList.toggle('light-theme', savedTheme === 'light');
    }
    applyMainTheme();

    window.addEventListener('storage', (e) => {
        if (e.key === 'theme') {
            applyMainTheme();
            const frame = document.getElementById('content-frame');
            if(frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'THEME_CHANGE', theme: e.newValue }, '*');
            }
        }
    });

    window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'ACCENT_CHANGE') {
            document.documentElement.style.setProperty('--premium-gold', e.data.color);
            if (e.data.rgb) {
                document.documentElement.style.setProperty('--premium-gold-rgb', e.data.rgb);
            }
        }
    });

    setInterval(() => { 
        const clockEl = document.getElementById('top-clock');
        if(clockEl) clockEl.innerText = new Date().toLocaleTimeString('en-GB'); 
    }, 1000);

    function initializeCommandCenter() {
        checkLoginStatus();
        const currentName = sessionStorage.getItem('currentAdminName') || "Admin User";
        document.getElementById('admin-name-display').innerText = currentName;
        
        db.ref('admins').orderByChild('username').equalTo(currentName).on('value', snap => {
            if(snap.exists()) {
                const data = Object.values(snap.val())[0];
                const avatarEl = document.getElementById('top-avatar');
                if(avatarEl) avatarEl.src = data.profileImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            }
        });
        loadContent('admin_dashboard.html', document.querySelector('.nav-item')); 
    }

    // 🔄 ฟังก์ชันสลับหน้าและเปลี่ยนชื่อซ้ายบนแบบเรียลไทม์
    function loadContent(url, element) {
        const frame = document.getElementById('content-frame');
        const brandText = document.getElementById('main-brand-text');
        
        if(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            
            // 📍 เปลี่ยนชื่อซ้ายบนตามเมนูที่กดครับน้า
            const menuName = element.querySelector('span').innerText;
            brandText.style.opacity = 0;
            setTimeout(() => {
                brandText.innerText = "BANGFOOD | " + menuName;
                brandText.style.opacity = 1;
            }, 150);
        }
        
        if(frame) frame.src = url;
        if (window.innerWidth <= 900) {
            document.getElementById('main-sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
    }

    function toggleSidebar() {
        document.getElementById('main-sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function toggleProfileDropdown() { 
        const dropdown = document.getElementById('profile-dropdown');
        if(dropdown) dropdown.classList.toggle('active'); 
    }

    function checkLoginStatus() { if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') window.location.href = "start.html"; }

    function logoutAdmin() { 
        if(confirm("ยืนยันการออกจากระบบ?")) { 
            sessionStorage.clear(); 
            window.location.href = "start.html"; 
        } 
    }

    window.onclick = function(event) {
        if (!event.target.closest('.profile-container')) {
            const dropdown = document.getElementById('profile-dropdown');
            if(dropdown) dropdown.classList.remove('active');
        }
    }
</script>
<script src="admin_script.js"></script>
</body>
</html>
