<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="global_style.css">

    <style>

        /* 📍 ปรับปรุง Header ให้สวยงามตามแบบ */
.app-header-sticky {
    position: sticky;
    top: 0;
    z-index: 2000;
    background: rgba(10, 10, 11, 0.95);
    backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--glass-border);
}

.header-main-row {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 55px;
}

/* 🖤 แถบ STATION และ TOTAL (จุดที่แก้ไข) */
.top-summary-bar {
    padding: 10px 25px;
    background: rgba(197, 160, 89, 0.05);
    display: flex;
    justify-content: space-between; /* แยกซ้าย-ขวา */
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.02);
}

.summary-label {
    font-size: 0.6rem;
    color: #666;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.summary-val {
    color: var(--premium-gold);
    font-weight: 700;
    font-size: 1.3rem; /* ขนาดตัวเลขราคา */
    text-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
}

.hamburger-menu {
    position: absolute;
    right: 20px;
}
        /* CSS เฉพาะส่วนของหน้าแรก (Slider และ Tabs) */
        .bangfood-logo { font-size: 1.1rem; font-weight: 600; letter-spacing: 4px; background: linear-gradient(90deg, #c5a059, #fff, #c5a059); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shineText 4s linear infinite; margin: 0; }
        
        .slider-container { width: 100%; margin-top: 10px; overflow: hidden; position: relative; }
        .image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; padding: 15px 35px 25px; scrollbar-width: none; scroll-behavior: smooth; flex-wrap: nowrap; }
        .image-slider::-webkit-scrollbar { display: none; }
        .slide-card { flex: 0 0 82%; scroll-snap-align: center; border-radius: 28px; height: 185px; transition: 0.6s; transform: scale(0.9); opacity: 0.5; overflow: hidden; }
        .slide-card.is-active { transform: scale(1); opacity: 1; }
        .slide-card img { width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--glass-border); border-radius: 28px; }

        .middle-indicator-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 5px auto 20px; height: 40px; width: 100%; }
        .indicator-item { width: 10px; height: 4px; background: #333; border-radius: 10px; transition: 0.4s; display: flex; justify-content: center; align-items: center; }
        .indicator-item.active { width: 35px; height: 35px; background: transparent; color: var(--premium-gold); font-size: 1.6rem; font-weight: 900; text-shadow: 0 0 20px rgba(197, 160, 89, 0.6); }

        .menu-tabs { display: flex; gap: 12px; padding: 10px 20px 20px; overflow-x: auto; scrollbar-width: none; }
        .menu-tab { padding: 10px 18px; background: var(--glass); border-radius: 12px; color: #555; font-size: 0.75rem; border: 1px solid var(--glass-border); white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .menu-tab.active { background: #fff; color: #000; font-weight: 600; }

        .menu-item { background: var(--glass); border: 1px solid var(--glass-border); margin: 0 20px 12px; padding: 14px; border-radius: 24px; display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; animation: slideUpFade 0.6s both; }
        body.light-theme .menu-item { background: #fff; color: #333; }
        .item-img-thumb { width: 65px; height: 65px; border-radius: 16px; object-fit: cover; }

        .bottom-nav-fixed { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 100px; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; z-index: 3000; }
        .nav-bar { width: 92%; height: 60px; background: #121214; border-radius: 30px; border: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; pointer-events: auto; margin-bottom: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        body.light-theme .nav-bar { background: #ffffff; }

        .round-refresh { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 75px; height: 75px; background: #fff; border-radius: 50%; border: 7px solid var(--bg-deep); color: #000; font-size: 1.6rem; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 2600; pointer-events: auto; }
    </style>
</head>
<body onload="initializeApp()">

<div id="side-drawer" class="side-drawer">
    <div class="drawer-content">
        <div class="drawer-item" onclick="switchCustomerTheme(); toggleDrawer();">
            <span data-lang-en="THEME" data-lang-th="เปลี่ยนธีม">เปลี่ยนธีม</span>
            <i class="fas fa-adjust" style="color:var(--premium-gold);"></i>
        </div>
        <div class="drawer-item" onclick="switchCustomerLanguage(); toggleDrawer();">
            <span data-lang-en="LANGUAGE" data-lang-th="เปลี่ยนภาษา">เปลี่ยนภาษา</span>
            <b id="drawer-lang-status">TH</b>
        </div>
    </div>
</div>
<div id="drawer-overlay" onclick="toggleDrawer()" style="position:fixed; top:0; left:0; width:100%; height:100%; background:transparent; z-index:3500; display:none;"></div>
<div class="app-header-sticky">
    <div class="header-main-row">
        <h1 class="bangfood-logo">BANGFOOD</h1>
        <div class="hamburger-menu" onclick="toggleDrawer()">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="top-summary-bar">
        <div class="summary-label">
            STATION <span id="display-table" style="color:var(--premium-gold);">1</span> | 
            <span data-lang-en="TOTAL" data-lang-th="ราคารวม">TOTAL</span>
        </div>
        <div class="summary-val">
            ฿<span id="floating-total">0.00</span>
        </div>
    </div>
</div>

    <main>
        <div style="padding: 25px 20px 0;"><h2 style="font-size: 0.85rem; color: var(--premium-gold); letter-spacing: 2.5px; margin: 0; text-transform: uppercase;"><i class="fas fa-crown"></i> <span data-lang-en="Signature Menu" data-lang-th="เมนูแนะนำ">Signature Menu</span></h2></div>
        <div class="slider-container">
            <div class="image-slider" id="hero-best-seller-slider"></div>
        </div>
        <div class="middle-indicator-container" id="indicator-container"></div>

        <div class="menu-tabs" id="category-tabs"> 
            <div class="menu-tab active" data-cat="ทั้งหมด" onclick="switchCategory('ทั้งหมด')" data-lang-en="ALL" data-lang-th="ทั้งหมด">ทั้งหมด</div>
            <div class="menu-tab" data-cat="อาหาร" onclick="switchCategory('อาหาร')" data-lang-en="MAIN" data-lang-th="อาหาร">อาหาร</div>
            <div class="menu-tab" data-cat="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว')" data-lang-en="NOODLES" data-lang-th="ก๋วยเตี๋ยว">ก๋วยเตี๋ยว</div>
            <div class="menu-tab" data-cat="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม')" data-lang-en="DRINKS" data-lang-th="น้ำ">น้ำ</div>
        </div>
        <div id="menu-main-container"></div>
    </main>

    <div class="bottom-nav-fixed">
        <div class="round-refresh" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i></div>
        <div class="nav-bar">
            <div onclick="goToPage('cart.html')" style="text-align:center; position:relative; cursor:pointer; color:#444;">
                <i class="fas fa-shopping-basket"></i>
                <div id="cart-count-badge" style="position:absolute; top:-5px; right:-8px; background:#ff4b2b; color:#fff; font-size:0.5rem; padding:2px 5px; border-radius:8px; display:none;">0</div>
                <span style="display:block; font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="BASKET" data-lang-th="ตะกร้า">BASKET</span>
            </div>
            <div style="width: 80px;"></div>
            <div onclick="goToPage('track.html')" style="text-align:center; cursor:pointer; color:#444;">
                <i class="fas fa-receipt"></i>
                <span style="display:block; font-size:0.55rem; font-weight:700; margin-top:3px;" data-lang-en="ORDERS" data-lang-th="รายการที่สั่ง">ORDERS</span>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="global_script.js"></script>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
        authDomain: "bangfood-cb30f.firebaseapp.com", 
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "bangfood-cb30f", 
        storageBucket: "bangfood-cb30f.appspot.com", 
        messagingSenderId: "390955623784", 
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    // 📍 ตั้งค่า window.db เพื่อให้ global_script.js เรียกใช้ได้
    window.db = firebase.database();

    async function loadMenuFromFirebase() {
        const tableNo = getTableNo();
        const currentLang = localStorage.getItem(`lang_table_${tableNo}`) || 'th';
        
        const [transSnap, prodSnap] = await Promise.all([
            window.db.ref('menu_translations').once('value'),
            window.db.ref('products').once('value')
        ]);

        const translations = transSnap.val() || {};
        const products = prodSnap.val() || {};
        if(!products) return;

        const hero = document.getElementById('hero-best-seller-slider');
        const indicators = document.getElementById('indicator-container');
        const menuMain = document.getElementById('menu-main-container');
        
        let heroHTML = '', indHTML = '', mainHTML = '';
        let productList = Object.values(products);

        productList.forEach((p, idx) => {
            const isOut = p.status === 'out_of_stock' || p.status === 'sold_out';
            const displayName = (currentLang === 'en') ? (translations[p.name] || p.name) : p.name;

            if(idx < 5) {
                heroHTML += `<div class="slide-card" data-index="${idx}" onclick="location.href='menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}'"><img src="${p.img}" loading="lazy"></div>`;
                indHTML += `<div class="indicator-item"></div>`;
            }

            mainHTML += `
                <a href="${isOut ? '#' : `menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}`}" 
                   class="menu-item" data-category="${p.category}" style="${isOut ? 'opacity:0.5; pointer-events:none;' : ''}">
                    <img src="${p.img}" class="item-img-thumb" loading="lazy">
                    <div style="flex:1;">
                        <h3>${displayName}</h3>
                        <div style="color:var(--premium-gold);">฿${p.price}</div>
                    </div>
                    <div class="select-btn" data-lang-en="${isOut?'OUT':'ADD'}" data-lang-th="${isOut?'หมด':'เลือก'}">
                         ${(currentLang === 'en') ? (isOut?'OUT':'ADD') : (isOut?'หมด':'เลือก')}
                    </div>
                </a>`;
        });

        hero.innerHTML = heroHTML;
        indicators.innerHTML = indHTML;
        menuMain.innerHTML = mainHTML;

        initInfiniteSlider();
        translatePage(currentLang);
        updateCartUI();
    }

    function goToPage(page) { window.location.href = `${page}?table=${getTableNo()}`; }

    let autoPlayInterval;

    function initInfiniteSlider() {
        const slider = document.getElementById('hero-best-seller-slider');
        const indicators = document.querySelectorAll('.indicator-item');
        const cards = slider.querySelectorAll('.slide-card');
        
        // 1. ระบบตรวจจับตำแหน่ง (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-active');
                    const idx = entry.target.dataset.index;
                    indicators.forEach((ind, i) => {
                        if (i == idx) { 
                            ind.classList.add('active'); 
                            ind.innerText = `${parseInt(i) + 1}`; 
                        } else { 
                            ind.classList.remove('active'); 
                            ind.innerText = ''; 
                        }
                    });
                } else {
                    entry.target.classList.remove('is-active');
                }
            });
        }, { root: slider, threshold: 0.7 });

        cards.forEach(card => observer.observe(card));

        // 2. ⚡ เริ่มการเลื่อนอัตโนมัติ (Auto-play)
        startAutoPlay(slider, cards.length);

        // 3. หยุดเลื่อนเมื่อผู้ใช้เอามือไปแตะ/ลากเอง
        slider.addEventListener('touchstart', () => clearInterval(autoPlayInterval));
        slider.addEventListener('mousedown', () => clearInterval(autoPlayInterval));
    }

    function startAutoPlay(slider, count) {
        if (autoPlayInterval) clearInterval(autoPlayInterval);
        
        let currentIndex = 0;
        autoPlayInterval = setInterval(() => {
            currentIndex++;
            if (currentIndex >= count) currentIndex = 0;

            const cardWidth = slider.querySelector('.slide-card').offsetWidth + 15; // 15 คือระยะ gap
            slider.scrollTo({
                left: currentIndex * cardWidth,
                behavior: 'smooth'
            });
        }, 4000); // ⏱️ เลื่อนทุกๆ 4 วินาที
    }

    function switchCategory(cat) {
        document.querySelectorAll('.menu-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
        document.querySelectorAll('.menu-item').forEach(item => item.style.display = (cat === 'ทั้งหมด' || item.dataset.category === cat) ? 'flex' : 'none');
    }

    function updateCartUI() {
        const cartKey = 'bangfood_cart_table_' + getTableNo();
        const cartData = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };
        const total = cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice || 0), 0);
        document.getElementById('floating-total').innerText = total.toLocaleString('th-TH', {minimumFractionDigits:2});
        const badge = document.getElementById('cart-count-badge');
        badge.innerText = cartData.items.length;
        badge.style.display = cartData.items.length > 0 ? 'block' : 'none';
    }

    function initializeApp() { 
        const tableNo = getTableNo();
        applyTheme(localStorage.getItem(`theme_table_${tableNo}`) || 'dark');
        loadMenuFromFirebase(); 
    }
</script>
<script src="guard.js"></script>
</body>
</html>
