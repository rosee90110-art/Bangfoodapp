<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะ - BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-deep: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        body { 
            background-color: var(--bg-deep); color: #e0e0e0; 
            font-family: 'Kanit'; margin: 0; padding: 0;
            display: flex; justify-content: center; overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%; max-width: 480px; min-height: 100vh;
            background: var(--bg-deep); position: relative; padding-bottom: 220px;
        }

        /* 📍 Header */
        .app-header {
            background: rgba(10, 10, 11, 0.8); backdrop-filter: blur(20px);
            padding: 18px 25px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid var(--glass-border);
        }
        .header-title { font-size: 0.95rem; font-weight: 600; letter-spacing: 3px; color: var(--premium-gold); margin: 0; }

        /* 📍 Table Status Box */
        .status-box { 
            text-align: center; padding: 25px 20px; 
            background: var(--glass); border-radius: 28px; 
            margin: 20px; border: 1px solid var(--glass-border);
        }
        .status-box h2 { margin: 0; color: var(--premium-gold); font-size: 1.4rem; font-weight: 500; }

        /* 📍 Order Card */
        .order-card {
            background: var(--glass); border: 1px solid var(--glass-border); 
            border-radius: 28px; padding: 22px; margin: 0 20px 20px;
            animation: slideUpFade 0.6s ease-out both;
        }
        .order-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;
        }

        .item-row { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.03); }
        .item-row:last-child { border-bottom: none; margin-bottom: 5px; }
        
        .item-main { display: flex; gap: 15px; align-items: flex-start; }
        .item-img { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; border: 1px solid var(--glass-border); }
        .item-info { flex: 1; }
        
        .food-name-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .food-name { font-size: 0.95rem; color: #fff; font-weight: 500; margin: 0; }
        .food-base-price { color: #fff; font-size: 0.9rem; }

        .addon-line { display: flex; justify-content: space-between; color: #777; font-size: 0.75rem; margin-top: 3px; }
        .addon-price { color: var(--premium-gold); }

        .item-total-badge { 
            text-align: right; margin-top: 12px; padding: 6px 12px; 
            background: rgba(255,255,255,0.02); border-radius: 10px;
            font-size: 0.85rem; font-weight: 600; color: #aaa;
        }

        .status-tag { font-size: 0.65rem; padding: 3px 10px; border-radius: 8px; font-weight: 600; text-transform: uppercase; }

        /* 📍 Bottom Luxury Bar - ดีไซน์ใหม่ซ้อนระดับ */
        .bottom-nav-container {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 200px;
            background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
            z-index: 2500; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-end; pointer-events: none;
        }

        /* กล่องราคารวมแบบลอยตัว (อยู่บนปุ่มรีเฟรชพอดี) */
        .total-floating-bar {
            width: 85%; background: rgba(20, 20, 22, 0.98); backdrop-filter: blur(30px);
            border: 1px solid rgba(197, 160, 89, 0.5); padding: 1px 2px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); pointer-events: auto;
            margin-bottom: 10px; /* ดันให้อยู่เหนือปุ่ม */
            animation: slideUpFade 0.8s both 0.3s;
        }
        .total-text-label { font-size: 0.65rem; color: #666; font-weight: 700; letter-spacing: 1px; }
        .total-text-amount { color: var(--premium-gold); font-weight: 700; font-size: 1.6rem; text-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }

        /* ปุ่มรีเฟรชกึ่งกลาง */
        .refresh-btn-center {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 78px; height: 78px; background: #fff; border-radius: 50%;
            border: 8px solid var(--bg-deep); color: #000; font-size: 2rem;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); cursor: pointer; z-index: 2600; 
            pointer-events: auto; transition: 0.3s;
        }
        .refresh-btn-center:active { transform: translateX(-50%) scale(0.9); }

        /* แถบเมนูปุ่มข้าง */
        .nav-actions-bar {
            width: 92%; height: 50px; background: #121214; border-radius: 34px;
            border: 1px solid var(--glass-border); display: flex;
            justify-content: space-around; align-items: center; pointer-events: auto;
            margin-bottom: 15px;
            -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 53px, black 54px);
        }

        .action-icon { display: flex; flex-direction: column; align-items: center; color: #444; cursor: pointer; transition: 0.3s; }
        .action-icon i { font-size: 1.2rem; }
        .action-icon span { font-size: 0.6rem; margin-top: 4px; font-weight: 700; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body> 
    <div class="app-wrapper">
        <header class="app-header">
            <div onclick="window.location.href='index.html'" style="cursor:pointer; color:#444;"><i class="fas fa-arrow-left"></i></div>
            <h1 class="header-title">ORDER TRACKING</h1>
            <div style="width: 20px;"></div>
        </header>

        <div class="status-box">
            <p style="color: #444; font-size: 0.65rem; text-transform: uppercase; margin-bottom: 5px; font-weight: 700; letter-spacing: 2px;">Your Table</p>
            <h2 id="tracking-table-header">...</h2>
        </div>

        <div id="items-list-container"></div>
        
        <div class="bottom-nav-container">
            <div class="total-floating-bar">
                <div class="total-text-label">GRAND TOTAL</div>
                <div class="total-text-amount">฿<span id="total-amount-display">0.00</span></div>
            </div>

            <div class="refresh-btn-center" onclick="window.location.reload()">
                <i class="fas fa-sync-alt"></i>
            </div>

            <div class="nav-actions-bar">
                <div class="action-icon" onclick="window.location.href='cart.html'">
                    <i class="fas fa-shopping-basket"></i>
                    <span>BASKET</span>
                </div>
                <div style="width: 90px;"></div>
                <div class="action-icon" onclick="window.location.href='index.html'">
                    <i class="fas fa-plus"></i>
                    <span>ADD MENU</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.firebasestorage.app", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database(); 

        function getTableNo() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('table') || localStorage.getItem('selectedTable') || '1';
        }

        function startTracking() {
            const tableNo = getTableNo();
            document.getElementById('tracking-table-header').textContent = "TABLE " + tableNo;

            db.ref('orders').orderByChild('tableNumber').equalTo(tableNo).on('value', (snapshot) => {
                const listContainer = document.getElementById('items-list-container');
                const totalDisplay = document.getElementById('total-amount-display');
                let mainHtml = ''; 
                let grandTotal = 0;

                if (snapshot.exists()) {
                    snapshot.forEach(orderChild => {
                        const order = orderChild.val();
                        let orderItemsHtml = '';
                        let statusColor = order.status === 'เสร็จสมบูรณ์' ? '#4CAF50' : '#ff9800';

                        if (order.items) {
                            order.items.forEach((item) => {
                                const finalP = parseFloat(item.finalPrice || 0);
                                grandTotal += finalP;

                                let optionsHtml = '';
                                let optionsPriceTotal = 0;

                                if (item.optionsArray && item.optionsArray.length > 0) {
                                    optionsHtml = item.optionsArray.map(opt => {
                                        const op = parseFloat(opt.price || 0);
                                        optionsPriceTotal += op;
                                        return `<div class="addon-line"><span>+ ${opt.name}</span><span class="addon-price">฿${op.toFixed(2)}</span></div>`;
                                    }).join('');
                                }

                                const baseP = finalP - optionsPriceTotal;

                                orderItemsHtml += `
                                    <div class="item-row">
                                        <div class="item-main">
                                            <img src="${item.img || ''}" class="item-img" onerror="this.src='https://via.placeholder.com/100'">
                                            <div class="item-info">
                                                <div class="food-name-line">
                                                    <span class="food-name">${item.name}</span>
                                                    <span class="food-base-price">฿${baseP.toFixed(2)}</span>
                                                </div>
                                                <div class="addon-area">${optionsHtml}</div>
                                                <div class="item-total-badge">รวมจานนี้: ฿${finalP.toFixed(2)}</div>
                                            </div>
                                        </div>
                                    </div>`;
                            });
                        }

                        mainHtml += `
                            <div class="order-card">
                                <div class="order-header">
                                    <span style="font-size: 0.75rem; color: #444; font-weight: 600;">ID: ${orderChild.key.slice(-6).toUpperCase()}</span>
                                    <span class="status-tag" style="color: ${statusColor}; border: 1px solid ${statusColor}44; padding: 3px 10px; border-radius: 8px; font-size: 0.65rem;">● ${order.status || 'รอดำเนินการ'}</span>
                                </div>
                                ${orderItemsHtml}
                            </div>`;
                    });
                    listContainer.innerHTML = mainHtml;
                    totalDisplay.textContent = grandTotal.toLocaleString('th-TH', { minimumFractionDigits: 2 });
                } else {
                    listContainer.innerHTML = "<div style='text-align:center; padding:100px 0; color: #333;'><p>ยังไม่มีรายการอาหาร</p></div>";
                    totalDisplay.textContent = "0.00";
                }
            });
        }
        document.addEventListener('DOMContentLoaded', startTracking);
    </script>
</body>
</html>
