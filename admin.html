<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าจอแอดมิน - BANGFOOD</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* 📍 กล่องสรุปจำนวนออเดอร์ */
        .order-summary-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .summary-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 15px 5px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .summary-box b {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 2px;
            font-family: 'Kanit', sans-serif;
        }

        .summary-box span {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* สีแยกตามสถานะ */
        .box-all b { color: #fff; }
        .box-pending { border-color: rgba(255, 152, 0, 0.3); }
        .box-pending b { color: #ff9800; } /* สีส้มรอทำ */
        .box-done { border-color: rgba(76, 175, 80, 0.3); }
        .box-done b { color: #4CAF50; } /* สีเขียวเสร็จแล้ว */

        /* 📍 สไตล์ Badge แจ้งเตือนบนไอคอน Dock */
        .lux-btn { position: relative; }
        .order-badge {
            position: absolute;
            top: -5px; right: -5px;
            background: #ff4444; color: white;
            font-size: 0.7rem; font-weight: bold;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #1a1a1a;
            box-shadow: 0 2px 8px rgba(255, 68, 68, 0.5);
            animation: pulse-alert 2s infinite;
        }

        @keyframes pulse-alert {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .luxury-dock-container { position: fixed; bottom: 30px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10000; pointer-events: none; }
        .luxury-dock-bar { display: flex; align-items: center; background: rgba(25, 25, 25, 0.7); backdrop-filter: blur(25px) saturate(180%); padding: 10px 30px; border-radius: 45px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); gap: 20px; pointer-events: auto; }
        .lux-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .lux-btn { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; display: flex; justify-content: center; align-items: center; margin-bottom: 4px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .lux-btn.active { background: linear-gradient(145deg, #333, #222); border: 1px solid rgba(255, 255, 255, 0.3); transform: translateY(-8px) scale(1.1); }
        .lux-home-btn { width: 65px; height: 65px; background: linear-gradient(145deg, #ff8a00, #e52d27); border-radius: 50%; border: 4px solid #f22800; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(229, 45, 39, 0.5); cursor: pointer; }
    </style>
</head>
<body onload="startAdminApp()">
    
    <header class="app-header">
        <h1 class="logo">BANGFOOD</h1>
        <div class="menu-icon" onclick="toggleDropdown()">
            <span></span><span></span><span></span>
        </div>
        <div id="myDropdown" class="dropdown-content">
            <a href="history.html">📜 ประวัติการขาย</a>
            <a href="#" onclick="logoutAdmin()" style="color: #ff4444;">🚪 ออกจากระบบ</a>
        </div>
    </header>

    <div class="order-summary-container">
        <div class="summary-box box-all">
            <b id="count-all">0</b>
            <span>ทั้งหมด</span>
        </div>
        <div class="summary-box box-pending">
            <b id="count-pending">0</b>
            <span>รอทำ</span>
        </div>
        <div class="summary-box box-done">
            <b id="count-done">0</b>
            <span>เสร็จแล้ว</span>
        </div>
    </div>

    <main style="padding-bottom: 120px;">
        <div id="pending-section" class="tab-content">
            <div class="section-title">📌 คำสั่งซื้อที่กำลังทำ</div>
            <div id="orders-list-container"></div>
        </div>

        <div id="completed-section" class="tab-content" style="display: none;">
            <div class="section-title">✅ รายการที่พร้อมเสิร์ฟ/จ่ายแล้ว</div>
            <div id="completed-orders-container"></div>
        </div>
    </main>

    <div class="luxury-dock-container">
        <div class="luxury-dock-bar">
            <div class="lux-item" onclick="switchTab('pending')">
                <button id="tab-pending" class="lux-btn active">
                    <span class="lux-icon">📝</span>
                    <span id="badge-pending" class="order-badge" style="display:none;">0</span>
                </button>
                <span class="lux-label">รอทำ</span>
            </div>

            <div class="lux-item main-item" onclick="window.location.href='admin_center.html'">
                <button class="lux-home-btn">
                    <span class="lux-home-icon">🏠</span>
                </button>
            </div>

            <div class="lux-item" onclick="switchTab('completed')">
                <button id="tab-completed" class="lux-btn">
                    <span class="lux-icon">✅</span>
                </button>
                <span class="lux-label">จ่ายแล้ว</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ",
            authDomain: "bangfood-cb30f.firebaseapp.com",
            databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bangfood-cb30f",
            storageBucket: "bangfood-cb30f.firebasestorage.app",
            messagingSenderId: "390955623784",
            appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database(); 

        function startAdminApp() {
            if (typeof loadOrdersRealtime === 'function') loadOrdersRealtime();
            updateOrderCounters();
        }

        // 📍 ฟังก์ชันนับจำนวนออเดอร์ (อัปเกรดให้รองรับภาษาไทยตามหน้าจอ image_d4ad3a)
        function updateOrderCounters() {
            db.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                let pendingCount = 0;
                let completedCount = 0;
                let totalCount = 0;

                if (data) {
                    Object.values(data).forEach(order => {
                        totalCount++;
                        
                        // 📍 เช็คสถานะตามคำที่โชว์จริงในแอปของน้า
                        // รายการที่ "รอดำเนินการ"
                        if (order.status === 'pending' || order.status === 'รอดำเนินการ') {
                            pendingCount++;
                        } 
                        // รายการที่ "เสร็จสมบูรณ์" หรือ "จ่ายแล้ว"
                        else if (order.status === 'completed' || order.status === 'เสร็จสมบูรณ์' || order.status === 'จ่ายแล้ว' || order.status === 'เสร็จสิ้น') {
                            completedCount++;
                        }
                    });
                }

                // อัปเดตตัวเลขในกล่อง Dashboard
                const allElem = document.getElementById('count-all');
                const pendingElem = document.getElementById('count-pending');
                const doneElem = document.getElementById('count-done');

                if(allElem) allElem.innerText = totalCount;
                if(pendingElem) pendingElem.innerText = pendingCount;
                if(doneElem) doneElem.innerText = completedCount;

                // อัปเดต Badge สีแดงที่ปุ่มด้านล่าง
                const badge = document.getElementById('badge-pending');
                if (badge) {
                    if (pendingCount > 0) {
                        badge.innerText = pendingCount;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            });
        }

        function logoutAdmin() {
            if (confirm("คุณต้องการออกจากระบบผู้ดูแลหรือไม่?")) {
                window.location.href = "start.html";
            }
        }
    </script>
    <script src="admin.js"></script>
</body>
</html>
