<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Access Control | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 Global UI Base */
        body { margin: 0; padding: 40px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; }
        main { max-width: 1200px; margin: 0 auto; animation: fadeInPage 0.8s ease-out; }

        /* 👑 Header Design */
        .elite-header-bar { display: flex; justify-content: space-between; align-items: center; gap: 25px; margin-bottom: 50px; flex-wrap: wrap; }
        .header-title h1 { font-size: 2.2rem; font-weight: 900; margin: 0; letter-spacing: -1px; }
        .header-title p { color: var(--premium-gold); font-size: 0.75rem; letter-spacing: 3px; font-weight: 700; margin-top: 5px; }

        /* 📊 Premium Stat Cluster */
        .stats-cluster { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-capsule {
            background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(197, 160, 89, 0.05));
            border: 1px solid var(--border); padding: 25px 40px; border-radius: 30px;
            flex: 1; backdrop-filter: blur(10px); transition: 0.4s;
        }
        .stat-capsule b { display: block; font-size: 2.5rem; color: var(--premium-gold); line-height: 1; margin-bottom: 8px; text-shadow: 0 0 15px rgba(197,160,89,0.3); }
        .stat-capsule span { font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }

        /* ➕ Button Metallic Gold */
        .btn-elite-create {
            background: linear-gradient(135deg, #d4af37, #8a6d3b); color: #000; border: none; 
            height: 65px; padding: 0 45px; border-radius: 20px; font-weight: 900; font-size: 0.85rem; 
            cursor: pointer; display: flex; align-items: center; gap: 15px; letter-spacing: 1px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2), inset 0 2px 2px rgba(255,255,255,0.4);
            white-space: nowrap;
        }
        .btn-elite-create:hover { transform: translateY(-7px) scale(1.02); box-shadow: 0 15px 30px rgba(197, 160, 89, 0.4); }

        /* 👥 User Grid Evolution */
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }
        .user-card { 
            background: rgba(128,128,128,0.03); border: 1px solid var(--border); border-radius: 40px; 
            padding: 35px; display: flex; align-items: center; justify-content: space-between; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
            backdrop-filter: blur(5px);
        }
        .user-card:hover { border-color: var(--premium-gold); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .user-card.is-active-me { border: 2px solid var(--premium-gold); background: linear-gradient(160deg, rgba(197, 160, 89, 0.08), transparent); }

        .avatar-frame { position: relative; width: 80px; height: 80px; }
        .user-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); padding: 3px; background: var(--bg); transition: 0.3s; }
        .user-card:hover .user-img { border-color: var(--premium-gold); transform: rotate(5deg); }
        
        /* วงแหวนสถานะ */
        .status-dot { position: absolute; bottom: 5px; right: 5px; width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--card-bg); z-index: 2; }
        .status-dot.online { background: #43e97b; box-shadow: 0 0 15px #43e97b; animation: pulseStatus 2s infinite; }
        .status-dot.offline { background: #555; }

        .role-tag { font-size: 0.65rem; font-weight: 900; color: var(--premium-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; display: block; }
        
        .action-btn { 
            width: 45px; height: 45px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; background: rgba(128,128,128,0.08); border: 1px solid var(--border);
        }
        .action-btn.edit-btn:hover { background: rgba(197, 160, 89, 0.15); color: var(--premium-gold); border-color: var(--premium-gold); transform: scale(1.1); }
        .action-btn.delete-btn:hover { background: rgba(255, 71, 87, 0.1); color: #ff4757; border-color: #ff4757; transform: scale(1.1); }

        /* 💎 Modal Form */
        .modal-box { background: var(--card-bg); border: 1px solid var(--premium-gold); padding: 50px; border-radius: 45px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 30px 100px rgba(0,0,0,0.5); }
        .modal-box input, .modal-box select { width: 90%; padding: 20px; margin-bottom: 18px; border-radius: 20px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; font-family: 'Kanit'; outline: none; transition: 0.3s; }
        .modal-box input:focus { border-color: var(--premium-gold); box-shadow: 0 0 20px rgba(197, 160, 89, 0.2); }

        @keyframes pulseStatus { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeAccessControl()">

    <main>
        <header class="elite-header-bar">
            <div class="header-title">
                <h1 data-lang-th="การจัดการสิทธิ์พนักงาน" data-lang-en="Access Control">การจัดการสิทธิ์พนักงาน</h1>
                <p>SYSTEM SECURITY & PERMISSIONS</p>
            </div>

            <div id="add-btn-container" style="display: none;">
                <button class="btn-elite-create" onclick="openAddModal()">
                    <i class="fas fa-plus-circle"></i> <span data-lang-th="เพิ่มสมาชิกใหม่" data-lang-en="ADD NEW MEMBER">เพิ่มสมาชิกใหม่</span>
                </button>
            </div>
        </header>

        <section class="stats-cluster">
            <div class="stat-capsule">
                <b id="total-admins">0</b>
                <span data-lang-th="พนักงานทั้งหมด" data-lang-en="Total Members">พนักงานทั้งหมด</span>
            </div>
            <div class="stat-capsule">
                <b id="online-admins" style="color: #43e97b;">0</b>
                <span data-lang-th="กำลังออนไลน์" data-lang-en="Active Now">กำลังออนไลน์</span>
            </div>
        </section>

        <div id="admin-list-container" class="user-grid"></div>
    </main>

    <div id="edit-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; backdrop-filter: blur(25px); justify-content: center; align-items: center; padding: 20px;">
        <div class="modal-box">
            <div style="position: relative; display: inline-block; margin-bottom: 30px;" onclick="document.getElementById('edit-avatar-input').click()">
                <img id="edit-avatar-preview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" style="width:130px; height:130px; border-radius:50%; border:4px solid var(--premium-gold); object-fit:cover; cursor:pointer;">
                <div style="position:absolute; bottom:5px; right:5px; background:var(--premium-gold); color:#000; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem;"><i class="fas fa-camera"></i></div>
            </div>
            <input type="file" id="edit-avatar-input" hidden accept="image/*" onchange="previewImage(this)">
            
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-username" placeholder="Username">
            <input type="text" id="edit-password" placeholder="Password">
            <select id="edit-role">
                <option value="Staff">Staff (พนักงาน)</option>
                <option value="Super Admin">Super Admin (เจ้าของร้าน)</option>
            </select>
            
            <button class="btn-elite-create" style="width:100%; justify-content:center; height:65px;" onclick="saveAdminChanges()">SAVE CHANGES</button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--sub-text); margin-top:25px; cursor:pointer; font-weight:800; letter-spacing:1px;">CANCEL</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentAdmin = sessionStorage.getItem('currentAdminName');
        const currentRole = sessionStorage.getItem('currentAdminRole') || "Staff";

        function initializeAccessControl() {
            const btnContainer = document.getElementById('add-btn-container');
            if (currentRole === 'Super Admin') btnContainer.style.display = 'block';

            if(typeof applyGlobalLanguage === 'function') applyGlobalLanguage();
            loadAdminsRealtime();
        }

        function loadAdminsRealtime() {
            db.ref('admins').on('value', adminSnap => {
                db.ref('presence').on('value', presenceSnap => {
                    renderAdmins(adminSnap.val() || {}, presenceSnap.val() || {});
                });
            });
        }

        function renderAdmins(admins, presenceData) {
            const container = document.getElementById('admin-list-container');
            container.innerHTML = '';
            let totalSessions = 0;
            const lang = localStorage.getItem(`bf_lang_${currentAdmin}`) || 'th';

            Object.keys(admins).forEach(id => {
                const admin = admins[id];
                const userSessions = presenceData[admin.username] || {};
                const isOnline = Object.keys(userSessions).length > 0;
                if (isOnline) totalSessions += Object.keys(userSessions).length;

                const isMe = (admin.username === currentAdmin);
                const canEdit = (currentRole === 'Super Admin') || isMe;
                const canDelete = (currentRole === 'Super Admin') && !isMe;

                let roleDisplay = (lang === 'th') ? (admin.role === 'Super Admin' ? 'เจ้าของร้าน' : 'พนักงาน') : admin.role;

                container.innerHTML += `
                    <div class="user-card ${isMe ? 'is-active-me' : ''}">
                        <div style="display:flex; align-items:center; gap:25px;">
                            <div class="avatar-frame">
                                <img src="${admin.profileImg || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="user-img">
                                <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            </div>
                            <div>
                                <span class="role-tag">${roleDisplay}</span>
                                <b style="font-size:1.3rem; letter-spacing:-0.5px;">${admin.username} ${isMe ? `<small style="opacity:0.5; font-size:0.7rem;">(You)</small>` : ''}</b>
                                <div style="color:${isOnline ? '#43e97b' : 'var(--sub-text)'}; font-size:0.65rem; font-weight:900; margin-top:3px; text-transform:uppercase;">
                                    ${isOnline ? 'Active Now' : 'Disconnected'}
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; gap:12px;">
                            ${canEdit ? `<div class="action-btn edit-btn" onclick='openEditModal("${id}", ${JSON.stringify(admin)})'><i class="fas fa-pen"></i></div>` : ''}
                            ${canDelete ? `<div class="action-btn delete-btn" onclick="deleteAdmin('${id}')"><i class="fas fa-trash"></i></div>` : ''}
                        </div>
                    </div>`;
            });
            document.getElementById('total-admins').innerText = Object.keys(admins).length;
            document.getElementById('online-admins').innerText = totalSessions;
        }

        function saveAdminChanges() {
            const id = document.getElementById('edit-id').value;
            const data = { 
                username: document.getElementById('edit-username').value.trim(), 
                password: document.getElementById('edit-password').value.trim(), 
                role: document.getElementById('edit-role').value,
                profileImg: document.getElementById('edit-avatar-preview').src 
            };

            if (!data.username || !data.password) return alert("กรุณากรอกข้อมูลให้ครบครับน้า");

            if (id) {
                db.ref('admins/' + id).update(data).then(closeModal).catch(err => alert(err.message));
            } else {
                data.createdAt = firebase.database.ServerValue.TIMESTAMP;
                db.ref('admins').push(data).then(closeModal).catch(err => alert(err.message));
            }
        }

        function openAddModal() {
            document.getElementById('edit-id').value = "";
            document.getElementById('edit-username').value = "";
            document.getElementById('edit-password').value = "";
            document.getElementById('edit-role').value = "Staff";
            document.getElementById('edit-avatar-preview').src = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openEditModal(id, admin) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = admin.username;
            document.getElementById('edit-password').value = admin.password;
            document.getElementById('edit-role').value = admin.role;
            document.getElementById('edit-role').disabled = (currentRole !== 'Super Admin');
            document.getElementById('edit-avatar-preview').src = admin.profileImg || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function deleteAdmin(id) {
            if (confirm("น้าจะลบพนักงานคนนี้จริงเหรอครับ? ข้อมูลจะหายถาวรเลยนะ")) {
                db.ref('admins/' + id).remove();
            }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('edit-avatar-preview').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
