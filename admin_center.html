<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Center | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --glass-soft: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
            
            /* 📍 ชุดสีไล่เฉดแบบพรีเมียม */
            --grad-admin: linear-gradient(135deg, #c5a059, #8e6d31);
            --grad-order: linear-gradient(135deg, #4facfe, #00f2fe);
            --grad-history: linear-gradient(135deg, #43e97b, #38f9d7);
            --grad-trend: linear-gradient(135deg, #f9d423, #ff4e50);
            --grad-product: linear-gradient(135deg, #f093fb, #f5576c);
            --grad-revenue: linear-gradient(135deg, #667eea, #764ba2);
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #222 0%, #0a0a0a 80%);
            min-height: 100vh;
        }

        .admin-header {
            position: sticky; top: 0; z-index: 2000;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(25px);
            padding: 25px; text-align: center;
            border-bottom: 1px solid var(--border-dim);
            animation: fadeInDown 0.8s ease-out;
        }
        .admin-header h1 { 
            font-size: 1rem; letter-spacing: 5px; margin: 0; font-weight: 500; 
            text-transform: uppercase; color: #fff;
        }

        .container { padding: 30px 20px 120px; max-width: 450px; margin: 0 auto; }
        .admin-menu-list { display: flex; flex-direction: column; gap: 18px; }

        /* 📋 Menu Card - ปรับแต่งให้ยุบเฉพาะเนื้อหาภายใน */
        .menu-card {
            display: flex; align-items: center;
            background: var(--glass-soft);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-dim);
            padding: 24px 25px; border-radius: 30px;
            text-decoration: none; color: white;
            opacity: 0; transform: translateY(30px);
            animation: slideUpPop 0.6s forwards;
            position: relative; overflow: hidden;
            
            /* 📍 การตั้งค่าสีขอบให้คงที่ */
            transition: border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* 📍 ส่วนที่ทำให้ปุ่ม "ยุบลง" แต่แสงสียังเด่น */
        .menu-card:active {
            transform: scale(0.94); /* ตัวกล่องยุบลง */
            filter: brightness(1.2); /* เพิ่มความสว่างของสี */
        }

        /* 📍 กำหนดความหนาของขอบแยกตามประเภท (สีจะไม่ยุบหายไป) */
        .btn-admin { border-left: 6px solid #c5a059; }
        .btn-order { border-left: 6px solid #4facfe; }
        .btn-history { border-left: 6px solid #43e97b; }
        .btn-trend { border-left: 6px solid #f9d423; }
        .btn-product { border-left: 6px solid #f093fb; }
        .btn-revenue { border-left: 6px solid #667eea; }

        /* การไล่เฉดสีที่ไอคอน */
        .btn-admin .menu-icon i { background: var(--grad-admin); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-order .menu-icon i { background: var(--grad-order); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-history .menu-icon i { background: var(--grad-history); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-trend .menu-icon i { background: var(--grad-trend); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-product .menu-icon i { background: var(--grad-product); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-revenue .menu-icon i { background: var(--grad-revenue); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* การโผล่แบบไล่ลำดับ */
        .menu-card:nth-child(1) { animation-delay: 0.1s; }
        .menu-card:nth-child(2) { animation-delay: 0.2s; }
        .menu-card:nth-child(3) { animation-delay: 0.3s; }
        .menu-card:nth-child(4) { animation-delay: 0.4s; }
        .menu-card:nth-child(5) { animation-delay: 0.5s; }
        .menu-card:nth-child(6) { animation-delay: 0.6s; }

        .menu-icon { font-size: 1.5rem; margin-right: 22px; width: 40px; display: flex; justify-content: center; }
        .menu-info { flex: 1; }
        .menu-info b { display: block; font-size: 1.05rem; font-weight: 500; margin-bottom: 4px; letter-spacing: 0.5px; }
        .menu-info small { color: #555; font-size: 0.75rem; letter-spacing: 0.5px; }

        .bottom-nav-logout {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(25px);
            padding: 25px 0; border-top: 1px solid var(--border-dim);
            display: flex; justify-content: center; z-index: 2000;
        }
        .exit-btn {
            color: #ff4444; font-size: 0.75rem; letter-spacing: 4px; font-weight: 500;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }

        @keyframes slideUpPop {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>Admin Control</h1>
    </header>

    <div class="container">
        <div class="admin-menu-list">
            
            <a href="admin.html" class="menu-card btn-order">
                <div class="menu-icon"><i class="fas fa-receipt"></i></div>
                <div class="menu-info">
                    <b>จัดการคำสั่งซื้อ</b>
                    <small>ออเดอร์และการทำอาหาร</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>

            <a href="history.html" class="menu-card btn-history">
                <div class="menu-icon"><i class="fas fa-clock-rotate-left"></i></div>
                <div class="menu-info">
                    <b>ประวัติการสั่งซื้อ</b>
                    <small>ตรวจสอบบิลย้อนหลัง</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>

            <a href="admin_users.html" class="menu-card btn-admin">
                <div class="menu-icon"><i class="fas fa-user-shield"></i></div>
                <div class="menu-info">
                    <b>จัดการแอดมิน</b>
                    <small>การเข้าถึงและความปลอดภัย</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>

            <a href="trending.html" class="menu-card btn-trend">
                <div class="menu-icon"><i class="fas fa-chart-line"></i></div>
                <div class="menu-info">
                    <b>อันดับเมนูยอดฮิต</b>
                    <small>เมนูขายดีประจำสัปดาห์</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>

            <a href="edit_products.html" class="menu-card btn-product">
                <div class="menu-icon"><i class="fas fa-box-open"></i></div>
                <div class="menu-info">
                    <b>จัดการรายการอาหาร</b>
                    <small>ปรับแต่งเมนูและราคา</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>
            
            <a href="revenue_report.html" class="menu-card btn-revenue">
                <div class="menu-icon"><i class="fas fa-wallet"></i></div>
                <div class="menu-info">
                    <b>ข้อมูลรายได้สรุป</b>
                    <small>สถิติและยอดขายทั้งหมด</small>
                </div>
                <i class="fas fa-chevron-right" style="opacity:0.05; font-size:0.8rem;"></i>
            </a>

        </div>
    </div>

    <div class="bottom-nav-logout">
        <div onclick="logoutAdmin()" class="exit-btn">
            <i class="fas fa-sign-out-alt"></i> Sign Out
        </div>
    </div>

<script>
    function checkLoginStatus() {
        const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
        if (isLoggedIn !== 'true') { window.location.href = "start.html"; }
    }

    function logoutAdmin() {
        if(confirm("ยืนยันการออกจากระบบ?")) {
            sessionStorage.removeItem('isAdminLoggedIn');
            sessionStorage.removeItem('currentAdminName');
            window.location.href = "start.html";
        }
    }
    window.onload = checkLoginStatus;
</script>
</body>
</html>
