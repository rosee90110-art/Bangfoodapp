<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Hub | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <style>
        /* 📍 Global UI Base */
        body { margin: 0; padding: 0; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; display: flex; align-items: center; justify-content: center; }
        .dashboard-container { width: 100%; max-width: 1000px; padding: 40px; display: flex; flex-direction: column; gap: 40px; animation: fadeIn 0.8s ease; }

        /* 👑 Premium Header */
        header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 30px; }
        header h1 { font-size: 2.2rem; font-weight: 900; margin: 0; letter-spacing: -1px; }
        header p { color: var(--sub-text); font-size: 0.8rem; margin: 8px 0 0; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

        /* 📊 Large Stat Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .stat-card { 
            background: linear-gradient(145deg, var(--card-bg), rgba(197, 160, 89, 0.03));
            border: 1px solid var(--border); padding: 40px; border-radius: 45px;
            display: flex; align-items: center; gap: 30px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* ✨ Light Theme Styling */
        body.light-theme .stat-card { background: #ffffff; box-shadow: 0 15px 40px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.05); }
        body.light-theme .stat-icon { background: rgba(197, 160, 89, 0.15); color: #8e6d2f; }

        .stat-card:hover { transform: translateY(-10px); border-color: var(--premium-gold); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .stat-icon { width: 75px; height: 75px; border-radius: 25px; background: rgba(197, 160, 89, 0.1); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--premium-gold); }
        .stat-info span { font-size: 0.75rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; display: block; margin-bottom: 6px; }
        .stat-info b { font-size: 2.5rem; font-weight: 900; color: var(--text); line-height: 1; letter-spacing: -1px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeDashboard()">

    <div class="dashboard-container">
        <header>
            <h1 data-lang-th="ศูนย์ควบคุมบริหาร" data-lang-en="Executive Hub">ศูนย์ควบคุมบริหาร</h1>
            <p data-lang-th="ภาพรวมประสิทธิภาพร้านวันนี้" data-lang-en="Snapshot Performance Today">ภาพรวมประสิทธิภาพร้านวันนี้</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-coins"></i></div>
                <div class="stat-info">
                    <span data-lang-th="รายได้รวมวันนี้" data-lang-en="Revenue Today">รายได้รวมวันนี้</span>
                    <b id="dash-revenue">฿0</b>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-info">
                    <span data-lang-th="ออเดอร์รอเริ่มทำ" data-lang-en="Pending Orders">ออเดอร์รอเริ่มทำ</span>
                    <b id="dash-orders-count">0</b>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color:#43e97b;"><i class="fas fa-broadcast-tower"></i></div>
                <div class="stat-info">
                    <span data-lang-th="พนักงานที่ออนไลน์" data-lang-en="Active Staff">พนักงานที่ออนไลน์</span>
                    <b id="dash-online-count" style="color:#43e97b;">0</b>
                </div>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 20px;">
            <div id="live-time" style="font-size: 1rem; font-weight: 800; color: var(--premium-gold); opacity: 0.8;">00:00:00</div>
            <p style="font-size: 0.6rem; opacity: 0.3; letter-spacing: 2px; margin-top: 10px;" data-lang-th="ระบบวิเคราะห์ข้อมูลปลอดภัย" data-lang-en="SECURE ANALYTICS CONNECTION">ระบบวิเคราะห์ข้อมูลปลอดภัย</p>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initializeDashboard() {
            // ดึงธีมและภาษามาใช้ทันที
            const user = sessionStorage.getItem('currentAdminName');
            if (user) {
                const theme = localStorage.getItem(`bf_theme_${user}`) || 'dark';
                document.body.classList.toggle('light-theme', theme === 'light');
            }
            
            // เรียกใช้ฟังก์ชันเปลี่ยนภาษาจาก admin_script.js
            if (window.applyGlobalLanguage) applyGlobalLanguage();

            // นาฬิกาแบบไทย/สากล
            setInterval(() => {
                document.getElementById('live-time').innerText = new Date().toLocaleTimeString('th-TH');
            }, 1000);

            loadData();
        }

        function loadData() {
            const today = new Date().toDateString();
            
            db.ref().on('value', snap => {
                const data = snap.val() || {};
                let totalRevenue = 0;
                let pendingCount = 0;

                // 1. กรองออเดอร์ที่ "รอดำเนินการ" และบวกยอดเงิน
                if (data.orders) {
                    Object.values(data.orders).forEach(o => {
                        if (o.status === 'รอดำเนินการ') pendingCount++;
                        const d = new Date(o.timestamp);
                        if(d.toDateString() === today) totalRevenue += parseFloat(o.total || 0);
                    });
                }

                // 2. บวกยอดเงินจากประวัติที่จบแล้ว
                if (data.history) {
                    Object.values(data.history).forEach(o => {
                        const d = new Date(o.archivedAt || o.timestamp);
                        if(d.toDateString() === today) totalRevenue += parseFloat(o.total || 0);
                    });
                }

                document.getElementById('dash-revenue').innerText = "฿" + totalRevenue.toLocaleString();
                document.getElementById('dash-orders-count').innerText = pendingCount;
            });

            // ดึงคนออนไลน์
            db.ref('presence').on('value', s => {
                let online = 0;
                if(s.exists()) Object.values(s.val()).forEach(ss => online += Object.keys(ss).length);
                document.getElementById('dash-online-count').innerText = online;
            });
        }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
