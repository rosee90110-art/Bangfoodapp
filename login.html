<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #c5a059;
            --bg-deep: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
            --text-muted: #666;
        }

        body {
            background-color: var(--bg-deep);
            color: white;
            font-family: 'Kanit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, #222 0%, #0a0a0a 80%);
        }

        .login-card {
            background: var(--glass);
            padding: 50px 30px;
            border-radius: 40px;
            border: 1px solid var(--border-dim);
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: cardEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .logo-icon {
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(197, 160, 89, 0.2));
        }

        h2 { 
            margin-bottom: 35px; 
            font-size: 1.4rem;
            letter-spacing: 5px; 
            font-weight: 500; 
            color: #fff;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 18px 25px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.4s;
        }

        input:focus {
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.15);
        }

        button {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            border: none;
            background: var(--primary-gold);
            color: #000;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 20px;
        }

        button:active { transform: scale(0.95); }

        .cancel-btn {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 35px;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .cancel-btn:hover { color: #fff; }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fas fa-user-shield logo-icon"></i>
        <h2>Admin Login</h2>

        <div class="input-group">
            <input type="text" id="user" placeholder="ชื่อผู้ใช้">
        </div>
        <div class="input-group">
            <input type="password" id="pass" placeholder="รหัสผ่าน">
        </div>

        <button onclick="handleLogin()">เข้าสู่ระบบ</button>
        
        <a href="admin_center.html" class="cancel-btn">ยกเลิก</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 📍 2. ตั้งค่า Firebase (ใช้ Config ชุดเดิมของน้า)
        const firebaseConfig = { 
            apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
            authDomain: "bangfood-cb30f.firebaseapp.com", 
            databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "bangfood-cb30f", 
            storageBucket: "bangfood-cb30f.appspot.com", 
            messagingSenderId: "390955623784", 
            appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 📍 3. ฟังก์ชันล็อกอินแบบเช็คผ่าน Firebase
        function handleLogin() {
            const userInput = document.getElementById('user').value.trim();
            const passInput = document.getElementById('pass').value;

            if (!userInput || !passInput) return alert("กรุณากรอกข้อมูลให้ครบครับน้า!");

            // ดึงข้อมูลแอดมินทั้งหมดจาก Firebase มาเทียบ
            db.ref('admins').once('value', snap => {
                let authenticated = false;
                
                if (snap.exists()) {
                    const admins = snap.val();
                    for (let id in admins) {
                        if (admins[id].username === userInput && admins[id].password === passInput) {
                            authenticated = true;
                            break;
                        }
                    }
                }

                // ตรวจสอบ (ให้สิทธิ์รหัสหลัก admin/bang ด้วย)
                if (authenticated || (userInput === "admin" && passInput === "bang")) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('currentAdminName', userInput);
                    alert("ยินดีต้อนรับครับน้า!");
                    window.location.href = "admin_center.html";
                } else {
                    alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้องครับน้า!");
                }
            });
        }
    </script>
</body>
</html>
