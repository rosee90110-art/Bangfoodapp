<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 Layout Setup */
        body { margin: 0; padding: 25px; min-height: 100vh; background-color: var(--bg); transition: 0.5s; overflow-x: hidden; }
        body::-webkit-scrollbar { display: none; }

        /* 📊 Dashboard Stats with Glow */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: var(--card-bg); border: 1px solid var(--border); padding: 25px; 
            border-radius: 35px; text-align: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-8px); border-color: var(--premium-gold); }
        .stat-label { font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; display: block; font-weight: 800; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--text); letter-spacing: -1px; }

        /* 🔍 Sophisticated Filter Section */
        .filter-section { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px; 
            padding: 20px 25px; margin-bottom: 35px; box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: fadeInDown 0.6s ease-out;
        }
        .filter-row { 
            display: flex; flex-wrap: wrap; gap: 50px; align-items: flex-end; justify-content: center;
        }
        .filter-group { flex: 1; min-width: 160px; }
        .filter-group label { 
            font-size: 0.65rem; color: var(--premium-gold); font-weight: 800; 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px;
            display: flex; align-items: center; gap: 6px;
        }
        
        .filter-group input {
            background: rgba(128,128,128,0.08); border: 1px solid var(--border);
            border-radius: 15px; color: var(--text); padding: 12px 15px;
            font-size: 0.9rem; width: 100%; transition: 0.3s;
        }
        .filter-group input:focus { border-color: var(--premium-gold); background: rgba(197, 160, 89, 0.05); box-shadow: 0 0 15px var(--gold-glow); }

        .btn-search { 
            background: var(--premium-gold); color: #000; border: none; padding: 12px 30px; 
            border-radius: 15px; font-weight: 900; cursor: pointer; height: 46px;
            transition: 0.3s; font-size: 0.85rem; letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 15px rgba(197, 160, 89, 0.15);
        }
        .btn-search:hover { transform: scale(1.05); box-shadow: 0 12px 25px var(--gold-glow); }

        /* 📜 Order Cards List */
        .order-card { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px; 
            margin-bottom: 15px; cursor: pointer; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            overflow: hidden; animation: slideUpFade 0.5s ease-out both;
        }
        .order-card:hover { border-color: var(--premium-gold); background: rgba(128,128,128,0.05); }

        .card-collapsed-part { padding: 22px 30px; display: flex; justify-content: space-between; align-items: center; }
        .station-tag { background: var(--premium-gold); color: #000; padding: 5px 16px; border-radius: 12px; font-size: 0.75rem; font-weight: 900; }
        .order-id-label { font-family: 'Courier New', monospace; color: var(--premium-gold); font-weight: 700; margin-left: 10px; opacity: 0.8; }
        .total-brief { font-size: 1.4rem; color: var(--text); font-weight: 800; }

        .card-expanded-part {
            max-height: 0; padding: 0 30px; background: rgba(0,0,0,0.1);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0;
        }
        .order-card.active .card-expanded-part { max-height: 1200px; padding: 25px 30px; opacity: 1; border-top: 1px solid var(--border); }

        .item-row { padding: 10px 0; border-bottom: 1px solid var(--border); transition: 0.3s; }
        .item-row:last-child { border-bottom: none; }
        .food-line { display: flex; justify-content: space-between; color: var(--text); font-weight: 600; font-size: 1rem; }
        .addon-item { font-size: 0.8rem; color: var(--sub-text); margin-top: 5px; padding-left: 15px; display: flex; justify-content: space-between; }

        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        .btn-action { flex: 1; border: none; padding: 14px; border-radius: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-print { background: rgba(128,128,128,0.1); color: var(--text); border: 1px solid var(--border); }
        .btn-del { background: rgba(255, 71, 87, 0.08); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.2); }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* ========================================================== */
        /* 🖨️ โค้ดปรับปรุงใหม่: เปลี่ยนเป็นรูปแบบ "ใบเสร็จสลิป" (Receipt Style) */
        /* ========================================================== */
        @media print {
            /* ซ่อนทุกอย่างยกเว้นบิลที่จะพิมพ์ */
            body * { visibility: hidden; background: white !important; }
            #history-list .order-card.active, 
            #history-list .order-card.active * { visibility: visible; }

            /* ปรับแต่งตำแหน่งและขนาดกระดาษ (ให้เหมือนสลิป 80mm หรือ 58mm) */
            #history-list .order-card.active {
                position: absolute;
                left: 0;
                top: 0;
                width: 300px; /* ขนาดหน้ากว้างสลิปโดยประมาณ */
                border: none !important;
                box-shadow: none !important;
                padding: 10px !important;
                margin: 0 !important;
                background: white !important;
                font-family: 'Courier New', Courier, monospace; /* ใช้ฟอนต์แนวเครื่องพิมใบเสร็จ */
                color: black !important;
            }

            /* จัดการหัวข้อสลิป */
            .card-collapsed-part {
                flex-direction: column !important;
                align-items: flex-start !important;
                padding: 10px 0 !important;
                border-bottom: 2px dashed #000 !important;
            }

            .station-tag { 
                background: none !important; 
                border: none !important; 
                font-size: 1.2rem !important; 
                padding: 0 !important; 
                font-weight: bold !important;
            }
            
            .order-id-label { margin: 5px 0 !important; display: block; font-size: 0.8rem !important; }

            /* รายการอาหาร */
            .card-expanded-part { 
                padding: 10px 0 !important; 
                opacity: 1 !important; 
                max-height: none !important; 
            }

            .item-row { border-bottom: 1px dashed #ccc !important; padding: 5px 0 !important; }
            .food-line span, .food-line b { color: black !important; font-size: 0.9rem !important; }

            /* ยอดรวมท้ายสลิป */
            .total-brief {
                display: block !important;
                text-align: right !important;
                font-size: 1.5rem !important;
                border-top: 2px solid #000 !important;
                margin-top: 10px !important;
                padding-top: 5px !important;
            }

            /* ซ่อนสิ่งที่ไม่จำเป็นบนใบเสร็จ */
            .btn-group, .filter-section, .stats-grid, .btn-action { display: none !important; }
            
            /* เพิ่มข้อความขอบคุณท้ายสลิป (ถ้าต้องการ) */
            #history-list .order-card.active::after {
                content: "--- THANK YOU ---";
                display: block;
                text-align: center;
                margin-top: 20px;
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body onload="initializeHistory()">

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">บิลทั้งหมด</span>
            <span id="total-bills" class="stat-value">0</span>
        </div>
        <div class="stat-card" style="border-bottom: 5px solid #2ecc71;">
            <span class="stat-label">รายได้รวม</span>
            <span class="stat-value">฿<span id="total-revenue">0.00</span></span>
        </div>
    </div>

    <section class="filter-section">
        <div class="filter-row">
            <div class="filter-group">
                <label><i class="far fa-calendar-alt"></i> วันที่ตรวจสอบ</label>
                <input type="date" id="search-date">
            </div>
            <div class="filter-group">
                <label><i class="far fa-clock"></i> เวลาเริ่ม</label>
                <input type="time" id="start-time" value="00:00">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-history"></i> เวลาสิ้นสุด</label>
                <input type="time" id="end-time" value="23:59">
            </div>
            <div class="filter-group" style="flex: 0.5;">
                <button onclick="filterHistoryByDateTime()" class="btn-search">
                    <i class="fas fa-search"></i> ค้นหาบิล
                </button>
            </div>
        </div>
    </section>

    <div id="history-list">
        </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.firebasestorage.app", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allHistoryData = [];

    function applySharedTheme() {
        const theme = localStorage.getItem('theme') || 'dark';
        document.body.classList.toggle('light-theme', theme === 'light');
    }
    applySharedTheme();

    function initializeHistory() { loadHistoryRealtime(); }

    function loadHistoryRealtime() {
        db.ref('history').on('value', (snapshot) => {
            allHistoryData = [];
            if (snapshot.exists()) {
                snapshot.forEach((child) => { allHistoryData.push({ id: child.key, ...child.val() }); });
            }
            renderHistory(allHistoryData);
        });
    }

    function toggleCard(element) {
        const isActive = element.classList.contains('active');
        document.querySelectorAll('.order-card').forEach(c => c.classList.remove('active'));
        if(!isActive) element.classList.add('active');
    }

    function printReceipt(btn) {
        const card = btn.closest('.order-card');
        document.querySelectorAll('.order-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        
        // หน่วงเวลาให้ UI อัปเดตก่อนสั่งพิมพ์
        setTimeout(() => {
            window.print();
        }, 250);
    }

    function renderHistory(data) {
        const list = document.getElementById('history-list');
        const billsEl = document.getElementById('total-bills');
        const revEl = document.getElementById('total-revenue');
        let html = ''; let totalSum = 0;
        data.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));

        data.forEach((order, index) => {
            totalSum += parseFloat(order.total || 0);
            const shortId = order.id.substring(order.id.length - 6).toUpperCase();
            
            // 📍 ส่วนที่ปรับปรุง: วนลูปรายการอาหารและท็อปปิ้งพร้อมแสดงจำนวน xN
            let itemsHtml = order.items ? order.items.map(item => {
                let optionsHtml = '';
                let optionsPriceTotal = 0;

                if (item.optionsArray) {
                    optionsHtml = item.optionsArray.map(opt => {
                        const optPrice = parseFloat(opt.price || 0);
                        const optQty = parseInt(opt.qty || 1); // ดึงจำนวน x2, x3
                        const totalPerOpt = optPrice * optQty;
                        optionsPriceTotal += totalPerOpt;

                        return `
                            <div class="addon-item" style="display: flex; justify-content: space-between; width: 100%;">
                                <span>+ ${opt.name} <b style="color:var(--premium-gold); margin-left:4px;">x${optQty}</b></span>
                                <span>฿${totalPerOpt.toFixed(2)}</span>
                            </div>`;
                    }).join('');
                }

                // คำนวณราคาอาหารหลัก (ราคาเต็ม - ราคาท็อปปิ้งรวม)
                const finalP = parseFloat(item.finalPrice || 0);
                const baseP = finalP - optionsPriceTotal;

                return `
                <div class="item-row">
                    <div class="food-line">
                        <span>${item.quantity || 1}x ${item.name}</span>
                        <b>฿${baseP.toFixed(2)}</b>
                    </div>
                    <div class="addon-area" style="padding-left: 10px; border-left: 1px dashed var(--border); margin-top: 5px;">
                        ${optionsHtml}
                    </div>
                </div>`;
            }).join('') : '';

            html += `
                <div class="order-card" onclick="toggleCard(this)">
                    <div class="card-collapsed-part">
                        <div>
                            <span class="station-tag">โต๊ะ ${order.tableNumber || '?'}</span>
                            <span class="order-id-label">#${shortId}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:20px;">
                            <span style="font-size:0.85rem; color:var(--sub-text);">🕒 ${new Date(order.archivedAt).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</span>
                            <b class="total-brief">฿${parseFloat(order.total).toLocaleString()}</b>
                        </div>
                    </div>
                    <div class="card-expanded-part">
                        <div style="font-size:0.7rem; color:var(--premium-gold); margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">
                            ID: ${order.id} | วันที่: ${new Date(order.archivedAt).toLocaleString('th-TH')}
                        </div>
                        <div class="items-area">${itemsHtml}</div>
                        <div class="btn-group">
                            <button onclick="event.stopPropagation(); printReceipt(this)" class="btn-action btn-print">
                                <i class="fas fa-print"></i> พิมพ์ใบเสร็จ
                            </button>
                            <button onclick="event.stopPropagation(); deleteEntry('${order.id}')" class="btn-action btn-del">
                                <i class="fas fa-trash-alt"></i> ลบข้อมูล
                            </button>
                        </div>
                    </div>
                </div>`;
        });
        list.innerHTML = data.length ? html : '<div style="text-align:center; padding:100px; color:var(--sub-text);">ไม่พบข้อมูลประวัติการขาย</div>';
        billsEl.textContent = data.length;
        revEl.textContent = totalSum.toLocaleString('th-TH', { minimumFractionDigits: 2 });
    }

    function filterHistoryByDateTime() {
        const searchDate = document.getElementById('search-date').value;
        const startTime = document.getElementById('start-time').value;
        const endTime = document.getElementById('end-time').value;
        if (!searchDate) return alert("กรุณาเลือกวันที่ก่อนครับ!");
        const filtered = allHistoryData.filter(order => {
            const d = new Date(order.archivedAt);
            const dateStr = d.toISOString().split('T')[0];
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return dateStr === searchDate && timeStr >= startTime && timeStr <= endTime;
        });
        renderHistory(filtered);
    }

    window.deleteEntry = (id) => confirm("ลบรายการนี้ถาวรเลยนะ?") && db.ref(`history/${id}`).remove();
</script>
</body>
</html>
