<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Menu | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        * { box-sizing: border-box; }
        body::-webkit-scrollbar { display: none; }
        body { margin: 0; padding: 30px; min-height: 100vh; scrollbar-width: none; -ms-overflow-style: none; }
        .admin-wrapper { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 1400px; margin: 0 auto; }
        @media (min-width: 1100px) { .admin-wrapper { grid-template-columns: 400px 1fr; align-items: start; } }
        .left-editor-pane { padding: 30px; border-radius: 40px; position: sticky; top: 30px; }
        .config-section { background: rgba(128, 128, 128, 0.05); border: 1px solid var(--border); border-radius: 25px; padding: 20px; margin-bottom: 20px; }
        .section-header { font-size: 0.75rem; color: var(--premium-gold); text-transform: uppercase; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .upload-box { width: 100%; height: 180px; background: rgba(128,128,128,0.05); border: 2px dashed var(--border); border-radius: 25px; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; transition: 0.3s; }
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; background: rgba(128,128,128,0.05); border: 1px solid var(--border); border-radius: 15px; color: var(--text); font-family: inherit; font-size: 0.9rem; }
        .add-row-btn { width: 100%; padding: 12px; background: rgba(197, 160, 89, 0.05); border: 1.5px dashed var(--premium-gold); color: var(--premium-gold); border-radius: 15px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; font-weight: 700; margin-top: 10px; }
        .btn-submit { width: 100%; padding: 18px; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 0.95rem; }
        .stats-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-dot { padding: 20px 10px; border-radius: 25px; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { display: flex; flex-direction: column; background: var(--card-bg); border-radius: 35px; border: 1px solid var(--border); overflow: hidden; transition: 0.3s; position: relative; }
        .p-thumb-wrapper { width: 100%; height: 180px; overflow: hidden; }
        .p-thumb { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .product-card:hover .p-thumb { transform: scale(1.1); }
        .p-info { padding: 20px; flex: 1; cursor: pointer; }
        .p-info b { display: block; font-size: 1.1rem; color: var(--text); margin-bottom: 5px; }
        .p-info span { font-size: 1rem; color: var(--premium-gold); font-weight: 700; }
        .card-actions { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 20px 20px; }
        .toggle-status { padding: 8px 18px; border-radius: 12px; font-size: 0.65rem; font-weight: 800; border: none; cursor: pointer; }
        .in-stock { background: rgba(39, 174, 96, 0.15); color: #27ae60; }
        .out-stock { background: rgba(231, 76, 60, 0.15); color: #e74c3c; }
        .btn-del-circle { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .option-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; background: rgba(0,0,0,0.1); padding: 8px; border-radius: 12px; border: 1px solid var(--border); }
    </style>
</head>
<body onload="initializeMenu()">

<div class="admin-wrapper">
    <aside class="left-editor-pane stat-card">
        <div style="font-size: 0.9rem; color: var(--premium-gold); letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; font-weight: 800; display: flex; align-items: center; gap: 10px;">
            <i class="fas fa-magic"></i> <span data-lang-en="Menu Configurator" data-lang-th="จัดการข้อมูลเมนู">Menu Configurator</span>
        </div>
        
        <div class="editor-body">
            <input type="hidden" id="edit-id">
            <div class="config-section">
                <div class="section-header"><i class="fas fa-image"></i> <span data-lang-en="Picture" data-lang-th="รูปภาพเมนู">รูปภาพเมนู</span></div>
                <div class="upload-box" onclick="document.getElementById('file-input').click()">
                    <img id="p-img-preview" src="" style="display:none; width: 100%; height: 100%; object-fit: cover;">
                    <div id="upload-hint" style="color:var(--sub-text); font-size:0.7rem; text-align:center;">
                        <i class="fas fa-cloud-upload-alt" style="font-size:2.2rem; display:block; margin-bottom:10px; color:var(--premium-gold);"></i> 
                        <span data-lang-en="UPLOAD IMAGE" data-lang-th="อัปโหลดรูปภาพ">UPLOAD IMAGE</span>
                    </div>
                    <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFileUpload(this)">
                    <input type="hidden" id="p-img">
                </div>
            </div>

            <div class="config-section">
                <div class="section-header"><i class="fas fa-pen"></i> <span data-lang-en="Basic Info" data-lang-th="ข้อมูลพื้นฐาน">ข้อมูลพื้นฐาน</span></div>
                <input type="text" id="p-name" placeholder="ชื่อเมนูอาหาร (ไทย)">
                <input type="text" id="p-name-en" placeholder="ชื่อเมนูอาหาร (English Name)">
                <input type="number" id="p-price" placeholder="ราคาเริ่มต้น (฿)">
                <select id="p-category" style="margin-bottom:0;">
                    <option value="อาหาร">อาหารจานเดียว</option>
                    <option value="ก๋วยเตี๋ยว">ก๋วยเตี๋ยว/เส้น</option>
                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                </select>
            </div>
            
            <div class="config-section">
                <div class="section-header"><i class="fas fa-layer-group"></i> <span data-lang-en="Sizes" data-lang-th="ตัวเลือกเสริม/ขนาด">ตัวเลือกเสริม/ขนาด</span></div>
                <div id="sizes-container"></div>
                <button class="add-row-btn" onclick="addOptionRow('sizes')">+ เพิ่มขนาด/ตัวเลือก</button>
            </div>

            <div class="config-section">
                <div class="section-header"><i class="fas fa-plus"></i> <span data-lang-en="Toppings" data-lang-th="ท็อปปิ้งเสริม">ท็อปปิ้งเสริม</span></div>
                <div id="addons-container"></div>
                <button class="add-row-btn" onclick="addOptionRow('addons')">+ เพิ่มท็อปปิ้ง</button>
            </div>

            <button id="btn-save" class="btn-submit" style="background:#27ae60; color:#fff;" onclick="saveData()">SAVE MENU ITEM</button>
            <button id="btn-cancel" style="display:none; width:100%; background:none; border:none; color:#e74c3c; margin-top:15px; font-size:0.85rem; cursor:pointer; font-weight:700; text-decoration:underline;" onclick="resetForm()">DISCARD CHANGES</button>
        </div>
    </aside>

    <section class="right-inventory-pane">
        <div class="stats-mini">
            <div class="stat-dot stat-card"><b id="count-food">0</b><br><small>Food</small></div>
            <div class="stat-dot stat-card"><b id="count-noodle" style="color:#2196F3;">0</b><br><small>Noodle</small></div>
            <div class="stat-dot stat-card"><b id="count-drink" style="color:#e91e63;">0</b><br><small>Drink</small></div>
        </div>

        <div class="search-area">
            <input type="text" id="menu-search" placeholder="🔍 ค้นหาเมนูเพื่อแก้ไข..." oninput="filterMenu()" style="border-radius:25px; padding-left:25px;">
        </div>
        <div id="product-list" class="menu-grid"></div>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function initializeMenu() { loadProducts(); }

    function handleFileUpload(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('p-img').value = e.target.result;
                const preview = document.getElementById('p-img-preview');
                preview.src = e.target.result; preview.style.display = 'block';
                document.getElementById('upload-hint').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    }

    function addOptionRow(type, name="", price="0", available=true) {
        const container = document.getElementById(`${type}-container`);
        const div = document.createElement('div');
        div.className = 'option-row';
        div.innerHTML = `
            <input type="checkbox" ${available?'checked':''} style="width:20px; height:20px; margin:0;"> 
            <input type="text" placeholder="ชื่อ" value="${name}" style="flex:2; margin-bottom:0; padding:8px; border-radius:10px;"> 
            <input type="number" placeholder="฿" value="${price}" style="flex:1; margin-bottom:0; padding:8px; border-radius:10px;"> 
            <i class="fas fa-times-circle" style="color:#e74c3c; cursor:pointer;" onclick="this.parentElement.remove()"></i>`;
        container.appendChild(div);
    }

    function saveData() {
        const id = document.getElementById('edit-id').value;
        const nameTH = document.getElementById('p-name').value.trim();
        const nameEN = document.getElementById('p-name-en').value.trim();
        
        const data = {
            name: nameTH,
            price: parseFloat(document.getElementById('p-price').value),
            img: document.getElementById('p-img').value,
            category: document.getElementById('p-category').value,
            status: 'instock',
            config: { sizes: [], addons: [] }
        };

        if(!data.name || isNaN(data.price) || !data.img) return alert("กรุณากรอกข้อมูลให้ครบครับ");

        ['sizes', 'addons'].forEach(type => {
            document.querySelectorAll(`#${type}-container .option-row`).forEach(row => {
                const i = row.querySelectorAll('input');
                if(i[1].value) data.config[type].push({ name: i[1].value, price: parseFloat(i[2].value)||0, available: i[0].checked });
            });
        });

        // 1. บันทึกสินค้าลง products
        const ref = id ? db.ref('products/'+id) : db.ref('products').push();
        ref.set(data).then(() => {
            
            // 2. 🔥 บันทึกคำแปลลง menu_translations อัตโนมัติ
            if (nameTH && nameEN) {
                db.ref('menu_translations').update({
                    [nameTH]: nameEN
                });
            }
            
            alert("บันทึกข้อมูลและคำแปลเรียบร้อย!");
            resetForm();
        });
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('p-name').value = "";
        document.getElementById('p-name-en').value = "";
        document.getElementById('p-price').value = "";
        document.getElementById('p-img').value = "";
        document.getElementById('p-img-preview').style.display = 'none';
        document.getElementById('upload-hint').style.display = 'block';
        document.getElementById('sizes-container').innerHTML = "";
        document.getElementById('addons-container').innerHTML = "";
        document.getElementById('btn-save').innerText = "SAVE MENU ITEM";
        document.getElementById('btn-cancel').style.display = "none";
    }

    function editProduct(id, p) {
        document.getElementById('edit-id').value = id;
        document.getElementById('p-name').value = p.name;
        document.getElementById('p-price').value = p.price;
        document.getElementById('p-img').value = p.img;
        const preview = document.getElementById('p-img-preview');
        preview.src = p.img; preview.style.display = 'block';
        document.getElementById('upload-hint').style.display = 'none';
        document.getElementById('p-category').value = p.category;
        
        // ดึงชื่ออังกฤษจากคำแปลเดิม (ถ้ามี)
        db.ref('menu_translations/' + p.name).once('value', snap => {
            document.getElementById('p-name-en').value = snap.val() || "";
        });

        document.getElementById('sizes-container').innerHTML = "";
        document.getElementById('addons-container').innerHTML = "";
        if(p.config) {
            if(p.config.sizes) p.config.sizes.forEach(s => addOptionRow('sizes', s.name, s.price, s.available));
            if(p.config.addons) p.config.addons.forEach(a => addOptionRow('addons', a.name, a.price, a.available));
        }
        document.getElementById('btn-save').innerText = "UPDATE MENU ITEM";
        document.getElementById('btn-cancel').style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadProducts() {
        db.ref('products').on('value', snap => {
            const list = document.getElementById('product-list');
            const data = snap.val();
            list.innerHTML = '';
            let counts = { 'อาหาร': 0, 'ก๋วยเตี๋ยว': 0, 'เครื่องดื่ม': 0 };
            for (let id in data) {
                const p = data[id];
                counts[p.category]++;
                const div = document.createElement('div');
                div.className = 'product-card';
                div.innerHTML = `
                    <div class="p-thumb-wrapper" onclick="editProduct('${id}', ${JSON.stringify(p).replace(/"/g, '&quot;')})">
                        <img src="${p.img}" class="p-thumb">
                    </div>
                    <div class="p-info" onclick="editProduct('${id}', ${JSON.stringify(p).replace(/"/g, '&quot;')})">
                        <b>${p.name}</b>
                        <span>฿${p.price}</span>
                    </div>
                    <div class="card-actions">
                        <button class="toggle-status ${p.status=='out_of_stock'?'out-stock':'in-stock'}" 
                                onclick="db.ref('products/${id}').update({status:'${p.status=='instock' || p.status=='available'?'out_of_stock':'instock'}'})">
                            ${p.status=='out_of_stock'?'SOLD OUT':'OPEN'}
                        </button>
                        <div class="btn-del-circle" onclick="if(confirm('ลบเมนูนี้?')) db.ref('products/${id}').remove()">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                    </div>`;
                list.appendChild(div);
            }
            document.getElementById('count-food').innerText = counts['อาหาร'];
            document.getElementById('count-noodle').innerText = counts['ก๋วยเตี๋ยว'];
            document.getElementById('count-drink').innerText = counts['เครื่องดื่ม'];
        });
    }

    function filterMenu() {
        const q = document.getElementById('menu-search').value.toLowerCase();
        document.querySelectorAll('.product-card').forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }
</script>
<script src="admin_script.js"></script>
</body>
</html>
