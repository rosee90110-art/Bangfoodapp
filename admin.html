<div class="luxury-dock-container">

    <script>
        
    const ADMIN_PASSWORD = "bang"; // *** ตรวจสอบว่ารหัสผ่านถูกกำหนดไว้ที่นี่ ***
    
    function checkAdminAccess() {
        // ใช้ setTimeout เพื่อให้แน่ใจว่า DOM element อื่นๆ โหลดแล้ว (ป้องกันปัญหาในบางเบราว์เซอร์)

                alert("รหัสผ่านไม่ถูกต้อง! ระบบจะนำท่านกลับไปหน้าหลัก");
                window.location.href = "start.html"; 
            }
        }, 50); // หน่วงเวลาเล็กน้อย
    }
    
    // เรียกใช้ฟังก์ชันทันทีที่หน้าจอเริ่มโหลด
    checkAdminAccess();
    
        // ... (โค้ด firebaseConfig ที่คุณให้มา) ...

        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); 
        
        // ฟังก์ชัน Logout (นำกลับไปหน้าเริ่มต้น)
        function logoutAdmin() {
            if (confirm("คุณต้องการออกจากระบบผู้ดูแลหรือไม่?")) {
                window.location.href = "start.html";
            }
        }
        
    </script>

<style>
    /* 📍 คอนเทนเนอร์คุมตำแหน่งลอยตัว */
.luxury-dock-container {
    position: fixed;
    bottom: 30px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 10000;
    pointer-events: none;
}

/* 📍 ตัวแท่งกระจก (Glassmorphism Dock) */
.luxury-dock-bar {
    display: flex;
    align-items: center;
    background: rgba(25, 25, 25, 0.7); /* โปร่งแสง */
    backdrop-filter: blur(25px) saturate(180%); /* เบลอและเพิ่มความสดของสีหลังกระจก */
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    padding: 10px 30px;
    border-radius: 45px;
    border: 1px solid rgba(255, 255, 255, 0.15); /* ขอบกระจกมีแสงสะท้อน */
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                inset 0 0 10px rgba(255, 255, 255, 0.05);
    gap: 20px;
    pointer-events: auto;
}

/* ส่วนประกอบใน Dock */
.lux-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
}

/* ปุ่มสถานะทั่วไป */
.lux-btn {
    width: 48px;
    height: 48px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 4px;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
}

.lux-icon { font-size: 1.2rem; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
.lux-label { font-size: 0.65rem; color: #777; font-weight: 300; letter-spacing: 0.5px; }

/* 📍 สถานะ Active เมื่อปุ่มถูกเลือก */
.lux-btn.active {
    background: linear-gradient(145deg, #333, #222);
    border: 1px solid rgba(255, 255, 255, 0.3);
    transform: translateY(-8px) scale(1.1);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
}
.lux-btn.active + .lux-label { color: #fff; font-weight: 500; }

/* 📍 ปุ่ม Home กลางหน้าจอ (Luxury Neumorphism) */
.lux-home-btn {
    width: 65px;
    height: 65px;
    background: linear-gradient(145deg, #ff8a00, #e52d27); /* ไล่สีส้มแดงหรูๆ */
    border-radius: 50%;
    border: 4px solid #f22800;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px; /* ดันให้ลอยสูง */
    box-shadow: 0 10px 25px rgba(229, 45, 39, 0.5), 
                inset 0 4px 10px rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.lux-home-icon { font-size: 1.8rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

.lux-home-btn:hover { transform: scale(1.1) translateY(-5px); }
.lux-home-btn:active { transform: scale(0.9); }
</style>
