<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | สั่งง่าย QR Code</title>
    <link rel="stylesheet" href="style.css">
    
    </head>
<body>
 
   <header id="menu-container"class="app-header">
    <a href="start.html" class="back-link">
        <i class="fas fa-chevron-left"></i> <span>กลับ</span>
    </a>
    
    <h1 class="bangfoodindex">BANGFOOD</h1>
    
    <div class="menu-toggle" onclick="tgl()">
        
        <span></span><span></span><span></span>
    </div>

    <div id="dwr" class="drawer">
        <a href="index.html" onclick="go(this.href, event)">🏠 หน้าหลัก</a>
        <a href="cart.html" onclick="go(this.href, event)">🛒 ตะกร้า</a>
        <a href="track.html" onclick="go(this.href, event)">📍 ติดตาม</a>
        <a href="#" onclick="tgl()" style="color:#ff4444; border-bottom:none;">❌ ปิดเมนู</a>
    </div>
    
</header>
   <main class="menu-container">
    <div class="menu-tabs"> 
        <a href="#" class="menu-tab active" data-category="อาหาร" onclick="switchCategory('อาหาร', event)">อาหาร</a>
        <a href="#" class="menu-tab" data-category="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว', event)">ก๋วยเตี๋ยว</a>
        <a href="#" class="menu-tab" data-category="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม', event)">เครื่องดื่ม</a>
    </div>

    <div id="food-container" class="menu-category-content">
        </div>

    <div id="noodle-container" class="menu-category-content" style="display: none;">
        </div>

    <div id="drink-container" class="menu-category-content" style="display: none;">
        </div>
</main>
    

<div class="curved-nav-container">
    <div class="nav-bg-curved">
        <svg viewBox="0 0 400 100" preserveAspectRatio="none">
            <path d="M0,100 L400,100 L400,40 
                     C360,40 340,40 330,60 
                     C320,80 280,80 270,60 
                     C260,40 240,40 200,40 
                     C160,40 140,40 130,60 
                     C120,80 80,80 70,60 
                     C60,40 40,40 0,40 Z" fill="#121212"/>
        </svg>
    </div>

    <div class="nav-buttons-wrapper">
        <div class="nav-btn-box">
            <button class="round-btn side" onclick="window.location.href='cart.html?table=' + localStorage.getItem('selectedTable')">
                🛒
            </button>
            <span class="label"></span>
        </div>

        <div class="nav-btn-box main-box">
            <button class="round-btn center" onclick="window.location.href='index.html?table=' + localStorage.getItem('selectedTable')">
                🏠
            </button>
        </div>

        <div class="nav-btn-box">
            <button class="round-btn side" onclick="window.location.href='track.html?table=' + localStorage.getItem('selectedTable')">
                📍
            </button>
            <span class="label"></span>
        </div>
    </div>
</div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
  
    // 1. ประกาศตัวแปร Global ไว้บนสุดเพื่อให้ทุกที่มองเห็น
    var urlParams = new URLSearchParams(window.location.search);
    var db; 

    // 2. ตั้งค่า Firebase ให้เสร็จก่อนเพื่อน
    const firebaseConfig = {
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ",
        authDomain: "bangfood-cb30f.firebaseapp.com",
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "bangfood-cb30f",
        storageBucket: "bangfood-cb30f.appspot.com",
        messagingSenderId: "390955623784",
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    window.db = db; // ยัดลง window เพื่อให้ไฟล์ script.js มองเห็น

    // 3. ฟังก์ชันโหลดเมนู (แก้ไขให้ดึงข้อมูลได้ชัวร์ขึ้น)
    function loadMenuFromFirebase() {
        const productsRef = db.ref('products'); 
        productsRef.on('value', (snapshot) => {
            const products = snapshot.val();
            const foodCont = document.getElementById('food-container');
            const noodleCont = document.getElementById('noodle-container');
            const drinkCont = document.getElementById('drink-container');

            if (!foodCont || !products) return;

            foodCont.innerHTML = '';
            noodleCont.innerHTML = '';
            drinkCont.innerHTML = '';

            for (let id in products) {
    const p = products[id];
    const isOut = p.status === 'out_of_stock';
    // ดึงเลขโต๊ะมาเพื่อสร้าง Link ที่ถูกต้อง
    const tableNo = localStorage.getItem('selectedTable') || '1';

    const productHTML = `
        <div class="menu-item ${isOut ? 'item-disabled' : ''}" style="${isOut ? 'opacity: 0.6;' : ''}">
            <img src="${p.img}" alt="${p.name}" class="item-image" style="${isOut ? 'filter: grayscale(1);' : ''}">
            <div class="item-details">
                <h3 class="item-name">${p.name} ${isOut ? '<span style="color:red;">(หมด)</span>' : ''}</h3>
                <div class="item-price"><span>${p.price}</span> บาท</div>
            </div>
            ${isOut 
                ? `<button class="add-to-cart-btn" disabled style="background:#888;">หมด</button>` 
                : `<a href="${p.category === 'เครื่องดื่ม' ? 'drink.html' : 'menu.html'}?name=${encodeURIComponent(p.name)}&price=${p.price}&img=${p.img}&table=${tableNo}" class="add-to-cart-btn"> + เพิ่ม </a>`
            }
        </div>`;

    if (p.category === 'อาหาร') foodCont.innerHTML += productHTML;
    else if (p.category === 'ก๋วยเตี๋ยว') noodleCont.innerHTML += productHTML;
    else if (p.category === 'เครื่องดื่ม') drinkCont.innerHTML += productHTML;
}
        });
    }
    function tgl() {
    const d = document.getElementById('dwr');
    // ใช้สไตล์สลับการแสดงผลแบบเรียบง่าย
    if (d.style.display === "block") {
        d.style.display = "none";
    } else {
        d.style.display = "block";
    }
}
// ตัวอย่างฟังก์ชันเพิ่มของลงตะกร้าในหน้าแรก (index.html)
function addToCart(productName, price, imgUrl) { // <--- ต้องรับค่า imgUrl มาด้วย
    const tableNo = getTableNo();
    const cartKey = 'bangfood_cart_table_' + tableNo;
    let cartData = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };

    const newItem = {
        name: productName,
        price: price,
        finalPrice: price,
        img: imgUrl, // <--- จุดสำคัญ! ต้องเก็บลิงก์รูปไว้ตรงนี้
        options: "" 
    };

    cartData.items.push(newItem);
    sessionStorage.setItem(cartKey, JSON.stringify(cartData));
    updateFloatingCart(); // อัปเดตแถบสีดำด้านล่าง
}

function go(u, e) {
    e.preventDefault();
    const t = localStorage.getItem('selectedTable') || '1';
    window.location.href = u.split('?')[0] + "?table=" + t;
}

    // 4. ฟังก์ชันจัดการเลขโต๊ะ
    function checkTable() {
        const display = document.getElementById('table-status-bar');
        let table = urlParams.get('table') || localStorage.getItem('selectedTable');

        if (table && table !== "null") {
            localStorage.setItem('selectedTable', table);
            if (display) {
                display.innerText = "📍 โต๊ะที่: " + table;
                display.style.color = "#4CAF50";
            }
        } else {
            if (display) {
                display.innerText = "❌ กรุณาสแกน QR Code";
                display.style.color = "#ff4444";
            }
        }
    }

    // 5. รันทุกอย่างเมื่อพร้อม
    document.addEventListener('DOMContentLoaded', () => {
        checkTable();
        loadMenuFromFirebase();
    });
</script>

    <script src="script.js"></script>
</body>
</html>
