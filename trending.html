<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending Analytics | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 คงเหลือไว้เฉพาะสไตล์โครงสร้างการจัดวางอันดับ */
        body { margin: 0; padding: 25px; padding-bottom: 50px; animation: fadeInPage 0.8s ease-out; min-height: 100vh; }

        .summary-dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px;
            max-width: 1200px; margin-left: auto; margin-right: auto;
        }
        .summary-item { 
            padding: 22px; border-radius: 28px; text-align: center;
        }
        .summary-item i { font-size: 1.4rem; color: var(--premium-gold); margin-bottom: 10px; display: block; }
        .summary-item b { font-size: 1.8rem; display: block; color: var(--text); }
        .summary-item span { font-size: 0.7rem; color: var(--sub-text); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }

        #trending-container { max-width: 1200px; margin: 0 auto; }
        .rank-card {
            border-radius: 30px; padding: 25px; margin-bottom: 18px; 
            display: flex; align-items: flex-start; gap: 20px; 
            opacity: 0; transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .rank-card.active { opacity: 1; transform: translateY(0); }
        /* ไฮไลท์อันดับ 1 */
        .rank-card.top-1 { border-color: var(--premium-gold) !important; background: linear-gradient(145deg, rgba(197, 160, 89, 0.08), transparent) !important; }

        .rank-number { font-size: 2.2rem; font-weight: 800; color: var(--premium-gold); min-width: 50px; line-height: 1; text-shadow: 0 0 15px rgba(197, 160, 89, 0.2); }
        .item-details { flex: 1; }
        .item-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; color: var(--text); }
        
        .progress-container { height: 8px; background: rgba(128,128,128,0.1); border-radius: 10px; margin: 15px 0; width: 100%; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--premium-gold); border-radius: 10px; width: 0; transition: 1.5s cubic-bezier(0.23, 1, 0.32, 1); }

        .sales-info { font-size: 0.85rem; color: var(--sub-text); display: flex; justify-content: space-between; align-items: center; font-weight: 500; }

        .table-stat-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .table-badge {
            background: rgba(128,128,128,0.05); color: var(--sub-text); font-size: 0.7rem;
            padding: 6px 14px; border-radius: 12px; border: 1px solid var(--border);
            font-weight: 600;
        }
        .table-badge b { color: var(--premium-gold); margin-left: 4px; }

        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body onload="initializeTrending()">

    <div style="font-size: 0.75rem; color: var(--premium-gold); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; font-weight: 700; text-align: center;">
        <i class="fas fa-chart-pie" style="margin-right: 10px;"></i> 
        <span data-lang-en="Menu Popularity Analytics" data-lang-th="วิเคราะห์อันดับเมนูยอดฮิต">Menu Popularity Analytics</span>
    </div>

    <div class="summary-dashboard">
        <div class="summary-item stat-card">
            <i class="fas fa-utensils"></i>
            <b id="stat-total-items">0</b>
            <span data-lang-en="Unique Dishes" data-lang-th="จำนวนเมนูทั้งหมด">Unique Dishes</span>
        </div>
        <div class="summary-item stat-card">
            <i class="fas fa-fire-alt"></i>
            <b id="stat-total-sales">0</b>
            <span data-lang-en="Total Orders" data-lang-th="ยอดสั่งซื้อรวม">Total Orders</span>
        </div>
    </div>

    <main id="trending-container">
        <p style="text-align:center; padding:100px; color:var(--sub-text); font-size: 0.9rem;">
            <i class="fas fa-sync fa-spin" style="margin-right: 10px;"></i> Crunching sales data...
        </p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initializeTrending() {
            calculateTrending();
        }

        async function calculateTrending() {
            const [ordersSnap, historySnap] = await Promise.all([
                db.ref('orders').once('value'),
                db.ref('history').once('value')
            ]);
            
            const stats = {};
            let globalTotalSales = 0;

            const processData = (snap) => {
                if (snap.exists()) {
                    Object.values(snap.val()).forEach(order => {
                        if (order.items) {
                            order.items.forEach(item => {
                                const name = item.name;
                                const qty = parseInt(item.quantity || 1);
                                if (!stats[name]) stats[name] = { total: 0, tables: {} };
                                stats[name].total += qty;
                                globalTotalSales += qty;
                                const table = order.tableNumber || "N/A";
                                stats[name].tables[table] = (stats[name].tables[table] || 0) + qty;
                            });
                        }
                    });
                }
            };

            processData(ordersSnap);
            processData(historySnap);

            const sorted = Object.entries(stats).sort((a, b) => b[1].total - a[1].total);
            const top10 = sorted.slice(0, 10);
            const maxSales = top10.length > 0 ? top10[0][1].total : 1;

            document.getElementById('stat-total-items').innerText = sorted.length;
            document.getElementById('stat-total-sales').innerText = globalTotalSales;

            const container = document.getElementById('trending-container');
            container.innerHTML = '';

            if (top10.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:100px; color:var(--sub-text);" data-lang-en="No sales data found" data-lang-th="ไม่มีข้อมูลการขายในขณะนี้">ไม่มีข้อมูลการขายในขณะนี้</p>';
                return;
            }

            top10.forEach(([name, data], index) => {
                const percentage = (data.total / maxSales) * 100;
                const tableBadges = Object.entries(data.tables)
                    .sort((a,b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([t, count]) => `<div class="table-badge"><span data-lang-en="Table" data-lang-th="โต๊ะ">โต๊ะ</span> ${t}: <b>${count}</b></div>`)
                    .join('');

                container.innerHTML += `
                    <div class="rank-card stat-card ${index === 0 ? 'top-1' : ''}" id="rank-${index}">
                        <div class="rank-number">#${index + 1}</div>
                        <div class="item-details">
                            <div class="item-name">${name}</div>
                            <div class="progress-container">
                                <div class="progress-bar" id="bar-${index}" data-width="${percentage}%"></div>
                            </div>
                            <div class="sales-info">
                                <span><span data-lang-en="Total Orders" data-lang-th="ยอดสั่งรวม">ยอดสั่งรวม</span>: <b style="color:var(--premium-gold)">${data.total}</b></span>
                                <span style="font-size: 0.7rem; opacity: 0.7;"><span data-lang-en="Popularity" data-lang-th="ดัชนีความนิยม">ดัชนีความนิยม</span> ${Math.round(percentage)}%</span>
                            </div>
                            <div class="table-stat-grid">${tableBadges}</div>
                        </div>
                    </div>`;
            });

            setTimeout(initReveal, 100);
            // สั่งแปลภาษาทันทีหลังโหลดข้อมูลเสร็จ
            if (window.applyGlobalLanguage) applyGlobalLanguage();
        }

        function initReveal() {
            document.querySelectorAll('.rank-card').forEach((card, i) => {
                setTimeout(() => {
                    card.classList.add('active');
                    const bar = document.getElementById(`bar-${i}`);
                    if (bar) bar.style.width = bar.getAttribute('data-width');
                }, i * 120);
            });
        }
    </script>

    <script src="admin_script.js"></script>
</body>
</html>
