                <div class="customization-group">

            <div class="modal-footer">

    <span>🚀 ยืนยันการสั่งซื้อ</span>
</button>

<script>
  function initializeMenuPage() {
    const urlParams = new URLSearchParams(window.location.search);
    const imgParam = urlParams.get('img');
    const nameParam = urlParams.get('name') || "อาหาร";
    const priceParam = urlParams.get('price') || "0";

    // 1. โหลดรูปภาพ
    const imgElement = document.getElementById('modal-item-image');
    if (imgElement && imgParam) {
        imgElement.src = imgParam; 
    }

    try {
        // 2. ใส่ชื่ออาหาร
        const nameNode = document.getElementById('modal-item-name');
        if (nameNode) nameNode.innerText = nameParam;

        // 3. ใส่ราคาเริ่มต้น
        const basePriceNode = document.getElementById('modal-base-price');
        const finalPriceNode = document.getElementById('modal-final-price');
        
        if (basePriceNode) basePriceNode.innerText = parseFloat(priceParam).toFixed(2);
        if (finalPriceNode) finalPriceNode.innerText = parseFloat(priceParam).toFixed(2);

        // 4. ใส่เลขโต๊ะ
        const tableNode = document.getElementById('display-table');
        const tableNo = urlParams.get('table') || "1";
        if (tableNode) tableNode.innerText = tableNo;

    } catch (e) {
        console.log("Error filling data:", e);
    }
  }

  function confirmOrder() {
    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || '1'; 
    
    const name = document.getElementById('modal-item-name').innerText || "อาหาร";
    const itemImg = urlParams.get('img') || ""; 
    
    const finalPriceText = document.getElementById('modal-final-price').innerText;
    const finalPrice = parseFloat(finalPriceText) || 0;

    let details = [];
    
    // ใส่เครื่องหมาย • ข้างหน้าเพื่อให้ดูเป็น List รายการครับ
    const selectedSize = document.querySelector('input[name="size"]:checked');
    if (selectedSize) details.push("• ปริมาณ: " + selectedSize.value);

    document.querySelectorAll('input[name="addon"]:checked').forEach(input => {
        details.push("• เพิ่ม: " + input.value); 
    });

    const notes = document.getElementById('modal-notes').value.trim();
    if (notes) details.push("📝 หมายเหตุ: " + notes);

    // ✅ จุดสำคัญ: เปลี่ยนจาก .join(", ") เป็น .join("<br>") เพื่อให้ขึ้นบรรทัดใหม่
    const optionsText = details.join("<br>") || "ธรรมดา";

    const cartKey = `bangfood_cart_table_${tableNo}`; 
    let cartData = sessionStorage.getItem(cartKey);
    let cart = cartData ? JSON.parse(cartData) : { items: [] };

    cart.items.push({
        name: name,
        finalPrice: finalPrice, 
        options: optionsText,
        img: itemImg, 
        quantity: 1
    });

    sessionStorage.setItem(cartKey, JSON.stringify(cart));
    alert("เพิ่ม " + name + " ลงตะกร้าเรียบร้อยครับ!");
    window.location.href = `cart.html?table=${tableNo}`;
}

  // ฟังก์ชันคำนวณราคา
  function updatePrice() {
    const urlParams = new URLSearchParams(window.location.search);
    const basePrice = parseFloat(urlParams.get('price')) || 0;
    let extraPrice = 0;

    document.querySelectorAll('input:checked').forEach(input => {
        extraPrice += parseFloat(input.getAttribute('data-modifier')) || 0;
    });

    const total = basePrice + extraPrice;
    const finalPriceNode = document.getElementById('modal-final-price');
    if (finalPriceNode) {
        finalPriceNode.innerText = total.toFixed(2);
    }
  }

  // ตั้งค่า Event Listeners สำหรับการเปลี่ยนราคา
  document.addEventListener('change', function(e) {
    if (e.target.name === 'size' || e.target.name === 'addon') {
        updatePrice();
    }
  });

  // Firebase Config
  const firebaseConfig = {

  };

  if (!firebase.apps.length) {

  window.db = firebase.database();
</script>
