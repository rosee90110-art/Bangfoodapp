<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revenue Insights | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* 📍 Global UI Base */
        body { margin: 0; padding: 25px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; }
        .page-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: fadeIn 0.8s ease; }

        /* 📅 Smart Filter Hub */
        .filter-hub {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px;
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .mode-toggle { background: rgba(128,128,128,0.1); padding: 4px; border-radius: 12px; display: flex; gap: 4px; }
        .mode-btn { border: none; padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: 0.7rem; cursor: pointer; transition: 0.3s; background: transparent; color: var(--sub-text); }
        .mode-btn.active { background: var(--premium-gold); color: #000; }
        .select-input { background: rgba(128,128,128,0.08); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; outline: none; font-weight: 600; }

        /* 💰 Main Revenue Display */
        .revenue-hero { 
            background: linear-gradient(135deg, var(--card-bg), rgba(197, 160, 89, 0.05));
            border: 1px solid var(--premium-gold); border-radius: 35px; padding: 40px; 
            text-align: center; box-shadow: 0 15px 40px rgba(197, 160, 89, 0.1);
        }
        .revenue-hero span { font-size: 0.8rem; color: var(--premium-gold); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; }
        .revenue-hero b { font-size: 3.5rem; display: block; letter-spacing: -2px; margin: 10px 0; color: var(--text); }
        
        .sub-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 500px; margin: 20px auto 0; padding-top: 20px; border-top: 1px solid var(--border); }
        .sub-stat-item i { color: var(--premium-gold); margin-right: 8px; }
        .sub-stat-item div { font-size: 0.7rem; color: var(--sub-text); font-weight: 700; text-transform: uppercase; }
        .sub-stat-item b { font-size: 1.2rem; }

        /* 📈 Charts & Tables */
        .revenue-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .revenue-grid { grid-template-columns: 1.5fr 1fr; } }

        .content-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card-head { font-size: 0.85rem; font-weight: 800; color: var(--sub-text); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        /* 🏆 Income Table */
        .income-row { display: flex; justify-content: space-between; padding: 12px 5px; border-bottom: 1px solid rgba(128,128,128,0.1); align-items: center; }
        .income-row:last-child { border-bottom: none; }
        .income-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }
        .income-val { font-weight: 800; color: var(--premium-gold); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pop { animation: pop 0.4s ease-out; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body onload="setupAndInit()">

    <div class="page-container">
        <header class="filter-hub">
            <div class="mode-toggle">
                <button id="m-daily" class="mode-btn active" onclick="switchView('daily')">DAILY</button>
                <button id="m-monthly" class="mode-btn" onclick="switchView('monthly')">MONTHLY</button>
                <button id="m-yearly" class="mode-btn" onclick="switchView('yearly')">YEARLY</button>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="date" id="in-date" class="select-input" onchange="refresh()">
                <select id="in-month" class="select-input" onchange="refresh()" style="display:none;">
                    <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                    <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
                    <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                    <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
                </select>
                <select id="in-year" class="select-input" onchange="refresh()">
                    <option value="2024">2567</option><option value="2025">2568</option><option value="2026">2569</option>
                </select>
            </div>
        </header>

        <section class="revenue-hero">
            <span>สรุปรายได้ตามช่วงเวลา</span>
            <b id="main-rev">฿0.00</b>
            <div class="sub-stats">
                <div class="sub-stat-item">
                    <div><i class="fas fa-file-invoice"></i> จำนวนบิล</div>
                    <b id="sub-orders">0</b>
                </div>
                <div class="sub-stat-item">
                    <div><i class="fas fa-hand-holding-usd"></i> เฉลี่ยต่อบิล</div>
                    <b id="sub-avg">฿0.00</b>
                </div>
            </div>
        </section>

        <div class="revenue-grid">
            <div class="content-card">
                <div class="card-head"><i class="fas fa-chart-line"></i> แนวโน้มรายได้ (REVENUE TREND)</div>
                <div style="height: 300px;"><canvas id="revChart"></canvas></div>
            </div>

            <div class="content-card">
                <div class="card-head"><i class="fas fa-trophy"></i> เมนูทำเงินสูงสุด (TOP REVENUE)</div>
                <div id="income-list"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let history = [];
        let chart;
        let mode = 'daily';

        function setupAndInit() {
            const now = new Date();
            document.getElementById('in-date').value = now.toISOString().split('T')[0];
            document.getElementById('in-month').value = now.getMonth();
            document.getElementById('in-year').value = now.getFullYear();
            
            const theme = localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light-theme', theme === 'light');

            db.ref('history').on('value', snap => {
                if (snap.exists()) {
                    history = Object.values(snap.val());
                    refresh();
                }
            });
        }

        function switchView(m) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-${m}`).classList.add('active');
            document.getElementById('in-date').style.display = (m === 'daily') ? 'block' : 'none';
            document.getElementById('in-month').style.display = (m === 'monthly') ? 'block' : 'none';
            refresh();
        }

        function refresh() {
            const selD = document.getElementById('in-date').value;
            const selM = parseInt(document.getElementById('in-month').value);
            const selY = parseInt(document.getElementById('in-year').value);
            
            let total = 0, count = 0, products = {}; let trendData = {};

            history.forEach(order => {
                if (!order || !order.archivedAt) return;
                const d = new Date(order.archivedAt);
                let match = false; let key = "";

                if (mode === 'daily' && d.toISOString().split('T')[0] === selD) { match = true; key = d.getHours() + ":00"; }
                else if (mode === 'monthly' && d.getMonth() === selM && d.getFullYear() === selY) { match = true; key = d.getDate(); }
                else if (mode === 'yearly' && d.getFullYear() === selY) { match = true; key = (d.getMonth() + 1); }

                if (match) {
                    const amt = parseFloat(order.total || 0);
                    total += amt; count++;
                    trendData[key] = (trendData[key] || 0) + amt;
                    if(order.items) {
                        order.items.forEach(i => {
                            if(!products[i.name]) products[i.name] = 0;
                            products[i.name] += parseFloat(i.finalPrice || 0);
                        });
                    }
                }
            });

            // Update UI
            const up = (id, v) => { const el = document.getElementById(id); el.innerText = v; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
            up('main-rev', "฿" + total.toLocaleString(undefined, {minimumFractionDigits: 2}));
            up('sub-orders', count.toLocaleString() + " บิล");
            up('sub-avg', "฿" + (total / (count || 1)).toLocaleString(undefined, {minimumFractionDigits: 2}));

            const sorted = Object.entries(products).sort((a,b) => b[1] - a[1]).slice(0, 8);
            document.getElementById('income-list').innerHTML = sorted.map(([n, v]) => `
                <div class="income-row">
                    <span class="income-name">${n}</span>
                    <span class="income-val">฿${v.toLocaleString()}</span>
                </div>`).join('');

            renderChart(trendData);
        }

        function renderChart(data) {
            const ctx = document.getElementById('revChart').getContext('2d');
            if (chart) chart.destroy();
            const isL = document.body.classList.contains('light-theme');
            const keys = Object.keys(data).sort((a, b) => (mode === 'daily' ? parseInt(a) : a) - (mode === 'daily' ? parseInt(b) : b));
            const labels = keys.map(k => mode === 'daily' ? k : (mode === 'monthly' ? `วันที่ ${k}` : `เดือน ${k}`));

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ 
                        data: keys.map(k => data[k]), 
                        borderColor: '#c5a059', 
                        backgroundColor: 'rgba(197, 160, 89, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 3, pointRadius: 4
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { grid: { color: 'rgba(128,128,128,0.05)' }, ticks: { color: isL ? '#555' : '#aaa', font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { color: isL ? '#555' : '#aaa', font: { size: 10 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
