<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - BANGFOOD</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 📍 ส่วนที่ 1: กล่องสรุปยอดเงิน */
        .cart-footer-fixed {
            position: fixed;
            bottom: 125px; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
            box-sizing: border-box;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .cart-total-summary h3 {
            margin: 0;
            color: white;
            font-size: 1.1rem;
            font-weight: 300;
        }

        #final-total-amount {
            color: #ffff41;
            font-weight: bold;
            font-size: 1.4rem;
        }

        /* 📍 ส่วนที่ 2: แถบเมนูชุดเทพแบบปรับแต่ง (Diamond Glow Premium Jumbo) */
        .curved-nav-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            height: 90px;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none; /* แก้ปัญหากดไม่ได้ */
        }
        .nav-buttons-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background: rgba(25, 25, 25, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            width: 100%;
            height: 99px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            padding: 0 10px;
            /* 📍 รอยเว้ากว้างรองรับปุ่มจัมโบ้ */
            mask-image: radial-gradient(circle 60px at center 0px, transparent 54px, black 55px);
            -webkit-mask-image: radial-gradient(circle 60px at center 0px, transparent 54px, black 55px);
        }
        .nav-btn-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
        }

        /* 🚀 ปุ่มยืนยันคำสั่งซื้อตรงกลางแบบจัมโบ้ (จิ้มได้ 100%) */
        .center-home-wrapper {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -45px);
            /* 📍 ดันให้สูงกว่าทุกอย่างและเปิดการกด */
            z-index: 2010; 
            pointer-events: auto; 
            cursor: pointer;
            text-align: center;
        }

        .round-btn.center {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            border-radius: 50%;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 12px 25px rgba(76, 175, 80, 0.5);
            border: 6px solid #0021081d;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .round-btn.center:active { transform: scale(0.9); }

        .round-btn.side {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, rgba(45, 45, 45, 1), rgba(20, 20, 20, 1));
            border-radius: 18px;
            font-size: 1.6rem;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 5px 5px 12px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .nav-btn-box:active .round-btn.side {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.7);
            transform: scale(0.9) translateY(2px);
        }

        .nav-label {
            font-size: 0.7rem;
            color: #fff;
            margin-top: 4px;
            font-weight: 500;
        }
        
        .btn-loading { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: translate(-50%, -55px) scale(1); }
            50% { transform: translate(-50%, -55px) scale(0.95); }
            100% { transform: translate(-50%, -55px) scale(1); }
        }
    </style>
</head>

<body onload="renderCartItems()">
    <header class="app-header">
        <a href="javascript:void(0)" class="back-link" onclick="goBackToIndex()">
            <i class="fas fa-chevron-left"></i> 
            <span>กลับ</span>
        </a>
        <h1 class="bangfood">BANGFOOD</h1>
        <p class="menu-label">ตะกร้าสินค้า</p>
    </header>

    <div class="cart-container" style="padding-bottom: 240px;">
        <div class="cart-header-row">
            <h3 id="table-display-info" style="color: white; text-align: center; width: 100%;"></h3> 
        </div>
        <div id="cart-items-list" class="cart-items-list"></div>
    </div>

    <div class="cart-footer-fixed">
        <div class="cart-total-summary">
            <h3>ยอดรวมทั้งหมด: <span id="final-total-amount">0.00</span> บาท</h3>
        </div>
    </div>

    <div class="curved-nav-container">
        <div id="order-btn-wrapper" class="center-home-wrapper" onclick="placeOrder()">
            <button id="checkout-btn" class="round-btn center">
                <i class="fas fa-paper-plane"></i>
                
            </button>
                <a>ยืนยันรายการ</a>
        </div>

        <div class="nav-buttons-wrapper">
            <div class="nav-btn-box" onclick="goBackToIndex()">
                <button class="round-btn side"><i class="fas fa-home"></i></button>
                <a>สั่งเพิ่ม</a>
            </div>
            
            <div style="flex: 1.2; pointer-events: none;"></div> 
            
            <div class="nav-btn-box" onclick="goToTracking()">
                <button class="round-btn side"><i class="fas fa-map-marker-alt"></i></button>
               <a>สถานะ</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ",
            authDomain: "bangfood-cb30f.firebaseapp.com",
            databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "bangfood-cb30f", 
            storageBucket: "bangfood-cb30f.appspot.com",
            messagingSenderId: "390955623784",
            appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.database(); 

        function getTableNo() {
            const urlParams = new URLSearchParams(window.location.search);
            let table = urlParams.get('table');
            if (table && table !== 'null') {
                localStorage.setItem('selectedTable', table);
                return table;
            }
            return localStorage.getItem('selectedTable') || '1';
        }

        function renderCartItems() {
            const listContainer = document.getElementById('cart-items-list');
            const totalAmountDisplay = document.getElementById('final-total-amount');
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = sessionStorage.getItem(cartKey);
            const currentCart = cartData ? JSON.parse(cartData) : { items: [] };

            if (!listContainer) return;
            listContainer.innerHTML = '';
            let grandTotal = 0;

            const tableDisplay = document.getElementById('table-display-info');
            if (tableDisplay) tableDisplay.innerText = "โต๊ะที่: " + tableNo;

            if (!currentCart.items || currentCart.items.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; padding:50px; color:#888;">ตะกร้าว่างครับน้า</p>';
                if (totalAmountDisplay) totalAmountDisplay.textContent = '0.00';
                return;
            }

            currentCart.items.forEach((item, index) => {
                const itemPrice = parseFloat(item.finalPrice) || 0;
                grandTotal += itemPrice;
                listContainer.innerHTML += `
                    <div class="cart-item" style="display:flex; align-items:center; padding:12px; background: #252525; margin-bottom: 8px; border-radius: 15px; gap: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <img src="${item.img || 'https://via.placeholder.com/50'}" style="width: 60px; height: 60px; border-radius: 10px; object-fit: cover;">
                        <div style="flex: 1;">
                            <p style="margin:0; font-weight: bold; color: white;">${item.name}</p>
                            <small style="color: #aaa;">${item.options || ''}</small>
                        </div>
                        <div style="text-align:right;">
                            <p style="margin:0; font-weight: bold; color: #ffff41;">${itemPrice.toFixed(2)}</p>
                            <button onclick="removeItem(${index})" style="color: #ff4444; background: none; border: 1px solid #ff4444; border-radius: 5px; padding: 2px 8px; margin-top: 5px; cursor: pointer;">ลบ</button>
                        </div>
                    </div>`;
            });
            if (totalAmountDisplay) totalAmountDisplay.textContent = grandTotal.toFixed(2);
        }

        window.removeItem = function(index) {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            let cartData = JSON.parse(sessionStorage.getItem(cartKey));
            cartData.items.splice(index, 1);
            sessionStorage.setItem(cartKey, JSON.stringify(cartData));
            renderCartItems();
        }

        window.placeOrder = function() {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = JSON.parse(sessionStorage.getItem(cartKey));

            if (!cartData || cartData.items.length === 0) return alert("เลือกอาหารก่อนครับน้า!");

            if (!confirm("ยืนยันการสั่งอาหารใช่ไหมครับ?")) return;

            const checkoutBtn = document.getElementById('checkout-btn');
            const wrapper = document.getElementById('order-btn-wrapper');
            checkoutBtn.disabled = true;
            wrapper.classList.add('btn-loading');
            checkoutBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const orderData = {
                tableNumber: tableNo,
                items: cartData.items,
                total: cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice), 0),
                status: 'รอดำเนินการ',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('orders').push(orderData).then(() => {
                sessionStorage.removeItem(cartKey);
                alert("สั่งอาหารเรียบร้อย! พนักงานกำลังเตรียมอาหารครับ");
                window.location.href = `track.html?table=${tableNo}`;
            }).catch(err => {
                alert("เกิดข้อผิดพลาด: " + err.message);
                checkoutBtn.disabled = false;
                wrapper.classList.remove('btn-loading');
                checkoutBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            });
        };

        function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
        function goToTracking() { window.location.href = `track.html?table=${getTableNo()}`; }
    </script>
</body>
</html>
