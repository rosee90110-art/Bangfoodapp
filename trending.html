<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Insights | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 Modern Grid Base - Desktop First */
        body { margin: 0; padding: 40px; min-height: 100vh; background-color: var(--bg); color: var(--text); font-family: 'Kanit', sans-serif; transition: 0.5s ease; }
        .grid-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: 25px; }

        /* 👑 Header Section */
        .analytics-header { grid-column: span 12; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .analytics-header h1 { font-size: 2.5rem; font-weight: 900; margin: 0; letter-spacing: -2px; }
        
        /* 🕒 Top Timeline Peak */
        .timeline-box { 
            grid-column: span 8; background: var(--card-bg); border-radius: 40px; padding: 30px; 
            border: 1px solid var(--border); backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            position: relative; overflow: hidden;
        }
        .timeline-box::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--premium-gold-rgb), 0.4), transparent);
        }
        .timeline-bars { display: flex; align-items: flex-end; gap: 4px; height: 80px; margin-top: 20px; }
        .t-bar { flex: 1; background: rgba(var(--premium-gold-rgb), 0.1); border-radius: 3px; transition: 0.5s; position: relative; }
        .t-bar:hover { background: rgba(var(--premium-gold-rgb), 0.25); }
        .t-bar.peak { background: var(--premium-gold); box-shadow: 0 0 15px rgba(var(--premium-gold-rgb), 0.5); animation: peakPulse 2s ease-in-out infinite; }
        @keyframes peakPulse { 0%,100% { box-shadow: 0 0 10px rgba(var(--premium-gold-rgb), 0.4); } 50% { box-shadow: 0 0 25px rgba(var(--premium-gold-rgb), 0.8); } }

        /* 📊 Floating Stat Rings */
        .stat-cluster { grid-column: span 4; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .ring-node { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; padding: 25px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative; overflow: hidden;
        }
        .ring-node::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--premium-gold), transparent);
            opacity: 0; transition: 0.4s;
        }
        .ring-node:hover { transform: translateY(-5px); border-color: rgba(var(--premium-gold-rgb), 0.3); }
        .ring-node:hover::after { opacity: 0.5; }
        .ring-node b { font-size: 1.8rem; color: var(--premium-gold); display: block; margin-top: 5px; }
        .ring-node span { font-size: 0.6rem; color: var(--sub-text); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }

        /* 📅 Control Floating Bar */
        .control-pill { 
            grid-column: span 12; background: var(--card-bg); border: 1px solid var(--border); 
            border-radius: 50px; padding: 10px 30px; display: flex; align-items: center; gap: 20px;
            justify-content: space-between; backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.03);
        }

        /* 🏆 List Masonry */
        .leaderboard-masonry { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .menu-tile { 
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 35px; padding: 30px;
            display: flex; flex-direction: column; gap: 15px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        .menu-tile::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--premium-gold-rgb), 0.3), transparent);
            opacity: 0; transition: 0.4s;
        }
        .menu-tile:hover { transform: scale(1.03); border-color: var(--premium-gold); box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .menu-tile:hover::before { opacity: 1; }
        .tile-rank { font-size: 3rem; font-weight: 900; color: var(--premium-gold); opacity: 0.05; position: absolute; top: 10px; right: 25px; line-height: 1; }
        .tile-title { font-size: 1.1rem; font-weight: 800; position: relative; z-index: 1; }
        .tile-count { font-size: 0.8rem; font-weight: 700; color: var(--premium-gold); }
        
        .progress-micro { height: 4px; background: rgba(128,128,128,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar-micro { height: 100%; background: var(--premium-gold); width: 0; transition: 1.5s; }

        .minimal-btn { background: transparent; border: 1px solid var(--border); color: var(--sub-text); padding: 8px 20px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; cursor: pointer; transition: 0.3s; }
        .minimal-btn:hover { border-color: rgba(var(--premium-gold-rgb), 0.4); color: var(--premium-gold); transform: translateY(-1px); }
        .minimal-btn.active { background: var(--premium-gold); color: #000; border-color: var(--premium-gold); box-shadow: 0 4px 15px rgba(var(--premium-gold-rgb), 0.3); }
        .minimal-select, .minimal-date { background: transparent; border: none; color: var(--text); font-weight: 800; font-size: 0.85rem; outline: none; cursor: pointer; }

        /* -----------------------------------------------------------
           🖨️ PRINT OPTIMIZATION
        ----------------------------------------------------------- */
        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white !important; color: black !important; padding: 0 !important; width: 100%; }
            .grid-container { display: block !important; width: 100% !important; max-width: none !important; }
            
            /* ซ่อนกราฟและส่วนควบคุม */
            .timeline-box, .control-pill, .minimal-btn, .progress-micro, #peak-status { display: none !important; }
            
            /* ปรับ Header รายงาน */
            .analytics-header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 25px; display: flex !important; justify-content: space-between !important; align-items: center !important; }
            .analytics-header h1 { color: black !important; font-size: 2rem !important; }
            #report-period { color: black !important; opacity: 1 !important; font-size: 0.9rem !important; letter-spacing: 1px !important; }

            /* สถิติสรุป (แถวบน) */
            .stat-cluster { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 15px !important; margin-bottom: 30px !important; width: 100%; }
            .ring-node { border: 1px solid #000 !important; padding: 15px !important; border-radius: 10px !important; background: none !important; grid-column: span 1 !important; }
            .ring-node b { font-size: 1.5rem !important; color: black !important; }
            .ring-node span { font-size: 0.7rem !important; color: #555 !important; }

            /* รายการอาหาร (ตารางเรียงลงมาเต็มหน้า) */
            .leaderboard-masonry { display: block !important; width: 100% !important; }
            .menu-tile { 
                display: flex !important; flex-direction: row !important; align-items: center !important; 
                padding: 12px 10px !important; border: none !important; border-bottom: 1px solid #ccc !important;
                border-radius: 0 !important; background: none !important; animation: none !important;
                page-break-inside: avoid;
            }
            .tile-rank { position: static !important; font-size: 1.1rem !important; opacity: 1 !important; color: black !important; width: 40px; }
            .tile-title { font-size: 1.1rem !important; flex-grow: 1 !important; font-weight: bold !important; }
            .tile-count { font-size: 1.1rem !important; color: black !important; width: 120px; text-align: right; margin: 0 20px; }
            .menu-tile div[style*="font-size:0.6rem"] { font-size: 0.9rem !important; opacity: 1 !important; color: #444 !important; width: 150px; text-align: right; }
        }

        /* 📱 Mobile UI Logic */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .grid-container { gap: 15px; }
            .analytics-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .analytics-header h1 { font-size: 1.8rem; }
            .timeline-box { grid-column: span 12; }
            .stat-cluster { grid-column: span 12; }
            .control-pill { border-radius: 25px; padding: 20px; flex-direction: column; align-items: stretch; gap: 15px; }
            .leaderboard-masonry { grid-template-columns: 1fr; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .menu-tile { animation: fadeIn 0.6s forwards; }
    </style>
</head>
<body onload="setupAndInit()">

    <div class="grid-container">
        
        <header class="analytics-header">
            <div>
                <span id="report-period" style="font-size: 0.7rem; color: var(--premium-gold); font-weight: 800; letter-spacing: 5px; text-transform: uppercase;">Business Intelligence</span>
                <h1 data-lang-th="บทวิเคราะห์" data-lang-en="ANALYTICS">บทวิเคราะห์</h1>
            </div>
            <div id="peak-status" style="font-size: 0.8rem; font-weight: 800; opacity: 0.6;"></div>
        </header>

        <section class="timeline-box">
            <span style="font-size: 0.65rem; font-weight: 900; color: var(--sub-text); text-transform: uppercase; letter-spacing: 2px;">Hourly Traffic Density</span>
            <div class="timeline-bars" id="peak-heatmap"></div>
        </section>

        <section class="stat-cluster">
            <div class="ring-node">
                <span data-lang-th="บิลทั้งหมด" data-lang-en="TOTAL BILLS">บิลทั้งหมด</span>
                <b id="stat-bills">0</b>
            </div>
            <div class="ring-node">
                <span data-lang-th="จำนวนจาน" data-lang-en="TOTAL DISHES">จำนวนจาน</span>
                <b id="stat-dishes">0</b>
            </div>
            <div class="ring-node" style="grid-column: span 2;">
                <span data-lang-th="เฉลี่ยรายการต่อบิล" data-lang-en="AVG ITEMS/BILL">เฉลี่ยรายการต่อบิล</span>
                <b id="stat-avg">0.0</b>
            </div>
        </section>

        <section class="control-pill">
            <div style="display:flex; gap:10px;">
                <button id="btn-monthly" class="minimal-btn active" onclick="switchMode('monthly')">MONTHLY</button>
                <button id="btn-yearly" class="minimal-btn" onclick="switchMode('yearly')">YEARLY</button>
                <button id="btn-range" class="minimal-btn" onclick="switchMode('range')">RANGE</button>
                
                <button class="minimal-btn" onclick="window.print()" style="border-color: var(--premium-gold); color: var(--premium-gold); font-weight: 900;">
                    <i class="fas fa-print"></i> PRINT REPORT
                </button>
            </div>
            <div id="control-inputs" style="display:flex; gap:20px; align-items:center;">
                <select id="select-month" class="minimal-select" onchange="initializeTrending()"></select>
                <div id="separator" style="width: 1px; height: 15px; background: var(--border);"></div>
                <select id="select-year" class="minimal-select" onchange="initializeTrending()"></select>
                
                <div id="range-inputs" style="display:none; gap:10px; align-items:center;">
                    <input type="date" id="start-date" class="minimal-date" onchange="initializeTrending()">
                    <span style="font-size: 0.7rem; font-weight: 800; color: var(--sub-text);">TO</span>
                    <input type="date" id="end-date" class="minimal-date" onchange="initializeTrending()">
                </div>
            </div>
        </section>

        <section class="leaderboard-masonry" id="trending-container"></section>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentMode = 'monthly';
        const currentAdmin = sessionStorage.getItem('currentAdminName');

        function setupAndInit() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            const mSel = document.getElementById('select-month');
            const ySel = document.getElementById('select-year');
            const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            mSel.innerHTML = months.map((m, i) => `<option value="${i}">${m.toUpperCase()}</option>`).join('');
            mSel.value = now.getMonth();
            ySel.innerHTML = [2024, 2025, 2026, 2027].map(y => `<option value="${y}">${y}</option>`).join('');
            ySel.value = now.getFullYear();

            document.getElementById('start-date').value = todayStr;
            document.getElementById('end-date').value = todayStr;

            if(typeof applyGlobalLanguage === 'function') applyGlobalLanguage();
            if(typeof applyGlobalTheme === 'function') applyGlobalTheme();

            initializeTrending();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-monthly').classList.toggle('active', mode === 'monthly');
            document.getElementById('btn-yearly').classList.toggle('active', mode === 'yearly');
            document.getElementById('btn-range').classList.toggle('active', mode === 'range');

            const isRange = mode === 'range';
            document.getElementById('range-inputs').style.display = isRange ? 'flex' : 'none';
            document.getElementById('select-month').style.display = (mode === 'monthly') ? 'block' : 'none';
            document.getElementById('select-year').style.display = (mode === 'monthly' || mode === 'yearly') ? 'block' : 'none';
            document.getElementById('separator').style.display = (mode === 'monthly') ? 'block' : 'none';

            initializeTrending();
        }

        async function initializeTrending() {
            const monthIdx = parseInt(document.getElementById('select-month').value);
            const year = parseInt(document.getElementById('select-year').value);
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const monthsNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

            // 🕒 ส่วนสำคัญ: อัปเดต วัน/เดือน/ปี ลงในหัวกระดาษรายงาน
            const periodLabel = document.getElementById('report-period');
            if (currentMode === 'monthly') {
                periodLabel.innerText = `REPORT PERIOD: ${monthsNames[monthIdx]} ${year}`;
            } else if (currentMode === 'yearly') {
                periodLabel.innerText = `REPORT PERIOD: YEAR ${year}`;
            } else if (currentMode === 'range') {
                periodLabel.innerText = `REPORT PERIOD: ${startDate} TO ${endDate}`;
            }

            const [ordersSnap, historySnap] = await Promise.all([
                db.ref('orders').once('value'), 
                db.ref('history').once('value')
            ]);
            
            const stats = {}; const hourly = Array(24).fill(0);
            let bTotal = 0, iTotal = 0;

            const process = (snap) => {
                if (snap.exists()) {
                    snap.forEach(c => {
                        const o = c.val();
                        const ts = o.timestamp || o.archivedAt;
                        if (!ts) return;

                        const d = new Date(ts);
                        const dateStr = d.toISOString().split('T')[0];
                        let isMatch = false;

                        if (currentMode === 'monthly') {
                            if (d.getFullYear() === year && d.getMonth() === monthIdx) isMatch = true;
                        } else if (currentMode === 'yearly') {
                            if (d.getFullYear() === year) isMatch = true;
                        } else if (currentMode === 'range') {
                            if (dateStr >= startDate && dateStr <= endDate) isMatch = true;
                        }

                        if (isMatch) {
                            bTotal++; 
                            hourly[d.getHours()]++;
                            if (o.items) {
                                o.items.forEach(i => {
                                    if (!stats[i.name]) stats[i.name] = { total: 0, tables: {} };
                                    const qty = parseInt(i.quantity || 1);
                                    stats[i.name].total += qty;
                                    stats[i.name].tables[o.tableNumber] = (stats[i.name].tables[o.tableNumber] || 0) + qty;
                                    iTotal += qty;
                                });
                            }
                        }
                    });
                }
            };

            process(ordersSnap); 
            process(historySnap);

            renderHeatmap(hourly);
            document.getElementById('stat-bills').innerText = bTotal.toLocaleString();
            document.getElementById('stat-dishes').innerText = iTotal.toLocaleString();
            document.getElementById('stat-avg').innerText = bTotal > 0 ? (iTotal/bTotal).toFixed(1) : "0.0";
            renderTrending(stats);
        }

        function renderHeatmap(data) {
            const container = document.getElementById('peak-heatmap');
            const max = Math.max(...data) || 1;
            const peakHr = data.indexOf(max);
            const lang = localStorage.getItem(`bf_lang_${currentAdmin}`) || 'th';
            
            container.innerHTML = data.map((v, hr) => `
                <div class="t-bar ${v === max && v > 0 ? 'peak' : ''}" style="height: ${((v / max) * 100) || 5}%"></div>
            `).join('');
            document.getElementById('peak-status').innerText = max > 0 ? (lang === 'th' ? `พีคสุดตอน ${peakHr}:00 น.` : `Peak at ${peakHr}:00`) : "";
        }

        function renderTrending(stats) {
            const lang = localStorage.getItem(`bf_lang_${currentAdmin}`) || 'th';
            const sorted = Object.entries(stats).sort((a, b) => b[1].total - a[1].total).slice(0, 20); // เพิ่มเป็น 20 รายการในรายงาน
            const max = sorted.length > 0 ? sorted[0][1].total : 1;
            const container = document.getElementById('trending-container');
            container.innerHTML = '';

            if (sorted.length === 0) {
                container.innerHTML = `<div style="grid-column: span 12; text-align: center; opacity: 0.5; padding: 50px;">ไม่พบข้อมูลในช่วงเวลาที่เลือก</div>`;
                return;
            }

            sorted.forEach(([name, data], idx) => {
                const pct = (data.total / max) * 100;
                const topTable = Object.entries(data.tables).sort((a,b) => b[1] - a[1])[0];
                
                container.innerHTML += `
                    <div class="menu-tile" style="animation-delay: ${idx * 0.05}s">
                        <div class="tile-rank">${idx + 1}</div>
                        <div class="tile-title">${name}</div>
                        <div class="tile-count">${data.total.toLocaleString()} ${lang==='th'?'จาน':'Sold'}</div>
                        <div class="progress-micro"><div class="progress-bar-micro" style="width:${pct}%"></div></div>
                        <div style="font-size:0.6rem; opacity:0.5; margin-top:5px;">TOP TABLE: ${topTable ? topTable[0] : 'N/A'}</div>
                    </div>`;
            });
        }
    </script>
    <script src="admin_script.js"></script>
</body>
</html>
