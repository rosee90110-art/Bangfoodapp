<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการขาย - BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-deep: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
            --success-green: #4CAF50;
        }

        body { background-color: var(--bg-deep); color: #f5f5f5; font-family: 'Kanit', sans-serif; margin: 0; overflow-x: hidden; }
        .history-app-container { padding: 20px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.8s ease-out; }
        
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .history-header h1 { font-size: 1.2rem; color: var(--premium-gold); margin: 0; letter-spacing: 2px; }
        .btn-back-admin { background: var(--glass); color: #888; padding: 10px 18px; border-radius: 12px; text-decoration: none; font-size: 0.8rem; border: 1px solid var(--border-dim); transition: 0.3s; }

        .summary-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--glass); padding: 18px; border-radius: 22px; text-align: center; border: 1px solid var(--border-dim); }
        .stat-label { display: block; font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #fff; }

        .filter-toggle-btn { background: var(--glass); padding: 15px; border-radius: 18px; border: 1px solid var(--border-dim); margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .filter-panel { display: none; background: #111; padding: 20px; border-radius: 22px; border: 1px dashed var(--premium-gold); margin-bottom: 20px; }

        /* 📜 รายการการ์ดประวัติ */
        .order-card { 
            background: var(--glass); padding: 20px; border-radius: 24px; 
            border: 1px solid var(--border-dim); margin-bottom: 15px; transition: 0.3s;
        }
        .order-card.active { border-color: var(--premium-gold); background: rgba(197, 160, 89, 0.05); }

        /* 📍 ส่วนแสดงรายการอาหารแบบละเอียด */
        .item-block { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .food-main-row { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 500; color: #fff; }
        .addon-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #777; margin-top: 4px; padding-left: 10px; }
        .addon-p { color: var(--premium-gold); }
        
        .item-sum-box { 
            text-align: right; margin-top: 12px; font-size: 0.85rem; color: #aaa; 
            padding: 6px 12px; background: rgba(255,255,255,0.02); border-radius: 10px;
        }

        .action-btn { flex: 1; border: none; padding: 12px; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.3s; }
        .btn-print { background: #2196F3; color: white; }
        .btn-delete { background: rgba(255, 71, 87, 0.1); color: #ff4757; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input { padding: 12px; border-radius: 12px; border: 1px solid var(--border-dim); background: #1a1a1a; color: #fff; width: 100%; box-sizing: border-box; outline: none; margin-top: 5px; }
    </style>
</head>
<body onload="initializeHistory()">

    <div class="history-app-container">
        <header class="history-header">
            <h1>📜 ประวัติการขาย</h1>
            <a href="admin_center.html" class="btn-back-admin">⬅ กลับแอดมิน</a>
        </header>

        <main>
            <div class="filter-toggle-btn" onclick="toggleFilterPanel()">
                <span style="color: var(--premium-gold);"><i class="fas fa-search"></i> ค้นหาตามวันที่/เวลา</span>
                <i id="filter-icon" class="fas fa-chevron-down" style="color: #444;"></i>
            </div>

            <div id="filter-panel" class="filter-panel">
                <div style="display: grid; gap: 15px;">
                    <div><label class="stat-label">วันที่ขาย</label><input type="date" id="search-date"></div>
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;"><label class="stat-label">ตั้งแต่</label><input type="time" id="start-time" value="00:00"></div>
                        <div style="flex: 1;"><label class="stat-label">ถึง</label><input type="time" id="end-time" value="23:59"></div>
                    </div>
                    <button onclick="filterHistoryByDateTime()" style="background: var(--premium-gold); color: black; border: none; padding: 15px; border-radius: 14px; cursor: pointer; font-weight: bold;">ค้นหาข้อมูล</button>
                </div>
            </div>

            <div class="summary-dashboard">
                <div class="stat-card"><span class="stat-label">จำนวนบิล</span><span id="total-bills" class="stat-value">0</span></div>
                <div class="stat-card" style="border-color: var(--success-green);"><span class="stat-label">รายได้รวม</span><span id="total-revenue" class="stat-value">0.00</span></div>
            </div>

            <div id="history-list">
                <p style="text-align:center; padding:50px; color:#333;">กำลังโหลดข้อมูล...</p>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCY...", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.firebasestorage.app", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allHistoryData = [];

    function initializeHistory() {
        db.ref('history').on('value', (snapshot) => {
            allHistoryData = [];
            if (snapshot.exists()) {
                snapshot.forEach((child) => { allHistoryData.push({ id: child.key, ...child.val() }); });
            }
            renderHistory(allHistoryData);
        });
    }

    function renderHistory(data) {
        const list = document.getElementById('history-list');
        const billsEl = document.getElementById('total-bills');
        const revEl = document.getElementById('total-revenue');
        let html = ''; let totalSum = 0;
        data.sort((a, b) => b.archivedAt - a.archivedAt);

        data.forEach((order) => {
            totalSum += parseFloat(order.total || 0);
            
            // 📍 ประมวลผลแยกราคาออฟชันเสริม
            let itemsHtml = order.items ? order.items.map(item => {
                const finalP = parseFloat(item.finalPrice || 0);
                let optHtml = ''; let optSum = 0;

                if (item.optionsArray && item.optionsArray.length > 0) {
                    optHtml = item.optionsArray.map(opt => {
                        const op = parseFloat(opt.price || 0);
                        optSum += op;
                        return `<div class="addon-row"><span>+ ${opt.name}</span><span class="addon-p">฿${op.toFixed(2)}</span></div>`;
                    }).join('');
                }

                const baseP = finalP - optSum;
                return `
                    <div class="item-block">
                        <div class="food-main-row"><span>${item.quantity || 1}x ${item.name}</span><span>฿${baseP.toFixed(2)}</span></div>
                        <div class="addon-list">${optHtml}</div>
                        <div class="item-sum-box">รวมรายการนี้: ฿${finalP.toFixed(2)}</div>
                    </div>`;
            }).join('') : '';

            html += `
                <div class="order-card" id="card-${order.id}">
                    <div onclick="toggleDetails('${order.id}')" style="cursor:pointer;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="background:var(--premium-gold); color:#000; padding:4px 12px; border-radius:10px; font-size:0.75rem; font-weight:bold;">โต๊ะ ${order.tableNumber || 'N/A'}</span>
                            <b style="font-size:1.2rem; color:var(--premium-gold);">฿${order.total}</b>
                        </div>
                        <div style="color:#444; font-size:0.7rem; margin-top:10px; letter-spacing:1px;">
                            <i class="far fa-clock"></i> ${new Date(order.archivedAt).toLocaleString('th-TH')}
                        </div>
                    </div>
                    <div id="details-${order.id}" style="display:none;">
                        ${itemsHtml}
                        <div style="display:flex; gap:10px; margin-top:20px;">
                            <button onclick="alert('กำลังพิมพ์...')" class="action-btn btn-print"><i class="fas fa-print"></i> พิมพ์ใบเสร็จ</button>
                            <button onclick="deleteEntry('${order.id}')" class="action-btn btn-delete"><i class="fas fa-trash-alt"></i> ลบประวัติ</button>
                        </div>
                    </div>
                </div>`;
        });

        list.innerHTML = data.length ? html : '<p style="text-align:center; padding:50px; color:#444;">ไม่มีข้อมูลประวัติครับน้า</p>';
        billsEl.textContent = data.length;
        revEl.textContent = totalSum.toLocaleString('th-TH', { minimumFractionDigits: 2 });
    }

    window.toggleDetails = function(id) {
        const el = document.getElementById(`details-${id}`);
        const card = document.getElementById(`card-${id}`);
        const isOpen = el.style.display === "block";
        el.style.display = isOpen ? "none" : "block";
        if (!isOpen) card.classList.add('active'); else card.classList.remove('active');
    };

    window.filterHistoryByDateTime = function() {
        const searchDate = document.getElementById('search-date').value;
        const startTime = document.getElementById('start-time').value;
        const endTime = document.getElementById('end-time').value;
        if (!searchDate) return alert("เลือกวันที่ก่อนครับน้า");

        const filtered = allHistoryData.filter(order => {
            const d = new Date(order.archivedAt);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const timeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            return dateStr === searchDate && timeStr >= startTime && timeStr <= endTime;
        });
        renderHistory(filtered);
        toggleFilterPanel();
    };

    window.toggleFilterPanel = function() {
        const panel = document.getElementById('filter-panel');
        const icon = document.getElementById('filter-icon');
        const isOpen = panel.style.display === "block";
        panel.style.display = isOpen ? "none" : "block";
        icon.className = isOpen ? "fas fa-chevron-down" : "fas fa-chevron-up";
    };

    window.deleteEntry = (id) => confirm("ลบประวัตินี้ถาวรเลยนะน้า?") && db.ref(`history/${id}`).remove();
</script>
</body>
</html>
