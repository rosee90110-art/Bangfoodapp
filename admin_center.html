<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Center | BANGFOOD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff9800, #f44336);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        .admin-header {
            padding: 40px 25px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .admin-header h1 {
            font-size: 1.6rem;
            letter-spacing: 5px;
            margin: 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* 📋 Grid เมนูหลัก */
        .admin-menu-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-card {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .menu-card:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.1);
        }

        .menu-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
            font-size: 1.8rem;
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.3);
        }

        .menu-info b {
            display: block;
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .menu-info small {
            color: #888;
            font-size: 0.85rem;
        }

        .exit-btn {
            display: block;
            text-align: center;
            margin-top: 50px;
            color: #555;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
        }

        .exit-btn:hover {
            color: #ff4444;
            border-color: #ff4444;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1>ADMIN CENTER</h1>
    </header>

    <div class="container">
        <div class="admin-menu-list">
            
            <a href="admin.html" class="menu-card">
                <div class="menu-icon">📑</div>
                <div class="menu-info">
                    <b>จัดการคำสั่งซื้อ</b>
                    <small>ดูออเดอร์ใหม่ และสถานะการทำอาหาร</small>
                </div>
            </a>

            <a href="history.html" class="menu-card">
                <div class="menu-icon">📜</div>
                <div class="menu-info">
                    <b>ประวัติการสั่งซื้อ</b>
                    <small>ตรวจสอบยอดขาย และรายการย้อนหลัง</small>
                </div>
            </a>

            <a href="edit_products.html" class="menu-card">
                <div class="menu-icon">🥘</div>
                <div class="menu-info">
                    <b>แก้ไข/จัดการสินค้า</b>
                    <small>เพิ่มเมนูใหม่ แก้ไขราคา และรูปภาพ</small>
                </div>
            </a>

            <a href="admin_users.html" class="menu-card">
                <div class="menu-icon">👥</div>
                <div class="menu-info">
                    <b>จัดการยูสเซอร์แอดมิน</b>
                    <small>ดูรายชื่อ, ลบ หรือแก้ไขบัญชีผู้ดูแลระบบ</small>
                </div>
            </a>

        </div>

        <div onclick="logoutAdmin()" class="exit-btn">ออกจากโหมดแอดมิน / Logout</div>
    </div>

<script>
    // ตรวจสอบว่าแอดมินล็อคอินอยู่หรือไม่ ถ้าไม่มีให้เด้งออกไปหน้าแรก
    function checkLoginStatus() {
        const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
        if (isLoggedIn !== 'true') {
            window.location.href = "start.html";
        }
    }

    function logoutAdmin() {
        if(confirm("ยืนยันการออกจากระบบแอดมิน?")) {
            sessionStorage.removeItem('isAdminLoggedIn');
            sessionStorage.removeItem('currentAdminName'); // ลบชื่อแอดมินที่ล็อคอินอยู่ด้วย
            window.location.href = "start.html";
        }
    }
    
    // เรียกใช้ตอนโหลดหน้า
    window.onload = checkLoginStatus;
</script>
</body>
</html>
