<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .top-header { top: 20px; right: 20px; z-index: 1001; }
        .menu-toggle { flex-direction: column; gap: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .menu-toggle span { width: 15px; height: 1.5px; background-color: white; }
        .admin-dropdown { position: fixed; top: 70px; right: 20px; width: 180px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(15px); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1002; display: none; overflow: hidden; animation: fadeInDown 0.3s ease-out; }
        .admin-dropdown.active { display: block; }
        .dropdown-item { display: block; padding: 15px; color: white; text-decoration: none; font-size: 0.85rem; transition: 0.3s; }
        .dropdown-item:hover { background: rgba(255, 255, 255, 0.1); color: #ff4b2b; }
        .dropdown-divider { height: 1px; background: rgba(255,255,255,0.05); }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .app-header-title { font-size: 3.5rem; font-weight: 700; letter-spacing: 5px; margin-bottom: 5px; color: white; text-shadow: 5px 5px 7px rgba(0, 0, 0, 0.8), 0 10px 20px rgba(0, 0, 0, 0.5), 0 20px 40px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>

<header id="menu-container" class="app-header">
    <a href="start.html" class="back-link">
        <i class="fas fa-chevron-left"></i> <span id="txt-back">กลับ</span>
    </a>
    <h1 class="bangfoodindex">BANGFOOD</h1>
    <div class="top-header">
        <div class="menu-toggle" onclick="toggleAdminMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div id="admin-dropdown" class="admin-dropdown">
        <a href="admin.html" id="txt-admin" class="dropdown-item">⚙️ โหมดผู้ดูแลระบบ</a>
        <div class="dropdown-divider"></div>
        <div class="language-select dropdown-item" style="cursor:pointer" onclick="switchLanguage()">
            <span id="lang-text">🌐 TH | EN</span>
        </div>
    </div>
</header>

<main class="menu-container">
    <div class="menu-tabs"> 
        <a href="#" class="menu-tab active" id="tab-food" data-category="อาหาร" onclick="switchCategory('อาหาร', event)">อาหาร</a>
        <a href="#" class="menu-tab" id="tab-noodle" data-category="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว', event)">ก๋วยเตี๋ยว</a>
        <a href="#" class="menu-tab" id="tab-drink" data-category="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม', event)">เครื่องดื่ม</a>
    </div>
    <div id="food-container" class="menu-category-content"></div>
    <div id="noodle-container" class="menu-category-content" style="display: none;"></div>
    <div id="drink-container" class="menu-category-content" style="display: none;"></div>
</main>

<div class="curved-nav-container">
    <div class="nav-bg-curved">
        <svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0,100 L400,100 L400,40 C360,40 340,40 330,60 C320,80 280,80 270,60 C260,40 240,40 200,40 C160,40 140,40 130,60 C120,80 80,80 70,60 C60,40 40,40 0,40 Z" fill="#121212"/></svg>
    </div>
    <div class="nav-buttons-wrapper">
        <div class="nav-btn-box">
            <button class="round-btn side" onclick="window.location.href='cart.html?table=' + localStorage.getItem('selectedTable')">🛒</button>
            <span class="label" id="lbl-cart">ตะกร้า</span>
        </div>
        <div class="nav-btn-box main-box">
            <button class="round-btn center" onclick="window.location.href='index.html?table=' + localStorage.getItem('selectedTable')">🏠</button>
        </div>
        <div class="nav-btn-box">
            <button class="round-btn side" onclick="window.location.href='track.html?table=' + localStorage.getItem('selectedTable')">📍</button>
            <span class="label" id="lbl-track">ติดตาม</span>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const translations = {
    th: {
        // ... ข้อความเดิมของน้า ...
        "ข้าวผัด": "ข้าวผัด","ข้าวผัดไข่": "ข้าวผัดไข่","ข้าวผัดเนื้อ": "ข้าวผัดเนื้อ","ข้าวผัดปู": "ข้าวผัดปู","ข้าวผัดทะเล": "ข้าวผัดทะเล","ข้าวผัดต้มยำ": "ข้าวผัดต้มยำ",
        "txt-back": "กลับ", "txt-admin": "⚙️ โหมดผู้ดูแลระบบ", "tab-food": "อาหาร", "tab-noodle": "ก๋วยเตี๋ยว", "tab-drink": "เครื่องดื่ม", "lbl-cart": "ตะกร้า", "lbl-track": "ติดตาม", "unit": "บาท", "out": "(หมด)", "add": "+ เพิ่ม", "sold": "หมด"
    },
    en: {
        // ... ข้อความเดิมของน้า ...
        "ข้าวผัด": "Fried Rice","ข้าวผัดไข่": "Egg Fried Rice","ข้าวผัดเนื้อ": "Beef Fried Rice","ข้าวผัดปู": "Crab Fried Rice","ข้าวผัดทะเล": "Seafood Fried Rice","ข้าวผัดต้มยำ": "Tom Yum Fried Rice",
        "txt-back": "Back", "txt-admin": "⚙️ Admin Mode", "tab-food": "Food", "tab-noodle": "Noodles", "tab-drink": "Drinks", "lbl-cart": "Cart", "lbl-track": "Track", "unit": "THB", "out": "(Out)", "add": "+ Add", "sold": "Out"
    }
};


    function applyPageLanguage() {
        const lang = localStorage.getItem('appLang') || 'th';
        Object.keys(translations[lang]).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerText = translations[lang][id];
        });
    }

    function switchLanguage() {
        const currentLang = localStorage.getItem('appLang') || 'th';
        localStorage.setItem('appLang', currentLang === 'th' ? 'en' : 'th');
        applyPageLanguage();
        loadMenuFromFirebase(); // รีโหลดเมนูอาหารเพื่อให้เปลี่ยนภาษาทันที
    }

    function toggleAdminMenu() { document.getElementById('admin-dropdown').classList.toggle('active'); }

    // Firebase Config
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadMenuFromFirebase() {
        const productsRef = db.ref('products');
        productsRef.on('value', (snapshot) => {
            const products = snapshot.val();
            const lang = localStorage.getItem('appLang') || 'th'; // ดึงภาษาปัจจุบันมาเช็ค
            
            const containers = { 
                'อาหาร': 'food-container', 
                'ก๋วยเตี๋ยว': 'noodle-container', 
                'เครื่องดื่ม': 'drink-container' 
            };
            
            Object.values(containers).forEach(id => { 
                const c = document.getElementById(id); 
                if(c) c.innerHTML = ''; 
            });

            for (let id in products) {
                const p = products[id];
                const isOut = p.status === 'out_of_stock';

                // 📍 จุดสำคัญ: แปลงชื่ออาหารโดยเทียบจากคลัง translations
                // ถ้าในคลังมีชื่ออาหารนี้ (เช่น "ข้าวผัดทะเล") ให้ใช้คำแปลภาษาอังกฤษ (Seafood Fried Rice) 
                // ถ้าหาไม่เจอ ให้ใช้ชื่อเดิมจาก Firebase ครับ
                const translatedName = translations[lang][p.name] || p.name;

                const statusTxt = isOut ? `<span style="color:red;">${translations[lang].out}</span>` : '';
                const btnTxt = isOut ? translations[lang].sold : translations[lang].add;
                const priceUnit = translations[lang].unit;

                const productHTML = `
                    <div class="menu-item" style="${isOut ? 'opacity: 0.6;' : ''}">
                        <img src="${p.img}" class="item-image" style="${isOut ? 'filter: grayscale(1);' : ''}">
                        <div class="item-details">
                            <h3 class="item-name">${translatedName} ${statusTxt}</h3>
                            <div class="item-price"><span>${p.price}</span> ${priceUnit}</div>
                        </div>
                        ${isOut 
                            ? `<button class="add-to-cart-btn" disabled style="background:#888;">${btnTxt}</button>` 
                            : `<a href="${p.category === 'เครื่องดื่ม' ? 'drink.html' : 'menu.html'}?name=${encodeURIComponent(p.name)}&price=${p.price}&img=${p.img}" class="add-to-cart-btn">${btnTxt}</a>`
                        }
                    </div>`;

                const container = document.getElementById(containers[p.category]);
                if (container) container.innerHTML += productHTML;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => { applyPageLanguage(); loadMenuFromFirebase(); });
</script>
</body>
</html>
