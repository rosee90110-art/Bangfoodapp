<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตัวเลือกอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --soft-gold: rgba(197, 160, 89, 0.12);
            --bg-dark: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --text-main: #e0e0e0;
        }

        body { 
            background-color: #000; color: var(--text-main); 
            font-family: 'Kanit', sans-serif; margin: 0; 
            overflow-x: hidden; letter-spacing: 0.1px;
            display: flex; justify-content: center;
        }

        .main-wrapper {
            width: 100%; max-width: 480px; 
            min-height: 100vh; background-color: var(--bg-dark);
            position: relative; padding-bottom: 240px; /* เว้นที่ให้แถบเฟดมืด */
            animation: fadeInPage 1s ease-out;
        }

        /* 📍 Header - Slim & Shimmer */
        .app-header {
            background: rgba(10, 10, 11, 0.9); backdrop-filter: blur(20px);
            padding: 18px 25px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid var(--glass-border);
        }
        .bangfood { 
            font-size: 0.95rem; font-weight: 600; letter-spacing: 4px;
            background: linear-gradient(90deg, #8e6d31, #fff, #c5a059);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
        }

        /* 📍 Hero Section - Floating Effect */
        .item-hero-section { padding: 35px 20px 15px; text-align: center; }
        .modal-image {
            width: 70%; max-width: 200px; border-radius: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7); border: 1px solid var(--glass-border);
            animation: imageFloat 3s ease-in-out infinite, popIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .section-label { 
            color: #444; font-size: 0.65rem; margin: 30px 30px 10px; 
            text-transform: uppercase; font-weight: 700; letter-spacing: 2px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-label::after { content: ""; flex: 1; height: 1px; background: var(--glass-border); }

        .option-item { 
            display: flex; align-items: center; padding: 15px 22px; 
            background: var(--glass); border-radius: 20px; 
            margin: 0 25px 12px; cursor: pointer; border: 1px solid var(--glass-border);
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            animation: slideUp 0.8s ease-out both;
        }
        .option-item:active { transform: scale(0.97); }
        .option-item:has(input:checked) { 
            background: var(--soft-gold); border-color: var(--premium-gold); 
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
        }
        .option-item input { margin-right: 15px; accent-color: var(--premium-gold); width: 18px; height: 18px; }

        /* 📍 แถบเฟดมืดด้านล่าง (Bottom Gradient Overlay) */
        .bottom-fade-layer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 220px;
            background: linear-gradient(to top, #000 30%, rgba(0,0,0,0.8) 60%, transparent 100%);
            z-index: 1400; pointer-events: none;
        }

        /* 📍 Floating Price - Stealth Glow */
        .price-summary-float {
            position: fixed; bottom: 105px; left: 2.5%; transform: translateX(-50%);
            width: 82%; max-width: 340px;
            background: rgba(20, 20, 22, 0.95); backdrop-filter: blur(30px);
            border: 1px solid rgba(197, 160, 89, 0.5);
            padding: 2px 25px; border-radius: 24px; z-index: 1500;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            animation: slideUp 0.8s ease-out both 0.5s;
        }
        .price-label { font-size: 0.65rem; color: #666; font-weight: 700; letter-spacing: 1px; }
        .price-amount { 
            color: var(--premium-gold); font-weight: 700; font-size: 1.6rem; 
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* 📍 Bottom Nav - Balanced Curves */
        .curved-nav-container {
            position: fixed; bottom: 15px; left: 4.5%; transform: translateX(-50%);
            width: 92%; max-width: 420px; height: 75px; z-index: 2000;
            display: flex; justify-content: center; align-items: flex-end; pointer-events: none;
            animation: slideUp 1s ease-out both 0.9s;
        }
        .nav-buttons-wrapper {
            background: rgba(18, 18, 20, 0.98); width: 100%; height: 68px; border-radius: 34px;
            border: 1px solid var(--glass-border); pointer-events: auto;
            display: flex; justify-content: space-around; align-items: center;
            -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 52px, black 53px);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        /* 📍 Confirm Button - Premium Breath */
        .round-btn.center {
            position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
            width: 78px; height: 78px; z-index: 2100; pointer-events: auto;
            background: linear-gradient(135deg, #c5a059, #8e6d31);
            border-radius: 50%; font-size: 2.2rem; color: #fff;
            border: 8px solid #0a0a0b;
            display: flex; justify-content: center; align-items: center;
            animation: confirmBreath 3s ease-in-out infinite;
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.4);
            cursor: pointer;
        }

        /* 📍 Keyframes */
        @keyframes shineText { to { background-position: 200% center; } }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes imageFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes confirmBreath { 
            0%, 100% { transform: translateX(-50%) scale(1); filter: brightness(1); } 
            50% { transform: translateX(-50%) scale(1.06); filter: brightness(1.2); box-shadow: 0 0 45px rgba(197, 160, 89, 0.6); } 
        }

        .side-btn { background: none; border: none; color: #444; font-size: 1.3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: 0.4s; }
        .side-btn:active { color: var(--premium-gold); transform: scale(0.9); }
        .nav-text { font-size: 0.6rem; margin-top: 5px; font-weight: 700; letter-spacing: 1px; color: #333; }
        .note-area { width: 100%; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px; color: #fff; padding: 15px; box-sizing: border-box; outline: none; font-size: 0.9rem; font-family: inherit; resize: none; transition: 0.3s; }
        .note-area:focus { border-color: var(--premium-gold); background: rgba(255,255,255,0.05); }
    </style>
</head>
<body onload="initializeMenuPage()">

    <div class="bottom-fade-layer"></div>

    <div class="main-wrapper">
        <header class="app-header">
            <a href="javascript:history.back()" style="color: #444; font-size: 1.2rem;"><i class="fas fa-arrow-left"></i></a>
            <h1 class="bangfood">SELECTION</h1>
            <div style="width: 25px;"></div>
        </header>

        <div class="item-hero-section">
            <img id="modal-item-image" src="" alt="food" class="modal-image">
            <h2 id="modal-item-name" style="margin: 25px 0 5px; font-size: 1.4rem; font-weight: 500; color: #fff;"></h2>
            <p style="color: var(--premium-gold); font-size: 0.9rem; opacity: 0.7;">Starting from ฿<span id="modal-base-price">0.00</span></p>
        </div>

        <form id="custom-order-form">
            <div id="dynamic-sizes-container"></div>
            <div id="dynamic-addons-container"></div>
            <div style="padding: 10px 25px;">
                <p class="section-label">Special Notes</p>
                <textarea id="modal-notes" rows="2" class="note-area" placeholder="ระบุความต้องการของคุณ..."></textarea>
            </div>
        </form>

        <div class="price-summary-float">
            <div class="price-label">TOTAL AMOUNT</div>
            <div class="price-amount">฿<span id="modal-final-price">0.00</span></div>
        </div>

        <div class="curved-nav-container">
            <div class="round-btn center" onclick="confirmOrder()">
                <i class="fas fa-check"></i>
            </div>
            <div class="nav-buttons-wrapper">
                <button class="side-btn" onclick="window.location.href='index.html?table=' + localStorage.getItem('selectedTable')">
                    <i class="fas fa-home"></i>
                    <span class="nav-text">HOME</span>
                </button>
                <div style="width: 90px;"></div>
                <button class="side-btn" onclick="window.location.href='cart.html?table=' + localStorage.getItem('selectedTable')">
                    <i class="fas fa-shopping-basket"></i>
                    <span class="nav-text">CART</span>
                </button>
            </div>
        </div>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function initializeMenuPage() {
        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        const tableNo = urlParams.get('table') || localStorage.getItem('selectedTable') || '1';
        localStorage.setItem('selectedTable', tableNo);
        if (!nameParam) return;

        db.ref('products').orderByChild('name').equalTo(nameParam).once('value', snapshot => {
            const data = snapshot.val();
            if (data) {
                const product = Object.values(data)[0];
                document.getElementById('modal-item-name').innerText = product.name;
                document.getElementById('modal-base-price').innerText = parseFloat(product.price).toFixed(2);
                document.getElementById('modal-item-image').src = product.img;
                renderOptions(product.config || {});
                updatePrice();
            }
        });
    }

    function renderOptions(config) {
        const sizeContainer = document.getElementById('dynamic-sizes-container');
        if (config.sizes) {
            sizeContainer.innerHTML = `<h3 class="section-label">Selection Size</h3>`;
            config.sizes.forEach((s, i) => {
                const item = document.createElement('label');
                item.className = 'option-item';
                item.style.animationDelay = (0.4 + (i * 0.1)) + 's';
                item.innerHTML = `<input type="radio" name="size" value="${s.name}" data-modifier="${s.price}" ${i===0?'checked':''} onchange="updatePrice()"><span style="font-size: 0.95rem;">${s.name}</span><span style="margin-left:auto; color:var(--premium-gold); font-weight:500;">+${s.price}</span>`;
                sizeContainer.appendChild(item);
            });
        }
        const addonContainer = document.getElementById('dynamic-addons-container');
        if (config.addons) {
            addonContainer.innerHTML = `<h3 class="section-label">Extra Add-ons</h3>`;
            config.addons.forEach((a, i) => {
                const item = document.createElement('label');
                item.className = 'option-item';
                item.style.animationDelay = (0.6 + (i * 0.1)) + 's';
                item.innerHTML = `<input type="checkbox" name="addon" value="${a.name}" data-modifier="${a.price}" onchange="updatePrice()"><span style="font-size: 0.95rem;">${a.name}</span><span style="margin-left:auto; color:var(--premium-gold); font-weight:500;">+${a.price}</span>`;
                addonContainer.appendChild(item);
            });
        }
    }

    function updatePrice() {
        const base = parseFloat(document.getElementById('modal-base-price').innerText);
        let extra = 0;
        const size = document.querySelector('input[name="size"]:checked');
        if (size) extra += parseFloat(size.dataset.modifier);
        document.querySelectorAll('input[name="addon"]:checked').forEach(a => extra += parseFloat(a.dataset.modifier));
        document.getElementById('modal-final-price').innerText = (base + extra).toFixed(2);
    }

    function confirmOrder() {
        const tableNo = localStorage.getItem('selectedTable');
        const cartKey = `bangfood_cart_table_${tableNo}`;
        let cart = JSON.parse(sessionStorage.getItem(cartKey)) || { items: [] };
        const size = document.querySelector('input[name="size"]:checked');
        let options = size ? "• " + size.value : "";
        document.querySelectorAll('input[name="addon"]:checked').forEach(a => options += "<br>• " + a.value);
        const notes = document.getElementById('modal-notes').value;
        if(notes) options += "<br>📝 " + notes;
        cart.items.push({ 
            name: document.getElementById('modal-item-name').innerText, 
            finalPrice: document.getElementById('modal-final-price').innerText, 
            options: options, 
            img: document.getElementById('modal-item-image').src, 
            quantity: 1 
        });
        sessionStorage.setItem(cartKey, JSON.stringify(cart));
        window.location.href = `index.html?table=${tableNo}`;
    }
</script>
</body>
</html>
