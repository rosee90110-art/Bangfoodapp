<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการแอดมินออนไลน์ | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ... (คงสไตล์เดิมที่น้าชอบไว้ทั้งหมดครับ) ... */
        :root { --premium-gold: #c5a059; --bg-deep: #0a0a0a; --glass: rgba(255, 255, 255, 0.03); --border-dim: rgba(255, 255, 255, 0.08); --success: #4CAF50; }
        body { background-color: var(--bg-deep); color: #fff; font-family: 'Kanit', sans-serif; margin: 0; background-image: radial-gradient(circle at 50% -20%, #252525 0%, #0a0a0a 70%); min-height: 100vh; }
        .header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(25px); padding: 22px 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-dim); }
        .container { max-width: 450px; margin: 0 auto; padding: 25px; padding-bottom: 120px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-item { background: var(--glass); padding: 25px 15px; border-radius: 32px; border: 1px solid var(--border-dim); text-align: center; }
        .stat-item b { display: block; font-size: 2rem; color: var(--premium-gold); }
        .btn-add-user { width: 100%; padding: 20px; background: rgba(197, 160, 89, 0.05); border: 1px dashed var(--premium-gold); border-radius: 28px; color: var(--premium-gold); font-size: 0.95rem; cursor: pointer; margin-bottom: 35px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .user-card { background: var(--glass); border: 1px solid var(--border-dim); padding: 28px; border-radius: 35px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .user-card.is-me { border-color: rgba(197, 160, 89, 0.3); background: rgba(197, 160, 89, 0.05); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 12px; background: #333; }
        .online-now { background: var(--success); box-shadow: 0 0 15px var(--success); }
        #edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
        .modal-content { background: #111; padding: 45px 35px; border-radius: 40px; width: 82%; max-width: 310px; border: 1px solid var(--border-dim); text-align: center; }
        input, select { width: 100%; padding: 18px; margin: 10px 0; border-radius: 20px; border: 1px solid #1a1a1a; background: #000; color: #fff; outline: none; font-family: inherit; box-sizing: border-box; }
        .btn-save-modal { width: 100%; padding: 20px; background: var(--premium-gold); border: none; border-radius: 22px; color: #000; font-weight: 600; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <a href="admin_center.html" style="color:var(--premium-gold);"><i class="fas fa-arrow-left"></i></a>
    <h2 style="font-size:1rem; letter-spacing:2px;">ONLINE ADMINS</h2>
    <div style="width:25px;"></div>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-item"><b id="total-admins">0</b><span>Accounts</span></div>
        <div class="stat-item"><b id="online-admins">1</b><span>Active Now</span></div>
    </div>
    <button id="add-admin-btn" class="btn-add-user" onclick="openAddModal()">+ Add New Admin</button>
    <div id="admin-list-container"></div>
</div>

<div id="edit-modal">
    <div class="modal-content">
        <h3 style="color:var(--premium-gold); font-weight:400; margin-bottom:20px;">MANAGE ACCOUNT</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="edit-username" placeholder="Username">
        <input type="text" id="edit-password" placeholder="Password">
        <select id="edit-role">
            <option value="Staff">พนักงาน (Staff)</option>
            <option value="Super Admin">เจ้าของร้าน (Super Admin)</option>
        </select>
        <button class="btn-save-modal" onclick="saveAdminChanges()">Save Account</button>
        <button onclick="closeModal()" style="background:none; border:none; color:#444; margin-top:20px;">Cancel</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 📍 1. ตั้งค่า Firebase ให้ตรงกับของน้า
    const firebaseConfig = { 
        apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", 
        authDomain: "bangfood-cb30f.firebaseapp.com", 
        databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", 
        projectId: "bangfood-cb30f", 
        storageBucket: "bangfood-cb30f.appspot.com", 
        messagingSenderId: "390955623784", 
        appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" 
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function renderAdmins() {
        db.ref('admins').on('value', snap => {
            const container = document.getElementById('admin-list-container');
            const currentLoginUser = sessionStorage.getItem('currentAdminName');
            container.innerHTML = '';
            
            if (snap.exists()) {
                const admins = snap.val();
                const adminIds = Object.keys(admins);
                document.getElementById('total-admins').innerText = adminIds.length;

                adminIds.forEach(id => {
                    const admin = admins[id];
                    const isMe = (admin.username === currentLoginUser);

                    container.innerHTML += `
                        <div class="user-card ${isMe ? 'is-me' : ''}">
                            <div class="user-info">
                                <span style="font-size:0.6rem; color:var(--premium-gold); letter-spacing:2px;">${admin.role}</span>
                                <b><span class="status-dot ${isMe ? 'online-now' : ''}"></span>${admin.username}</b>
                                <span style="font-size:0.75rem; color:#333; margin-top:10px; display:block;">Pass: ${admin.password}</span>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <i class="fas fa-edit" style="color:#444; cursor:pointer;" onclick='openEditModal("${id}", ${JSON.stringify(admin)})'></i>
                                ${!isMe ? `<i class="fas fa-trash" style="color:#500; cursor:pointer;" onclick="deleteAdmin('${id}')"></i>` : ''}
                            </div>
                        </div>`;
                });
            }
        });
    }

    function saveAdminChanges() {
        const id = document.getElementById('edit-id').value;
        const data = {
            username: document.getElementById('edit-username').value.trim(),
            password: document.getElementById('edit-password').value.trim(),
            role: document.getElementById('edit-role').value
        };

        if (!data.username || !data.password) return alert("กรุณากรอกข้อมูล");

        if (id) {
            db.ref('admins/' + id).update(data).then(() => closeModal());
        } else {
            db.ref('admins').push(data).then(() => closeModal());
        }
    }

    function deleteAdmin(id) {
        if (confirm("ลบแอดมินคนนี้?")) db.ref('admins/' + id).remove();
    }

    function openAddModal() {
        document.getElementById('edit-id').value = "";
        document.getElementById('edit-username').value = "";
        document.getElementById('edit-password').value = "";
        document.getElementById('edit-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('edit-modal').classList.add('active'), 10);
    }

    function openEditModal(id, admin) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-username').value = admin.username;
        document.getElementById('edit-password').value = admin.password;
        document.getElementById('edit-role').value = admin.role;
        document.getElementById('edit-modal').style.display = 'flex';
        setTimeout(() => document.getElementById('edit-modal').classList.add('active'), 10);
    }

    function closeModal() {
        document.getElementById('edit-modal').classList.remove('active');
        setTimeout(() => document.getElementById('edit-modal').style.display = 'none', 400);
    }

    window.onload = renderAdmins;
</script>
</body>
</html>
