<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    :root {
        --premium-gold: #c5a059;
        --bg-deep: #0a0a0a;
        --glass-soft: rgba(255, 255, 255, 0.03);
        --border-dim: rgba(255, 255, 255, 0.08);
        --text-main: #e0e0e0;
    }

    body { 
        background-color: rgb(17, 16, 13); color: var(--text-main); 
        font-family: 'Kanit', sans-serif; margin: 0; 
        padding-bottom: 180px; 
        overflow-x: hidden; letter-spacing: 0.1px;
    }

    /* 📍 Header + แอนิเมชันชื่อร้านเรืองแสง */
    .app-header {
        background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px);
        padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
        position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid var(--border-dim);
    }
    .bangfoodindex { 
        font-size: 1.15rem; font-weight: 600; letter-spacing: 4px; margin: 0;
        background: linear-gradient(90deg, #c5a059, #fff, #c5a059);
        background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: shineText 4s linear infinite;
    }

    /* 📍 Premium Title Area */
    .premium-title-container { padding: 20px 20px 5px; display: flex; flex-direction: column; gap: 8px; }
    .premium-title-container h2 {
        margin: 0; font-size: 0.9rem; font-weight: 500; color: var(--premium-gold);
        letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        background: linear-gradient(90deg, #c5a059, #fff, #c5a059);
        background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: shineText 3s linear infinite;
    }
    .gold-line { height: 1.5px; background: linear-gradient(90deg, var(--premium-gold), transparent); width: 60px; border-radius: 10px; }

    /* 📍 Shimmer Effect for Menu Name */
    .shimmer-text {
        background: linear-gradient(90deg, #fff, var(--premium-gold), #fff);
        background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        animation: shineText 3s linear infinite;
        display: inline-block;
    }

    /* 📍 Slider Area */
    .slider-container { position: relative; width: 100%; margin-top: 5px; z-index: 100; }
    .image-slider { 
        display: flex; overflow-x: auto; scroll-snap-type: x mandatory; 
        gap: 12px; padding: 10px 10%; scrollbar-width: none;
        scroll-behavior: smooth; /* 📍 เพื่อให้การเลื่อนอัตโนมัติดูสมูท */
    }
    .image-slider::-webkit-scrollbar { display: none; }
    
    .slide-card {
        flex: 0 0 82%; scroll-snap-align: center; position: relative;
        border-radius: 22px; overflow: hidden; height: 185px; 
        border: 1px solid var(--border-dim); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        transform: scale(0.94); opacity: 0.6; cursor: pointer;
    }
    .slide-card.is-active { 
        transform: scale(1); opacity: 1; border-color: var(--premium-gold); 
        box-shadow: 0 0 25px rgba(197, 160, 89, 0.3); 
    }
    .slide-card img { width: 100%; height: 100%; object-fit: cover; }

    .recommend-badge { 
        position: absolute; top: 12px; right: 12px; background: var(--premium-gold); 
        color: #000; padding: 4px 10px; border-radius: 8px; font-size: 0.6rem; font-weight: 800; z-index: 10;
        pointer-events: none;
    }

    .slide-info { 
        position: absolute; bottom: 0; left: 0; right: 0; 
        padding: 12px 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
        border-top: 1.5px solid var(--premium-gold); z-index: 10; pointer-events: none;
    }
    .slide-info h3 { font-size: 0.9rem; margin: 0; color: #fff; }

    /* 📍 Indicators */
    .slider-indicators { display: flex; justify-content: center; gap: 8px; margin-top: 10px; margin-bottom: 20px; }
    .dot { width: 12px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; transition: 0.4s; }
    .dot.active { width: 28px; background: var(--premium-gold); box-shadow: 0 0 10px var(--premium-gold); }

    /* 📍 Bottom Gradient Fade */
    .bottom-gradient-fade {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 180px;
        background: linear-gradient(to top, rgba(10, 10, 10, 1) 20%, rgba(10, 10, 10, 0.7) 50%, transparent 100%);
        z-index: 2500; pointer-events: none;
    }

    /* 📍 Fixed Footer Area */
    .fixed-footer { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 3000; pointer-events: none; }
    .price-summary-float { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); width: 82%; max-width: 280px; background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(25px); border: 1px solid var(--premium-gold); padding: 8px 20px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); pointer-events: auto; }
    .curved-nav-container { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; height: 65px; pointer-events: auto; }
    .nav-buttons-wrapper { background: #111; width: 100%; height: 100%; border-radius: 30px; border: 1px solid var(--border-dim); display: flex; justify-content: space-around; align-items: center; }
    .round-btn.center { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 65px; height: 65px; background: #fff; border-radius: 50%; border: 4px solid rgb(17, 16, 13); color: #000; font-size: 1.3rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    /* 📍 Menu Tabs & Items */
    .menu-tabs { display: flex; gap: 6px; padding: 10px 15px 15px; overflow-x: auto; scrollbar-width: none; }
    .menu-tab { padding: 6px 14px; background: var(--glass-soft); border-radius: 10px; color: #555; font-size: 0.75rem; border: 1px solid var(--border-dim); transition: 0.3s; }
    .menu-tab.active { background: #fff; color: #000; font-weight: 500; }
    .menu-item { background: var(--glass-soft); border: 1px solid var(--border-dim); margin: 0 15px 10px; padding: 12px; border-radius: 20px; display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; transition: 0.2s; }
    .item-image { width: 58px !important; height: 58px !important; border-radius: 12px !important; object-fit: cover; }
    .add-to-cart-btn { padding: 6px 14px; border-radius: 10px; font-size: 0.75rem; background: rgba(197, 160, 89, 0.12); color: var(--premium-gold); border: 1px solid var(--premium-gold); font-weight: 500; margin-left: auto; }

    @keyframes shineText { to { background-position: 200% center; } }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onload="initializeApp()">

<div class="bottom-gradient-fade"></div>

<header class="app-header">
    <div style="width: 30px;"></div> 
    <h1 class="bangfoodindex">BANGFOOD</h1> 
    <div onclick="window.location.href='admin_center.html'" style="cursor:pointer; color:#444;"><i class="fas fa-bars"></i></div>
</header>

<main>
    <div class="premium-title-container">
        <h2><i class="fas fa-crown"></i> เมนูยอดนิยม</h2>
        <div class="gold-line"></div>
    </div>

    <div class="slider-container">
        <div class="image-slider" id="hero-best-seller-slider"></div>
        <div class="slider-indicators" id="slider-indicators"></div>
    </div>

    <div class="menu-tabs"> 
        <a href="#" class="menu-tab active" data-cat="ทั้งหมด" onclick="switchCategory('ทั้งหมด', event)">ทั้งหมด</a>
        <a href="#" class="menu-tab" data-cat="อาหาร" onclick="switchCategory('อาหาร', event)">อาหาร</a>
        <a href="#" class="menu-tab" data-cat="ก๋วยเตี๋ยว" onclick="switchCategory('ก๋วยเตี๋ยว', event)">ก๋วยเตี๋ยว</a>
        <a href="#" class="menu-tab" data-cat="เครื่องดื่ม" onclick="switchCategory('เครื่องดื่ม', event)">เครื่องดื่ม</a>
    </div>

    <div id="menu-main-container"></div>
</main>

<div class="fixed-footer">
    <div class="price-summary-float">
        <div style="font-size: 0.65rem; color: #555;">โต๊ะ <span id="display-table">1</span> | รวม</div>
        <div style="color:var(--premium-gold); font-weight:600;">฿<span id="floating-total">0.00</span></div>
    </div>

    <div class="curved-nav-container">
        <div class="round-btn center" onclick="window.location.reload()"><i class="fas fa-receipt"></i></div>
        <div class="nav-buttons-wrapper">
            <div onclick="goToPage('cart.html')" style="flex:1; text-align:center; position:relative; cursor:pointer;">
                <i class="fas fa-shopping-basket" style="color:#444; font-size:1.2rem;"></i>
                <span id="cart-count-badge" style="position:absolute; top:-5px; right:25%; background:#ff4b2b; color:white; font-size:0.6rem; padding:2px 5px; border-radius:8px; display:none;">0</span>
            </div>
            <div style="flex: 1.2;"></div>
            <div onclick="goToPage('track.html')" style="flex:1; text-align:center; cursor:pointer;"><i class="fas fa-clock" style="color:#444; font-size:1.2rem;"></i></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getTableNo() {
        const urlParams = new URLSearchParams(window.location.search);
        let table = urlParams.get('table') || localStorage.getItem('selectedTable') || '1';
        localStorage.setItem('selectedTable', table);
        document.getElementById('display-table').innerText = table;
        return table;
    }

    function goToPage(page) { window.location.href = `${page}?table=${getTableNo()}`; }

    function updateCartUI() {
        const cartKey = 'bangfood_cart_table_' + getTableNo();
        const cartData = sessionStorage.getItem(cartKey);
        let total = 0, count = 0;
        if (cartData) {
            const cart = JSON.parse(cartData);
            count = cart.items ? cart.items.length : 0;
            total = cart.items ? cart.items.reduce((s, i) => s + parseFloat(i.finalPrice || 0), 0) : 0;
        }
        document.getElementById('floating-total').innerText = total.toFixed(2);
        const badge = document.getElementById('cart-count-badge');
        badge.innerText = count;
        badge.style.display = count > 0 ? 'block' : 'none';
    }

    // 📍 ฟังก์ชันใหม่สำหรับเลื่อน Slider อัตโนมัติ
    let autoSlideInterval;
    function startAutoSlide() {
        const slider = document.getElementById('hero-best-seller-slider');
        autoSlideInterval = setInterval(() => {
            const cards = slider.querySelectorAll('.slide-card');
            if (cards.length === 0) return;

            let currentIndex = Array.from(cards).findIndex(c => c.classList.contains('is-active'));
            let nextIndex = (currentIndex + 1) % cards.length;
            
            // คำนวณตำแหน่งการเลื่อน
            const cardWidth = cards[0].offsetWidth + 12; // กว้างการ์ด + gap
            slider.scrollTo({
                left: cardWidth * nextIndex,
                behavior: 'smooth'
            });
        }, 3500); // 📍 เลื่อนทุกๆ 3.5 วินาที
    }

    function initHeroSlider() {
        const slider = document.getElementById('hero-best-seller-slider');
        const indicators = document.getElementById('slider-indicators');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const cards = Array.from(slider.querySelectorAll('.slide-card'));
                    const index = cards.indexOf(entry.target);
                    cards.forEach(c => c.classList.remove('is-active'));
                    entry.target.classList.add('is-active');
                    const dots = indicators.querySelectorAll('.dot');
                    dots.forEach(d => d.classList.remove('active'));
                    if(dots[index]) dots[index].classList.add('active');
                }
            });
        }, { root: slider, threshold: 0.6 });

        const cards = slider.querySelectorAll('.slide-card');
        indicators.innerHTML = '';
        cards.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            indicators.appendChild(dot);
            observer.observe(cards[i]);
        });

        // 📍 หยุด Auto-play เมื่อมีการปัดหน้าจอเอง และเริ่มใหม่เมื่อหยุด
        slider.addEventListener('touchstart', () => clearInterval(autoSlideInterval));
        slider.addEventListener('touchend', () => {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        });
        
        startAutoSlide();
    }

    async function loadMenuFromFirebase() {
        db.ref('products').on('value', (snapshot) => {
            const products = snapshot.val();
            const hero = document.getElementById('hero-best-seller-slider');
            const menuMain = document.getElementById('menu-main-container');
            const tableNo = getTableNo();
            menuMain.innerHTML = ''; hero.innerHTML = '';
            let productList = [];
            for (let id in products) { productList.push(products[id]); }

            productList.slice(0, 5).forEach((p, idx) => {
                const isOut = p.status === 'out_of_stock';
                hero.innerHTML += `
                    <div class="slide-card" onclick="${isOut ? '' : `location.href='menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}'`}">
                        <div class="recommend-badge">RANK #${idx + 1}</div>
                        <img src="${p.img}" style="${isOut ? 'filter: grayscale(1); opacity:0.4;' : ''}"> 
                        <div class="slide-info"><h3 class="shimmer-text">${p.name}</h3></div>
                    </div>`;
            });

            productList.forEach((p, idx) => {
                const isOut = p.status === 'out_of_stock';
                menuMain.innerHTML += `
                    <a href="${isOut ? '#' : `menu.html?name=${encodeURIComponent(p.name)}&table=${tableNo}`}" 
                       class="menu-item" data-category="${p.category}" style="animation: slideUpFade 0.4s both ${idx*0.05}s; ${isOut ? 'opacity:0.5; pointer-events:none;' : ''}">
                        <img src="${p.img}" class="item-image">
                        <div style="flex:1;">
                            <h3 style="margin:0; font-size:0.9rem;">${p.name}</h3>
                            <div style="color:var(--premium-gold); font-size:0.8rem;">฿${p.price}</div>
                        </div>
                        <div class="add-to-cart-btn">${isOut ? 'หมด' : 'เลือก'}</div>
                    </a>`;
            });
            initHeroSlider();
            switchCategory(document.querySelector('.menu-tab.active').dataset.cat);
        });
    }

    function switchCategory(cat, e) {
        if(e) e.preventDefault();
        document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[data-cat="${cat}"]`).classList.add('active');
        document.querySelectorAll('.menu-item').forEach(item => {
            item.style.display = (cat === 'ทั้งหมด' || item.dataset.category === cat) ? 'flex' : 'none';
        });
    }

    function initializeApp() { loadMenuFromFirebase(); updateCartUI(); getTableNo(); }
</script>
</body>
</html>
