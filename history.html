<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History | BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin_style.css">

    <style>
        /* 📍 Layout Setup */
        body { margin: 0; padding: 25px; min-height: 100vh; background-color: var(--bg); transition: 0.5s; overflow-x: hidden; }
        body::-webkit-scrollbar { display: none; }

        /* ✨ Page entrance */
        @keyframes fadeInUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px);} to { opacity:1; transform:translateY(0); } }
        @keyframes slideUpFade{ from { opacity:0; transform:translateY(30px);} to { opacity:1; transform:translateY(0); } }
        @keyframes shimmer    { 0%,100%{opacity:.4} 50%{opacity:.9} }

        /* 📊 Stat Cards */
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; animation:fadeInDown .5s ease both; }
        .stat-card {
            background:var(--card-bg); border:1px solid var(--border); padding:30px 25px;
            border-radius:28px; text-align:center;
            transition:.4s cubic-bezier(.175,.885,.32,1.275);
            box-shadow:0 8px 30px rgba(0,0,0,.12); position:relative; overflow:hidden;
            backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
        }
        .stat-card::before {
            content:''; position:absolute; inset:0;
            background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(var(--premium-gold-rgb),.06), transparent 70%);
            pointer-events:none;
        }
        .stat-card::after {
            content:''; position:absolute; top:0; left:0; right:0; height:2px;
            background:linear-gradient(90deg,transparent,var(--premium-gold),transparent);
            animation:shimmer 3s ease-in-out infinite;
        }
        .stat-card:hover { transform:translateY(-8px); border-color:rgba(var(--premium-gold-rgb),.4); box-shadow:0 20px 50px rgba(0,0,0,.2),0 0 20px rgba(var(--premium-gold-rgb),.08); }
        .stat-label { font-size:.7rem; color:var(--sub-text); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; display:block; font-weight:800; }
        .stat-value { font-size:2rem; font-weight:800; color:var(--text); letter-spacing:-1px; }
        .stat-icon { font-size:1.5rem; color:var(--premium-gold); margin-bottom:12px; display:block;
            filter:drop-shadow(0 0 8px rgba(var(--premium-gold-rgb),.5)); }

        /* 🔍 Filter Section */
        .filter-section {
            background:var(--card-bg); border:1px solid rgba(var(--premium-gold-rgb),.12); border-radius:28px;
            padding:22px 28px; margin-bottom:35px;
            box-shadow:0 15px 40px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.05);
            backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            animation:fadeInDown .6s .1s ease both;
        }
        .filter-row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; }
        .filter-group { flex:1; min-width:140px; }
        .filter-group label {
            font-size:.65rem; color:var(--premium-gold); font-weight:800;
            margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;
            display:flex; align-items:center; gap:6px;
        }
        .filter-group input {
            background:rgba(128,128,128,.07); border:1px solid var(--border);
            border-radius:14px; color:var(--text); padding:11px 15px;
            font-size:.9rem; width:100%; box-sizing:border-box;
            transition:.3s cubic-bezier(.23,1,.32,1);
        }
        .filter-group input:focus {
            border-color:var(--premium-gold);
            background:rgba(var(--premium-gold-rgb),.05);
            outline:none; box-shadow:0 0 0 3px rgba(var(--premium-gold-rgb),.12);
        }

        /* 🔘 Buttons */
        .btn-search {
            background:linear-gradient(135deg,var(--premium-gold),rgba(var(--premium-gold-rgb),.75));
            color:#000; border:none; padding:12px 22px;
            border-radius:14px; font-weight:900; cursor:pointer; height:46px;
            transition:.35s cubic-bezier(.23,1,.32,1); font-size:.85rem; letter-spacing:.5px;
            display:flex; align-items:center; justify-content:center; gap:8px;
            box-shadow:0 6px 20px rgba(var(--premium-gold-rgb),.25); width:100%; white-space:nowrap;
            position:relative; overflow:hidden;
        }
        .btn-search::after {
            content:''; position:absolute; inset:0;
            background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.25),transparent 70%);
            opacity:0; transition:opacity .35s;
        }
        .btn-search:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 14px 32px rgba(var(--premium-gold-rgb),.35); }
        .btn-search:hover::after { opacity:1; }
        .btn-search:active { transform:scale(.97); }

        /* 📜 Order Cards */
        .order-card {
            background:var(--card-bg); border:1px solid var(--border); border-radius:24px;
            margin-bottom:14px; cursor:pointer;
            transition:.4s cubic-bezier(.4,0,.2,1);
            overflow:hidden; animation:slideUpFade .45s ease both;
            position:relative; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        }
        .order-card:nth-child(1){animation-delay:.04s}
        .order-card:nth-child(2){animation-delay:.08s}
        .order-card:nth-child(3){animation-delay:.12s}
        .order-card:nth-child(4){animation-delay:.16s}
        .order-card:nth-child(5){animation-delay:.20s}
        .order-card::before {
            content:''; position:absolute; left:0; top:15%; bottom:15%; width:3px;
            background:linear-gradient(180deg,transparent,var(--premium-gold),transparent);
            border-radius:0 3px 3px 0; opacity:0;
            transition:.35s; transform:scaleY(0); transform-origin:center;
        }
        .order-card:hover { border-color:rgba(var(--premium-gold-rgb),.3); background:rgba(var(--premium-gold-rgb),.03); transform:translateX(3px); }
        .order-card:hover::before,.order-card.active::before { opacity:1; transform:scaleY(1); }
        .order-card.active { border-color:rgba(var(--premium-gold-rgb),.35); box-shadow:0 8px 30px rgba(var(--premium-gold-rgb),.08); }

        .card-collapsed-part { padding:20px 28px; display:flex; justify-content:space-between; align-items:center; }
        .station-tag {
            background:linear-gradient(135deg,var(--premium-gold),rgba(var(--premium-gold-rgb),.7));
            color:#000; padding:5px 14px; border-radius:10px;
            font-size:.75rem; font-weight:900;
            box-shadow:0 4px 12px rgba(var(--premium-gold-rgb),.25);
        }
        .order-id-label { font-family:'Courier New',monospace; color:var(--premium-gold); font-weight:700; margin-left:10px; opacity:.7; }
        .total-brief { font-size:1.4rem; color:var(--text); font-weight:800; }

        .card-expanded-part {
            max-height:0; padding:0 28px;
            background:rgba(0,0,0,.08);
            transition:.5s cubic-bezier(.4,0,.2,1); opacity:0;
        }
        .order-card.active .card-expanded-part { max-height:1200px; padding:22px 28px; opacity:1; border-top:1px solid var(--border); }

        .item-row { padding:10px 0; border-bottom:1px solid var(--border); transition:.3s; }
        .item-row:last-child { border-bottom:none; }
        .item-row:hover { background:rgba(var(--premium-gold-rgb),.03); border-radius:8px; padding-left:6px; }
        .food-line { display:flex; justify-content:space-between; color:var(--text); font-weight:600; font-size:1rem; }
        .addon-item { font-size:.8rem; color:var(--sub-text); margin-top:5px; padding-left:15px; display:flex; justify-content:space-between; }

        .btn-group { display:flex; gap:12px; margin-top:22px; }
        .btn-action {
            flex:1; border:none; padding:13px; border-radius:16px;
            font-weight:800; cursor:pointer;
            transition:.3s cubic-bezier(.23,1,.32,1);
            font-size:.8rem; display:flex; align-items:center; justify-content:center; gap:8px;
            position:relative; overflow:hidden;
        }
        .btn-action::after {
            content:''; position:absolute; inset:0;
            background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.15),transparent 70%);
            opacity:0; transition:opacity .3s;
        }
        .btn-action:hover::after { opacity:1; }
        .btn-action:hover { transform:translateY(-2px); }
        .btn-action:active { transform:scale(.96); }
        .btn-print {
            background:rgba(128,128,128,.1); color:var(--text);
            border:1px solid var(--border);
        }
        .btn-print:hover { background:rgba(128,128,128,.2); border-color:rgba(var(--premium-gold-rgb),.3); color:var(--premium-gold); }
        .btn-del {
            background:rgba(255,71,87,.08); color:#ff4757;
            border:1px solid rgba(255,71,87,.2);
        }
        .btn-del:hover { background:rgba(255,71,87,.18); border-color:rgba(255,71,87,.4); box-shadow:0 6px 20px rgba(255,71,87,.15); }

        /* หัวข้อรายงานสำหรับพิมพ์ (ซ่อนไว้ในหน้าจอปกติ) */
        #report-header { display: none; }

        /* ========================================================== */
        /* 🖨️ Media Print Section */
        /* ========================================================== */
        @media print {
            body { background: white !important; padding: 0 !important; }
            
            /* กรณีพิมพ์ใบเสร็จ (รายละเอียดเยอะ) */
            body:not(.printing-full-report) * { visibility: hidden; }
            body:not(.printing-full-report) #history-list .order-card.active, 
            body:not(.printing-full-report) #history-list .order-card.active * { visibility: visible; }
            body:not(.printing-full-report) #history-list .order-card.active {
                position: absolute; left: 0; top: 0; width: 300px; 
                border: none !important; box-shadow: none !important;
                padding: 10px !important; margin: 0 !important;
                background: white !important; font-family: 'Courier New', Courier, monospace; 
                color: black !important;
            }

            /* --- กรณีพิมพ์รายงานสรุป (บรรทัดเดียว ดูง่าย) --- */
            body.printing-full-report .filter-section, 
            body.printing-full-report .btn-group,
            body.printing-full-report .btn-action,
            body.printing-full-report .card-expanded-part { display: none !important; } /* ซ่อนรายละเอียดรายการอาหาร */
            
            body.printing-full-report #report-header { 
                display: block !important; 
                text-align: center; 
                margin-bottom: 20px; 
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
                color: black;
            }

            body.printing-full-report .stats-grid { 
                display: flex !important; 
                gap: 20px; 
                margin-bottom: 30px; 
            }
            body.printing-full-report .stat-card { 
                flex: 1; 
                border: 1px solid #ccc !important; 
                color: black !important;
                box-shadow: none !important;
                border-radius: 10px !important;
                padding: 10px !important;
            }
            body.printing-full-report .stat-value, 
            body.printing-full-report .stat-label { color: black !important; }

            body.printing-full-report .order-card { 
                page-break-inside: avoid; 
                border: none !important;
                border-bottom: 1px solid #eee !important;
                margin-bottom: 0 !important;
                border-radius: 0 !important;
                width: 100% !important;
                display: block !important;
            }
            
            body.printing-full-report .card-collapsed-part {
                padding: 10px 5px !important;
                color: black !important;
            }
            
            body.printing-full-report .total-brief,
            body.printing-full-report .station-tag,
            body.printing-full-report .order-id-label { color: black !important; }
            body.printing-full-report .station-tag { border: 1px solid #000; background: none !important; }
        }
    </style>
</head>
<body onload="initializeHistory()">

    <div id="report-header">
        <h1 style="margin: 0; font-size: 24px;">BANGFOOD SALES REPORT</h1>
        <p id="print-date-range" style="margin: 5px 0; font-size: 16px; font-weight: bold;"></p>
        <p style="font-size: 12px; opacity: 0.7;">พิมพ์เมื่อ: <span id="current-print-time"></span></p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-receipt stat-icon"></i>
            <span class="stat-label">บิลทั้งหมด</span>
            <span id="total-bills" class="stat-value">0</span>
        </div>
        <div class="stat-card" style="border-bottom: 3px solid #2ecc71;">
            <i class="fas fa-coins stat-icon" style="color:#2ecc71;"></i>
            <span class="stat-label">รายได้รวม</span>
            <span class="stat-value" style="color:#2ecc71;">฿<span id="total-revenue">0.00</span></span>
        </div>
    </div>

    <section class="filter-section">
        <div class="filter-row">
            <div class="filter-group">
                <label><i class="far fa-calendar-alt"></i> วันที่เริ่มต้น</label>
                <input type="date" id="start-date">
            </div>
            <div class="filter-group">
                <label><i class="far fa-calendar-check"></i> วันที่สิ้นสุด</label>
                <input type="date" id="end-date">
            </div>
            <div class="filter-group">
                <label><i class="far fa-clock"></i> เวลาเริ่ม</label>
                <input type="time" id="start-time" value="00:00">
            </div>
            <div class="filter-group">
                <label><i class="fas fa-history"></i> เวลาสิ้นสุด</label>
                <input type="time" id="end-time" value="23:59">
            </div>
            <div class="filter-group" style="flex: 0.8; display: flex; align-items: flex-end;">
                <button onclick="filterHistoryByDateTime()" class="btn-search">
                    <i class="fas fa-search"></i> ค้นหาบิล
                </button>
            </div>
            <div class="filter-group" style="flex: 0.5; display: flex; align-items: flex-end;">
                <button onclick="printFullReport()" class="btn-search" style="background: #3498db; color: white;">
                    <i class="fas fa-file-invoice"></i> พิมพ์รายงาน
                </button>
            </div>
            <div class="filter-group" style="flex: 0.4; display: flex; align-items: flex-end;">
                <button onclick="resetFilter()" class="btn-search" style="background: rgba(128,128,128,0.2); color: var(--text);">
                     ล้างค่า
                </button>
            </div>
        </div>
    </section>

    <div id="history-list"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.firebasestorage.app", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allHistoryData = [];

    function applySharedTheme() {
        const theme = localStorage.getItem('theme') || 'dark';
        document.body.classList.toggle('light-theme', theme === 'light');
    }
    applySharedTheme();

    function initializeHistory() { 
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('start-date').value = today;
        document.getElementById('end-date').value = today;
        loadHistoryRealtime(); 
    }

    function loadHistoryRealtime() {
        db.ref('history').on('value', (snapshot) => {
            allHistoryData = [];
            if (snapshot.exists()) {
                snapshot.forEach((child) => { allHistoryData.push({ id: child.key, ...child.val() }); });
            }
            filterHistoryByDateTime(); 
        });
    }

    function toggleCard(element) {
        if (document.body.classList.contains('printing-full-report')) return; // ป้องกันการเปลี่ยนสถานะขณะพิมพ์
        const isActive = element.classList.contains('active');
        document.querySelectorAll('.order-card').forEach(c => c.classList.remove('active'));
        if(!isActive) element.classList.add('active');
    }

    function printReceipt(btn) {
        const card = btn.closest('.order-card');
        document.querySelectorAll('.order-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        setTimeout(() => { window.print(); }, 250);
    }

    function printFullReport() {
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;
        
        const displayRange = (start === end) ? `วันที่: ${start}` : `ช่วงวันที่: ${start} ถึง ${end}`;
        document.getElementById('print-date-range').innerText = displayRange;
        document.getElementById('current-print-time').innerText = new Date().toLocaleString('th-TH');

        // เข้าสู่โหมดพิมพ์รายงาน
        document.body.classList.add('printing-full-report');
        
        setTimeout(() => {
            window.print();
            // ออกจากโหมดพิมพ์รายงาน
            document.body.classList.remove('printing-full-report');
        }, 500);
    }

    function renderHistory(data) {
        const list = document.getElementById('history-list');
        const billsEl = document.getElementById('total-bills');
        const revEl = document.getElementById('total-revenue');
        let html = ''; let totalSum = 0;
        data.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));

        data.forEach((order, index) => {
            totalSum += parseFloat(order.total || 0);
            const shortId = order.id.substring(order.id.length - 6).toUpperCase();
            
            let itemsHtml = order.items ? order.items.map(item => {
                let optionsHtml = '';
                let optionsPriceTotal = 0;

                if (item.optionsArray) {
                    optionsHtml = item.optionsArray.map(opt => {
                        const optPrice = parseFloat(opt.price || 0);
                        const optQty = parseInt(opt.qty || 1); 
                        const totalPerOpt = optPrice * optQty;
                        optionsPriceTotal += totalPerOpt;

                        return `
                            <div class="addon-item" style="display: flex; justify-content: space-between; width: 100%;">
                                <span>- ${opt.name} <b style="color:var(--premium-gold); margin-left:4px;">x${optQty}</b></span>
                                <span>฿${totalPerOpt.toFixed(2)}</span>
                            </div>`;
                    }).join('');
                }

                const finalP = parseFloat(item.finalPrice || 0);
                const baseP = finalP - optionsPriceTotal;

                return `
                <div class="item-row">
                    <div class="food-line">
                        <span>${item.quantity || 1}x ${item.name}</span>
                        <b>฿${baseP.toFixed(2)}</b>
                    </div>
                    <div class="addon-area" style="padding-left: 10px; border-left: 1px dashed var(--border); margin-top: 5px;">
                        ${optionsHtml}
                    </div>
                </div>`;
            }).join('') : '';

            html += `
                <div class="order-card" onclick="toggleCard(this)">
                    <div class="card-collapsed-part">
                        <div>
                            <span class="station-tag">โต๊ะ ${order.tableNumber || '?'}</span>
                            <span class="order-id-label">#${shortId}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:20px;">
                            <span class="time-label" style="font-size:0.85rem; color:var(--sub-text);">🕒 ${new Date(order.archivedAt).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</span>
                            <b class="total-brief">฿${parseFloat(order.total).toLocaleString()}</b>
                        </div>
                    </div>
                    <div class="card-expanded-part">
                        <div style="font-size:0.7rem; color:var(--premium-gold); margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">
                            ID: ${order.id} | วันที่: ${new Date(order.archivedAt).toLocaleString('th-TH')}
                        </div>
                        <div class="items-area">${itemsHtml}</div>
                        <div class="btn-group">
                            <button onclick="event.stopPropagation(); printReceipt(this)" class="btn-action btn-print">
                                <i class="fas fa-print"></i> พิมพ์ใบเสร็จ
                            </button>
                            <button onclick="event.stopPropagation(); deleteEntry('${order.id}')" class="btn-action btn-del">
                                <i class="fas fa-trash-alt"></i> ลบข้อมูล
                            </button>
                        </div>
                    </div>
                </div>`;
        });
        list.innerHTML = data.length ? html : '<div style="text-align:center; padding:100px; color:var(--sub-text);">ไม่พบข้อมูลในช่วงเวลาที่เลือก</div>';
        billsEl.textContent = data.length;
        revEl.textContent = totalSum.toLocaleString('th-TH', { minimumFractionDigits: 2 });
    }

    function filterHistoryByDateTime() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        const startTime = document.getElementById('start-time').value;
        const endTime = document.getElementById('end-time').value;

        if (!startDate || !endDate) return alert("กรุณาระบุวันที่เริ่มต้นและสิ้นสุดให้ครบถ้วนครับ");
        if (startDate > endDate) return alert("วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุดครับ");

        const filtered = allHistoryData.filter(order => {
            const d = new Date(order.archivedAt);
            const orderDateStr = d.toISOString().split('T')[0];
            const orderTimeStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const isDateInRange = orderDateStr >= startDate && orderDateStr <= endDate;
            
            if (startDate === endDate) {
                return isDateInRange && orderTimeStr >= startTime && orderTimeStr <= endTime;
            } else {
                if (orderDateStr === startDate) return orderTimeStr >= startTime;
                else if (orderDateStr === endDate) return orderTimeStr <= endTime;
                else return isDateInRange;
            }
        });
        renderHistory(filtered);
    }

    function resetFilter() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('start-date').value = today;
        document.getElementById('end-date').value = today;
        document.getElementById('start-time').value = "00:00";
        document.getElementById('end-time').value = "23:59";
        filterHistoryByDateTime();
    }

    window.deleteEntry = (id) => confirm("ลบรายการนี้ถาวรเลยนะ?") && db.ref(`history/${id}`).remove();
</script>
<script src="admin_script.js"></script>
</body>
</html>
