<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อันดับยอดฮิต - BANGFOOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-deep: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border-dim: rgba(255, 255, 255, 0.08);
        }

        body { 
            background-color: var(--bg-deep); color: #f5f5f5; 
            font-family: 'Kanit', sans-serif; margin: 0; padding: 20px;
            padding-bottom: 50px;
        }

        /* 📍 Header */
        .trending-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; animation: fadeInDown 0.8s ease-out;
        }
        .trending-header h1 { font-size: 1.3rem; color: #fff; margin: 0; letter-spacing: 1px; }
        .btn-back { color: #555; text-decoration: none; font-size: 0.85rem; padding: 8px 15px; border-radius: 12px; border: 1px solid var(--border-dim); transition: 0.3s; }
        .btn-back:hover { color: #fff; border-color: #fff; }

        /* 📊 Top Dashboard สรุปยอดรวม */
        .summary-dashboard {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }
        .summary-item {
            background: var(--glass); border: 1px solid var(--border-dim);
            padding: 20px; border-radius: 24px; text-align: center;
        }
        .summary-item i { font-size: 1.2rem; color: var(--premium-gold); margin-bottom: 10px; display: block; }
        .summary-item b { font-size: 1.5rem; display: block; }
        .summary-item span { font-size: 0.75rem; color: #666; text-transform: uppercase; }

        /* 🏆 การ์ดจัดอันดับ */
        .rank-card {
            background: var(--glass); border-radius: 28px; border: 1px solid var(--border-dim);
            padding: 25px; margin-bottom: 18px; display: flex; align-items: flex-start;
            gap: 20px; opacity: 0; animation: slideUpFade 0.6s forwards;
            position: relative; overflow: hidden;
        }
        
        /* ใส่แสงเรืองๆ ให้อันดับ 1 */
        .rank-card.top-1 { border-color: var(--premium-gold); background: linear-gradient(145deg, rgba(197, 160, 89, 0.05), transparent); }

        .rank-number { font-size: 2.2rem; font-weight: 800; color: var(--premium-gold); min-width: 45px; line-height: 1; }
        .item-details { flex: 1; }
        .item-name { font-size: 1.2rem; font-weight: 500; margin-bottom: 6px; color: #fff; }
        
        /* 📍 แถบความนิยม (Sales Progress) */
        .progress-container { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 12px 0; width: 100%; }
        .progress-bar { height: 100%; background: var(--premium-gold); border-radius: 10px; transition: 1s ease-out; width: 0; }

        .sales-info { font-size: 0.85rem; color: #888; display: flex; justify-content: space-between; align-items: center; }

        /* 📍 รายละเอียดโต๊ะ */
        .table-stat-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .table-badge {
            background: rgba(255,255,255,0.03); color: #888; font-size: 0.7rem;
            padding: 5px 12px; border-radius: 10px; border: 1px solid var(--border-dim);
        }
        .table-badge b { color: var(--premium-gold); }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        /* 📍 เตรียมท่าทางก่อนการปรากฏตัว (ซ่อนไว้ก่อน) */
.reveal {
    opacity: 0;
    transform: translateY(40px) scale(0.95); /* ลอยต่ำลงและเล็กลงนิดหน่อย */
    transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1); /* ความเร็วแบบพรีเมียม */
}

/* 📍 ท่าทางเมื่อเลื่อนหน้าจอมาเจอ (Active) */
.reveal.active {
    opacity: 1;
    transform: translateY(0) scale(1); /* กลับสู่ตำแหน่งปกติ */
}

/* 📍 ตั้งค่าขีดพลังสีทองให้ยาวจาก 0 ตอนที่เลื่อนมาเห็น */
.progress-bar {
    width: 0; 
    transition: 1.5s cubic-bezier(0.23, 1, 0.32, 1); /* แถบค่อยๆ วิ่งยาวขึ้น */
}
    </style>
</head>
<body onload="calculateTrending()">

    <header class="trending-header">
        <h1>🏆 อันดับยอดฮิต</h1>
        <a href="admin_center.html" class="btn-back">กลับหน้าหลัก</a>
    </header>

    <div class="summary-dashboard">
        <div class="summary-item">
            <i class="fas fa-utensils"></i>
            <b id="stat-total-items">0</b>
            <span>เมนูที่ถูกสั่ง</span>
        </div>
        <div class="summary-item">
            <i class="fas fa-shopping-cart"></i>
            <b id="stat-total-sales">0</b>
            <span>จานรวมทั้งหมด</span>
        </div>
    </div>

    <div style="font-size: 0.75rem; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; padding-left: 5px;">Top 5 Best Sellers</div>
    
    <main id="trending-container">
        <p style="text-align:center; padding:100px; color:#444;">กำลังวิเคราะห์ข้อมูลยอดขาย...</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function calculateTrending() {
            const [ordersSnap, historySnap] = await Promise.all([
                db.ref('orders').once('value'),
                db.ref('history').once('value')
            ]);
            
            const stats = {};
            let globalTotalSales = 0;

            const processData = (snap) => {
                if (snap.exists()) {
                    Object.values(snap.val()).forEach(order => {
                        if (order.items) {
                            order.items.forEach(item => {
                                const name = item.name;
                                const qty = parseInt(item.quantity || 1);
                                if (!stats[name]) stats[name] = { total: 0, tables: {} };
                                stats[name].total += qty;
                                globalTotalSales += qty;
                                const table = order.tableNumber || "N/A";
                                stats[name].tables[table] = (stats[name].tables[table] || 0) + qty;
                            });
                        }
                    });
                }
            };

            processData(ordersSnap);
            processData(historySnap);

            const sorted = Object.entries(stats).sort((a, b) => b[1].total - a[1].total);
            const top5 = sorted.slice(0, 5);
            const maxSales = top5.length > 0 ? top5[0][1].total : 1;

            document.getElementById('stat-total-items').innerText = sorted.length;
            document.getElementById('stat-total-sales').innerText = globalTotalSales;

            const container = document.getElementById('trending-container');
            container.innerHTML = '';

            if (top5.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:100px; color:#444;">ยังไม่มีข้อมูลการสั่งซื้อครับน้า</p>';
                return;
            }

            top5.forEach(([name, data], index) => {
                const percentage = (data.total / maxSales) * 100;
                const tableBadges = Object.entries(data.tables)
                    .sort((a,b) => b[1] - a[1])
                    .map(([t, count]) => `<div class="table-badge">โต๊ะ ${t}: <b>${count}</b></div>`)
                    .join('');

                // 📍 เพิ่มคลาส 'reveal' และเก็บค่าเปอร์เซ็นต์ไว้ใน 'data-width'
                container.innerHTML += `
                    <div class="rank-card reveal ${index === 0 ? 'top-1' : ''}">
                        <div class="rank-number">#${index + 1}</div>
                        <div class="item-details">
                            <div class="item-name">${name}</div>
                            
                            <div class="progress-container">
                                <div class="progress-bar" data-width="${percentage}%"></div>
                            </div>

                            <div class="sales-info">
                                <span>ยอดขายจริง: <b style="color:#fff">${data.total} จาน</b></span>
                                <span style="font-size: 0.7rem; opacity: 0.5;">ความนิยม ${Math.round(percentage)}%</span>
                            </div>
                            
                            <div class="table-stat-grid">
                                ${tableBadges}
                            </div>
                        </div>
                    </div>`;
            });

            // 📍 ⚠️ เรียกใช้งานแอนิเมชันหลังจาก Render ข้อมูลเสร็จ
            setTimeout(initRevealAnimation, 100);
        }

        // 📍 ฟังก์ชันตรวจจับการเลื่อนหน้าจอด้วย Intersection Observer
        function initRevealAnimation() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active'); // เปิดตัวการ์ด
                        
                        const bar = entry.target.querySelector('.progress-bar');
                        if (bar) {
                            setTimeout(() => {
                                bar.style.width = bar.getAttribute('data-width'); // วิ่งแถบพลังสีทอง
                            }, 300);
                        }
                    }
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }
        // 📍 ฟังก์ชันตรวจจับการเลื่อนหน้าจอด้วย Intersection Observer
function initRevealAnimation() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                // เมื่อเลื่อนมาเจอรายการ ให้สั่งให้ Active
                entry.target.classList.add('active');
                
                // สั่งให้แถบพลังสีทองวิ่งไปตามค่าจริงที่เก็บไว้ใน data-width
                const bar = entry.target.querySelector('.progress-bar');
                if (bar) {
                    setTimeout(() => {
                        bar.style.width = bar.getAttribute('data-width');
                    }, 300);
                }
            }
        });
    }, { threshold: 0.15 }); // เริ่มเล่นแอนิเมชันเมื่อเห็นการ์ด 15%

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

// ⚠️ สำคัญมาก: น้าอย่าลืมใส่คำสั่ง initRevealAnimation() 
// ไว้บรรทัดสุดท้ายของฟังก์ชัน calculateTrending() ด้วยนะครับ!
    </script>
</body>
</html>
