<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า | BANGFOOD</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --premium-gold: #c5a059;
            --bg-charcoal: #121212;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            background-color: var(--bg-charcoal); 
            color: #f1f1f1; 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            background-image: radial-gradient(circle at 50% 20%, #1c1c1c, #121212);
            padding-bottom: 100%;
            overflow-x: hidden;
        }

        /* 📍 Header แบบกระจกฝ้า */
        .app-header {
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 2000;
            animation: fadeInDown 0.8s ease-out;
        }

        .bangfood {
            font-weight: 800;
            color: var(--premium-gold);
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        /* 📍 รายการในตะกร้าพร้อมแอนิเมชัน Cascade */
        .cart-item {
            display: flex;
            align-items: center;
            padding: 16px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            margin: 0 15px 12px;
            border-radius: 22px;
            gap: 15px;
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transition: all 0.3s ease;
        }

        .cart-item:active { transform: scale(0.98); }

        .cart-item img {
            width: 70px; height: 70px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* 📍 กล่องสรุปยอดเงินแบบลอยเหนือแถบเมนู */
        .cart-footer-fixed {
            position: fixed;
            bottom: 110px;
            left: 5.5%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.4);
            padding: 3px 25px;
            border-radius: 25px;
            z-index: 1500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideUpFade 0.8s both 0.4s;
        }

        .cart-total-summary h3 { 
            margin: 0; 
            font-size: 0.8rem; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        #final-total-amount { 
            color: var(--premium-gold); 
            font-weight: 800; 
            font-size: 1.8rem; 
            text-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .price-bump { transform: scale(1.15); color: #fff !important; }

        /* 📍 แถบเมนูด้านล่างรอยเว้าสมบูรณ์ */
        .curved-nav-container {
            position: fixed; bottom: 15px; left: 50%;
            transform: translateX(-50%); width: 92%; max-width: 420px;
            height: 75px; z-index: 2000; display: flex;
            justify-content: center; align-items: flex-end; pointer-events: none;
            animation: navEntry 1s cubic-bezier(0.23, 1, 0.32, 1) both 0.5s;
        }

        .nav-buttons-wrapper {
            display: flex; align-items: center; justify-content: space-around;
            background: #151515; width: 100%; height: 100%; border-radius: 35px;
            border: 1px solid var(--glass-border); pointer-events: auto;
            mask-image: radial-gradient(circle 60px at center -5px, transparent 48px, black 49px);
            -webkit-mask-image: radial-gradient(circle 60px at center -5px, transparent 48px, black 49px);
        }

        .center-btn-wrapper {
            position: absolute; top: -38px; left: 50%;
            transform: translateX(-50%); z-index: 2100; 
            pointer-events: auto; cursor: pointer;
        }

        .round-btn.center {
            width: 78px; height: 78px;
            background: #fff;
            border-radius: 50%; font-size: 2rem; color: #000;
            border: 6px solid var(--bg-charcoal);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: pulseBreath 3s infinite; /* แอนิเมชันปุ่มสั่งซื้อ */
        }

        .round-btn.side {
            width: 48px; height: 48px;
            background: transparent;
            border-radius: 15px; font-size: 1.2rem; color: #666;
            border: 1px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center;
        }

        .nav-label { font-size: 0.65rem; color: #555; margin-top: 5px; font-weight: 600; text-align: center; }
        .active-gold { color: var(--premium-gold) !important; }

        .remove-btn {
            background: rgba(255, 71, 87, 0.1); color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2);
            padding: 6px 12px; border-radius: 10px;
            font-size: 0.7rem; font-weight: bold; cursor: pointer;
        }

        /* 📍 Keyframes Animations */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes navEntry { from { opacity: 0; transform: translate(-50%, 50px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes pulseBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); box-shadow: 0 12px 30px rgba(255,255,255,0.2); } }
    </style>
</head>

<body onload="renderCartItems()">
    <header class="app-header">
        <a href="javascript:void(0)" onclick="goBackToIndex()" style="color: #444;">
            <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="bangfood">MY BASKET</h1>
        <div style="width: 20px;"></div>
    </header>

    <div class="cart-container" style="padding: 20px 0;">
        <div id="table-display-info" style="text-align: center; color: #444; font-size: 0.8rem; margin-bottom: 20px; letter-spacing: 2px;"></div> 
        <div id="cart-items-list"></div>
    </div>

    <div class="cart-footer-fixed">
        <div class="cart-total-summary">
            <h3>ยอดชำระสุทธิ</h3>
        </div>
        <div id="final-total-amount">0.00</div>
    </div>

    <div class="curved-nav-container">
        <div id="order-btn-wrapper" class="center-btn-wrapper" onclick="placeOrder()">
            <div class="round-btn center">
                <i class="fas fa-utensils"></i>
            </div>
            <span class="nav-label active-gold">สั่งอาหาร</span>
        </div>

        <div class="nav-buttons-wrapper">
            <div class="nav-btn-box" onclick="goBackToIndex()">
                <button class="round-btn side"><i class="fas fa-plus"></i></button>
                <span class="nav-label">เพิ่มเมนู</span>
            </div>
            <div style="flex: 1.2;"></div> 
            <div class="nav-btn-box" onclick="goToTracking()">
                <button class="round-btn side"><i class="fas fa-clock"></i></button>
                <span class="nav-label">ติดตาม</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCYIFwwhW7LeM92FqZykqAsDnte09iU9QQ", authDomain: "bangfood-cb30f.firebaseapp.com", databaseURL: "https://bangfood-cb30f-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "bangfood-cb30f", storageBucket: "bangfood-cb30f.appspot.com", messagingSenderId: "390955623784", appId: "1:390955623784:web:aed47e64d2e9dd9e7be2dd" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.database(); 

        function getTableNo() {
            const urlParams = new URLSearchParams(window.location.search);
            let table = urlParams.get('table');
            if (table && table !== 'null') { localStorage.setItem('selectedTable', table); return table; }
            return localStorage.getItem('selectedTable') || '1';
        }

        function renderCartItems() {
            const listContainer = document.getElementById('cart-items-list');
            const totalAmountDisplay = document.getElementById('final-total-amount');
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = sessionStorage.getItem(cartKey);
            const currentCart = cartData ? JSON.parse(cartData) : { items: [] };

            if (!listContainer) return;
            listContainer.innerHTML = '';
            let grandTotal = 0;

            document.getElementById('table-display-info').innerHTML = `STATION: ${tableNo}`;

            if (!currentCart.items || currentCart.items.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:100px 0; color:#333; animation: slideUpFade 0.6s forwards;"><i class="fas fa-shopping-basket" style="font-size:3rem; margin-bottom:15px;"></i><p>ยังไม่มีรายการอาหารครับน้า</p></div>';
                totalAmountDisplay.textContent = '0.00';
                return;
            }

            currentCart.items.forEach((item, index) => {
                const itemPrice = parseFloat(item.finalPrice) || 0;
                grandTotal += itemPrice;
                const html = `
                    <div class="cart-item" style="animation-delay: ${index * 0.1}s">
                        <img src="${item.img || 'https://via.placeholder.com/100'}">
                        <div class="item-info" style="flex: 1;">
                            <b style="color:#fff; display:block; margin-bottom:2px;">${item.name}</b>
                            <small style="color:#666; font-size:0.75rem;">${item.options || 'ปกติ'}</small>
                        </div>
                        <div style="text-align:right;">
                            <p style="margin:0 0 8px; font-weight: 700; color:var(--premium-gold);">฿${itemPrice.toFixed(2)}</p>
                            <button class="remove-btn" onclick="removeItem(${index})">ลบ</button>
                        </div>
                    </div>`;
                listContainer.insertAdjacentHTML('beforeend', html);
            });

            // แอนิเมชันยอดเงินเปลี่ยน
            if (totalAmountDisplay.textContent !== grandTotal.toFixed(2)) {
                totalAmountDisplay.classList.add('price-bump');
                setTimeout(() => totalAmountDisplay.classList.remove('price-bump'), 300);
            }
            totalAmountDisplay.textContent = grandTotal.toFixed(2);
        }

        window.removeItem = function(index) {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            let cartData = JSON.parse(sessionStorage.getItem(cartKey));
            cartData.items.splice(index, 1);
            sessionStorage.setItem(cartKey, JSON.stringify(cartData));
            renderCartItems();
        }

        window.placeOrder = function() {
            const tableNo = getTableNo();
            const cartKey = 'bangfood_cart_table_' + tableNo;
            const cartData = JSON.parse(sessionStorage.getItem(cartKey));
            if (!cartData || cartData.items.length === 0) return alert("กรุณาเลือกเมนูก่อนครับน้า");
            if (!confirm("ยืนยันส่งออเดอร์เข้าครัวใช่ไหมครับ?")) return;

            const orderData = {
                tableNumber: tableNo,
                items: cartData.items,
                total: cartData.items.reduce((s, i) => s + parseFloat(i.finalPrice), 0),
                status: 'รอดำเนินการ',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('orders').push(orderData).then(() => {
                sessionStorage.removeItem(cartKey);
                window.location.href = `track.html?table=${tableNo}`;
            });
        };

        function goBackToIndex() { window.location.href = `index.html?table=${getTableNo()}`; }
        function goToTracking() { window.location.href = `track.html?table=${getTableNo()}`; }
    </script>
</body>
</html>
